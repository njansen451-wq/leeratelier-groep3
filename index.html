/* Leeratelier huisstijl v0.6 — één visuele taal voor alle trainingen.
   Lichte, rustige ondergrond; violet is het merk; groen = gelukt; honing = tussenstap. Geen rood. */
:root{
  --pl-paper:#FAF5F7;      /* achtergrond: licht roze-wit (v0.8: roze palet, 7.5RP/10RP) */
  --pl-surface:#FFFFFF;    /* kaarten en panelen */
  --pl-ink:#44333D;        /* tekst: diep pruim (10RP 1/2) */
  --pl-ink-soft:#695D61;   /* rustige tekst */
  --pl-line:#ECE3E8;       /* lijnen en randen */
  --pl-mist:#D4CBD0;       /* neutraal: 'dit is een ander land' */
  --pl-violet:#C12F78;     /* merk, knoppen, focus: roze 7.5RP 4/16 (de naam --pl-violet blijft voor de code) */
  --pl-violet-deep:#9D285C;
  --pl-violet-soft:#F4DDE3;
  --pl-lilac:#F19CB1;      /* lichtroze 7.5RP 7/12: bloemblad, tweede kleur in de tienstrook */
  --pl-leaf:#2F8F5E;       /* gelukt */
  --pl-leaf-soft:#E2F3E9;
  --pl-honey:#B9790F;      /* tussenstap */
  --pl-honey-soft:#FBF1DC;
  --pl-sea:#DCE6F4;        /* zee op de kaart */
  --pl-land:#F3ECEF;       /* land buiten de training */
  --pl-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --pl-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pl-r-card:18px; --pl-r-pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--pl-paper);color:var(--pl-ink);font-family:var(--pl-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pl-violet);outline-offset:2px}
.pl-app{min-height:100%;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* kop */
.pl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pl-logo{width:44px;height:44px;border:0;background:none;padding:0;cursor:default;flex:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pl-title{min-width:0;flex:1 1 200px}
.pl-title h1{font-family:var(--pl-display);font-weight:600;font-size:1.6rem;line-height:1.1;margin:0}
.pl-helps{margin:2px 0 0;font-size:.85rem;color:var(--pl-ink-soft)}
.pl-garden-btn{border:1.5px solid var(--pl-line);background:var(--pl-surface);border-radius:var(--pl-r-pill);min-height:44px;padding:8px 16px;font-weight:500;cursor:pointer}
.pl-garden-btn:hover{border-color:var(--pl-violet)}

/* schermen */
.pl-screen{display:flex;flex-direction:column;gap:14px}
.pl-card{background:var(--pl-surface);border-radius:var(--pl-r-card);padding:20px;border:1px solid var(--pl-line)}
.pl-h2{font-family:var(--pl-display);font-weight:600;font-size:1.5rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.pl-lead{margin:0;color:var(--pl-ink-soft);max-width:60ch}
.pl-forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.pl-form{text-align:left;border:2px solid var(--pl-line);background:var(--pl-paper);border-radius:var(--pl-r-card);padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.pl-form b{font-family:var(--pl-display);font-weight:600;font-size:1.15rem}
.pl-form span{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-form[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
.pl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* knoppen: één vorm per rol */
.pl-btn{border:0;border-radius:var(--pl-r-pill);padding:12px 22px;min-height:48px;font-family:var(--pl-display);font-weight:600;font-size:1.15rem;cursor:pointer;background:var(--pl-violet);color:#fff}
.pl-btn:hover{background:var(--pl-violet-deep)}
.pl-btn.big{font-size:1.35rem;padding:14px 30px}
.pl-btn.quiet{background:var(--pl-surface);color:var(--pl-ink);border:2px solid var(--pl-line)}
.pl-btn.quiet:hover{border-color:var(--pl-violet)}
.pl-btn[disabled]{opacity:.5;cursor:default}

/* vraag */
.pl-ask{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl-ask-lead{font-family:var(--pl-display);font-size:1.15rem;color:var(--pl-ink-soft)}
.pl-ask-main{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.05}
.pl-dots{display:flex;gap:6px;align-items:center}
/* stippen: nog = open rondje, nu = gevuld met ring, gedaan = gevuld (vorm én kleur) */
.pl-dot{width:12px;height:12px;border-radius:50%;background:var(--pl-surface);border:2px solid var(--pl-ink-soft);box-sizing:border-box}
.pl-dot.done{background:var(--pl-violet);border-color:var(--pl-violet)}
.pl-dot.now{background:var(--pl-violet);border-color:var(--pl-violet);box-shadow:0 0 0 3px var(--pl-surface),0 0 0 5px var(--pl-violet)}

/* feedback: drie vaste vormen */
.pl-fb{min-height:0}
.pl-fb:empty{display:none}
.pl-ok{background:var(--pl-leaf-soft);border:2px solid var(--pl-leaf);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-ok b{color:#1F6B45;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-step{background:var(--pl-honey-soft);border:2px dashed var(--pl-honey);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-step b{color:#8A5A0B;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-cheer{background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:16px 18px;font-family:var(--pl-display);font-size:1.25rem;line-height:1.35}
.pl-note{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-fact{border-top:1px solid var(--pl-line);padding-top:12px;font-size:.95rem;color:var(--pl-ink-soft)}
.pl-fact b{color:var(--pl-ink)}

/* tuin (laat zien) */
.pl-garden{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:70px}
.pl-garden svg{width:58px;height:70px}
.pl-cando{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.pl-cando li{background:var(--pl-leaf-soft);border-radius:var(--pl-r-pill);padding:4px 12px;font-size:.95rem}

/* ouderscherm */
.pl-parent{position:fixed;inset:0;background:rgba(68,51,61,.45);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.pl-parent .pl-card{max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.pl-table-wrap{overflow-x:auto}
.pl-table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.pl-table th,.pl-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--pl-line);white-space:nowrap}
.pl-table th{font-weight:500;color:var(--pl-ink-soft)}
.pl-parent pre{white-space:pre-wrap;background:var(--pl-paper);border-radius:12px;padding:12px;font-size:.85rem;max-height:220px;overflow:auto}
.pl-parent textarea{width:100%;min-height:70px;border:2px solid var(--pl-line);border-radius:12px;padding:8px;font:.85rem ui-monospace,Menlo,monospace;background:var(--pl-paper)}
.pl-h3{font-family:var(--pl-display);font-weight:600;font-size:1.15rem;margin:4px 0 0}
.pl-foot{margin-top:auto;font-size:.75rem;color:var(--pl-ink-soft);text-align:right;user-select:none}

/* keypad (rekenen) */
.pl-keypad{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:8px;max-width:420px}
.pl-key{min-height:52px;border-radius:14px;border:2px solid var(--pl-line);background:var(--pl-surface);font-family:var(--pl-display);font-weight:600;font-size:1.4rem;cursor:pointer}
.pl-key:hover{border-color:var(--pl-violet)}
.pl-key.wide{grid-column:span 2;font-size:1.1rem}
.pl-key.go{background:var(--pl-violet);border-color:var(--pl-violet);color:#fff}

@media (max-width:560px){.pl-card{padding:16px}.pl-btn.big{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.2: home */
.pl-hero{position:relative;background:var(--pl-violet-soft);border-radius:26px;padding:22px;min-height:150px;display:flex;align-items:center;overflow:hidden}
.pl-hero-text{max-width:60%;display:grid;gap:6px}
.pl-hero-img{position:absolute;right:-6px;bottom:-10px;height:170px;border-radius:50% 50% 0 0}
.pl-today{display:grid;gap:10px}
.pl-eyebrow{font-size:.875rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-ink-soft)}
.pl-list{display:grid;gap:10px}
.pl-listrow{display:flex;align-items:center;gap:12px;background:var(--pl-surface);border:1.5px solid var(--pl-line);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-listrow:hover{border-color:var(--pl-violet)}
.pl-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--pl-display);font-weight:600;color:var(--pl-violet-deep);flex:none}
.pl-listtext{flex:1;display:flex;flex-direction:column;min-width:0}
.pl-listtext b{font-weight:500}.pl-listtext span{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-chev{width:10px;height:10px;border-right:2px solid var(--pl-ink-soft);border-bottom:2px solid var(--pl-ink-soft);transform:rotate(-45deg);margin-right:6px}
/* v0.2: rekenmuur modellen */
.rk-model{display:grid;gap:8px;transition:opacity .4s;min-height:0}
.rk-model.gone{opacity:0}
.rk-line{width:min(100%,320px);height:auto;display:block}
.rk-grid{display:grid;gap:4px;width:max-content;max-width:100%}
.rk-grid .rk-cell{width:16px}
.rk-skip{display:flex;gap:6px;flex-wrap:wrap}
.rk-skip span{background:var(--pl-violet-soft);border-radius:999px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
/* v0.2: eigen ronde */
.pl-make{display:flex;align-items:center;gap:12px;border:2px dashed var(--pl-lilac);background:var(--pl-surface);border-radius:22px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-make:hover{border-color:var(--pl-violet)}
.pl-make .pl-listtext b{font-family:var(--pl-display);font-weight:600;font-size:1.1rem}
.pl-plus{width:44px;height:44px;border-radius:999px;background:var(--pl-violet);position:relative;flex:none}
.pl-plus::before,.pl-plus::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.pl-plus::before{width:16px;height:2.5px}.pl-plus::after{width:2.5px;height:16px}
.pl-btn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
@media (max-width:560px){.pl-garden-btn{padding:8px 12px;font-size:.95rem}.pl-title h1{font-size:1.35rem}}
/* v0.3: zinnen en werkwoorden */
.gr-board{display:grid;gap:12px}
.gr-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.5rem;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.gr-w{font:inherit;border:2px solid transparent;background:var(--pl-paper);border-radius:10px;padding:2px 8px;cursor:pointer;color:var(--pl-ink)}
.gr-w:hover:not([disabled]){border-color:var(--pl-lilac)}
.gr-w.on{background:var(--pl-violet-soft);border-color:var(--pl-violet);color:var(--pl-violet-deep)}
.gr-w[disabled]{cursor:default;color:var(--pl-ink)}
.gr-w[disabled]:not(.on){background:transparent}
.gr-punt{font-size:1.5rem}
.gr-opt.gr-long{font-size:1rem;white-space:normal;text-align:left;line-height:1.3}
.gr-step:empty{display:none}
.ww-board{display:grid;gap:12px}
.ww-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.6rem;line-height:1.4}
.ww-steps{display:flex;flex-wrap:wrap;gap:8px}
.ww-steps:empty{display:none}
.ww-steps span{background:var(--pl-paper);border-radius:999px;padding:2px 12px;font-size:.95rem;color:var(--pl-ink-soft)}
.rk-bar{position:relative;width:min(100%,300px);height:28px;border:2px solid var(--pl-line);border-radius:999px;overflow:hidden;background:var(--pl-surface)}
.rk-bar span{position:absolute;left:0;top:0;bottom:0;background:var(--pl-lilac)}
.rk-bar b{position:absolute;left:10px;top:3px;font-family:var(--pl-display);font-weight:600}
.pl-form.locked{opacity:.55;cursor:default;border-style:dashed}
/* v0.4: ronde verlaten, compacte stenenkeuze, knop in beeld */
.pl-confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:12px 16px}
.pl-stones{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:0}
.pl-stones .pl-form{padding:10px 12px}
.pl-stones .pl-form b{font-size:.95rem}
.pl-stones .pl-form span{font-size:.85rem}
.pl-sticky{position:sticky;bottom:0;background:var(--pl-paper);padding:10px 0 6px;z-index:2}
/* v0.5: Bedenk je ronde (gesprek in bouwstenen) */
.pl-chat{display:grid;gap:10px}
.pl-bub{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.4}
.pl-bub.ik{background:var(--pl-violet-soft);border-bottom-left-radius:6px;justify-self:start;font-family:var(--pl-display);font-size:1.1rem}
.pl-bub.jij{background:var(--pl-surface);border:1.5px solid var(--pl-line);border-bottom-right-radius:6px;justify-self:end}
.pl-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding-left:4px}
.pl-chip{text-align:left;border:2px solid var(--pl-line);background:var(--pl-paper);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-height:48px;color:var(--pl-ink)}
.pl-chip b{font-family:var(--pl-display);font-weight:600}
.pl-chip span{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-chip:hover{border-color:var(--pl-violet)}
.pl-chip.later{border-style:dashed;background:transparent;color:var(--pl-ink-soft)}
.pl-chip.later b{font-weight:500}
.pl-chip.later:hover{border-style:solid;border-color:var(--pl-violet);color:var(--pl-ink)}
.pl-plan{display:grid;gap:10px;border-top:1px solid var(--pl-line);padding-top:12px}
.pl-vraag{margin:0;padding:12px 16px;border-left:4px solid var(--pl-violet);background:var(--pl-surface);border-radius:0 14px 14px 0;font-family:var(--pl-display);font-size:1.1rem;line-height:1.4}
.pl-denk{margin:0;display:grid;gap:6px}
.pl-denk dt{font-size:.875rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-ink-soft)}
.pl-denk dd{margin:0 0 4px;line-height:1.45}

/* v0.6: reactie met reden, begroeting */
.pl-react{display:grid;gap:10px}
.pl-react .pl-btn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
.pl-chips.pl-why{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pl-why .pl-chip b{font-weight:500}
#pl-why .pl-note b{color:var(--pl-ink);font-weight:500}
.pl-greet{margin:8px 0 0;max-width:60ch}

/* v0.7: één schermindeling voor een ronde (B1, B2, B6) en tekst die bij de stand hoort */
.pl-top{flex-wrap:nowrap}
.pl-title{flex:1 1 auto}
.pl-helps{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-topbtns{display:flex;gap:8px;flex:none}
.pl-round{width:100%;max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.pl-round .pl-keypad{margin-inline:auto;width:100%;max-width:420px;position:sticky;bottom:0;z-index:5;background:var(--pl-paper);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -12px rgba(68,51,61,.35)}
.pl-tried{display:block;font-size:.9rem;color:var(--pl-ink-soft);margin-bottom:4px}
.pl-next{margin:0;background:var(--pl-paper);border-radius:var(--pl-r-card);padding:12px 16px;line-height:1.45}
.pl-next b{font-family:var(--pl-display);font-weight:600;margin-right:4px}
/* hulpknop: geen antwoordvorm (B4). Tekst in violet, geen pil, wel 44 px hoog */
.pl-help{border:0;background:none;color:var(--pl-violet-deep);font:500 .95rem var(--pl-body);min-height:44px;padding:8px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pl-help:hover{color:var(--pl-violet)}
.pl-startrow{margin-top:14px}
.pl-daarna{margin:10px 0 0}
.pl-why-today{margin:0}
/* Bedenk je ronde: wat dicht is, is geen knop (C2) */
.pl-locked{list-style:none;margin:0;padding:0 0 0 4px;display:grid;gap:2px;font-size:.85rem;color:var(--pl-ink-soft)}
.pl-locked b{font-weight:500;color:var(--pl-ink-soft)}
@media (max-width:560px){.pl-topbtns .pl-garden-btn{padding:8px 12px}.pl-title h1{font-size:1.25rem}}
@media (max-width:480px){.pl-top .pl-helps{display:none}}
/* v0.9: de regel van de gevraagde vorm, in de ronde (niet in de kop); verschijnt bij het begin en na een tussenstap */
.pl-rulebar{display:grid;gap:8px;justify-items:start}
.pl-rulebar[hidden]{display:none}
.pl-rulebtn{border:1.5px solid var(--pl-line);background:var(--pl-surface);color:var(--pl-violet-deep);border-radius:var(--pl-r-pill);min-height:44px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.pl-rulebtn:hover{border-color:var(--pl-violet)}
.pl-rules{width:100%;box-sizing:border-box;background:var(--pl-violet-soft);border-radius:16px;padding:12px 16px;color:var(--pl-ink)}
.pl-rules[hidden]{display:none}
.pl-rules b{font-family:var(--pl-display);font-size:1.05rem}
.pl-rules ul{margin:6px 0 0;padding-left:1.1em;display:grid;gap:4px}
/* Zinnen v0.7: het gezegde in beeld. Roze = gezegde (merk), lichtroze gestippeld = naamwoordelijk deel; boog = koppelen */
.gr-w.gr-vast{cursor:default;background:transparent;border-color:transparent;padding:2px 4px;border-radius:0}
.gr-w.gr-gz,.gr-w.gr-kw{border-bottom:4px solid var(--pl-violet);color:var(--pl-violet-deep);font-weight:600}
.gr-w.gr-nd{border-bottom:4px dashed var(--pl-lilac);color:var(--pl-violet-deep);font-weight:600}
.gr-w.gr-ow{border-bottom:2px solid var(--pl-mist)}
.gr-zin-bouw{position:relative;padding-bottom:14px}
.gr-zin-bouw.gr-met-boog{padding-top:20px}
.gr-bogen{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gr-band{fill:none;stroke:var(--pl-violet);stroke-width:2;stroke-linejoin:round}
.gr-boog{fill:none;stroke:var(--pl-ink-soft);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
.gr-bouw{display:grid;gap:4px;font-size:.95rem;color:var(--pl-ink)}
.gr-bouw b{font-weight:600;color:var(--pl-violet-deep)}
.gr-eind{display:inline-flex;align-items:baseline}
.gr-bouw-naam{color:var(--pl-ink-soft)}
.gr-sw{display:inline-block;width:22px;height:0;margin-right:8px;border-bottom:4px solid var(--pl-violet);vertical-align:middle}
.gr-sw.nd{border-bottom-style:dashed;border-bottom-color:var(--pl-lilac)}
.gr-klaar{margin-top:4px}
.gr-vb{display:grid;gap:2px;margin-top:10px;padding-top:8px;border-top:1px solid var(--pl-line)}
.gr-vb-zin{font-family:var(--pl-display);font-size:1.15rem}
.gr-w.gr-klein{font-size:1.15rem;padding:0 2px}
.gr-vb-naam{font-size:.9rem;color:var(--pl-ink-soft)}
/* v0.9.2: de oplossing blijft staan; Verder gaat meteen door. De regelknop blijft altijd, rustig als het goed gaat */
.pl-ok{display:flow-root}
.pl-verder{float:right;margin:8px 0 0 12px;border:1.5px solid var(--pl-leaf);background:var(--pl-surface);color:var(--pl-ink);border-radius:var(--pl-r-pill);min-height:40px;padding:6px 16px;font:inherit;font-weight:600;cursor:pointer}
.pl-rulebar.stil .pl-rulebtn{border-color:transparent;background:transparent;color:var(--pl-ink-soft);font-weight:500;min-height:36px;padding:4px 10px;font-size:.92rem}
.pl-rulebar.stil .pl-rulebtn:hover{color:var(--pl-violet-deep);border-color:var(--pl-line)}
/* De rekenmuur v0.6: plaatjes bij "Laat zien hoe het werkt" — roze = er al, lichtroze = erbij */
.rk-vb{margin-top:10px;padding-top:10px;border-top:1px solid var(--pl-line);display:grid;gap:6px;justify-items:start}
.rk-vb-strook{display:grid;gap:4px}
.rk-vb-rij{display:grid;grid-template-columns:repeat(10,22px);gap:3px}
.rk-vb-rij i,.rk-vb-rooster i,.rk-vb-groepen i{display:block;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--pl-mist);background:var(--pl-surface)}
.rk-vb-rij i.v,.rk-vb-rooster i.v,.rk-vb-groepen i{background:var(--pl-violet);border-color:var(--pl-violet)}
.rk-vb-rij i.n,.rk-vb-rooster i.n{background:var(--pl-lilac);border-color:var(--pl-lilac)}
.rk-vb-rooster{display:grid;gap:3px;width:min(100%,200px)}
.rk-vb-groepen{display:flex;flex-wrap:wrap;gap:10px}
.rk-vb-groepen span{display:grid;grid-auto-flow:column;gap:3px;padding:5px;border:1.5px dashed var(--pl-violet);border-radius:10px}
.rk-vb-groepen i{width:14px}
.rk-vb-lijn{width:min(100%,320px);height:auto;overflow:visible}
.rk-vb-as,.rk-vb-tik{stroke:var(--pl-ink-soft);stroke-width:1.5}
.rk-vb-boog{fill:none;stroke:var(--pl-violet);stroke-width:2}
.rk-vb-lab{font:600 12px var(--pl-text,inherit);fill:var(--pl-violet-deep);text-anchor:middle}
.rk-vb-getal{font:12px var(--pl-text,inherit);fill:var(--pl-ink);text-anchor:middle}
.rk-vb-delen{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:min(100%,320px);border:1.5px solid var(--pl-violet);border-radius:8px;overflow:hidden}
.rk-vb-delen span{padding:6px 2px;text-align:center;font-size:.9rem;border-right:1px solid var(--pl-lilac)}
.rk-vb-delen span:last-child{border-right:0}
.rk-vb-delen span.v{background:var(--pl-lilac);font-weight:600}
.rk-vb-onder{margin:0;font-size:.85rem;color:var(--pl-ink-soft)}
.rk-vb-volgorde{display:grid;gap:4px;font-family:var(--pl-display);font-size:1.15rem}
.rk-vb-volgorde u{text-decoration:none;border-bottom:3px solid var(--pl-violet)}
/* v0.10: brede trainingen (de kaart), regiokeuze, lange ronde met een balk */
@media (min-width:700px){.pl-app.pl-wide{max-width:90vw}.pl-app.pl-wide .pl-round{max-width:none}}
.pl-regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pl-region{display:grid;gap:4px;text-align:left;border:2px solid var(--pl-line);background:var(--pl-surface);border-radius:var(--pl-r-card);padding:14px 16px;cursor:pointer;color:var(--pl-ink);font:inherit;transition:border-color .2s,transform .2s}
.pl-region b{font-family:var(--pl-display);font-size:1.15rem}
.pl-region:hover{border-color:var(--pl-violet);transform:translateY(-2px)}
.pl-allround{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pl-bar{display:block;width:min(100%,420px);height:10px;border-radius:999px;background:var(--pl-line);overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--pl-violet);border-radius:999px;transition:width .5s}
/* brede training op een groot, liggend scherm: links de vraag, de regel en de feedback; rechts het werkvlak (de kaart).
   Staand (iPad rechtop) blijft alles onder elkaar: dan krijgt de kaart de hele breedte. */
@media (min-width:1000px) and (orientation: landscape){
  .pl-app.pl-wide .pl-round{display:grid;grid-template-columns:minmax(280px,340px) 1fr;grid-template-rows:auto auto auto 1fr;column-gap:24px;align-items:start}
  .pl-app.pl-wide .pl-round > :not(#pl-work){grid-column:1}
  .pl-app.pl-wide .pl-round > #pl-work{grid-column:2;grid-row:1 / span 4}
  .pl-app.pl-wide .pl-ask-main{font-size:clamp(1.6rem,2.6vw,2.3rem)}
}

/* ======================= v0.11 — Laws of UX (zie CHANGELOG): zelfde tokens, nieuwe indeling ======================= */
/* toegankelijkheid: zichtbare focusring op alles wat je kunt bedienen */
:focus-visible{outline:3px solid var(--pl-violet);outline-offset:2px}
summary:focus-visible,.pl-listrow:focus-visible,.pl-form:focus-visible{outline:3px solid var(--pl-violet);outline-offset:2px}
.pl-between{justify-content:space-between}
.pl-center{text-align:center;margin:0}
.pl-full{width:100%;display:block}
.pl-btn.pl-full{min-height:52px}

/* Home: begroeting met de foto ernaast, nooit erover (Prägnanz) */
.pl-hero{min-height:0;padding:16px 18px;gap:14px;overflow:visible}
.pl-hero-img{position:static;width:72px;height:72px;flex:none;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid var(--pl-surface);box-shadow:0 4px 12px -6px rgba(68,51,61,.5)}
.pl-hero-flower{display:grid;place-items:center;background:var(--pl-surface)}
.pl-hero-flower svg{width:48px;height:48px}
.pl-hero-text{max-width:none;flex:1;min-width:0;gap:2px}
.pl-hero-text .pl-h2{margin:0}
.pl-today .pl-h2{margin:0}
.pl-today .pl-lead{margin:0}
.pl-today-open{border:2px solid var(--pl-violet)}
/* vakken (Chunking, Similarity): kop per vak, rijen met dezelfde bloem in de kleur van het vak */
.pl-group{display:grid;gap:8px}
.pl-cathead{margin:6px 0 0;font-family:var(--pl-body)}
.pl-area-list{display:grid;gap:10px;align-content:start}
.pl-listrow{min-height:64px;padding:10px 14px;width:100%}
.pl-badge svg{width:30px;height:30px}
.pl-rowtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-listtext .pl-rowtop b{font-weight:600;font-family:var(--pl-display);font-size:1.08rem;color:var(--pl-ink)}
.pl-listtext .pl-sub{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-tag{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.03em;color:var(--pl-violet-deep);background:var(--pl-violet-soft);border-radius:var(--pl-r-pill);padding:1px 8px}
.pl-listtext .pl-status{font-size:.8rem;color:var(--pl-ink-soft);margin-top:2px}
.pl-listtext .pl-status.s-nieuw{color:var(--pl-violet-deep);font-weight:500}
.pl-makelink{justify-self:start}
.pl-tuinkaart{display:grid;gap:10px}
.pl-tuinkaart .pl-lead{margin:0}
.pl-tuinkaart #pl-tuin{cursor:pointer}
.pl-grownlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl-grownlist li{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;background:var(--pl-paper);border-radius:12px;padding:8px 12px}
.pl-grownlist b{font-weight:500}
.pl-grownlist span{color:var(--pl-ink-soft);font-size:.92rem}
.pl-narrow{max-width:760px}
.pl-region .pl-note{margin:0}

/* Home op een groot scherm (Proximity, Common Region): links begroeting, Vandaag en Mijn tuin; rechts de vakken in twee kolommen */
.pl-home{display:grid;gap:14px;grid-template-areas:"hero" "today" "list" "tuin"}
.pl-home > .pl-hero{grid-area:hero}.pl-area-today{grid-area:today}.pl-area-list{grid-area:list}.pl-area-tuin{grid-area:tuin}
@media (min-width:1024px){
  .pl-app.pl-homeapp{max-width:1200px;padding-inline:32px}
  .pl-home{grid-template-columns:minmax(320px,400px) 1fr;grid-template-areas:"hero list" "today list" "tuin list";grid-template-rows:auto auto 1fr;column-gap:32px;align-items:start}
  .pl-grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* kop van een training (Jakob's Law): terug naar Home linksboven, Geluid en Mijn tuin rechts */
.pl-top{position:relative}
.pl-backhome{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--pl-line);background:var(--pl-surface);border-radius:var(--pl-r-pill);min-height:44px;padding:8px 16px 8px 14px;font-weight:500;cursor:pointer;flex:none;color:var(--pl-ink)}
.pl-backhome:hover{border-color:var(--pl-violet)}
.pl-chev-l{transform:rotate(135deg);margin:0 0 0 4px;width:9px;height:9px}
.pl-tuinbtn{display:inline-flex;align-items:center;gap:6px;padding-left:10px}
.pl-btnflower{display:inline-flex;width:22px;height:22px;flex:none}
.pl-btnflower svg{width:100%;height:100%}
.pl-top-tr .pl-title{min-width:0}
.pl-top-tr .pl-title h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pl-soundpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--pl-surface);border:1px solid var(--pl-line);border-radius:var(--pl-r-card);padding:8px;display:grid;gap:2px;min-width:240px;box-shadow:0 14px 30px -16px rgba(68,51,61,.55)}
.pl-toggle{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 10px;border-radius:12px;cursor:pointer}
.pl-toggle:hover{background:var(--pl-paper)}
.pl-toggle input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--pl-line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.pl-toggle input::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--pl-surface);box-shadow:0 1px 3px rgba(68,51,61,.4);transition:transform .15s}
.pl-toggle input:checked{background:var(--pl-violet)}
.pl-toggle input:checked::after{transform:translateX(18px)}
@media (max-width:700px){
  .pl-top-tr{flex-wrap:wrap;row-gap:8px}
  .pl-top-tr .pl-topbtns{margin-left:auto}
  .pl-top-tr .pl-title{order:3;flex:1 1 100%}
}
@media (max-width:380px){.pl-top-tr .pl-garden-btn,.pl-backhome{padding-inline:10px}}

/* startscherm (Hick, Occam, Fitts): uitleg → vorm → één Start onderin */
.pl-intro{width:100%;max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.pl-app.pl-wide .pl-intro{max-width:760px}
.pl-startcard{display:grid;gap:10px}
.pl-startcard .pl-h2,.pl-startcard .pl-lead,.pl-startcard .pl-greet,.pl-startcard .pl-daarna{margin:0}
.pl-grow{display:flex;align-items:center;gap:8px;margin:0;color:var(--pl-ink)}
.pl-segwrap{display:grid;gap:6px;margin-top:4px}
.pl-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--pl-paper);border:1.5px solid var(--pl-line);border-radius:var(--pl-r-pill);padding:4px}
.pl-seg .pl-form{margin:0;border:0;background:transparent;border-radius:var(--pl-r-pill);min-height:44px;padding:8px 12px;text-align:center;font-family:var(--pl-display);font-weight:600;font-size:1.05rem;display:block;color:var(--pl-ink)}
.pl-seg .pl-form[aria-checked="true"]{background:var(--pl-surface);color:var(--pl-violet-deep);box-shadow:0 0 0 2px var(--pl-violet)}
.pl-formdesc{margin:0}
.pl-links{gap:4px 16px}
.pl-details summary{cursor:pointer;color:var(--pl-violet-deep);font-weight:500;min-height:44px;display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px}
.pl-details[open] summary{margin-bottom:6px}
.pl-actions{display:grid;gap:8px}
@media (max-width:700px){
  .pl-actions{position:sticky;bottom:0;z-index:6;background:var(--pl-paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 14px -14px rgba(68,51,61,.35)}
  .pl-app{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}

/* ronde (Goal-Gradient, Flow): een balk met "2 van 6"; geen kop-tierlantijnen tijdens de ronde */
.pl-roundprog{display:flex;align-items:center;gap:12px}
.pl-roundprog .pl-bar{flex:1;width:auto;max-width:none;height:10px}
.pl-count{font-size:.95rem;font-weight:500;color:var(--pl-ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-dots{display:none}
.pl-app.pl-inround .pl-foot{display:none}
.pl-app.pl-inround{gap:10px;padding-top:10px}
.pl-round{gap:12px}
@media (max-width:700px){.pl-app.pl-inround .pl-top-tr .pl-title{display:none}}
/* "Gelukt" in een vaste strook onderin (Fitts, Doherty): schuift erover, duwt niets weg */
.pl-sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;margin-inline:auto;max-width:640px;background:var(--pl-surface);border:1px solid var(--pl-line);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 30px -18px rgba(68,51,61,.55);transform:translateY(105%);transition:transform .18s ease-out}
.pl-sheet.open{transform:none}
.pl-sheet .pl-ok{display:grid;gap:12px;background:var(--pl-leaf-soft);border:2px solid var(--pl-leaf);padding:12px 14px}
.pl-ok-text{margin:0}
.pl-sheet .pl-verder{float:none;margin:0;border:0;min-height:52px;font-family:var(--pl-display);font-size:1.2rem;background:var(--pl-violet);color:#fff;border-radius:var(--pl-r-pill)}
.pl-sheet .pl-verder:hover{background:var(--pl-violet-deep)}

/* einde van een ronde (Peak-End): kort feestje, wat erbij groeide, één volgende stap */
.pl-endcard{display:grid;gap:12px}
.pl-endtop{display:flex;align-items:center;gap:10px}
.pl-endtop .pl-h2{margin:0}
.pl-endflower{width:44px;height:44px;display:inline-flex;animation:pl-bloei .5s ease-out}
.pl-endflower svg{width:100%;height:100%}
@keyframes pl-bloei{from{transform:scale(.6) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.pl-nextline{margin:0}
.pl-nextline b{color:var(--pl-ink);font-weight:600}
.pl-chipbtn{min-height:44px;padding:8px 18px;font-size:1rem}
.pl-endcard .pl-fact{margin:0}
.pl-btnflower svg{width:auto;height:100%;margin-inline:auto}
.pl-grow .pl-btnflower{height:24px}
/* tijdens "Gelukt" is de invoer even rustig: één opvallende knop in beeld (Von Restorff) */
.pl-round:has(.pl-sheet.open) .pl-keypad{opacity:.35;pointer-events:none}

/* ======================= v0.12 — de stem (zie docs/onderbouwing.md) ======================= */
.pl-ok-stem{margin:0;color:var(--pl-ink);font-family:var(--pl-display);font-size:1.05rem;line-height:1.35}
.pl-rups{margin:0;font-family:var(--pl-display);font-size:1.12rem;line-height:1.4;color:var(--pl-ink)}
.pl-stemline{margin:0;color:var(--pl-ink)}
.pl-perken li{display:block;padding:0;background:none}
.pl-perk{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t c" "s c";gap:2px 10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--pl-line);background:var(--pl-paper);border-radius:14px;padding:10px 14px;min-height:56px;cursor:pointer;color:var(--pl-ink)}
.pl-perk:hover{border-color:var(--pl-violet)}
.pl-perk b{grid-area:t;font-family:var(--pl-display);font-weight:600}
.pl-perk span:not(.pl-chev){grid-area:s;font-size:.92rem;color:var(--pl-ink-soft)}
.pl-perk .pl-chev{grid-area:c;transform:rotate(45deg);transition:transform .2s}
.pl-perk[aria-expanded="true"]{border-color:var(--pl-violet);background:var(--pl-surface)}
.pl-perk[aria-expanded="true"] .pl-chev{transform:rotate(-135deg)}
.pl-result{display:grid;gap:10px;padding:12px 4px 4px}
.pl-perken .pl-result{padding:12px 14px 4px}
.pl-resblock{display:grid;gap:2px}
.pl-resblock h3{margin:0;font-family:var(--pl-body)}
.pl-resblock p{margin:0;line-height:1.45}
/* in de tuin: alleen de perken zijn aan te tikken (gras, licht en lucht laten de tik door) */
.pl-tuinpagina .gd *{pointer-events:none}
.pl-tuinpagina .gd .gd-bed{pointer-events:auto}

/* ======================= v0.13 — Te makkelijk / Pittig ======================= */
.pl-roundprog{position:relative;flex-wrap:nowrap}
.pl-feel{display:flex;gap:6px;align-items:center;flex:none}
.pl-feelbtn{border:1.5px solid var(--pl-line);background:var(--pl-surface);color:var(--pl-ink-soft);border-radius:var(--pl-r-pill);min-height:44px;padding:6px 12px;font:500 .9rem var(--pl-body);cursor:pointer}
.pl-feelbtn:hover:not([disabled]){border-color:var(--pl-violet);color:var(--pl-ink)}
.pl-feelbtn[aria-expanded="true"],.pl-feelbtn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft);color:var(--pl-violet-deep)}
.pl-feelbtn[disabled]{cursor:default}
.pl-feelbtn[disabled]:not([aria-pressed="true"]){opacity:.5}
/* in de ronde: het vak met redenen schuift over het spel (niets verspringt) */
.pl-feel-ronde .pl-feelpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:28;width:min(340px,calc(100vw - 32px));background:var(--pl-surface);border:1px solid var(--pl-line);border-radius:var(--pl-r-card);padding:12px;box-shadow:0 14px 30px -16px rgba(68,51,61,.55);display:grid;gap:8px}
.pl-feel-ronde .pl-feelpanel[hidden]{display:none}
.pl-feelpanel .pl-note{margin:0}
.pl-feelchips{grid-template-columns:1fr;padding:0}
.pl-feelchips .pl-chip b{font-weight:500;font-family:var(--pl-body)}
.pl-feelwrap{display:grid;gap:8px}
.pl-feelwrap .pl-feel{flex-wrap:wrap}
.pl-feel-einde .pl-feelpanel{flex-basis:100%;display:grid;gap:8px}
.pl-feel-einde .pl-feelpanel[hidden]{display:none}
.pl-toets{font-family:var(--pl-display);font-size:1.05rem}
@media (max-width:380px){.pl-feelbtn{padding:6px 9px;font-size:.85rem}}

/* v0.14: gedeelde login (presentatie, groep3) */
.pl-loginapp{justify-content:center}
.pl-login{max-width:420px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:left}
.pl-login .pl-h2{margin:0;text-align:center}
.pl-login-flower{display:block;width:56px;height:56px;margin:0 auto}
.pl-login-flower svg{width:100%;height:100%}
.pl-login-field{display:flex;flex-direction:column;gap:6px;font-weight:500}
.pl-login-field input{font:inherit;font-size:1.1rem;min-height:52px;padding:10px 14px;border:2px solid var(--pl-line);border-radius:14px;background:var(--pl-paper);color:var(--pl-ink)}
.pl-login-field input:focus{border-color:var(--pl-violet);outline:none}
.pl-login-msg{min-height:1.5em;margin:0}
/* v0.14: demo-hulpmiddelen in de voettekst (alleen presentatie) */
.pl-demotools{display:inline-flex;gap:4px;margin-left:10px}
.pl-demotools button{border:0;background:none;color:var(--pl-ink-soft);font:inherit;font-size:.75rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:32px;padding:4px 6px}
.pl-demotools button.pl-demo-armed{color:var(--pl-violet-deep);font-weight:600}

/* De tuin v0.8: lagen (lucht, heuvels, wei, tuintjes, gras), licht volgens de klok, beweging die meegroeit (gd-t0 … gd-t3).
   Alleen transform, opacity en filter; bij "minder beweging" staat alles stil (core.css). Geen tekst. */
.gd{opacity:0;transition:opacity .8s}
.gd.gd-klaar{opacity:1}
.gd{--gd-shadow:drop-shadow(var(--shx) 5px 4px rgba(40,25,15,.32));--fx:50%;--fy:50%;position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:22px;background:#8FC46A;isolation:isolate;box-shadow:0 10px 30px -18px rgba(68,51,61,.6)}
.gd-cam{position:absolute;inset:0;transform-origin:var(--fx) var(--fy);transition:transform 1.6s cubic-bezier(.4,0,.2,1)}
.gd-zoom .gd-cam{transform:translate(calc(50% - var(--fx)),calc(50% - var(--fy))) scale(1.85)}
.gd-cam > *{position:absolute}
.gd img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* lucht en verte */
.gd-lucht{inset:0;overflow:hidden}
.gd-land{width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.04)}
.gd-nevel{left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(250,245,247,.95),rgba(250,245,247,.75) 60%,rgba(250,245,247,0));opacity:var(--nevel);transition:opacity 2s}
.gd-zon{left:var(--sx);top:var(--sy);width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,252,232,.98) 0 6%,rgba(255,240,190,.55) 16%,rgba(255,236,170,0) 62%);mix-blend-mode:screen}
.gd-stralen{inset:0;overflow:hidden;mix-blend-mode:screen;opacity:0}
.gd-stralen i{position:absolute;left:var(--sx);top:var(--sy);width:9%;height:140%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,246,214,.55),rgba(255,246,214,0) 75%);filter:blur(6px)}
.gd-stralen i:nth-child(1){transform:translateX(-50%) rotate(18deg)}.gd-stralen i:nth-child(2){transform:translateX(-50%) rotate(-4deg);width:6%}.gd-stralen i:nth-child(3){transform:translateX(-50%) rotate(-26deg)}
.gd-heuvels{left:-2%;width:104%;top:44%;opacity:.5;filter:saturate(.9) blur(.5px);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.gd-wei{left:0;right:0;top:50%;bottom:0;background:linear-gradient(180deg,rgba(60,110,50,0) 0%,rgba(60,110,50,.18) 60%,rgba(40,80,35,.35) 100%)}
.gd-veld{inset:0}
.gd-gras{left:-3%;right:-3%;bottom:-2%;height:calc(12% + var(--gras) * 12%);overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 38%);mask-image:linear-gradient(180deg,transparent 0,#000 38%);transform-origin:50% 100%;z-index:60}
.gd-gras img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.gd-toon{inset:0;pointer-events:none;z-index:80;mix-blend-mode:soft-light;transition:background 3s}
.gd-toon::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at var(--sx) var(--sy),rgba(255,248,225,.5),rgba(255,248,225,0) 70%)}
.gd-nacht .gd-toon::after{background:radial-gradient(ellipse 50% 60% at var(--sx) var(--sy),rgba(210,220,255,.25),transparent 70%)}
.gd-stof,.gd-blad{inset:0;pointer-events:none;z-index:85}

/* tuintjes */
.gd-bed{position:absolute;aspect-ratio:760/425}
.gd-soil{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 76%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 76%,transparent 100%);filter:drop-shadow(0 8px 10px rgba(30,20,10,.3))}
.gd-soil-svg{background:radial-gradient(ellipse at 50% 50%,#4a3528 0 60%,#7d8c84 61% 70%,transparent 72%)}
.gd-bedin{position:absolute;inset:0}
.gd-el{position:absolute;transform:translate(-50%,-92%)}
.gd-sprite{display:block;width:100%;height:auto;filter:var(--gd-shadow);transform-origin:50% 100%}
.gd-svg svg{width:100%;height:auto;display:block}
.gd-flip .gd-grow{scale:-1 1}
.gd-insect{transform:translate(-50%,-70%)}
.gd-focus .gd-soil{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 8px 10px rgba(30,20,10,.3)) brightness(1.04)}

/* posities: breed (16:10) – achter tafels, europa, rekenmuur; voor de drie taaltuintjes */
.gd-bed[data-bed="tafels"]{left:8%;top:42%;width:24%;z-index:10}
.gd-bed[data-bed="europa"]{left:38%;top:40%;width:24%;z-index:9}
.gd-bed[data-bed="rekenmuur"]{left:68%;top:42%;width:24%;z-index:10}
.gd-bed[data-bed="spelling-een-of-twee"]{left:2%;top:62%;width:30%;z-index:20}
.gd-bed[data-bed="werkwoorden"]{left:35%;top:65%;width:30%;z-index:21}
.gd-bed[data-bed="zinnen"]{left:68%;top:62%;width:30%;z-index:20}
.gd-groei{position:absolute;left:50%;bottom:4%;width:8%;z-index:70;transform:translateX(-50%)}
.gd-groei img,.gd-groei svg{width:100%;height:auto;display:block;filter:var(--gd-shadow)}
.gd-groei.gd-eitje{width:6%}
.gd-groei.gd-rups.gd-klein{width:5.5%}
.gd-groei.gd-cocon{bottom:auto;top:24%;left:92%;width:4%}
@media (max-width:600px){
  .gd{aspect-ratio:4/5}
  .gd-nevel{height:34%}
  .gd-land{object-position:30% 40%}
  .gd-heuvels{top:26%;left:-30%;width:160%}
  .gd-wei{top:30%}
  .gd-bed[data-bed="tafels"]{left:3%;top:33%;width:46%}
  .gd-bed[data-bed="rekenmuur"]{left:51%;top:33%;width:46%}
  .gd-bed[data-bed="europa"]{left:3%;top:51%;width:46%}
  .gd-bed[data-bed="spelling-een-of-twee"]{left:51%;top:51%;width:46%}
  .gd-bed[data-bed="werkwoorden"]{left:3%;top:69%;width:46%}
  .gd-bed[data-bed="zinnen"]{left:51%;top:69%;width:46%}
  .gd-groei{width:13%}.gd-groei.gd-rups.gd-klein{width:9%}.gd-groei.gd-eitje{width:10%}.gd-groei.gd-cocon{top:18%;width:7%}
  .gd-zoom .gd-cam{transform:translate(calc(50% - var(--fx)),calc(50% - var(--fy))) scale(1.7)}
}

/* licht volgens de klok */
.gd-ochtend .gd-toon{background:linear-gradient(180deg,rgba(255,190,200,.35),rgba(255,220,200,.1))}
.gd-dag .gd-toon{background:linear-gradient(180deg,rgba(255,252,240,.18),rgba(255,255,255,0))}
.gd-goud .gd-toon{background:linear-gradient(180deg,rgba(255,196,110,.55),rgba(255,170,90,.3))}
.gd-avond .gd-toon{background:linear-gradient(180deg,rgba(255,140,110,.6),rgba(160,80,130,.45))}
.gd-nacht .gd-toon{background:linear-gradient(180deg,rgba(40,50,120,.75),rgba(30,40,90,.6))}
.gd-nacht .gd-zon{background:radial-gradient(circle,rgba(240,244,255,.9) 0 4%,rgba(200,210,255,.25) 12%,rgba(200,210,255,0) 40%)}
.gd-nacht .gd-cam{filter:brightness(.82) saturate(.85)}
.gd-avond .gd-cam{filter:sepia(.18) saturate(1.15) brightness(.96)}
.gd-goud .gd-cam{filter:sepia(.12) saturate(1.15) brightness(1.03)}
.gd-ochtend .gd-cam{filter:brightness(1.03) saturate(.95)}

/* beweging die meegroeit: t0 alleen gras; t1 planten wiegen, rups, stofjes; t2 insecten, stralen; t3 vlinders vrij, blaadjes */
.gd-gras{animation:gd-wind 7s ease-in-out infinite alternate}
@keyframes gd-wind{from{transform:skewX(-1.2deg)}to{transform:skewX(1.2deg)}}
.gd-t2 .gd-gras,.gd-t3 .gd-gras{animation-duration:4.5s}
.gd-t1 .gd-sway,.gd-t2 .gd-sway,.gd-t3 .gd-sway{animation:gd-sway 5.5s ease-in-out infinite alternate}
.gd-el:nth-child(2n) .gd-sway{animation-delay:-2s}.gd-el:nth-child(3n) .gd-sway{animation-delay:-3.5s}
@keyframes gd-sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.gd-t1 .gd-stralen{opacity:.35}.gd-t2 .gd-stralen,.gd-t3 .gd-stralen{opacity:.6;animation:gd-adem 9s ease-in-out infinite alternate}
.gd-nacht .gd-stralen{opacity:0!important}
@keyframes gd-adem{from{opacity:.35}to{opacity:.7}}
.gd-t1 .gd-rups img,.gd-t2 .gd-rups img,.gd-t3 .gd-rups img{transform-origin:50% 100%;animation:gd-inch 2.8s ease-in-out infinite}
@keyframes gd-inch{0%,100%{transform:scale(1,1)}40%{transform:scale(1.06,.9)}60%{transform:scale(.97,1.05) translateY(-2%)}}
.gd-t1 .gd-rups,.gd-t2 .gd-rups,.gd-t3 .gd-rups{animation:gd-kruip-veld 60s ease-in-out infinite alternate}
@keyframes gd-kruip-veld{from{left:38%}to{left:62%}}
.gd-t2 .gd-kruip,.gd-t3 .gd-kruip{animation:gd-kruip 14s ease-in-out infinite alternate}
.gd-t2 .gd-kruip.gd-m1,.gd-t3 .gd-kruip.gd-m1{animation-duration:19s;animation-direction:alternate-reverse}
@keyframes gd-kruip{0%{transform:translate(-70%,-70%)}50%{transform:translate(-40%,-74%)}100%{transform:translate(-10%,-70%)}}
.gd-t2 .gd-zweef,.gd-t3 .gd-zweef{animation:gd-zweef 7s ease-in-out infinite}
@keyframes gd-zweef{0%,100%{transform:translate(-50%,-160%)}25%{transform:translate(-10%,-190%)}50%{transform:translate(-50%,-150%)}75%{transform:translate(-90%,-185%)}}
.gd-zweef .gd-wing{transform-origin:50% 100%;animation:gd-flap .16s ease-in-out infinite alternate}
@keyframes gd-flap{from{transform:scaleY(1)}to{transform:scaleY(.4)}}
.gd-stof b{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,248,220,.9);box-shadow:0 0 6px 2px rgba(255,240,200,.6);opacity:0;animation:gd-stof 12s ease-in-out infinite}
@keyframes gd-stof{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}75%{opacity:.6}100%{opacity:0;transform:translate(22px,-30px)}}
.gd-nacht .gd-stof b{background:#FFF3A0;box-shadow:0 0 8px 3px rgba(255,240,140,.8)}
.gd-blad i{position:absolute;top:-4%;width:10px;height:7px;border-radius:70% 0 70% 0;background:#F19CB1;opacity:0;animation:gd-blad 16s linear infinite}
.gd-blad i:nth-child(2n){background:#FFE9A3}
@keyframes gd-blad{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(-60px,110vh) rotate(540deg)}}

/* de vlinder: klapperende vleugels (één render, gespiegeld), vliegt over de tuin */
.gd-vlinder{position:absolute;width:7%;aspect-ratio:1;z-index:90;left:10%;top:20%;animation:gd-vlucht 34s ease-in-out infinite}
.gd-vlinder.gd-v1{animation-duration:41s;animation-delay:-12s;width:5.5%}.gd-vlinder.gd-v2{animation-duration:47s;animation-delay:-25s;width:5%}
.gd-vlinder.gd-v3{animation-duration:38s;animation-delay:-6s;width:4.5%}.gd-vlinder.gd-v4{animation-duration:52s;animation-delay:-31s;width:4.5%}
.gd-vl{position:absolute;top:2%;width:44%;height:96%}
.gd-vl img{width:100%;height:100%;object-fit:contain}
.gd-vl-l{left:6%;transform-origin:100% 60%;animation:gd-vleugel .38s ease-in-out infinite alternate}
.gd-vl-r{left:46%;transform-origin:0% 60%;animation:gd-vleugel-r .38s ease-in-out infinite alternate;filter:brightness(.88)}
.gd-vl-r img{transform:scaleX(-1)}
.gd-vl-lijf{position:absolute;left:24%;top:12%;width:62%;height:auto}
@keyframes gd-vleugel{from{transform:rotateY(0)}to{transform:rotateY(62deg)}}
@keyframes gd-vleugel-r{from{transform:rotateY(0)}to{transform:rotateY(-62deg)}}
@keyframes gd-vlucht{0%{transform:translate(0,0) rotate(-4deg)}20%{transform:translate(380%,90%) rotate(6deg)}40%{transform:translate(820%,-30%) rotate(-3deg)}60%{transform:translate(1050%,140%) rotate(5deg)}80%{transform:translate(500%,260%) rotate(-6deg)}100%{transform:translate(0,0) rotate(-4deg)}}
.gd-t0 .gd-vlinder,.gd-t1 .gd-vlinder{animation-duration:60s}

/* iets nieuws groeit zichtbaar op */
.gd-grow{display:block;transform-origin:50% 100%}
.gd-vlinder .gd-grow{position:absolute;inset:0;transform-origin:50% 50%}
.gd-nieuw{animation:gd-nieuw 1.6s cubic-bezier(.3,1.4,.5,1) .6s both}
@keyframes gd-nieuw{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:scale(1)}}

/* v0.9: de strook onderaan het startscherm — halve hoogte, één rij tuintjes, geen nevel, stralen, stofjes of blaadjes */
.gd.gd-strook{aspect-ratio:16/5;border-radius:18px;box-shadow:none}
.gd-strook .gd-land{object-position:50% 30%}
.gd-strook .gd-zon{width:30%}
.gd-strook .gd-wei{top:35%}
.gd-strook .gd-gras{height:calc(14% + var(--gras) * 8%)}
.gd-strook .gd-bed{top:44%;width:14%;z-index:10}
.gd-strook .gd-bed[data-bed="tafels"]{left:2%}
.gd-strook .gd-bed[data-bed="rekenmuur"]{left:18.5%}
.gd-strook .gd-bed[data-bed="europa"]{left:35%}

/* Thema blauw (v0.14) voor de kindversie. Palet van de ouder:
   #5188B3 staalblauw · #8CB3CD lichtblauw · #13294F marine · #D7D8DD lichtgrijs · #4897C5 helderblauw.
   Papier is een lichte tint van het grijs; tekst en de hoofdknop zijn marine (wit erop 14 : 1).
   Gelukt (groen) en tussenstap (honing) blijven: die vormen betekenen in elke versie hetzelfde. Rood komt niet voor. */
:root{
  --pl-paper:#F3F6FA;
  --pl-surface:#FFFFFF;
  --pl-ink:#13294F;
  --pl-ink-soft:#44597A;
  --pl-line:#D7D8DD;
  --pl-mist:#D7D8DD;
  --pl-violet:#13294F;       /* merk en hoofdknop: marine */
  --pl-violet-deep:#0C1B36;
  --pl-violet-soft:#E3EDF5;  /* tint van #8CB3CD */
  --pl-lilac:#8CB3CD;
  --g3-steel:#5188B3;
  --g3-sky:#4897C5;
  --g3-light:#8CB3CD;
  --g3-grey:#D7D8DD;
  --g3-navy:#13294F;
  --g3-read:"Andika","Lexend",system-ui,sans-serif;
}
/* de bloem in het blauwe palet */
.k-root svg [fill="#F19CB1"]{fill:#8CB3CD}
.k-root svg [fill="#C12F78"]{fill:#13294F}
.k-root svg [fill="#9D285C"]{fill:#0C1B36}

/* Kindschil v0.1 (Leeratelier v0.14). Belangrijkste maat: tablet 820 × 1180; telefoon 375 × 812 en desktop 1440 × 900 werken ook.
   Tikdoelen minstens 64 px; leesletters minstens 32 px (telefoon) en 48 px (tablet), in Andika (enkelvoudige a en g), nooit hoofdletters. */
.k-app{max-width:900px;min-height:100dvh;padding-inline:max(16px,env(safe-area-inset-left));padding-block:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-bottom));gap:16px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.k-app button{touch-action:manipulation}
.k-foot{text-align:center}
.k-letter{font-family:var(--g3-read);font-weight:400;text-transform:none;letter-spacing:.01em;line-height:1}

/* kopbalk: home links, luidspreker rechts */
.k-top{display:flex;align-items:center;gap:12px}
.k-logo{width:44px;height:44px;flex:none}.k-logo svg{width:100%;height:100%}
.k-hoi{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.6rem,4.6vw,2.3rem);margin:0;flex:1}
.k-bar{display:flex;justify-content:space-between;align-items:center}
.k-speak,.k-homebtn,.k-hear{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.k-speak{background:var(--g3-navy);color:#fff}
.k-speak svg,.k-homebtn svg,.k-hear svg{width:38px;height:38px}
.k-homebtn{background:var(--pl-surface);color:var(--g3-navy);border:2px solid var(--pl-line)}
.k-hear{background:var(--pl-violet-soft);color:var(--g3-navy);margin:6px auto 0;width:80px;height:80px}
.k-speak:active,.k-hear:active,.k-homebtn:active{transform:scale(.96)}

/* Home */
.k-hero{display:flex;align-items:center;gap:18px;background:var(--pl-violet-soft);border-radius:24px;padding:16px 20px}
.k-avatar{display:block;border-radius:50%;object-fit:cover;object-position:50% 25%;border:4px solid var(--pl-surface);box-shadow:0 6px 16px -8px rgba(19,41,79,.5)}
.k-avatar-big{width:clamp(96px,22vw,150px);height:clamp(96px,22vw,150px)}
.k-avatar-flower{display:grid;place-items:center;background:var(--pl-surface)}.k-avatar-flower svg{width:60%;height:60%}
.k-hero-q{font-family:var(--pl-display);font-weight:500;font-size:clamp(1.25rem,3.6vw,1.7rem);margin:0}
.k-lines{display:flex;flex-direction:column;gap:14px}
.k-line{background:var(--pl-surface);border:1px solid var(--pl-line);border-radius:22px;padding:12px 14px 14px}
.k-line-name{font-family:var(--pl-display);font-weight:600;font-size:1.1rem;margin:2px 4px 10px;color:var(--pl-ink-soft)}
.k-line-rekenen{border-top:6px solid var(--g3-steel)}.k-line-lezen{border-top:6px solid var(--g3-sky)}.k-line-schrijven{border-top:6px solid var(--g3-light)}
.k-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.k-tile{min-height:150px;border:2px solid var(--pl-line);border-radius:20px;background:var(--pl-paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;cursor:pointer;color:var(--pl-ink)}
.k-tile:active{transform:scale(.98);border-color:var(--g3-steel)}
.k-tile-pic{width:110px;height:76px;display:grid;place-items:center}.k-tile-pic svg{width:100%;height:100%}
.k-tile-name{font-family:var(--pl-display);font-weight:500;font-size:1.05rem}
.k-tuinbtn{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;background:var(--pl-surface);min-height:120px;display:block;width:100%}
.k-tuinstrook{display:block}
.k-tuinlabel{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:var(--g3-navy);border-radius:999px;padding:8px 16px 8px 10px;font-family:var(--pl-display);font-weight:600;font-size:1.1rem}
.k-tuinlabel svg{width:28px;height:28px}

/* intro */
.k-s-intro .k-introcard,.k-s-slot .k-slotcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.k-intro-pic{width:min(70vw,360px);aspect-ratio:3/2;background:var(--pl-surface);border-radius:28px;border:1px solid var(--pl-line);display:grid;place-items:center;padding:24px}
.k-intro-pic svg{width:100%;height:100%}
.k-title{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,5vw,2.6rem);margin:0}
.k-bottom{display:flex;justify-content:center;gap:14px;padding-bottom:8px}
.k-go,.k-calm{min-height:88px;min-width:min(78vw,340px);border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:14px;font-family:var(--pl-display);font-weight:600;font-size:1.6rem;cursor:pointer}
.k-go{background:var(--g3-navy);color:#fff}
.k-calm{background:var(--pl-surface);color:var(--g3-navy);border:3px solid var(--g3-light)}
.k-go svg,.k-calm svg{width:44px;height:44px}
.k-two{flex-wrap:wrap}.k-two .k-go,.k-two .k-calm{min-width:min(42vw,300px)}
.k-go:active,.k-calm:active{transform:scale(.98)}

/* ronde: vraag in het midden, keuzes onderin */
.k-s-ronde .k-work{flex:1;display:flex;flex-direction:column}
.k-q{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 0}
.k-vis{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.k-vis .k-svg{max-width:100%}
.k-dobbel{width:min(42vw,220px)}
.k-hand{height:min(34vh,240px)}.k-handen{height:min(30vh,230px);max-width:92vw}
.k-rekenrek{width:min(92vw,560px)}
.k-help .k-rekenrek{width:min(80vw,420px);opacity:.95}
.k-help{background:var(--pl-violet-soft);border-radius:18px;padding:10px 12px}
.k-groep{height:auto}
.k-twee{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.k-twee .k-groep{max-width:42vw}
.k-erbij{animation:k-in .7s .5s both}
@keyframes k-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.k-plusteken{font-family:var(--pl-display);font-size:3rem;color:var(--g3-navy)}
.k-asknum{display:grid;place-items:center}
.k-num{font-family:var(--pl-display);font-weight:600;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1}
.k-num-big{font-size:clamp(4rem,12vw,6rem);background:var(--pl-surface);border-radius:28px;padding:12px 40px;border:1px solid var(--pl-line)}
.k-bigletter{display:grid;place-items:center}
.k-letter-xl{font-size:clamp(7rem,24vw,11rem);background:var(--pl-surface);border-radius:32px;padding:10px 46px 26px;border:1px solid var(--pl-line)}
.k-pic{width:min(56vw,300px);aspect-ratio:4/3;background:var(--pl-surface);border-radius:26px;border:1px solid var(--pl-line);display:grid;place-items:center;padding:16px}
.k-pic svg,.k-pic img{width:100%;height:100%;object-fit:contain}

.k-choices{display:grid;gap:14px;width:100%;max-width:640px;margin:0 auto;padding-bottom:6px}
.k-n2{grid-template-columns:repeat(2,1fr)}.k-n3{grid-template-columns:repeat(3,1fr)}.k-n1{grid-template-columns:1fr}
.k-choice{min-height:112px;border-radius:24px;border:3px solid var(--pl-line);background:var(--pl-surface);color:var(--pl-ink);display:grid;place-items:center;padding:10px;cursor:pointer;transition:transform .12s,opacity .2s,border-color .2s}
.k-choice:active{transform:scale(.97)}
.k-letters .k-choice .k-letter{font-size:clamp(3rem,9vw,4.6rem)}
.k-pics .k-choice{min-height:150px}.k-pics .k-choice svg,.k-pics .k-choice img{width:100%;max-height:150px}
/* terugkoppeling: geen rood en geen kruis; gelukt = groene rand, het goede voorbeeld = gestippelde groene rand */
.k-choice.k-ok{border-color:var(--pl-leaf);background:var(--pl-leaf-soft);border-style:solid}
.k-choice.k-not{opacity:.35}
.k-choice.k-show{border-color:var(--pl-leaf);border-style:dashed;border-width:4px;animation:k-puls 1.4s ease-in-out infinite}
.k-choice:disabled{opacity:.3;cursor:default}
.k-model .k-choice.k-show{opacity:1}
@keyframes k-puls{50%{transform:scale(1.04)}}
.k-done .k-choice:not(.k-ok){opacity:.3}

/* hakken, plakken, bouwen */
.k-boxes{display:flex;gap:12px;justify-content:center}
.k-box{width:clamp(76px,18vw,108px);height:clamp(92px,22vw,128px);border-radius:18px;background:var(--pl-surface);border:3px solid var(--g3-light);display:grid;place-items:center;font-size:clamp(3rem,9vw,4.4rem);color:var(--g3-navy);transition:background .2s,border-color .2s}
.k-box.k-lit{background:var(--pl-violet-soft);border-color:var(--g3-sky)}
.k-slot{border-style:dashed;padding-bottom:8px}
.k-slot.k-filled{border-style:solid;font-family:var(--g3-read)}
.k-slots.k-ok .k-slot{border-color:var(--pl-leaf);background:var(--pl-leaf-soft)}
.k-tilebank{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:640px;margin:0 auto}
.k-tilebtn{width:clamp(76px,17vw,104px);height:clamp(84px,19vw,112px);border-radius:18px;border:3px solid var(--g3-steel);background:var(--pl-surface);cursor:pointer;display:grid;place-items:center;color:var(--g3-navy)}
.k-tilebtn .k-letter{font-size:clamp(2.6rem,8vw,3.8rem)}
.k-tilebtn.k-used{visibility:hidden}
.k-tilebtn.k-dim{opacity:.3}
.k-tilebtn.k-show{border-color:var(--pl-leaf);border-style:dashed;border-width:4px;animation:k-puls 1.4s ease-in-out infinite}
.k-tilebtn.k-wobble{animation:k-wob .45s}
@keyframes k-wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* slot en tuin */
.k-avatar-slot{width:clamp(160px,40vw,260px);height:clamp(160px,40vw,260px)}
.k-slotline{font-family:var(--pl-display);font-weight:500;font-size:clamp(1.3rem,3.8vw,1.8rem);max-width:560px;margin:0;line-height:1.35}
.k-tuinpagina{flex:1;display:flex;align-items:center}
.k-tuinpagina > .gd{width:100%}

/* de drie perken (rekenen, lezen, schrijven) */
.k-root .gd-bed[data-bed="rekenen"]{left:4%;top:56%;width:30%;z-index:20}
.k-root .gd-bed[data-bed="lezen"]{left:35%;top:46%;width:30%;z-index:12}
.k-root .gd-bed[data-bed="schrijven"]{left:66%;top:56%;width:30%;z-index:20}
@media (max-width:600px){
  .k-root .gd-bed[data-bed="rekenen"]{left:3%;top:40%;width:46%}
  .k-root .gd-bed[data-bed="lezen"]{left:51%;top:40%;width:46%}
  .k-root .gd-bed[data-bed="schrijven"]{left:27%;top:62%;width:46%}
  .k-tiles{grid-template-columns:1fr 1fr}
  .k-tile{min-height:132px}
  .k-choice{min-height:96px}
  .k-speak,.k-homebtn{width:64px;height:64px}
}
@media (min-width:1100px){
  .k-app{max-width:1040px}
  .k-lines{display:grid;grid-template-columns:repeat(3,1fr)}
  .k-tiles{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.k-choice.k-show,.k-tilebtn.k-show,.k-erbij{animation:none}}
/* de gesproken vraag ook als rustige regel (voor wie meekijkt, of als het geluid uit staat) */
.k-cap{font-family:var(--pl-body);font-size:1rem;color:var(--pl-ink-soft);text-align:center;margin:0;min-height:1.5em;max-width:560px}

<script>
/* Leeratelier kern v0.6
   Eén motor voor alle trainingen. Trainingen leveren alleen stenen (generatoren) en een werkvlak.
   De kern regelt: startscherm, rondes, stille diagnose, twee verborgen hefbomen (moeilijkheid, herhaling),
   faden van het model, feedback, uitleg-moment, tuin, ouderscherm, materiaalpakketten en het logboek.
   Nieuw in v0.6: leuk/gewoon/pittig met een reden die iets verandert, uitlegvormen die gemeten worden
   (lukte de vraag na de uitleg?), en zinnen uit bouwstenen met variabelen uit de sessie.
   v0.7 (na de UX-doorloop van 14 oktober): een sessie telt pas bij een afgeronde ronde; een tussenstap toont het antwoord
   niet (anders meldt de training "revealed" en telt het niet voor de uitlegmeting); teksten volgen uit de stand; het eindscherm
   zegt wat de volgende ronde wordt en waarom; één schermindeling voor een ronde (vraag, hulp en invoer in één venster). */
(function(){
"use strict";
const PL = window.PL = {};
/* v0.14: één systeem, drie versies (natalia, presentatie, groep3). De build zet window.__plSpace; zonder build is het Natalia.
   Alle opslagsleutels krijgen het voorvoegsel van de versie: "philearn-tafels" → "philearn-natalia-tafels". */
const SPACE = PL.space = Object.assign({id: "natalia", learnerName: "Natalia", requireLogin: false, demoTools: false, version: "v0.14", migrateLegacy: true}, window.__plSpace || {});
PL.VERSION = SPACE.version;
const NS = "philearn-" + SPACE.id + "-";
const nsKey = k => k.indexOf(NS) === 0 ? k : NS + (k.indexOf("philearn-") === 0 ? k.slice(9) : k);
PL.nsKey = nsKey;
PL.ls = {
  get(k){ try { return localStorage.getItem(nsKey(k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(nsKey(k), v); } catch(e){} },
  remove(k){ try { localStorage.removeItem(nsKey(k)); } catch(e){} }
};
/* eenmalige overzetting van de sleutels van vóór v0.14 (alleen de Natalia-versie). De oude sleutels blijven staan als reserve. */
const LEGACY = /^(philearn-(?!natalia-|presentatie-|groep3-)[a-z0-9_-]+|pl-geluid|tf-[a-z0-9_-]+)$/i;
PL.migrateLegacy = function(){
  if (!SPACE.migrateLegacy) return null;
  try {
    const mark = NS + "_migratie";
    if (localStorage.getItem(mark)) return JSON.parse(localStorage.getItem(mark));
    const moved = [];
    // eerst alle sleutels verzamelen: schrijven tijdens het doorlopen verschuift de volgorde van localStorage.key(i)
    const keys = []; for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    for (const k of keys){
      if (!k || !LEGACY.test(k)) continue;
      const nk = nsKey(k);
      if (localStorage.getItem(nk) === null){ localStorage.setItem(nk, localStorage.getItem(k)); moved.push(k); }
    }
    const rec = {d: new Date().toISOString(), moved};
    localStorage.setItem(mark, JSON.stringify(rec));
    return rec;
  } catch(e){ return null; }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const dayNum = iso => Math.floor(Date.parse(iso + "T12:00:00Z") / 864e5);
function weekKey(iso){ const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); }
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const noEmoji = s => String(s || "").replace(/[\p{Extended_Pictographic}\u{FE0F}]/gu, "").replace(/\s+/g, " ").trim();
Object.assign(PL, {$, esc, shuffle, pick, rnd, sleep, today, median});
/* een sessie is trainen pas als er minstens één ronde is afgemaakt (A1); een gestarte en verlaten poging staat alleen in het logboek */
const realSessions = d => ((d && d.sessions) || []).filter(s => (s.rounds || 0) > 0);
PL.realSessions = realSessions;

/* ---------- parameters uit het onderzoek (zie kennis/06) ---------- */
const P = {
  roundSize: 6, warm: 2,                 // 2 opwarmers uit groene stof, 4 uit de huidige steen
  fluentMs: 3000,                        // vlot = goed in één keer binnen 3 s (na typ-correctie)
  powerWindow: 5, powerNeed: 4,          // beheersing: 4 van de laatste 5 goed in één keer
  speedWindow: 6,                        // tempo: mediaan van de laatste 6 goede antwoorden ≤ fluentMs
  promoteFirst: 5,                       // ronde met ≥5/6 in één keer → stapje verder (als steen groen is)
  demoteSteps: 3,                        // ronde met ≥3 tussenstappen → stapje terug
  cooldownRounds: 1,                     // na een stap eerst één ronde rust
  holdRounds: 2,                         // na een stapje terug slaat de stille diagnose 2 rondes niets over (anders is de stap meteen ongedaan)
  review: [2, 5, 12, 30],                // herhaalchecks in dagen
  requeueAfter: 3,                       // na een tussenstap komt het item 3 vragen later terug
  wheel: 10,                             // 10 vragen zonder 3 goed op rij → stap terug
  sessionMin: 15,
  maxEvents: 3000
};
PL.P = P;

/* ---------- het merkteken ---------- */
PL.flower = function(petals, opts){
  opts = opts || {}; const n = 5, on = Math.max(0, Math.min(n, petals));
  let s = `<svg viewBox="0 0 58 70" aria-hidden="true">`;
  if (opts.stem !== false) s += `<path d="M29 40 V68" stroke="#2F8F5E" stroke-width="3" stroke-linecap="round"/><path d="M29 58 C 36 52, 44 54, 46 50 C 40 49, 33 51, 29 56" fill="#2F8F5E"/>`;
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, cx = 29 + Math.cos(a) * 11, cy = 24 + Math.sin(a) * 11;
    s += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="8" ry="11" transform="rotate(${(a * 180 / Math.PI + 90).toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${i < on ? (opts.petal || "#F19CB1") : "#ECE3E8"}"/>`;
  }
  return s + `<circle cx="29" cy="24" r="6.5" fill="${opts.heart || "#C12F78"}"/></svg>`;
};

/* ---------- v0.11 geluid (Doherty Threshold): een zacht toontje bij "Gelukt", binnen 400 ms. Eén knop "Geluid" in de kop;
   een training kan eigen geluiden toevoegen (Tafelreis: Natuurgeluiden, Muziek). Voorkeur in localStorage "pl-geluid". ---------- */
let chimeCtx = null;
const chimeOn = () => PL.ls.get("pl-geluid") !== "uit";
PL.chime = function(){
  if (!chimeOn() || window.__plSnel) return;
  try {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const c = chimeCtx, t = c.currentTime;
    [[587.33, 0], [880, .09]].forEach(([f, d]) => { const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.08, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .5); o.connect(g); g.connect(c.destination); o.start(t + d); o.stop(t + d + .55); });
  } catch(e){}
};
function soundItems(T){
  const own = (T.sound && T.sound.items) || [];
  const core = T.sound && T.sound.ownFeedback ? [] : [{key: "geluidjes", label: "Geluidjes bij gelukt", get: chimeOn, set: on => { PL.ls.set("pl-geluid", on ? "aan" : "uit"); if (on) PL.chime(); }}];
  return core.concat(own);
}

/* ---------- opslag ---------- */
async function makeStore(){
  try {
    if (window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function"){

        async save(k, obj){ await window.storage.set(k, JSON.stringify(obj)); } };
    }
  } catch(e){}
  try {
    if (window.claude && typeof window.claude.use === "function"){
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = db && user && typeof user.id === "function" ? await user.id() : null;
      if (db && uid) return { kind: "Claude-opslag (gepubliceerd)", persist: true,
        async load(k){ try { const s = await db.doc(`data/users/${uid}/${k}`).get(); return s.exists ? JSON.parse(s.data().json) : null; } catch(e){ return null; } },
        async save(k, obj){ await db.doc(`data/users/${uid}/${k}`).set({json: JSON.stringify(obj)}); } };
    }
  } catch(e){}
  try {
    localStorage.setItem("pl-test", "1"); localStorage.removeItem("pl-test");
    PL.migration = PL.migrateLegacy();   // v0.14: vóór de eerste lading
    return { kind: "browser (alleen dit apparaat)", persist: true,

      async save(k, obj){ try { localStorage.setItem(nsKey(k), JSON.stringify(obj)); } catch(e){} } };
  } catch(e){}
  const mem = {};
  return { kind: "alleen deze sessie", persist: false, async load(k){ return mem[k] || null; }, async save(k, obj){ mem[k] = JSON.parse(JSON.stringify(obj)); } };
}

let aiFn = null, aiKind = "niet beschikbaar", aiOff = false;
async function detectAI(){
  try {
    const c = window.claude;
    if (c && typeof c.complete === "function"){ aiKind = "Claude (chat)"; aiFn = async p => { const r = await c.complete(p); return typeof r === "string" ? r : (r && (r.text || r.completion)) || ""; }; return; }
    if (c && typeof c.use === "function"){ const s = await c.use("sample"); if (s){ aiKind = "Claude (gepubliceerd)"; aiFn = async p => (await s(p, {modelTier: "quick", cache: false})).text; } }
  } catch(e){}

const FORBIDDEN = /\b(niveau|groep \d|groep|cijfer|score|punten|fout|fouten|makkelijk|moeilijk|simpel|slim|dom|zwak|slecht|beter dan|sneller dan|leeftijd|jaar oud)\b/i;
PL.FORBIDDEN = FORBIDDEN;
PL.ai = async function(prompt){
  if (!aiFn || aiOff) return null;
  try { const t = noEmoji(await aiFn(prompt)); if (!t || FORBIDDEN.test(t)) return null; return t.slice(0, 320); }
  catch(e){ const code = e && e.code; if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(code)){ aiOff = true; aiKind = "uitgezet door de kijker"; } return null; }
};

const AGAIN = ["Nog een keer: zo leer je het echt.", "Goed plan. Elke ronde maakt het steviger.", "Daar gaan we weer. Nieuwe ronde.", "Herhalen is trainen. Net als bij ballet."];

/* ---------- de stem in code: zinnen uit bouwstenen met variabelen (kennis/08) ----------
   Na een ronde verzamelt de motor waarnemingen: wat gebeurde er precies? Elke waarneming heeft een gewicht en twee of
   drie varianten. Gekozen worden de zwaarste die niet net gebruikt zijn: hooguit twee zinnen, plus "nog een keer".
   Waarom zo: procesfeedback over wat ze deed (Mueller & Dweck 1998), concreet en specifiek (Hattie & Timperley 2007),
   en herhaling van dezelfde zin slijt. Alle zinnen gaan door de verboden-woordenfilter (tests/dialoog.js). */
const cap1 = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const ORD = ["", "eerste", "tweede", "derde", "vierde", "vijfde", "zesde", "zevende", "achtste", "negende", "tiende"];
const lst = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " en " + a[a.length - 1];
const OBS = {
  explHelp: {w: 10, v: [f => `Bij ${f.L} ${f.Mpl ? "hielpen" : "hielp"} ${f.M}. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst met ${f.M} erbij. Toen hij terugkwam, wist je hem.`]},
  reqOk:    {w: 9, v: [f => `Bij ${f.L} nam je een tussenstap. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst via een tussenstap. Toen hij terugkwam, wist je hem.`, f => `Bij ${f.L} hielp de tussenstap: de tweede keer deed je hem zelf.`]},
  newKnown: {w: 8, v: [f => `Nieuw: ${f.K} ${f.k > 1 ? "gaan" : "gaat"} nu vanzelf.`, f => `${cap1(f.K)} ${f.k > 1 ? "gaan" : "gaat"} sinds deze ronde vanzelf.`]},
  switch:   {w: 8, v: [() => `Je vroeg om een andere uitleg. Dat kun je aan elke AI ook vragen.`, () => `Je zei dat de uitleg niet hielp, en kreeg een andere. Zo werkt goed vragen.`]},
  dueOk:    {w: 6, v: [f => `${cap1(f.D)} kwam terug van een vorige keer, en je wist hem meteen. Zo werkt herhalen.`, f => `${cap1(f.D)} had je een tijdje niet gezien. Hij zat er nog.`]},
  step:     {w: 6, v: [f => `Bij ${f.L} nam je een tussenstap, en daarna vond je het zelf. Zo werkt trainen.`, f => `${cap1(f.L)} deed je via een tussenstap. Die weg heb je straks niet meer nodig.`]},
  adjOk:    {w: 5, v: [f => ({veel: "Met de extra opwarmers ging het rustiger.", snel: "Rustiger aan werkte: je nam de tijd die je nodig had.", lang: "Een korte ronde is ook een ronde.", uitleg: `De andere uitleg, ${f.M}, heb je gebruikt.`})[f.adj] || ""]},
  reqStill: {w: 5, v: [f => `${cap1(f.L)} kwam twee keer langs met een tussenstap. Hij komt nog eens terug; zo wordt hij van jou.`, f => `Bij ${f.L} heb je de tussenstap twee keer gezet. Volgende keer komt hij weer, met dezelfde hulp.`]},
  fluent:   {w: 5, v: [f => `Veel ${f.noun} wist je meteen, zonder te hoeven denken. Dat is wat trainen doet.`, f => `De meeste ${f.noun} kwamen meteen, zonder tellen.`]},
  wise:     {w: 4, v: [f => `Ik geef je deze ${f.noun} omdat ik weet dat je ze kunt leren. Elke tussenstap laat zien dat het gebeurt.`]},
  allSelf:  {w: 3, v: [f => `Je deed de ${f.noun} achter elkaar zelf, tot en met ${f.last}.`, f => `Alles in deze ronde deed je zelf, tot en met ${f.last}.`]},
  roundN:   {w: 2, v: [f => `Dit is al je ${ORD[f.r] || f.r + "e"} ronde vandaag.`, f => `Je ${ORD[f.r] || f.r + "e"} ronde vandaag. Je bleef erbij.`]}
};
const GROUPS = [["explHelp", "reqOk", "step", "reqStill"], ["fluent", "allSelf"]];
const AGAIN_END = ["En je koos zelf voor nog een keer.", "Nog een keer was jouw keuze. Dat is trainen.", "En deze ronde koos je zelf."];
/* f: waarnemingen van één ronde. recent: lijst "soort:variant" van de laatste eindschermen. Geeft {text, used}. */
PL.compose = function(f, recent){
  recent = recent || [];
  const recentKinds = recent.map(x => x.split(":")[0]);
  const have = Object.keys(OBS).filter(k => f.has[k]);
  const pickKinds = have.map(k => [k, OBS[k].w - (recentKinds.slice(-6).includes(k) && OBS[k].w < 8 ? 4 : 0) - (recentKinds.slice(-2).includes(k) ? 2 : 0)])
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const chosen = [];
  for (const k of pickKinds){
    if (chosen.length >= 2) break;
    // per groep hooguit één zin: over de tussenstap, of over "alles zelf"
    const grp = GROUPS.find(g => g.includes(k)); if (grp && chosen.some(c => grp.includes(c))) continue;
    chosen.push(k);
  }
  const used = [], parts = [];
  for (const k of chosen){
    const vs = OBS[k].v; let i = vs.findIndex((_, j) => !recent.includes(k + ":" + j)); if (i < 0) i = Math.floor(Math.random() * vs.length);
    const t = vs[i](f); if (t){ parts.push(t); used.push(k + ":" + i); }
  }
  if (f.again){ const i = (recent.filter(x => x.startsWith("again:")).length) % AGAIN_END.length; parts.push(AGAIN_END[i]); used.push("again:" + i); }
  // kort houden: hooguit vier zinnen; anders valt de tweede waarneming weg
  const sentences = a => (a.join(" ").match(/[.!?](\s|$)/g) || []).length;
  if (parts.length > 1 && sentences(parts) > 4 && !used[1].startsWith("again")){ parts.splice(1, 1); used.splice(1, 1); }
  return {text: parts.join(" "), used};
};

/* m: meting van de ronde {fr: aandeel in één keer, steps, reqN, reqOk, switches, mode, nextMode, modeName, nextName, hasModes, form} */
PL.reasonReply = function(react, why, m){
  const ok = m.fr >= 0.67, low = m.fr < 0.5;
  if (react === "leuk"){
    if (why === "lukte") return ok ? "Dat zag ik ook: de meeste kwamen meteen." : "Fijn dat het zo voelde. Je nam ook een paar tussenstappen; die horen erbij.";
    if (why === "snapte") return m.modeName && m.reqOk ? `Dan onthoud ik dat ${m.modeName} bij jou ${m.pl ? "werken" : "werkt"}.` : "Fijn. Snappen maakt het onthouden lichter.";
    if (why === "spel") return `Dat onthoud ik. Je kiest de vorm altijd zelf; vandaag was het ${m.form}.`;
    if (why === "kiezen") return "Zo werkt het hier ook: jij kiest wat en hoe, ik kies de volgorde.";
    return "Dat mag. Soms weet je het pas later.";
  }
  if (react === "pittig"){
    if (why === "veel") return (low ? "Dat zag ik ook." : "Er lukte toch veel meteen; pittig en lukken kan samen.") + " De volgende ronde begin ik met meer uit wat al lukt.";
    if (why === "uitleg") return m.hasModes ? `Dank je, dat helpt mij. De volgende keer leg ik het anders uit: met ${m.nextName}.` : "Dank je. Dat schrijf ik op, zodat er een andere uitleg kan komen.";
    if (why === "snel") return "Dan doe ik het rustiger: de hulp blijft langer staan en er zit meer tijd tussen de vragen.";
    if (why === "lang") return "Dan maak ik de volgende ronde korter. Kort is ook trainen.";
    return "Dat mag. Pittig is niet erg; zo voelt trainen soms.";
  }
  return "";
};
/* wat de reden verandert: een aanpassing voor de volgende ronde(s); de lat (beheersing, tempo) zakt nooit */
PL.adjustFor = function(react, why, m){
  if (react !== "pittig") return null;
  if (why === "veel") return {kind: "veel", left: 1};
  if (why === "snel") return {kind: "snel", left: 3};
  if (why === "lang") return {kind: "lang", left: 1};
  if (why === "uitleg" && m.hasModes) return {kind: "uitleg", left: 1, mode: m.nextMode};
  return null;
};
/* voor het ouderscherm: klopt het gevoel met de meting? Alleen een etiket per keer; patronen pas over weken. */
PL.classifyReact = function(e){
  const fr = e.fr == null ? null : e.fr;
  if (e.react === "gewoon") return "gewoon";
  if (!e.why) return e.react + " zonder reden";
  if (e.react === "leuk"){
    if (e.why === "lukte") return fr != null && fr >= 0.67 ? "leuk omdat het lukte (klopt met meting)" : "leuk omdat het lukte, meting: veel tussenstappen";
    return "leuk om een andere reden dan lukken (" + e.why + ")";
  }
  if (e.why === "veel") return fr != null && fr < 0.5 ? "pittig door veel tussenstappen (klopt met meting)" : "voelde pittig terwijl veel lukte (inspanning of onzekerheid)";
  if (e.why === "uitleg") return e.re > 0 ? "uitleg landde niet (na de uitleg opnieuw een tussenstap)" : e.sw > 0 ? "uitleg landde niet (vroeg om een andere)" : "uitleg niet gesnapt, meting: vraag erna lukte wel";
  if (e.why === "snel") return "tempo voelde te hoog";
  if (e.why === "lang") return "ronde voelde lang";
  return "pittig, reden onbekend";
};

/* ---------- uitlegvormen: welke uitleg helpt bij deze steen? ----------
   Begrip meten we aan gedrag, niet aan een label: een uitleg "landt" als dezelfde vraag even later in één keer lukt.
   Nog niet geprobeerde vormen eerst (in de volgorde van de training), daarna de vorm met de beste (ok+1)/(n+2), met af en toe
   een andere (15 %), zodat één slechte dag een vorm niet voorgoed wegzet. "Anders uitleggen" en "ik snapte de uitleg niet"
   tellen als niet geland. Leerstijlen bestaan hier als observatie per steen, nooit als label (Pashler e.a. 2008). */
PL.chooseExpl = function(modes, stats, avoid, rand){
  rand = rand == null ? Math.random() : rand;
  stats = stats || {};
  let cand = modes.filter(m => m !== avoid); if (!cand.length) cand = modes.slice();
  const untried = cand.filter(m => !stats[m] || !((stats[m].ok || 0) + (stats[m].no || 0)));
  if (untried.length) return untried[0];
  const sc = m => ((stats[m].ok || 0) + 1) / ((stats[m].ok || 0) + (stats[m].no || 0) + 2);
  const best = cand.slice().sort((a, b) => sc(b) - sc(a))[0];
  if (rand < 0.15 && cand.length > 1){ const others = cand.filter(m => m !== best); return others[Math.floor(rand / 0.15 * others.length) % others.length]; }
  return best;
};

PL.greet = function(o){
  // o: {first, hour, daysSince, adjust, adjName, due}
  const title = "Hoi " + SPACE.learnerName;   // v0.11: overal dezelfde begroeting (Home en elke training)
  const parts = [];
  if (o.adjust) parts.push(({veel: "Vorige keer was het pittig. Ik begin daarom met meer uit wat al lukt.", snel: "Vorige keer ging het te snel. Ik doe het nu rustiger.", lang: "Vorige keer duurde het lang. De eerste ronde is korter.", uitleg: `Vorige keer hielp de uitleg niet. Ik probeer nu ${o.adjName || "een andere manier"}.`})[o.adjust] || "");
  if (!o.first && o.daysSince != null){
    if (o.daysSince === 0) parts.push("Je trainde vandaag al. Fijn dat je terug bent.");
    else if (o.daysSince === 1) parts.push("Gisteren trainde je ook. Vaak een beetje helpt het meest.");
    else if (o.daysSince < 7) parts.push("Een paar dagen rust. We beginnen met iets wat vorige keer lukte.");
    else parts.push("Het is even geleden. De basis komt eerst terug, net als bij ballet.");
  }
  if (o.due && parts.length < 2) parts.push("Er staat iets klaar om te herhalen.");
  return {title, note: parts.filter(Boolean).slice(0, 2).join(" ")};
};
