/* ---------- tabel per steen (A6): alleen meten, de drempels in P blijven staan ---------- */
PL.stoneTable = function(d, T){
  const ev = (d.events || []).filter(e => e.k != null && e.ok1 != null && e.land == null);
  return T.stones.map(s => {
    const es = ev.filter(e => e.st === s.id), ok = es.filter(e => e.ok1), rts = ok.map(e => e.rt).filter(x => x != null);
    const st = (d.stones || {})[s.id] || {};
    return {id: s.id, name: s.name, n: es.length, ok1: ok.length, fluent: rts.filter(x => x <= P.fluentMs).length, med: median(rts),
      state: st.power ? "beheerst" : st.n ? "oefent" : "nog niet gezien", speed: st.speed ? "vlot" : st.power ? "nog niet vlot" : "",
      stuck: !!st.power && !st.speed};
  });
};

/* ---------- weekoverzicht: het enige dat naar de chat gaat ---------- */
PL.weekly = function(all, trainingsList){
  const rows = [], byForm = {}, hard = {}, reacts = {}, expl = [], adjs = [], stoneLines = [];
  for (const id of Object.keys(all)){
    const d = all[id]; if (!d) continue;
    const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const weeks = {};
    for (const s of realSessions(d)){
      const w = weeks[weekKey(s.d)] || (weeks[weekKey(s.d)] = {week: weekKey(s.d), training: name, sessions: 0, min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, fluent: 0, leuk: 0, gewoon: 0, pittig: 0, rules: 0, rts: []});
      w.sessions++; w.min += s.min || 0; w.rounds += s.rounds || 0; w.again += s.again || 0; w.steps += s.steps || 0; w.first += s.first || 0; w.items += s.items || 0;
      w.leuk += (s.react && s.react.leuk) || 0; w.makkelijk = (w.makkelijk || 0) + ((s.react && s.react.makkelijk) || 0); w.pittig += (s.react && s.react.pittig) || 0; w.gewoon += (s.react && s.react.gewoon) || 0;
    }
    for (const e of d.events || []){
      if (e.react){ const key = e.react + (e.why ? " / " + e.why : ""); const r = reacts[key] || (reacts[key] = {n: 0, fr: [], again: 0, labels: {}}); r.n++; if (e.fr != null) r.fr.push(e.fr); if (e.again) r.again++; const c = PL.classifyReact(e); r.labels[c] = (r.labels[c] || 0) + 1; continue; }
      if (e.adjResult){ adjs.push(`${name}: na "${e.adjResult}" van ${Math.round(e.before * 100)}% naar ${Math.round(e.after * 100)}% in één keer`); continue; }
      if (e.rules){ const w = weeks[weekKey(e.t.slice(0, 10))]; if (w) w.rules++; continue; }
      if (e.k == null || e.round || e.land != null) continue;
      const w = weeks[weekKey(e.t.slice(0, 10))]; if (!w) continue;
      if (e.ok1 && e.rt != null){ w.rts.push(e.rt); if (e.rt <= P.fluentMs) w.fluent++; }
      const fk = name + " / vorm " + e.f; const f = byForm[fk] || (byForm[fk] = {n: 0, ok: 0, rts: []});
      f.n++; if (e.ok1){ f.ok++; f.rts.push(e.rt); }
    }
    for (const w of Object.values(weeks)){ w.medianRt = median(w.rts); delete w.rts; rows.push(w); }
    for (const [k, r] of Object.entries(d.items || {})) if (r.st > 0) hard[name + ": " + (T && T.keyLabel ? T.keyLabel(k) : k)] = r;
    if (T && T.stones) for (const r of PL.stoneTable(d, T)) if (r.n) stoneLines.push(`${name}, ${r.name}: ${r.n} vragen, ${r.ok1} in één keer, ${r.fluent} vlot, mediaan ${r.med != null ? (r.med / 1000).toFixed(1) : "-"} s${r.stuck ? " (beheerst, haalt vlot nog niet)" : ""}`);
    for (const [stId, modes] of Object.entries(d.expl || {})){
      const stName = T && T.stones ? ((T.stones.find(x => x.id === stId) || {}).name || stId) : stId;
      for (const [m, v] of Object.entries(modes)){ if (m === "avoid" || !v || typeof v !== "object") continue; const n = (v.ok || 0) + (v.no || 0); if (!n) continue;
        expl.push(`${name}, ${stName}, ${(T && T.explainNames && T.explainNames[m]) || (m === "standaard" ? "de tussenstap" : m)}: ${n}x uitgelegd, ${v.ok || 0}x daarna in één keer${v.sw ? `, ${v.sw}x "anders uitleggen"` : ""}${modes.avoid === m ? " (nu even overgeslagen)" : ""}`); }
    }
  }
  rows.sort((a, b) => b.week.localeCompare(a.week) || a.training.localeCompare(b.training));
  const formsText = Object.entries(byForm).map(([k, f]) => `${k}: ${f.n} vragen, ${Math.round(100 * f.ok / Math.max(1, f.n))}% in één keer, mediaan ${f.rts.length ? (median(f.rts) / 1000).toFixed(1) : "-"} s`).join("; ");
  const hardText = Object.entries(hard).sort((a, b) => b[1].st - a[1].st).slice(0, 8).map(([k, r]) => `${k} (${r.st}x tussenstap, ${r.ok1}x in één keer)`).join("; ");
  const reactText = Object.entries(reacts).sort((a, b) => b[1].n - a[1].n).map(([k, r]) => `${k}: ${r.n}x${r.fr.length ? `, in die rondes gemiddeld ${Math.round(100 * r.fr.reduce((a, b) => a + b, 0) / r.fr.length)}% in één keer` : ""}${r.again ? `, ${r.again}x daarna nog een keer` : ""} (${Object.entries(r.labels).map(([l, n]) => n > 1 ? `${l} ${n}x` : l).join("; ")})`).join("\n");
  const feelLines = [];
  for (const id of Object.keys(all)){ const d = all[id]; if (!d) continue; const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const set = T ? PL.feelSet(T) : null, txt = (k, w) => { const o = set && set[k] && set[k].find(x => x[0] === w); return o ? o[1] : w === "vraag" ? "Weet ik niet" : w; };
    for (const e of (d.events || []).filter(e => e.feel || e.feelTest).slice(-30)){
      if (e.feel) feelLines.push(`${(e.t || "").slice(0, 10)} ${name}: ${e.feel === "makkelijk" ? "Te makkelijk" : "Pittig"}, "${txt(e.feel, e.why)}"${e.fast ? " (snelle klik, niets gedaan)" : e.ign ? " (klopte drie keer niet, niets gedaan)" : ""}`);

    } }
  return {feelText: feelLines.slice(-20).join("\n"), rows, formsText, hardText, byForm, reactText, explText: expl.join("\n"), stoneText: stoneLines.join("\n"), adjText: adjs.slice(-8).join("; ")};
};
PL.weeklyText = function(w){
  return [`Leeratelier weekoverzicht (${today()})`,
    ...w.rows.map(r => `Week van ${r.week}, ${r.training}: ${r.sessions} sessies, ${r.min} min, ${r.rounds} rondes, ${r.again}x nog een keer, ${r.first}/${r.items} in één keer, ${r.fluent} vlot (binnen 3 s), ${r.steps} tussenstappen, ${r.rules || 0}x de regel bekeken, mediaan ${r.medianRt != null ? (r.medianRt / 1000).toFixed(1) : "-"} s, te makkelijk ${r.makkelijk || 0} / pittig ${r.pittig}`),
    `Per vorm: ${w.formsText || "nog niets"}`,
    `Vaakst een tussenstap: ${w.hardText || "nog niets"}`,
    `Leuk/pittig met reden (naast meting):\n${w.reactText || "nog niets"}`,
    `Te makkelijk / pittig met reden, en wat de toets liet zien:\n${w.feelText || "nog niets"}`,
    `Uitleg per steen en vorm (landt = vraag erna in één keer):\n${w.explText || "nog niets"}`,
    `Aanpassingen na een reden: ${w.adjText || "geen"}`,
    `Per steen (tempo-drempel ${P.fluentMs / 1000} s, alleen gemeten):\n${w.stoneText || "nog niets"}`,
    `Regels voor de lezer: alleen patronen over meerdere weken benoemen; geen niveau, groep, cijfer of leeftijd; technische problemen apart van observaties.`].join("\n");
};

    const bl = bloemen(); landt = (VLINDER || soort === "bij") && bl.length && Math.random() < (VLINDER ? .45 : .35);
    doel = landt ? bl[Math.floor(Math.random() * bl.length)] : {x: rnd(r[0], r[1]), y: rnd(r[2], r[3])};
  }
  nieuwDoel();
  return (t, dt) => {
    if (rust > 0){ rust -= dt; if (rust <= 0) nieuwDoel(); v.x *= .9; v.y *= .9; }
    else {
      const dx = doel.x - p.x, dy = doel.y - p.y, afst = Math.hypot(dx, dy);
      if (afst < 1.2){ rust = landt ? rnd(2.5, 7) : soort === "libel" ? rnd(.6, 2) : rnd(0, .8); if (!rust) nieuwDoel(); }
      else {
        const rem = Math.min(1, afst / 8), wv = {x: dx / afst * SNEL * rem, y: dy / afst * SNEL * rem};
        const acc = VLINDER ? 9 : soort === "libel" ? 40 : 16;
        v.x += Math.max(-acc, Math.min(acc, (wv.x - v.x) * 3)) * dt; v.y += Math.max(-acc, Math.min(acc, (wv.y - v.y) * 3)) * dt;
      }
    }
    p.x += v.x * dt; p.y += v.y * dt;

    const op = VLINDER ? wiebel(t * 1.7) * (rust > 0 ? 0 : 2.4) : soort === "bij" ? Math.sin(t * 9 + fase) * .35 + wiebel(t) * .6 : wiebel(t * 2) * .3;
    if (Math.abs(v.x) > .6) kant = v.x > 0 ? 1 : -1;
    el.style.left = p.x.toFixed(2) + "%"; el.style.top = (p.y + op).toFixed(2) + "%";
    const spiegel = (kant > 0) === kijktRechts ? 1 : -1;
    if (VLINDER){
      // vleugelslag: snel in de vlucht, soms even zweven, langzaam open en dicht als hij zit
      slag += dt * (rust > 0 ? 1.6 : (wiebel(t * .5) > .55 ? 2 : 13));
      const s = rust > 0 ? .55 + .45 * Math.cos(slag) : .2 + .8 * (.5 + .5 * Math.cos(slag));
      vl.forEach(w => w.style.transform = `scaleX(${s.toFixed(3)})`);
      el.style.transform = `translate(-50%,-100%) rotate(${(v.x * .8).toFixed(2)}deg)`;
    } else el.style.transform = `translate(-50%,-100%) scaleX(${spiegel}) rotate(${(v.y * .6 * spiegel).toFixed(2)}deg)`;
  };
}
// kruipen (lieveheersbeestje, mier): een stukje lopen, stilstaan, omdraaien
function kruiper(el, soort){
  const kijktRechts = el.dataset.kijkt === "r", x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top), bereik = parseFloat(el.dataset.bereik || 9);
  let x = x0, doel = x0, rust = rnd(.5, 2), kant = 1; const snel = {mier: 3.2, muis: 4.5, slak: .45, glanskever: 2}[soort] || 1.4, w = ruis(2);
  return (t, dt) => {
    if (rust > 0){ rust -= dt; if (rust <= 0) doel = x0 + rnd(-bereik, bereik); }
    else { const d = doel - x; if (Math.abs(d) < .15){ rust = rnd(1, soort === "mier" ? 2 : 5); } else { kant = d > 0 ? 1 : -1; x += kant * Math.min(Math.abs(d), snel * dt); } }
    el.style.left = x.toFixed(2) + "%"; el.style.top = (y0 + w(t * .4) * .4).toFixed(2) + "%";
    const loop = rust > 0 ? 0 : Math.sin(t * 16) * .8;
    el.style.transform = `translate(-50%,-100%) scaleX(${(kant > 0) === kijktRechts ? 1 : -1}) rotate(${loop.toFixed(2)}deg)`;
  };
}
// springen (sprinkhaan): lang stilzitten, dan een boogje
function springer(el){
  const x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top), kijktRechts = el.dataset.kijkt === "r";
  let x = x0, wacht = rnd(3, 9), sprong = null;
  return (t, dt) => {
    if (sprong){
      sprong.u += dt / .55; const u = Math.min(1, sprong.u);
      x = sprong.van + (sprong.naar - sprong.van) * u;
      el.style.left = x.toFixed(2) + "%"; el.style.top = (y0 - Math.sin(Math.PI * u) * 7).toFixed(2) + "%";
      el.style.transform = `translate(-50%,-100%) scaleX(${(sprong.naar > sprong.van) === kijktRechts ? 1 : -1})`;
      if (u >= 1){ sprong = null; wacht = rnd(4, 11); }
    } else if ((wacht -= dt) <= 0){ const naar = Math.max(x0 - 10, Math.min(x0 + 10, x + rnd(-8, 8))); sprong = {van: x, naar, u: 0}; }
  };
}

/* ---------- egel en konijn ---------- */
// houdingen met een rol (data-rol): zit (wisselt willekeurig), loop (schuift langzaam een stukje op), spring (een boogje),
// slaap (alleen 's avonds; in de proef niet). Na lopen of springen blijft hij die kant op kijken.
function dier(el){
  const h = [...el.querySelectorAll(".h")]; if (!h.length) return () => {};
  const rol = i => h[i].dataset.rol || "zit", avond = el.closest("[data-avond]") != null;
  const kies = [...h.keys()].filter(i => rol(i) !== "slaap" || avond);
  let nu = 0, wissel = rnd(3, 7), weg = 0, uit = 0, kant = 1, beweeg = null;
  h.forEach((x, i) => x.style.opacity = i ? 0 : 1);
  const adem = ruis(2), x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top); let x = x0;
  const toon = n => { if (n === nu) return; h[nu].style.opacity = 0; h[n].style.opacity = 1; nu = n; };
  return (t, dt) => {
    if (beweeg){
      beweeg.u += dt / beweeg.duur; const u = Math.min(1, beweeg.u);
      x = beweeg.van + (beweeg.naar - beweeg.van) * (beweeg.soort === "spring" ? u : u * u * (3 - 2 * u));
      const boog = beweeg.soort === "spring" ? Math.sin(Math.PI * u) * 4 : 0;
      el.style.left = x.toFixed(2) + "%"; el.style.top = (y0 - boog).toFixed(2) + "%";
      if (u >= 1){ beweeg = null; toon(0); wissel = rnd(3, 8); }
    } else if ((wissel -= dt) <= 0){
      let n = kies[Math.floor(Math.random() * kies.length)]; if (n === nu) n = kies[(kies.indexOf(n) + 1) % kies.length];
      toon(n); wissel = rnd(4, 12);
      if (rol(n) === "loop" || rol(n) === "spring"){
        // binnen een klein stukje rond de eigen plek blijven
        let naar = x + (Math.random() < .5 ? -1 : 1) * rnd(3, 6); if (Math.abs(naar - x0) > 7) naar = x0 + (x0 - naar) * .3;
        kant = naar > x ? 1 : -1; beweeg = {van: x, naar, u: 0, soort: rol(n), duur: rol(n) === "spring" ? .5 : rnd(2.5, 4)};
      } else if (Math.random() < .2) weg = rnd(1.5, 3.5);   // even wegduiken in het gras
    }
    if (weg > 0) weg -= dt;
    uit += ((weg > 0 ? 1 : 0) - uit) * Math.min(1, dt * 2.2);
    if (!beweeg) el.style.top = (y0 + uit * 5.5).toFixed(2) + "%";
    const a = adem(t * .9) * .008, stap = beweeg && beweeg.soort === "loop" ? Math.sin(t * 9) * 1.2 : 0;
    el.style.transform = `translate(-50%,-100%) scale(${(kant * (1 + a)).toFixed(4)},${(1 - a).toFixed(4)}) rotate(${stap.toFixed(2)}deg)`;
  };
}

/* ---------- stofjes in het licht ---------- */
function stofjes(tuin, n){
  const laag = document.createElement("div"); laag.className = "stof"; tuin.appendChild(laag); const ss = [];
  for (let i = 0; i < n; i++){ const b = document.createElement("b"); laag.appendChild(b); ss.push({b, x: rnd(0, 100), y: rnd(10, 75), s: rnd(.6, 1.4), r: ruis(2), f: rnd(0, 6)}); }
  return (t, dt, wind) => { for (const s of ss){
    s.x += (wind.op(s.x / 100, t) * 1.6 + s.r(t * .3) * .8) * dt; s.y += (-.35 + s.r(t * .23 + 5) * .6) * dt;
    if (s.x > 104 || s.y < 4){ s.x = rnd(-4, 30); s.y = rnd(30, 78); }
    s.b.style.left = s.x.toFixed(2) + "%"; s.b.style.top = s.y.toFixed(2) + "%"; s.b.style.transform = `scale(${s.s})`; s.b.style.opacity = (.25 + .55 * (.5 + .5 * Math.sin(t * 1.3 + s.f))).toFixed(2);
  } };
}

/* ---------- vuurvliegjes ('s nachts): zwerven laag boven de weide, lichten op en doven, met een wazige gloed ---------- */
function vuurvliegjes(tuin, n){
  const laag = document.createElement("div"); laag.className = "vuur"; tuin.appendChild(laag); const vv = [];
  for (let i = 0; i < n; i++){
    const diep = Math.random(), el = document.createElement("i");           // diep: 0 = ver weg (klein, scherp), 1 = dichtbij (groot, wazig)
    el.style.setProperty("--s", (.5 + diep * 1.4).toFixed(2) + "%"); el.style.setProperty("--b", (diep * diep * 4).toFixed(1) + "px");
    laag.appendChild(el);
    vv.push({el, x: rnd(5, 95), y: rnd(52, 90) - (1 - diep) * 10, rx: ruis(3), ry: ruis(3), f: rnd(.08, .2), per: rnd(2.2, 5.5), fase: rnd(0, 6), aan: rnd(.6, 1.4), sn: .6 + diep * 1.6});
  }
  return (t, dt, wind) => { for (const v of vv){
    v.x += (v.rx(t * v.f) * 2.2 + (wind.op(v.x / 100, t) - .3) * .8) * v.sn * dt; v.y += v.ry(t * v.f + 9) * 1.2 * v.sn * dt;
    if (v.x < 2) v.x = 98; if (v.x > 98) v.x = 2; v.y = Math.max(40, Math.min(94, v.y));
    // knipperen: een zacht oplichten, even branden, langzaam doven; elk met een eigen ritme
    const c = ((t + v.fase) % v.per) / v.per, gloed = c < .12 ? c / .12 : c < .12 + .2 * v.aan ? 1 : Math.max(0, 1 - (c - .12 - .2 * v.aan) / .25);
    v.el.style.left = v.x.toFixed(2) + "%"; v.el.style.top = v.y.toFixed(2) + "%"; v.el.style.opacity = (.08 + gloed * .92).toFixed(2);
    v.el.style.transform = `translate(-50%,-50%) scale(${(.7 + gloed * .45).toFixed(3)})`;
  } };
}

/* ---------- starten ---------- */
TB.start = async function(tuin, opts){
  opts = opts || {};
  if (!tuin || tuin.__tb) return; tuin.__tb = 1;
  if (stil()) return;
  const wind = Wind(), stappen = [], gl = [];
  // lukt WebGL niet (oud apparaat, beeld van een ander adres), dan blijft het scherpe stilstaande beeld staan
  const bg = tuin.querySelector("img.bg"); if (bg){ try { const f = await weide(tuin, bg); if (f) gl.push(f); } catch(e){ const c = tuin.querySelector("canvas.bgw"); if (c) c.remove(); } }
  for (const el of tuin.querySelectorAll(".boom")){ try { const f = await boompje(el); if (f) gl.push(f); } catch(e){} }
  tuin.querySelectorAll(".wieg").forEach(el => {   // boompjes niet: daar beweegt alleen het blad (de shader hierboven)
    const kind = el.querySelector("img") || el, x = parseFloat(el.style.left) / 100, b = parseFloat(el.style.width);
    stappen.push(veer(kind, x, {amp: Math.max(.8, 4.2 - b * .22), f: rnd(.5, 1.1)}));
  });
  tuin.querySelectorAll(".hang").forEach(el => stappen.push(veer(el.querySelector("img") || el, parseFloat(el.style.left) / 100, {amp: 2.2, f: rnd(.4, .8), k: rnd(3, 5), c: rnd(1, 1.6)})));
  tuin.querySelectorAll(".gras img").forEach((el, i, all) => stappen.push(veer(el, (i + .5) / all.length, {amp: 2.6, f: rnd(.8, 1.4), skew: 1, k: rnd(7, 11), c: rnd(1.4, 2)})));
  tuin.querySelectorAll(".vlieg").forEach(el => stappen.push(vlieger(el, tuin, el.dataset.soort || "bij")));
  tuin.querySelectorAll(".kruip").forEach(el => stappen.push(kruiper(el, el.dataset.soort || "lieveheersbeestje")));
  tuin.querySelectorAll(".spring").forEach(el => stappen.push(springer(el)));
  tuin.querySelectorAll(".dier:not(.slaap)").forEach(el => stappen.push(dier(el)));
  // slapen: alleen rustig ademen
  tuin.querySelectorAll(".slaap").forEach(el => { const kind = el.querySelector(".vlin") || el.querySelector("img"), a = ruis(2), f = rnd(.7, 1.1); if (kind) stappen.push(t => { const v = a(t * f) * .018; kind.style.transform = `scale(${(1 + v).toFixed(4)},${(1 - v * 1.4).toFixed(4)})`; }); });
  if (opts.stof !== 0) stappen.push(stofjes(tuin, opts.stof || 12));
  if (opts.vuur) stappen.push(vuurvliegjes(tuin, opts.vuur));

  if ("IntersectionObserver" in window){ io = new IntersectionObserver(e => { zichtbaar = e[0].isIntersecting; }); io.observe(tuin); }
  const stop = () => { if (uit) return; uit = true; if (io) io.disconnect(); gl.forEach(g => g.weg && g.weg()); };
  tuin.__tbStop = stop;
  function tik(nu){
    if (uit) return;
    if (!tuin.isConnected) return stop();   // de tuin is opnieuw getekend of weg: deze lus stopt
    requestAnimationFrame(tik);
    const dt = Math.min(.05, (nu - (vorige || nu)) / 1000); vorige = nu;
    if (!zichtbaar || document.hidden || !dt) return;
    t += dt; wind.stap(t);
    for (const s of stappen) s(t, dt, wind);
    if ((glTik += dt) >= 1 / 30){ glTik = 0; for (const g of gl) g(t, wind); }   // blad: 30 beelden per seconde is genoeg

TB.stop = tuin => { if (tuin && tuin.__tbStop) tuin.__tbStop(); };
})();

/* De tuin v1.3 — één weide die groeit, zonder getal en zonder einde (v1.3: veel soorten, groei volgt het gebruik).
   Wat er groeit hangt aan wat ze trainde (afgeronde rondes, wat vanzelf gaat, wat na dagen nog vanzelf gaat, stenen die groen
   zijn); die regels (PL.tuinMaat, PL.tuinPlan) zijn dezelfde als in v0.9. Nieuw in v1.0: geen aparte perken meer. Alles staat
   samen in één weide in 3D-animatiestijl; de onderwerpen staan voor de trainingen (planten = rekenen, bloemen = taal/lezen,
   insecten = topografie/schrijven). Van eitje tot vlinder, de egel en het konijn horen bij alles samen.
   Elk ding krijgt één keer een vaste plek in de weide (bewaard), zodat niets verspringt als er iets bij komt.
   De beweging (wind, blad, insecten, dieren) staat in tuin-beweging.js. Het licht volgt de echte tijd van de dag.
   Niets krimpt (hoogste stand wordt bewaard), en er staat geen tekst in de tuin. Lagen: tuin/lagen/ (tools/tuin-beelden.py). */
(function(){
"use strict";
const PL = window.PL;
const FILES = new Set(window.__tuinFiles || []);
const BASE = "tuin/";
const has = f => FILES.has(f + ".webp");
const src = f => (window.__tuinSrc && window.__tuinSrc[f]) || BASE + f + ".webp";   // __tuinSrc: ingesloten beelden (overzichtspagina)
function rng(seed){ let s = 2166136261; for (const c of String(seed)) s = Math.imul(s ^ c.charCodeAt(0), 16777619) >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// v0.14: een versie kan eigen trainingen voor de tuin hebben (groep3: rekenen, lezen, schrijven) via space.tuin {cat, order, kind}
const TZ = (PL.space && PL.space.tuin) || {};
const CAT = TZ.cat || {rekenmuur: "planten", tafels: "planten", "spelling-een-of-twee": "bloemen", werkwoorden: "bloemen", zinnen: "bloemen", europa: "insecten"};
const ORDER = TZ.order || ["tafels", "europa", "rekenmuur", "spelling-een-of-twee", "werkwoorden", "zinnen"];
const KIND = TZ.kind || {"spelling-een-of-twee": "a", werkwoorden: "b", zinnen: "c"};   // a lila, b geel, c blauw

/* ---------- de maat van een training: alleen uit de stand ---------- */
PL.tuinMaat = function(d){
  const ss = PL.realSessions(d), items = Object.values((d && d.items) || {}), stones = Object.values((d && d.stones) || {});
  return {
    e: ss.reduce((a, s) => a + (s.rounds || 0), 0),                                   // moeite: afgeronde rondes
    k: items.filter(r => r && r.fl >= 2 && r.last === "ok").length,                    // gaat vanzelf
    r: items.filter(r => r && r.iv >= 2 && r.last === "ok").length,                    // na dagen nog vanzelf (herhaalschema)
    g: stones.filter(s => s && s.power && s.speed).length,                             // stenen die groen zijn
    days: [...new Set(ss.map(s => s.d))]
  };
};

/* ---------- wat er groeit: een lijst elementen per training en voor alles samen (puur, testbaar) ----------
   v1.3: zonder einde. De eerste dingen volgen dezelfde regels als v0.9 (zelfde ids, zelfde stadia); daarna komt er bij elk stuk
   groei iets bij, zonder bovengrens. Wat er komt, volgt het gebruik: veel rekenen = veel bomen, veel taal = veel bloemen,
   veel topografie/schrijven = veel insecten. Elk ding heeft een soort die vastligt in zijn id; hoe meer er staat, hoe meer
   soorten er verschijnen. */
const PLANT = ["plant-0-kiem", "plant-1-spruit", "plant-2-zaailing", "plant-3-struik", "plant-4-boompje", "plant-5-boom"];
const SLOTS = [[50, 56], [30, 50], [70, 50], [40, 36], [60, 34], [24, 66], [76, 66]];
const FLOWER = ["", "1-knop", "2-dicht", "3-open", "4-groot"];
const INSECTS = [["lieveheersbeestje", "k", 1], ["mier", "k", 5], ["bij", "k", 10], ["lieveheersbeestje", "k", 16], ["sprinkhaan", "k", 22], ["libel", "r", 3], ["bij", "r", 8]];
// soorten; per training eerst de eigen familie, daarna komen er steeds meer bij
const BOMEN = ["loof", "appel", "kers", "eik", "den", "magnolia", "lijsterbes", "beuk"];
const BLOEMEN = ["a", "b", "c", "d", "e", "f", "g", "h"];
const BEESTJES = ["bij", "lieveheersbeestje", "hommel", "glanskever", "zweefvlieg", "slak", "mier", "sprinkhaan", "libel", "roodborst", "muis"];
const FAM = Object.assign({tafels: "appel", rekenmuur: "kers", rekenen: "appel"}, TZ.familie || {});
const hash = t => { let h = 2166136261; for (const c of String(t)) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return h; };
function soort(pool, eigen, id, i){
  if (i < 3) return eigen;
  const rest = pool.filter(x => x !== eigen).sort((x, y) => hash(id + x) - hash(id + y));   // per training een eigen volgorde
  const open = [eigen, ...rest].slice(0, Math.min(pool.length, 2 + Math.floor(i / 3)));       // hoe meer er staat, hoe meer soorten
  return open[hash(id + "-" + i) % open.length];

const plantStart = i => i < 7 ? [1, 10, 24, 45, 75, 110, 150][i] : 150 + (i - 6) * 40;

PL.tuinPlan = function(maat){
  // maat: {id: {e,k,r,g,days}} (al met de hoogste stand)
  const beds = [], all = {e: 0, k: 0, r: 0, g: 0}, days = new Set();
  for (const id of ORDER){
    const m = maat[id]; if (!m) continue;
    for (const x of ["e", "k", "r", "g"]) all[x] += m[x] || 0; (m.days || []).forEach(d => days.add(d));
    if (!m.e) continue;                                                       // er groeit iets na de eerste afgeronde ronde
    const cat = CAT[id], els = [];
    if (cat === "planten"){
      const V = m.e + 2 * m.k + 4 * m.r + 6 * m.g;
      for (let i = 0; V >= plantStart(i); i++){
        const stage = Math.min(5, Math.floor((V - plantStart(i)) / 8));
        els.push({id: `${id}-p${i}`, t: "plant", stage, soort: soort(BOMEN, FAM[id] || "loof", id, i)});
      }
    } else if (cat === "bloemen"){
      const P = m.k + Math.floor(m.e / 2.5), n = 1 + Math.floor(P / 4), eigen = KIND[id] || "a";
      for (let i = 0; i < n; i++){
        let stage = Math.max(1, Math.min(3, 1 + Math.floor((P - i * 4) / 5)));
        if (m.r >= (i + 1) * 2) stage = 4;
        els.push({id: `${id}-b${i}`, t: "bloem", kind: soort(BLOEMEN, eigen, id, i), stage});
      }
      const pollen = (m.r >= 5 ? 1 : 0) + Math.max(0, Math.floor((m.r - 5) / 6)) + Math.floor(m.e / 40);
      for (let j = 0; j < pollen; j++) els.push({id: j ? `${id}-plant${j}` : `${id}-plant`, t: "bloemplant", kind: soort(BLOEMEN, eigen, id + "-pol", j)});
    } else {
      INSECTS.forEach(([kind, key, need], i) => { const have = key === "k" ? Math.max(m.k, i === 0 ? 1 : 0) : m.r; if (have >= need) els.push({id: `${id}-i${i}`, t: "insect", kind, n: i}); });
      const have = m.k + Math.floor(m.e / 3);
      for (let i = 7; have >= 22 + (i - 6) * 5; i++) els.push({id: `${id}-i${i}`, t: "insect", kind: soort(BEESTJES, "bij", id, i), n: i});
    }

  const vlinders = G < 160 ? 0 : 1 + [260, 400, 580, 800].filter(x => G >= x).length + Math.max(0, Math.floor((G - 800) / 250));
  return {beds, groei, vlinders, G, D, tier: D >= 10 ? 3 : D >= 5 ? 2 : D >= 2 ? 1 : 0, gras: Math.min(1, all.e / 40), nevel: Math.max(0, .6 - D * .045)};
};

/* ---------- de weide: vaste plekken ---------- */
// rijen (voetlijn in % van de hoogte): hoe lager in beeld, hoe dichterbij en groter
const RIJEN = [72, 75.5, 79, 82.5, 86, 89.5, 93];
const PERSP = y => Math.max(.3, .55 + (y - 70) / 26 * .6);
const PLEKKEN = []; RIJEN.forEach((y, r) => { const n = 11 + r; for (let i = 0; i < n; i++) PLEKKEN.push({y, r, x: 5 + (i + (r % 2 ? .75 : .25)) * 90 / n}); });
// v1.3: als de weide vol raakt, groeit hij naar achteren (verder weg, kleiner); deze plekken komen achter aan de lijst
[70, 68, 66, 64].forEach((y, k) => { const n = 18 + k * 2; for (let i = 0; i < n; i++) PLEKKEN.push({y, r: -1 - k, x: 4 + (i + (k % 2 ? .7 : .3)) * 92 / n}); });
// wat hoog wordt staat achteraan, kruipers en het eitje vooraan; daarna de verre rijen
const RIJ = {plant: [[0, 2], [-4, -1]], bloem: [[1, 6], [-2, -1]], bloemplant: [[1, 5], [-3, -1]], kruip: [[4, 6]], eitje: [[5, 6]]};
function plek(mem, id, soort){
  mem.plek = mem.plek || {};
  const oud = mem.plek[id];
  if (Array.isArray(oud)) return {x: oud[0], y: oud[1]};
  if (oud != null && PLEKKEN[oud]) return PLEKKEN[oud];
  const bezet = new Set(Object.values(mem.plek).filter(v => !Array.isArray(v))), R = rng(id);
  for (const [r0, r1] of RIJ[soort] || [[1, 6]]){
    const kan = PLEKKEN.map((p, i) => i).filter(i => PLEKKEN[i].r >= r0 && PLEKKEN[i].r <= r1 && !bezet.has(i));
    const ruim = kan.filter(i => !bezet.has(i - 1) && !bezet.has(i + 1));   // liefst niet vlak naast een ander
    const lijst = ruim.length ? ruim : kan;
    if (lijst.length){ const i = lijst[Math.floor(R() * lijst.length)]; mem.plek[id] = i; return PLEKKEN[i]; }
  }
  // alles bezet: een pol vormen rond iets van dezelfde soort (bloemen bij bloemen, bomen bij bomen), zo ontstaan veldjes
  const zelfde = Object.keys(mem.plek).filter(k => k !== id && k.replace(/\d+$/, "").slice(-2) === id.replace(/\d+$/, "").slice(-2));
  const buur = zelfde.length ? mem.plek[zelfde[Math.floor(R() * zelfde.length)]] : Math.floor(R() * PLEKKEN.length);
  const b = Array.isArray(buur) ? {x: buur[0], y: buur[1]} : PLEKKEN[buur];
  const [lo, hi] = soort === "plant" ? [64, 79] : soort === "kruip" ? [86, 93] : [66, 93];
  const xy = [Math.max(3, Math.min(97, b.x + (R() - .5) * 6)), Math.max(lo, Math.min(hi, b.y + (R() - .5) * 3))].map(v => Math.round(v * 10) / 10);
  mem.plek[id] = xy; return {x: xy[0], y: xy[1]};
}

/* ---------- wat er staat ---------- */
const PLANT_B = [5, 6, 8, 9, 10.5, 12.5];          // breedte in % van de weide (op de middelste rij)
const BLOEM_B = [0, 4.5, 5, 7, 8.5];
// beestje: [beeld, beweging, breedte, kijkt naar (l/r)]
const INSECT = {lieveheersbeestje: ["lieveheersbeestje", "kruip", 3.2, "l"], mier: ["insect-mier", "kruip", 2.6, "l"], sprinkhaan: ["insect-sprinkhaan", "spring", 4.5, "l"],
  bij: ["bij", "vlieg", 4, "r"], libel: ["insect-libel", "vlieg", 6, "r"], hommel: ["insect-hommel", "vlieg", 4.6, "r"], zweefvlieg: ["insect-zweefvlieg", "vlieg", 3.4, "r"],
  glanskever: ["insect-glanskever", "kruip", 2.8, "l"], slak: ["insect-slak", "kruip", 3.8, "r"], roodborst: ["vogel-roodborst", "spring", 4.6, "r"], muis: ["dier-muis", "kruip", 4.2, "l"]};
const GEBIED = {bij: "16 86 44 76", hommel: "14 88 46 78", zweefvlieg: "18 84 40 72", libel: "20 80 36 64", vlinder: "12 88 30 72"};
const VLEUGELS = ["vlinder-vleugel", "vlinder-vleugel-b", "vlinder-vleugel-geel", "vlinder-vleugel-rood", "vlinder-vleugel-paars", "vlinder-vleugel-groen"];
// v: variatie per exemplaar {schaal, spiegel, tint}
function d(cls, x, y, b, inner, extra, v){
  v = v || {};
  const vliegt = /\bvlieg\b/.test(cls), w = b * (vliegt ? 1 : PERSP(y)) * (v.schaal || 1);
  // diepte: wat ver weg staat is een fractie zachter en lichter, zoals de weide zelf; wat vliegt is altijd scherp
  const blur = vliegt ? 0 : Math.max(0, (73 - y) * .09), licht = vliegt ? 0 : Math.max(0, (78 - y) * .012);
  const f = blur || licht || v.tint ? `;filter:blur(${blur.toFixed(2)}px) brightness(${(1 + licht).toFixed(3)}) saturate(${(1 - licht).toFixed(3)})${v.tint ? ` hue-rotate(${v.tint.toFixed(1)}deg)` : ""} ` : "";
  const t = v.spiegel ? ";transform:translate(-50%,-100%) scaleX(-1)" : "";
  return `<div class="d ${cls}" ${extra || ""} style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${w.toFixed(2)}%;z-index:${Math.round(y * 2)}${f}${t}">${inner}</div>`;
}
const im = f => `<img src="${src(f)}" alt="" draggable="false" decoding="async">`;
function best(prefixes, stage){ for (let s = stage; s >= 0; s--){ const f = prefixes[s]; if (f && has(f)) return {f, s}; } return null; }
const STAP = ["struik", "boompje", "boom"];
function plantBeeld(e){
  if (e.stage >= 3 && e.soort && e.soort !== "loof"){ for (let s = e.stage; s >= 3; s--){ const f = `boom-${e.soort}-${STAP[s - 3]}`; if (has(f)) return {f, s}; } }
  return best(PLANT, e.stage);
}
function elHTML(e, bed, mem, fresh){
  const nw = fresh ? " nieuw" : "", tag = `data-bed="${bed}" data-el="${e.id}"`, R = rng(e.id), jx = (R() - .5) * 2.4;
  const v = {schaal: .88 + R() * .24, spiegel: R() < .5};
  if (e.t === "plant"){
    const b = plantBeeld(e); if (!b) return "";
    const p = plek(mem, e.id, "plant");
    return d((b.s >= 3 ? "boom" : "wieg") + nw, p.x + jx, p.y, PLANT_B[b.s], im(b.f), tag, v);
  }
  if (e.t === "bloem" || e.t === "bloemplant"){
    const st = e.t === "bloem" ? FLOWER[e.stage] : "plant";
    const f = has(`bloem-${e.kind}-${st}`) ? `bloem-${e.kind}-${st}` : has(`bloem-a-${st}`) ? `bloem-a-${st}` : ""; if (!f) return "";
    const p = plek(mem, e.id, e.t), w = e.t === "bloem" ? BLOEM_B[e.stage] : 10.5;
    v.tint = (R() - .5) * 16;   // geen twee bloemen precies gelijk
    if (e.t === "bloem" && e.stage >= 3) NACHT.bloemen.push({x: p.x + jx, y: p.y, h: w * PERSP(p.y) * v.schaal * 1.2 * 16 / 9});
    return d("wieg bloem" + nw, p.x + jx, p.y, w, im(f), `${tag} data-h="${(w * PERSP(p.y) * 1.3 * 16 / 9).toFixed(1)}"`, v);
  }
  if (e.t === "insect"){
    const I = INSECT[e.kind]; if (!I || !has(I[0])) return "";
    const kijkt = `data-soort="${e.kind}" data-kijkt="${I[3]}"`, sv = {schaal: .9 + R() * .2};
    if (NACHT.aan){
      // 's nachts slaapt alles: wat vliegt slaapt op een bloem (of in het gras), wat kruipt op zijn plek
      const beeld = has(I[0] + "-slaap") ? I[0] + "-slaap" : I[0], bl = NACHT.bloemen.length ? NACHT.bloemen[hash(e.id) % NACHT.bloemen.length] : null;
      const p = I[1] === "vlieg" ? (bl ? {x: bl.x + (R() - .5) * 1.5, y: bl.y - bl.h * .9} : plek(mem, e.id, "kruip")) : plek(mem, e.id, "kruip");
      sv.spiegel = I[3] === "l"; return d("slaap" + (I[1] === "vlieg" && bl ? " opbloem" : ""), p.x + (I[1] === "vlieg" ? 0 : jx), p.y, I[2] * .9, im(beeld), tag, sv);
    }
    if (I[1] === "vlieg"){ const g = GEBIED[e.kind].split(" ").map(Number); return d("vlieg" + nw, g[0] + R() * (g[1] - g[0]), g[2] + R() * (g[3] - g[2]), I[2], im(I[0]), `${tag} ${kijkt} data-gebied="${GEBIED[e.kind]}"`, sv); }
    const p = plek(mem, e.id, "kruip");
    return d(I[1] + nw, p.x + jx, p.y, I[2], im(I[0]), `${tag} ${kijkt}`, sv);
  }
  return "";
}
const NACHT = {aan: false, bloemen: []};
function vlinder(i, fresh){
  const R = rng("vlinder-" + i), g = GEBIED.vlinder.split(" ").map(Number), pool = VLEUGELS.filter(has), v = pool[(i + hash("v" + i)) % pool.length] || "vlinder-vleugel";
  const inner = `<div class="vlin"><span class="vl l">${im(v)}</span><span class="vl r">${im(v)}</span><img class="vlijf" src="${src("vlinder-lijf")}" alt=""></div>`;
  if (NACHT.aan && NACHT.bloemen.length){ const bl = NACHT.bloemen[(i * 7 + 3) % NACHT.bloemen.length]; return d("vlinder slaap opbloem", bl.x, bl.y - bl.h * .85, 5, inner); }
  return d("vlinder vlieg" + (fresh ? " nieuw" : ""), g[0] + R() * (g[1] - g[0]), g[2] + R() * (g[3] - g[2]), 6 * (.85 + R() * .3), inner, `data-soort="vlinder" data-gebied="${GEBIED.vlinder}"`);
}
// boven een aantal worden losse bloemen van een training samen een veldje (één pol), zodat de tuin vloeiend blijft
const LOS_MAX = 16, PER_VELD = 4;
function samen(b){
  if (b.cat !== "bloemen") return b.els;
  const bl = b.els.filter(e => e.t === "bloem"); if (bl.length <= LOS_MAX) return b.els;
  const uit = b.els.filter(e => e.t !== "bloem").concat(bl.slice(0, LOS_MAX));
  for (let j = 0; LOS_MAX + j * PER_VELD < bl.length; j++){ const eerste = bl[LOS_MAX + j * PER_VELD]; uit.push({id: eerste.id, t: "bloemplant", kind: eerste.kind}); }
  return uit;
}

// egel en konijn: houdingen met een rol (zit, loop, spring, slaap); zie tuin-beweging.js
const ROL = {"egel-3": "loop", "egel-4": "slaap", "konijn-4": "spring"};
const SLAAP = {egel: "egel-4", konijn: "konijn-slaap"};
function dier(naam, x, y, b, fresh){
  if (NACHT.aan && has(SLAAP[naam])) return d("dier slaap", x, y, b * (naam === "konijn" ? 1.25 : 1.05), `<img class="h" src="${src(SLAAP[naam])}" alt="" decoding="async">`);
  const hs = [1, 2, 3, 4].map(j => `${naam}-${j}`).filter(has); if (!hs.length) return "";
  return d("dier" + (fresh ? " nieuw" : ""), x, y, b, hs.map(h => `<img class="h" data-rol="${ROL[h] || "zit"}" src="${src(h)}" alt="" decoding="async">`).join(""));
}

/* v1.2 licht volgens de klok: een eigen weide voor de ochtend, de middag en de avond; 's nachts de avondweide, donker */
function licht(now){
  const h = now.getHours() + now.getMinutes() / 60;
  return h < 6 || h >= 21.5 ? "nacht" : h < 11 ? "ochtend" : h < 17 ? "middag" : "avond";
}
const weide = toon => { for (const f of toon === "nacht" ? ["weide-nacht", "weide-avond"] : ["weide-" + toon]) if (has(f)) return f; return "weide"; };
// sterren: alleen in de lucht (het masker komt uit de nachtweide, tools/tuin-beelden.py kies-tijd nacht)
function sterren(){
  const R = rng("sterren"); let h = "";
  for (let i = 0; i < 70; i++){ const g = R() < .15 ? 2.2 : 1 + R(); h += `<b${g > 2 ? ' class="fel"' : ""} style="left:${(R() * 100).toFixed(1)}%;top:${(R() * 52).toFixed(1)}%;--g:${g.toFixed(2)};animation-duration:${(2.5 + R() * 4).toFixed(1)}s;animation-delay:-${(R() * 6).toFixed(1)}s"></b>`; }
  const m = has("weide-nacht-lucht") ? `-webkit-mask-image:url(${src("weide-nacht-lucht")});mask-image:url(${src("weide-nacht-lucht")})` : "";
  return `<div class="gd-sterren" style="${m}">${h}</div>`;
}

const KEY = "philearn-tuin";
PL.tuin = async function(box, opts){
  opts = opts || {};
  const store = PL._store; if (!store || !box) return;
  const mem = (await store.load(KEY)) || {max: {}, seen: {}};
  const maat = {};
  for (const id of ORDER){
    const dd = opts.states ? opts.states[id] : null;
    const m = dd ? PL.tuinMaat(dd) : null, old = mem.max[id] || null;
    if (!m && !old) continue;
    // niets krimpt: de hoogste stand blijft staan
    maat[id] = {e: Math.max((m || {}).e || 0, (old || {}).e || 0), k: Math.max((m || {}).k || 0, (old || {}).k || 0), r: Math.max((m || {}).r || 0, (old || {}).r || 0), g: Math.max((m || {}).g || 0, (old || {}).g || 0),
      days: [...new Set([...((m || {}).days || []), ...((old || {}).days || [])])]};
    mem.max[id] = maat[id];
  }
  const plan = PL.tuinPlan(maat), toon = opts.tijd || licht(new Date());
  const seen = mem.seen || {}, fresh = id => !seen[id] && Object.keys(seen).length > 0;
  let els = ""; NACHT.aan = toon === "nacht"; NACHT.bloemen = [];
  const alle = plan.beds.flatMap(b => samen(b).filter(e => e.t !== "plant" || +e.id.split("-p").pop() < 60).map(e => [e, b.id]));
  for (const [e, bed] of alle.filter(([e]) => e.t !== "insect").concat(alle.filter(([e]) => e.t === "insect"))) els += elHTML(e, bed, mem, fresh(e.id));
  // van eitje tot vlinder: hoort bij alles samen
  const groei = plan.groei, gF = fresh("groei-" + groei);
  if (groei === "eitje" && has("eitje")){ const p = plek(mem, "groei-eitje", "eitje"); els += d("wieg" + (gF ? " nieuw" : ""), p.x, p.y, 3.6, im("eitje")); }
  else if ((groei === "rupsje" || groei === "rups") && has("rups")){ const p = plek(mem, "groei-rups", "kruip"); els += d((NACHT.aan ? "slaap" : "kruip") + (gF ? " nieuw" : ""), p.x, p.y, groei === "rups" ? 4.8 : 3.4, im("rups"), `data-soort="rups" data-kijkt="l" data-bereik="6"`); }
  else if (groei === "cocon" && has("cocon")) els += `<div class="d hang${gF ? " nieuw" : ""}" style="left:20%;top:21.5%;width:3.6%;z-index:40">${im("cocon")}</div>`;
  else if (groei === "vlinder") for (let i = 0; i < plan.vlinders; i++) els += vlinder(i, fresh("vlinder-" + i));
  // de egel komt na twee trainingsdagen, het konijn na vijf ('s nachts slapen ze)
  if (plan.tier >= 1) els += dier("egel", 13, 95, 8.5, fresh("dier-egel"));
  if (plan.tier >= 2) els += dier("konijn", 87, 96, 9, fresh("dier-konijn"));
  const strook = !!opts.strook;   // de rustige strook op het startscherm: dezelfde weide, alleen het onderste deel
  const avond = toon === "avond" || toon === "nacht";
  const oud = box.querySelector(".gd-scene"); if (oud && window.TuinBeweging) TuinBeweging.stop(oud);
  box.innerHTML = `<div class="gd${strook ? " gd-strook" : ""}${opts.vol ? " gd-vol" : ""} gd-t${plan.tier} gd-${toon}${toon === "nacht" && !has("weide-nacht") ? " gd-nachtavond" : ""}${opts.focus ? " gd-focus" : ""}" role="img" aria-label="Mijn tuin"${avond ? " data-avond" : ""} style="--nevel:${plan.nevel}">
    <div class="gd-scene"><img class="bg" src="${src(weide(toon))}" alt="" draggable="false">${NACHT.aan ? sterren() : ""}<div class="gd-nevel"></div><div class="gd-dingen">${els}</div>
    <div class="gras voor">${has("gras-voor") ? Array.from({length: 5}, () => im("gras-voor")).join("") : ""}</div><div class="gd-toon"></div></div></div>`;
  const G_ = box.querySelector(".gd"), scene = box.querySelector(".gd-scene");
  if (opts.vol) requestAnimationFrame(() => { G_.scrollLeft = (G_.scrollWidth - G_.clientWidth) / 2; });
  if (opts.focus) G_.querySelectorAll(`[data-bed="${opts.focus}"]`).forEach(x => x.classList.add("aan"));
  // pas tonen als de lagen er zijn (geen losse stukken die binnenvallen); dan beweegt hij
  // wat beweegt heeft een bovengrens (vloeiend op een tablet): het dichtstbijzijnde beweegt, de rest staat stil of rust op een bloem
  const dichtst = sel => [...G_.querySelectorAll(sel)].sort((x, y) => parseFloat(y.style.top) - parseFloat(x.style.top));
  const MAX = Object.assign({boom: 14, wieg: 70}, window.__tuinMax || {});   // __tuinMax: alleen om te meten
  dichtst(".boom").slice(MAX.boom).forEach(x => x.classList.replace("boom", "boomstil"));
  dichtst(".wieg").slice(MAX.wieg).forEach(x => x.classList.replace("wieg", "stil"));
  const bl = NACHT.bloemen;
  [...G_.querySelectorAll(".vlieg:not(.vlinder)")].slice(16).forEach((x, i) => {
    x.classList.replace("vlieg", "stil"); x.style.filter = "";
    if (bl.length){ const b = bl[(i * 5 + 1) % bl.length]; x.style.left = b.x.toFixed(1) + "%"; x.style.top = (b.y - b.h * .9).toFixed(1) + "%"; x.style.zIndex = Math.round(b.y * 2) + 1; x.style.width = (parseFloat(x.style.width) * .8).toFixed(2) + "%"; }
  });
  [...G_.querySelectorAll(".kruip,.spring")].slice(20).forEach(x => { x.classList.remove("kruip", "spring"); x.classList.add("stil"); });
  const klaar = () => { if (G_.classList.contains("gd-klaar")) return; G_.classList.add("gd-klaar"); if (window.TuinBeweging) { if (!opts.stil) TuinBeweging.start(scene, {stof: strook || NACHT.aan ? 0 : 4 + plan.tier * 3, vuur: NACHT.aan ? (strook ? 6 : 10 + plan.tier * 4) : 0}); } };
  Promise.all([...box.querySelectorAll("img")].map(i => i.decode ? i.decode().catch(() => 0) : 0)).then(klaar); setTimeout(klaar, 2500);
  // wat nu te zien is, is gezien (de volgende keer groeit alleen het nieuwe zichtbaar op)
  const nowSeen = {}; plan.beds.forEach(b => b.els.forEach(e => { nowSeen[e.id] = 1; })); if (groei) nowSeen["groei-" + groei] = 1;
  for (let i = 0; i < plan.vlinders; i++) nowSeen["vlinder-" + i] = 1; if (plan.tier >= 1) nowSeen["dier-egel"] = 1; if (plan.tier >= 2) nowSeen["dier-konijn"] = 1;
  mem.seen = Object.assign(seen, nowSeen, Object.keys(seen).length ? {} : {_: 1});
  try { await store.save(KEY, mem); } catch(e){}
  return plan;
};
})();

/* Gedeelde login (v0.14), alleen in versies met space.requireLogin (presentatie, groep3).
   Dit is een drempel tegen toevallige bezoekers, geen beveiliging: de hash staat in de pagina.
   Gebruikersnaam en SHA-256 van het wachtwoord komen bij het bouwen uit .env.local (niet in git).
   Na een juiste invoer: een vlag in de opslag van deze versie, 30 dagen geldig op dit apparaat. */
(function(){
"use strict";
const PL = window.PL, S = PL.space;
const DAYS = 30, FLAG = "login";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function valid(){
  try {
    const f = JSON.parse(PL.ls.get(FLAG) || "null");
    // een ander wachtwoord maakt oude vlaggen ongeldig
    return !!(f && f.until > Date.now() && f.h === String(S.loginHash || "").slice(0, 12));
  } catch(e){ return false; }
}
PL.logout = () => { PL.ls.remove(FLAG); location.reload(); };

PL.gate = function(app){
  if (!S.requireLogin || valid()) return Promise.resolve(true);
  if (!S.loginUser || !S.loginHash){
    app.innerHTML = `<div class="pl-card pl-login"><h1 class="pl-h2">Leeratelier</h1><p class="pl-lead">Deze versie is gebouwd zonder inloggegevens. Zie de README.</p></div>`;
    return Promise.resolve(false);
  }
  return new Promise(resolve => {
    app.classList.add("pl-loginapp");
    app.innerHTML = `
      <form class="pl-card pl-login" id="pl-login" autocomplete="on" novalidate>
        <span class="pl-login-flower" aria-hidden="true">${PL.flower ? PL.flower(5, {stem: false}) : ""}</span>
        <h1 class="pl-h2">Leeratelier</h1>
        <label class="pl-login-field"><span>Gebruikersnaam</span><input id="pl-login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="pl-login-field"><span>Wachtwoord</span><input id="pl-login-pass" name="password" type="password" autocomplete="current-password" required></label>
        <p class="pl-note pl-login-msg" id="pl-login-msg" role="status" aria-live="polite"></p>
        <button class="pl-btn big pl-full" type="submit">Binnen</button>
      </form>
      <div class="pl-foot">Leeratelier ${esc(PL.VERSION)}</div>`;
    const form = document.getElementById("pl-login"), msg = document.getElementById("pl-login-msg");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const u = document.getElementById("pl-login-user").value.trim(), p = document.getElementById("pl-login-pass").value;
      let h = "";
      try { h = await sha256(p); } catch(err){ msg.textContent = "Deze browser kan het wachtwoord niet controleren. Open de pagina via https."; return; }
      if (u.toLowerCase() === String(S.loginUser).toLowerCase() && h === S.loginHash){
        PL.ls.set(FLAG, JSON.stringify({until: Date.now() + DAYS * 864e5, h: h.slice(0, 12)}));
        app.classList.remove("pl-loginapp");
        resolve(true);
      } else {
        msg.textContent = "Die combinatie klopt niet. Kijk de gebruikersnaam en het wachtwoord nog eens na.";
        document.getElementById("pl-login-pass").select();
      }
    });
    setTimeout(() => { const i = document.getElementById("pl-login-user"); if (i && !("ontouchstart" in window)) i.focus(); }, 50);
  });
};
})();

/* Naspelen (v0.14): een stand opbouwen door vragen na te spelen met dezelfde regels als de kern (updateItem/updateStone).
   Gebruikt door de stem-ontwikkelpagina (stem-fixtures.js) en door "Demo vullen" in de presentatieversie (demo.js). */
(function(){
"use strict";
const PL = window.PL;
const P = () => PL.P; const day0 = new Date().toISOString().slice(0, 10);
const iso = off => new Date(Date.parse(day0 + "T12:00:00Z") + off * 864e5).toISOString().slice(0, 10);
const dn = s => Math.floor(Date.parse(s + "T12:00:00Z") / 864e5);
const med = a => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;
function blank(){ return {v: 4, stage: 1, items: {}, stones: {}, sessions: [], events: [], forms: {A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, lastForm: "A", cooldown: 0, hold: 0, lastPlayed: "", expl: {}, explPending: {}, adjust: null, lines: [], voice: {recent: {}, lines: []}}; }
/* één vraag naspelen: zelfde regels als core.js */
function play(d, T, off, hhmm, k, ok1, rt, sup, f, extra){
  const st = T.stoneOf(k), t = iso(off) + "T" + hhmm + ":00";
  d.events.push(Object.assign({t, tr: T.id, k, st, f: f || "A", ok1: ok1 ? 1 : 0, step: ok1 ? 0 : 1, rt, warm: 0, sup: sup || "vol"}, extra || {}));
  const r = d.items[k] || (d.items[k] = {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []});
  r.n++; if (ok1) r.ok1++; else r.st++; r.rts = r.rts.concat(ok1 ? [rt] : []).slice(-5);
  const fluent = ok1 && rt <= P().fluentMs; r.last = ok1 ? "ok" : "step"; r.d = iso(off);
  if (fluent){ r.fl++; r.iv = Math.min(P().review.length - 1, (r.iv || 0) + (r.fl >= 2 ? 1 : 0)); r.due = dn(iso(off)) + P().review[r.iv]; }
  else if (!ok1){ r.fl = 0; r.iv = Math.max(0, (r.iv || 0) - 1); r.due = dn(iso(off)) + 1; }
  const s = d.stones[st] || (d.stones[st] = {hist: [], rts: [], power: false, speed: false, n: 0});
  s.n++; s.hist.push(ok1 ? 1 : 0); if (s.hist.length > P().powerWindow) s.hist.shift();
  if (ok1){ s.rts.push(rt); if (s.rts.length > P().speedWindow) s.rts.shift(); } else if (s.rts.length) s.rts.shift();
  s.power = s.hist.length >= P().powerWindow && s.hist.reduce((a, b) => a + b, 0) >= P().powerNeed; s.speed = s.power && s.rts.length >= P().speedWindow && med(s.rts) <= P().fluentMs;
}
function round(d, T, off, hh, qs, f, opts){
  // qs: [[k, ok1, rt, sup]]; een ronde = deze vragen + een round-event + een sessie (per dag samengevoegd)
  qs.forEach(([k, ok1, rt, sup], i) => play(d, T, off, `${hh}:${String(10 + i).padStart(2, "0")}`, k, ok1, rt, sup, f));
  d.events.push({t: iso(off) + `T${hh}:30:00`, tr: T.id, round: 1, st: T.stoneOf(qs[qs.length - 1][0]), f: f || "A", n: qs.length});
  let s = d.sessions.find(x => x.d === iso(off)); if (!s){ s = {d: iso(off), t0: 0, min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, forms: [], react: {leuk: 0, gewoon: 0, pittig: 0}, why: {}}; d.sessions.push(s); }
  s.rounds++; s.items += qs.length; s.first += qs.filter(x => x[1]).length; s.steps += qs.filter(x => !x[1]).length; s.min += 6; if (!s.forms.includes(f || "A")) s.forms.push(f || "A");
  d.forms[f || "A"].rounds++; d.lastForm = f || "A"; d.lastPlayed = iso(off) + `T${hh}:30:00.000Z`;
  if (opts && opts.land) d.events.push(Object.assign({t: iso(off) + `T${hh}:31:00`, tr: T.id}, opts.land));
}
PL._naspelen = {day0, iso, blank, play, round};
})();

/* Kindschil · geluid (v0.14). Elke instructie wordt uitgesproken.
   Volgorde van voorkeur (zie kennis/10, onderzoek iOS):
   1. een opgenomen of vooraf gemaakt bestand (audio/<id>.m4a), afgespeeld met één hergebruikt <audio>-element;
   2. anders de Nederlandse stem van de browser (speechSynthesis, nl-NL, dan nl-BE, dan nl), met een tijdslimiet als vangnet.
   Letterklanken komen alleen uit opnames (klank-m, klank-s, …): een spraaksynthesizer zegt "em" in plaats van "mmm".
   Ontbreekt een opname van een klank, dan zegt de stem niets voor die klank en toont het scherm de letter (en de
   ontbrekende opname staat in het ouderoverzicht). Het eerste geluid start altijd na een tik (iOS). */
(function(){
"use strict";
const PL = window.PL;
const MAP = window.__plAudio || {};
const G = PL.geluid = {};
let el = null, unlocked = false, voice = null, runId = 0;
const missing = new Set();

function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices() || [];
    voice = vs.find(v => /^nl[-_]NL/i.test(v.lang) && /xander|claire/i.test(v.name)) || vs.find(v => /^nl[-_]NL/i.test(v.lang)) || vs.find(v => /^nl[-_]BE/i.test(v.lang)) || vs.find(v => /^nl/i.test(v.lang)) || null;
  } catch(e){ voice = null; }
}
try { if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch(e){}

G.has = id => !!MAP[id];
G.missing = () => [...missing];
/* in een tik aanroepen: maakt het audio-element en de spraak vrij (iOS) */
G.unlock = function(){
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
  try { el = new Audio(); el.preload = "auto"; el.src = "data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAACAE00QSBpc29taXNvMgAAAAhmcmVlAAAAAG1kYXQ="; const p = el.play(); if (p && p.catch) p.catch(() => {}); } catch(e){}
  try { if ("speechSynthesis" in window){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch(e){}
};
G.stop = function(){ runId++; try { if (el){ el.pause(); } } catch(e){} try { speechSynthesis.cancel(); } catch(e){} };

function playFile(src, my){
  return new Promise(res => {
    if (!el) el = new Audio();
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    try {
      el.onended = fin; el.onerror = fin; el.src = src; el.currentTime = 0;
      const p = el.play(); if (p && p.catch) p.catch(fin);
    } catch(e){ fin(); }
    setTimeout(fin, 6000);
    const watch = setInterval(() => { if (my !== runId){ clearInterval(watch); fin(); } if (done) clearInterval(watch); }, 80);
  });
}
function speakText(text, my){
  return new Promise(res => {
    if (!text || !("speechSynthesis" in window)) return res();
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = "nl-NL"; u.rate = 0.9; u.pitch = 1; if (voice) u.voice = voice;
      G._u = u;   // referentie houden (iOS ruimt anders soms op)

    } catch(e){ fin(); }
    setTimeout(fin, 1200 + text.length * 90);   // vangnet als onend niet komt
    const watch = setInterval(() => { if (my !== runId){ clearInterval(watch); fin(); } if (done) clearInterval(watch); }, 80);
  });
}
const pause = ms => new Promise(r => setTimeout(r, ms));

/* parts: een lijst van {id, t} (of een string: alleen tekst). Opeenvolgende delen zonder bestand gaan samen in één zin
   naar de spraak; delen met een bestand worden als bestand gespeeld. Een klank (id begint met "klank-") zonder bestand wordt overgeslagen. */
/* Leestekens alleen ("?", ".") staan in het onderschrift maar worden nooit uitgesproken: de browserstem zegt anders "vraagteken". */
const spreekbaar = t => !!t && /[0-9A-Za-z\u00C0-\u024F]/.test(t);
G.tts = [];   // wat naar de browserstem zou gaan (geen bestand); voor tests en het ouderoverzicht
G.say = async function(parts){
  G.stop(); const my = runId;
  G.last = parts;
  parts = (Array.isArray(parts) ? parts : [parts]).filter(Boolean).map(p => typeof p === "string" ? {t: p} : p);
  for (const p of parts) if (!p.gap && !p.fn && !(p.id && MAP[p.id]) && !(p.id && p.id.indexOf("klank-") === 0) && spreekbaar(p.t)) G.tts.push(p.id ? p.id + ": " + p.t : p.t);
  if (window.__kindStil){ for (const p of parts) if (p.fn) try { p.fn(); } catch(e){} return; }   // tests: geen geluid, niet wachten; wel de animaties
  let buf = [];
  const flush = async () => { if (buf.length){ const t = buf.join(" "); buf = []; await speakText(t, my); } };
  for (const p of parts){
    if (my !== runId) return;
    if (p.fn){ await flush(); try { p.fn(); } catch(e){} continue; }   // iets laten gebeuren op dit punt in de zin (animatie)
    if (p.gap){ await flush(); await pause(p.gap); continue; }
    if (p.id && MAP[p.id]){ await flush(); await playFile(MAP[p.id], my); continue; }
    if (p.id && p.id.indexOf("klank-") === 0){ missing.add(p.id); await flush(); await pause(500); continue; }
    if (p.id) missing.add(p.id);
    if (spreekbaar(p.t)) buf.push(p.t);
  }
  await flush();
};
})();

/* Kindschil v0.1 (Leeratelier v0.14) — voor een kind dat nog niet leest.
   Opslag, login, de tuin en de regels van de motor (stage, items, herhaalinterval iv, events) komen uit de kern;
   Home, de ronde en het slot zijn hier, omdat een kind van zes geen menu leest:
   - elke instructie wordt uitgesproken, met een grote luidsprekerknop om het nog eens te horen;
   - één vraag en één handeling per scherm, hooguit drie keuzes, tikdoelen van minstens 64 px, de hoofdactie onderin;
   - geen timers, geen rode kruizen, geen levens; na een niet-passend antwoord hoort en ziet het kind rustig het goede antwoord
     ("Kijk. … Nu jij.") en tikt het dat zelf aan; het item komt later terug; na twee keer niet komt er hulp bij;
   - rondes van vijf minuten, een kort warm slot en één keuze in plaatjes: nog een rondje of klaar.
   Waarom zo: zie kennis/10 (onderzoek beginnend lezen) en de stem (kennis/08). */
(function(){
"use strict";
const PL = window.PL, S = PL.space, G = PL.geluid;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, window.__kindStil ? Math.min(ms, 20) : ms));
const today = () => new Date().toISOString().slice(0, 10);
const dn = s => Math.floor(Date.parse(s + "T12:00:00Z") / 864e5);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const med = a => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;

/* parameters voor deze versie (de kern heeft er voor de oudere trainingen andere) */
const K = PL.kindP = {
  roundMs: 5 * 60 * 1000,      // een ronde duurt vijf minuten (geen klok in beeld)
  sessieMin: (PL.space && PL.space.sessieMinuten) || 10,   // daarna wordt Klaar de hoofdknop; nog een rondje blijft mogelijk
  maxItems: 30,                // vangnet
  warm: 2,                     // eerst twee dingen die al lukten (of aan herhaling toe zijn)
  fluentMs: 5000,              // "vanzelf": in één keer, binnen 5 s na het einde van de vraag (een kind van zes, met gesproken vraag)
  powerWindow: 5, powerNeed: 4, speedWindow: 5,
  review: [2, 5, 12, 30],      // herhaalchecks in dagen (zelfde als de kern)
  requeueAfter: 3,             // niet in één keer → drie vragen later terug
  supportAfter: 2              // twee keer niet in één keer → hulp erbij (minder keuzes, rekenrek)
};
const LINES = [
  {id: "rekenen", name: "Rekenen", say: "Rekenen"},
  {id: "lezen", name: "Lezen", say: "Lezen"},
  {id: "schrijven", name: "Schrijven", say: "Schrijven"}
];
const trainings = [];
const KS = PL.kind = {trainings, LINES, register: T => trainings.push(T)};
let store = null, app = null;

/* ---------- zinnen (alles wat gezegd wordt; ids zijn de bestandsnamen in audio/) ---------- */
const ZIN = PL.kindZin = {
  "hoi": () => `Hoi ${S.learnerName}.`,
  "wat-trainen": "Wat wil je trainen? Tik op een plaatje.",
  "ja": "Ja.",
  "kijk": "Kijk.",
  "het-is": "Het is",
  "nu-jij": "Nu jij.",
  "luister": "Luister.",
  "start": "Tik op start.",
  "nog-of-klaar": "Nog een rondje, of klaar?",
  "nog-een": "Nog een rondje. Daar gaan we.",
  "nog-een-2": "Nog een keer. Zo train je.",
  "klaar": "Klaar voor vandaag.",
  "naar-tuin": "Kijk maar in je tuin.",
  "slot-rondje": "Je hebt een rondje getraind.",
  "slot-terug": "kwam terug, en toen wist je het.",
  "slot-meteen": "ging vandaag meteen.",
  "slot-hulp": "Bij één vraag hielp ik mee. Die komt nog eens terug.",
  "tuin-leeg": "Je tuin wacht op je eerste rondje.",
  "tuin-rekenen": "Bij rekenen groeien planten.",
  "tuin-lezen": "Bij lezen groeien bloemen.",
  "tuin-schrijven": "Bij schrijven komen beestjes.",
  "home": "Terug naar het begin.",
  "luister-nog": "Luister nog een keer.",
  "klaar-vandaag": "Klaar voor vandaag. Morgen groeit je tuin verder.",
  "nog-mag": "Nog een rondje mag ook."
};
const NUM = ["nul", "één", "twee", "drie", "vier", "vijf", "zes", "zeven", "acht", "negen", "tien", "elf", "twaalf", "dertien", "veertien", "vijftien", "zestien", "zeventien", "achttien", "negentien", "twintig"];
for (let n = 0; n <= 20; n++) ZIN["getal-" + n] = NUM[n];
const z = id => ({id, t: typeof ZIN[id] === "function" ? ZIN[id]() : ZIN[id]});
const getal = n => z("getal-" + n);
KS.z = z; KS.getal = getal; KS.NUM = NUM;
KS.addZin = obj => Object.assign(ZIN, obj);

/* ---------- pictogrammen van de schil (de bloem uit de kern; verder alleen wat een kind nodig heeft om zonder lezen te kiezen) ---------- */
const ICON = {
  luid: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 19h8l11-9v28l-11-9H8z" fill="currentColor"/><path d="M32 17c3 2 4 4.5 4 7s-1 5-4 7M36 12c5 3.5 7 7.5 7 12s-2 8.5-7 12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  huis: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 23 24 9l17 14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v17h9V28h6v10h9V21" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>`,
  start: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 11v26l21-13z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>`,
  nog: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M37 24a13 13 0 1 1-4-9.4" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M35 6v10H25" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  tuin: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42V24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M24 30c-8 0-12-5-12-12 7 0 12 4 12 12zM24 26c0-8 4-13 12-13 0 8-4 13-12 13z" fill="currentColor"/></svg>`
};
KS.ICON = ICON;

/* ---------- opslag per training: zelfde vorm als de kern (v4) ---------- */
function blank(){ return {v: 4, kind: 1, stage: 1, items: {}, stones: {}, sessions: [], events: [], lastPlayed: ""}; }
async function load(T){ const d = Object.assign(blank(), (await store.load("philearn-" + T.id)) || {}); d.items = d.items || {}; d.stones = d.stones || {}; d.events = d.events || []; d.sessions = d.sessions || []; if (T.upgrade) T.upgrade(d); return d; }
const saveQ = {}; function save(T, d){ saveQ[T.id] = (saveQ[T.id] || Promise.resolve()).then(() => store.save("philearn-" + T.id, d)).catch(() => {}); return saveQ[T.id]; }
async function allStates(){ const st = {}; for (const T of trainings) st[T.id] = await load(T); return st; }
/* de tuin heeft drie perken: elke leerlijn is de som van zijn trainingen */
function lineStates(states){
  const out = {};
  for (const L of LINES){
    const ds = trainings.filter(T => T.line === L.id).map(T => states[T.id]).filter(Boolean);
    if (!ds.length) continue;
    const m = blank();
    for (const d of ds){ Object.assign(m.items, d.items); for (const [k, v] of Object.entries(d.stones)) m.stones[d === ds[0] ? k : k + "#" + ds.indexOf(d)] = v; m.sessions = m.sessions.concat(d.sessions); }
    out[L.id] = m;
  }
  return out;
}

/* ---------- de regels van de motor (zelfde als core.js updateItem / updateStone) ---------- */
function makeCtx(T, d){
  const rec = k => d.items[k] || {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []};
  const due = k => { const r = d.items[k]; return !!(r && r.due != null && r.due <= dn(today())); };
  const known = k => { const r = d.items[k]; return !!(r && r.fl >= 2 && r.last === "ok"); };
  const green = id => { const s = d.stones[id]; return !!(s && s.power && s.speed); };
  const support = k => rec(k).miss >= K.supportAfter && rec(k).last !== "ok";
  return {T, data: d, rec, due, known, green, support, stage: () => d.stage};
}
function update(ctx, it, first, rt){
  const d = ctx.data, k = it.key, st = it.stone;
  const r = d.items[k] || (d.items[k] = {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []});
  r.n++; if (first) r.ok1++; else { r.st++; r.miss = (r.miss || 0) + 1; }
  r.rts = r.rts.concat(first ? [rt] : []).slice(-5);
  const fluent = first && rt <= K.fluentMs; r.last = first ? "ok" : "step"; r.d = today();
  if (fluent){ r.fl++; r.iv = Math.min(K.review.length - 1, (r.iv || 0) + (r.fl >= 2 ? 1 : 0)); r.due = dn(today()) + K.review[r.iv]; if (r.fl >= 2) r.miss = 0; }
  else if (!first){ r.fl = 0; r.iv = Math.max(0, (r.iv || 0) - 1); r.due = dn(today()) + 1; }
  const s = d.stones[st] || (d.stones[st] = {hist: [], rts: [], power: false, speed: false, n: 0});
  s.n++; s.hist.push(first ? 1 : 0); if (s.hist.length > K.powerWindow) s.hist.shift();
  if (first){ s.rts.push(rt); if (s.rts.length > K.speedWindow) s.rts.shift(); } else if (s.rts.length) s.rts.shift();
  s.power = s.hist.length >= K.powerWindow && s.hist.reduce((a, b) => a + b, 0) >= K.powerNeed;
  s.speed = s.power && s.rts.length >= K.speedWindow && med(s.rts) <= K.fluentMs;
  d.events.push({t: new Date().toISOString().slice(0, 19), tr: T_id(ctx), k, st, ok1: first ? 1 : 0, step: first ? 0 : 1, rt, sup: it.support ? "hulp" : "", warm: it.warm ? 1 : 0});
  if (d.events.length > 3000) d.events = d.events.slice(-3000);
}
const T_id = ctx => ctx.T.id;
function nextStage(ctx){
  const d = ctx.data, stones = ctx.T.stones;
  if (d.stage < stones.length && ctx.green(stones[d.stage - 1].id)){ d.stage++; d.events.push({t: new Date().toISOString().slice(0, 19), tr: ctx.T.id, stage: d.stage}); return true; }
  return false;
}

/* ---------- keuzes: hooguit drie, groot, met rustige terugkoppeling ---------- */
/* opts: {options: [{value, html, cls}], correct, answer: [delen om te zeggen], area, after (ms)}
   geeft {first, rt}. Na een niet-passend antwoord: "Kijk. Het is …" en het goede antwoord licht op; daarna "Nu jij." */
KS.choose = function(ctx, opts){
  return new Promise(resolve => {
    const box = document.createElement("div");
    box.className = "k-choices k-n" + opts.options.length + (opts.cls ? " " + opts.cls : "");
    box.innerHTML = opts.options.map((o, i) => `<button type="button" class="k-choice ${o.cls || ""}" data-i="${i}" aria-label="${esc(o.label || "")}">${o.html}</button>`).join("");
    (opts.area || ctx.work).appendChild(box);
    const t0 = performance.now() + (opts.t0delay || 0);
    KS._now = {kind: "choose", values: opts.options.map(o => o.value), correct: opts.options.map(o => o.value).find(v => opts.isCorrect ? opts.isCorrect(v) : v === opts.correct)};   // voor de tests
    let first = true, done = false, missers = 0, busy = false;
    box.addEventListener("click", async e => {
      const b = e.target.closest(".k-choice"); if (!b || done || b.disabled || busy) return;
      G.unlock();
      const o = opts.options[+b.dataset.i];
      const ok = opts.isCorrect ? opts.isCorrect(o.value) : o.value === opts.correct;
      if (ok){
        done = true; const rt = Math.max(0, performance.now() - (ctx.speechEnd || t0));
        b.classList.add("k-ok"); box.classList.add("k-done");
        if (opts.onOk) try { opts.onOk(o.value); } catch(e){}
        if (PL.chime) PL.chime();
        await G.say(opts.okParts || [z("ja")].concat(opts.answer || []));
        await sleep(opts.after || 500);
        resolve({first, rt});
      } else if (missers === 0){
        // eerste keer niet passend: de app zet zelf een stap terug (hulp erbij, één keuze minder), het kind probeert opnieuw
        first = false; missers = 1; busy = true;
        b.classList.add("k-not"); b.disabled = true;
        const parts = (opts.stepBack && await opts.stepBack()) || [z("luister-nog")];
        await G.say(parts);
        busy = false;
      } else if (missers === 1){
        // tweede keer: voordoen en de beurt teruggeven
        missers = 2;
        b.classList.add("k-not"); box.classList.add("k-model");
        const good = [...box.children].find(x => { const v = opts.options[+x.dataset.i].value; return opts.isCorrect ? opts.isCorrect(v) : v === opts.correct; });
        [...box.children].forEach(x => { if (x !== good) x.disabled = true; });
        good.classList.add("k-show");
        await G.say((opts.model || [z("kijk"), z("het-is")].concat(opts.answer || [])).concat([{gap: 250}, z("nu-jij")]));
      }
    });
  });
};

function homeBtn(){ return `<button type="button" class="k-homebtn" id="k-home" aria-label="Terug naar het begin">${ICON.huis}</button>`; }
function wireHome(){ const b = $("k-home"); if (b) b.addEventListener("click", () => { G.unlock(); running = 0; KS.home(); }); }

let running = 0;
KS.round = async function(T, again){
  G.stop(); const my = ++running; setRoute(T.id + "/ronde");
  const d = await load(T), ctx = makeCtx(T, d);
  ctx.leesStap = await KS.leesStap();   // welke klanken al gehad zijn (stand van Letterklanken); bepaalt de woorden bij lezen en bouwen
  frame("ronde", `
    <header class="k-bar">${homeBtn()}${bigSpeaker("k-say")}</header>
    <section class="k-work" id="k-work" aria-live="polite"></section>`);
  wireHome();
  ctx.work = $("k-work");
  let lastSay = null;
  const capText = parts => parts.filter(p => p && !p.gap && p.cap !== false && !(p.id && p.id.indexOf("klank-") === 0)).map(p => typeof p === "string" ? p : (p.t || "")).join(" ").replace(/\s+([.,?!])/g, "$1").replace(/\s+/g, " ").trim();
  ctx.say = async parts => {
    lastSay = parts; ctx.speechEnd = null;
    const q = ctx.work.querySelector(".k-q"); if (q){ let c = q.querySelector(".k-cap"); if (!c){ c = document.createElement("p"); c.className = "k-cap"; const v = q.querySelector(".k-vis"); v ? v.after(c) : q.prepend(c); } c.textContent = capText(parts); }
    await G.say(parts); ctx.speechEnd = performance.now();
  };
  $("k-say").addEventListener("click", () => { G.unlock(); if (lastSay) G.say(lastSay); });
  if (again) await G.say([z(pick(["nog-een", "nog-een-2"]))]);

  const t0 = Date.now(), res = {items: 0, first: 0, steps: 0, back: [], meteen: [], helped: 0, start: t0};
  const queue = [], used = new Set();
  // eerst wat aan herhaling toe is of al lukte (opwarmers), dan de huidige steen
  const dueKeys = shuffle(Object.keys(d.items).filter(k => ctx.due(k) && d.items[k].last === "ok")).slice(0, K.warm);
  for (const k of dueKeys){ const it = T.fromKey(k); if (it) queue.push(Object.assign(it, {warm: true, stone: T.stoneOf(k)})); }
  const missedThisRound = new Set();
  let n = 0;
  while (my === running){
    if (Date.now() - t0 >= K.roundMs || n >= K.maxItems) break;
    let it = queue.length && (queue[0].at == null || queue[0].at <= n) ? queue.shift() : null;
    if (!it){
      const stones = T.stones, cur = stones[d.stage - 1];
      const earlier = stones.slice(0, d.stage - 1);
      const src = n < K.warm && earlier.length ? pick(earlier) : cur;
      let guard = 0;
      do { it = src.gen(ctx); guard++; } while (it && used.has(it.key) && guard < 12);
      if (!it) break;
      it.stone = src.id; it.warm = src !== cur;
    }
    used.add(it.key);
    it.support = ctx.support(it.key);
    ctx.work.innerHTML = "";
    const r = await T.ask(ctx, it);
    if (my !== running) return;
    n++; res.items++;
    update(ctx, it, r.first, r.rt);
    if (r.first){ res.first++; if (missedThisRound.has(it.key) && !res.back.includes(it.key)) res.back.push(it.key); else if (ctx.known(it.key) && !res.meteen.includes(it.key)) res.meteen.push(it.key); }
    else { res.steps++; missedThisRound.add(it.key); if (it.support) res.helped++;
      // komt drie vragen later terug (als er nog tijd is)
      const again_ = T.fromKey(it.key); if (again_) queue.push(Object.assign(again_, {at: n + K.requeueAfter, stone: it.stone, requeue: true})); used.delete(it.key); }
    nextStage(ctx);
    save(T, d);
  }
  if (my !== running) return;
  // een ronde is een afgeronde ronde: sessie per dag
  let s = d.sessions.find(x => x.d === today()); if (!s){ s = {d: today(), rounds: 0, items: 0, first: 0, steps: 0, min: 0}; d.sessions.push(s); }
  s.rounds++; s.items += res.items; s.first += res.first; s.steps += res.steps; s.min += Math.round((Date.now() - t0) / 60000);
  if (d.sessions.length > 200) d.sessions = d.sessions.slice(-200);
  d.events.push({t: new Date().toISOString().slice(0, 19), tr: T.id, round: 1, n: res.items, st: T.stones[d.stage - 1].id});
  d.lastPlayed = new Date().toISOString();
  await save(T, d);
  // oefentijd vandaag (alle trainingen samen), alleen voor de keuze op het slot
  try { const k = "sessie", o = JSON.parse(PL.ls.get(k) || "null"); const v = o && o.d === today() ? o : {d: today(), ms: 0}; v.ms += Date.now() - t0; PL.ls.set(k, JSON.stringify(v)); res.vandaagMs = v.ms; } catch(e){}
  KS.slot(T, res);
};

/* ---------- het slot: kort, concreet, warm; dan één keuze in plaatjes ---------- */
function slotParts(T, res){
  const lab = k => T.sayItem ? T.sayItem(k) : [];
  if (res.back.length) return lab(res.back[0]).concat([z("slot-terug")]);
  if (res.meteen.length) return lab(res.meteen[0]).concat([z("slot-meteen")]);
  if (res.helped) return [z("slot-rondje"), z("slot-hulp")];
  return [z("slot-rondje")];
}
KS.slot = function(T, res){
  setRoute(T.id + "/klaar");
  frame("slot", `
    <header class="k-bar">${homeBtn()}${bigSpeaker("k-slot-say")}</header>
    <section class="k-slotcard"><div class="k-slotbeeld">${avatar("k-avatar-slot")}<span class="k-slotbloem" aria-hidden="true">${PL.flower(6, {stem: true})}</span></div><p class="k-slotline" id="k-slotline"></p></section>
    <div class="k-bottom k-two">
      <button type="button" class="k-go k-again" id="k-again" aria-label="Nog een rondje">${ICON.nog}<span>Nog een rondje</span></button>
      <button type="button" class="k-calm" id="k-klaar" aria-label="Klaar">${ICON.tuin}<span>Klaar</span></button>
    </div>`);

  const genoeg = (res.vandaagMs || 0) >= K.sessieMin * 60000;
  if (genoeg){   // klaar voor vandaag: Klaar wordt de hoofdknop, Nog een rondje blijft
    const a = $("k-again"), k = $("k-klaar"); a.className = "k-calm k-again"; k.className = "k-go"; k.parentNode.insertBefore(k, a);
  }
  const parts = slotParts(T, res).concat(genoeg ? [{gap: 300}, z("klaar-vandaag"), {gap: 200}, z("nog-mag")] : [{gap: 300}, z("nog-of-klaar")]);
  const sl = $("k-slotline"); if (sl){ const t = parts.filter(p => p && p.t).map(p => p.t).join(" ").replace(/\s+([.,?])/g, "$1"); sl.textContent = t.charAt(0).toUpperCase() + t.slice(1); }
  $("k-slot-say").addEventListener("click", () => { G.unlock(); G.say(parts); });
  $("k-again").addEventListener("click", () => { G.unlock(); KS.round(T, true); });
  $("k-klaar").addEventListener("click", () => { G.unlock(); KS.tuin(T); });
  G.say(parts);
};

/* Kindschil · plaatjes (v0.14): eenvoudige tekeningen in code, in het blauwe palet.
   Dit zijn stand-ins. Staat er een render van de ouder in assets/g3/<naam>.webp (of .png), dan gebruikt de pagina die
   (de bestanden gaan als plaatjes/<naam>.webp mee naar de website). Geen standaardplaatjes van internet. */
(function(){
"use strict";
const PL = window.PL, KS = PL.kind;
const C = {red: "#D2453A", redDark: "#A8332B", navy: "#13294F", steel: "#5188B3", sky: "#4897C5", light: "#8CB3CD", grey: "#D7D8DD", paper: "#F3F6FA", white: "#FFFFFF",
  leaf: "#6BAA75", leafDark: "#3F7F55", wood: "#B98A5E", woodDark: "#8A6240", skin: "#F2C9A9", skinDark: "#D9A27E", soil: "#8D7B6A", warm: "#E7B75F"};
const IMG = window.__plImages || {};   // naam → plaatjes/<bestand> (renders van de ouder)
const P = KS.pic = {C};
const svg = (vb, body, cls) => `<svg class="k-svg ${cls || ""}" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
P.render = (name, fallback) => IMG[name] ? `<img class="k-render" src="${IMG[name]}" alt="">` : fallback;

/* ---------- rekenrek: twee rijen van tien, per rij vijf blauw en vijf wit; geschoven kralen staan links ---------- */
/* ---------- scènes voor Erbij en eraf (v0.16): de appelboom en de kledingkast ----------
   Boom en kast zijn leeg getekend (plaatjes/scenes, tools/scenes.py); de code zet er precies a dingen in en animeert de verandering.
   Plekken in procenten van de scène (links, boven, breedte van een ding). Afgevallen appels en uitgehaalde kleren blijven licht zichtbaar
   naast de boom of de kast, zodat het kind ziet wat er gebeurde maar alleen telt wat er nog is. */
const SC = P.SCENE = {
  boom: {img: "scene-boom", ratio: 676 / 667, maat: 11,
    plek: [[22, 22], [46, 12], [66, 21], [14, 40], [36, 33], [57, 33], [74, 42], [26, 53], [48, 49], [66, 57]],
    grond: [[22, 92], [62, 92], [84, 94], [32, 95], [93, 90]]},
  kast: {img: "scene-kast", ratio: 916 / 635, maat: 15,
    plek: [[26, 16], [41, 16], [56, 16], [26, 35], [41, 35], [56, 35], [26, 54], [41, 54], [56, 54], [26, 74], [41, 74], [56, 74]],
    weg: [[90, 90], [90, 79], [90, 68], [90, 57], [90, 46]], tas: [9, 80]}
};
P.sceneKan = soort => !!(IMG[SC[soort].img] && SC[soort].plek.length >= 10 && IMG[soort === "boom" ? "scene-appel" : "scene-trui"]);
const KLEREN = ["scene-broek", "scene-hemd", "scene-trui"];
/* a dingen nu, b erbij (op = "p") of eraf (op = "m"); geeft html; de animatie start met P.sceneSpeel(root) */
P.scene = function(soort, a, b, op){
  const S = SC[soort], m = S.maat;
  const ding = i => soort === "boom" ? "scene-appel" : KLEREN[i % 3];
  const el = (i, x, y, cls, extra) => `<img class="k-ding ${cls}" data-i="${i}" src="${IMG[ding(i)]}" alt="" style="left:${x}%;top:${y}%;width:${m}%;${extra || ""}">`;
  let html = "";
  const n = op === "p" ? a + b : a;
  for (let i = 0; i < n; i++){
    const [x, y] = S.plek[i];
    if (op === "p" && i >= a) html += el(i, x, y, "k-nieuw", soort === "kast" ? `--van-x:${((S.tas[0] - x) / m * 100).toFixed(0)}%;--van-y:${((S.tas[1] - y) / S.ratio / (m * 0.8) * 100).toFixed(0)}%` : "");   // groeit of wordt gekocht
    else if (op === "m" && i >= a - b){                                              // valt af of gaat eruit
      const [gx, gy] = (soort === "boom" ? S.grond : S.weg)[i - (a - b)];
      html += el(i, x, y, "k-gaat", `--naar-x:${gx}%;--naar-y:${gy}%`);
    } else html += el(i, x, y, "");
  }
  const tas = soort === "kast" && op === "p" ? `<img class="k-tas" src="${IMG["scene-tas"]}" alt="" style="left:${S.tas[0]}%;top:${S.tas[1]}%;width:${m * 1.05}%">` : "";
  return `<div class="k-scene k-scene-${soort} k-op-${op}" style="aspect-ratio:${S.ratio};--r:${S.ratio}" role="img" aria-label="${a} ${op === "p" ? "plus" : "min"} ${b}">` +
    `<img class="k-scene-bg" src="${IMG[S.img]}" alt="">${tas}${html}</div>`;
};
P.sceneSpeel = function(root){
  const s = root && root.querySelector(".k-scene"); if (!s || s.classList.contains("k-gespeeld")) return;
  s.classList.add("k-gespeeld");
  s.querySelectorAll(".k-gaat").forEach((e, j) => { e.style.transitionDelay = (j * 0.25) + "s"; e.style.left = e.style.getPropertyValue("--naar-x"); e.style.top = e.style.getPropertyValue("--naar-y"); });
  s.querySelectorAll(".k-nieuw").forEach((e, j) => { e.style.animationDelay = (j * 0.3) + "s"; });
};

/* ---------- splitsen (v0.15): de splitsvorm uit het werkboek ("splits.", "maak de splitstabel.") ----------
   Bovenaan het hele getal (of een groep dingen), twee lijnen naar twee vakjes eronder. Een leeg vakje is gestippeld. */
P.img = w => IMG[w] || null;
P.TELDING = ["snoep", "koek", "bal", "kip", "vis", "bloem", "ei", "slak", "uil", "mus"].filter(w => IMG[w]);
/* n dezelfde dingen in rijen van vijf; de eerste `licht` worden licht (die zijn al geteld) */
P.splitsPlaatjes = function(n, ding, licht){
  const src = IMG[ding];
  const een = i => src ? `<img src="${src}" alt=""${i < (licht || 0) ? ' class="k-licht"' : ""}>` : `<span class="k-stip${i < (licht || 0) ? " k-licht" : ""}"></span>`;
  return `<div class="k-splpics k-splpics-${Math.min(n, 5)}" role="img" aria-label="${n}">${Array.from({length: n}, (_, i) => een(i)).join("")}</div>`;
};
const vak = (inhoud, leeg) => leeg ? `<div class="k-spvak k-spleeg" data-leeg="1"><span>?</span></div>` : `<div class="k-spvak">${inhoud}</div>`;
P.splitsvorm = function(top, links, rechts, leeg){
  return `<div class="k-spvorm">${`<div class="k-spvak k-sptop">${top}</div>`}` +
    `<svg class="k-sppoot" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M100 0 L50 40 M100 0 L150 40" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>` +
    `<div class="k-sponder">${vak(`<span class="k-num">${links}</span>`, leeg === "l")}${vak(`<span class="k-num">${rechts}</span>`, leeg === "r")}</div></div>`;
};
/* splitstabel: het getal bovenaan, rijen links | rechts. rows: [{l, r, toon: "vol"|"vraag"|"later"}], leeg: "l"|"r" voor de vraagrij */
P.splitstabel = function(heel, rows, leeg){
  // vol: beide getallen; vraag: het gegeven getal en een leeg vakje; later: alleen het gegeven getal, licht (zoals links 1, 2, 3 in het werkboek)
  const cel = (v, wat) => wat === "leeg" ? `<span class="k-stleeg" data-leeg="1">?</span>` : wat === "toon" ? `<span>${v}</span>` : `<span class="k-stlater"></span>`;
  const wat = (r, kant) => r.toon === "vol" ? "toon" : kant === leeg ? (r.toon === "vraag" ? "leeg" : "niets") : "toon";
