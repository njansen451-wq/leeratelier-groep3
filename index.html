  }
  /* v0.12 startscherm (S2, S8, S10, S14, S18): wat terugkomt, welke vorm ze koos, waar ze was; na een pauze warm en zonder aantal
     dagen; na twee rondes vandaag: stoppen mag. De eerste keer zegt startText het al (geen extra zin). Eén keer per bezoek. */
  let introLine = null;
  function introVoice(){
    if (introLine != null) return introLine;
    const st = PL.stem, V = data.voice, sig = st.sig, g = st.genus(T), tIso = today(), ss = realSessions(data);
    if (!ss.length) return (introLine = "");
    const todayRounds = sig.roundsOn(data, tIso), since = sig.daysSince(data), h = new Date().getHours();
    const reg = h >= 19 ? "rustig" : todayRounds ? "" : "kort";
    const stap = T.stones[data.stage - 1].name, last = ss[ss.length - 1];
    if (todayRounds >= 2) return (introLine = st.say("intro.vandaag", {rondes: st.aantal(todayRounds, "rondes"), reg}, V));
    if (since >= 5){ const gs = T.stones.slice(0, data.stage).reverse().find(s => green(s.id)); return (introLine = st.say("intro.pauze", {stap: (gs || T.stones[data.stage - 1]).name, reg}, V)); }
    const dueK = sig.dueToday(data);
    if (dueK.length){ const d0 = dueK.map(k => data.items[k].d || "").filter(Boolean).sort()[0]; return (introLine = st.say("intro.terug", {items: st.kort(dueK.slice(0, 3).map(k => st.label(T, k)), dueK.length, st.noun(T)), pl: dueK.length > 1, dag: d0 ? st.dag(d0) : "", genus: g, reg}, V)); }
    const vorm = `"${T.forms[data.lastForm || "A"].name}"`;
    introLine = ss.length % 2 ? st.say("intro.vorm", {vorm, dag: st.dag(last.d), reg}, V) : st.say("intro.laatst", {stap, dag: st.dag(last.d), reg}, V);
    return introLine;
  }
  /* startscherm v0.11 (Hick, Occam): één regel uitleg → de vorm als keuze uit twee (onthouden) → één Start over de hele breedte,
     onderin (Fitts). Een open ronde gaat voor (Zeigarnik): "Ga verder". Wat al vanzelf gaat, staat er als groei, zonder totaal. */
  function showStart(fromRoute){
    if (!fromRoute) route("");
    app.classList.remove("pl-inround");
    const g = greeting(), gr = PL.growthOf(T, data), op = openRound(data);
    screen.innerHTML = `
      <div class="pl-intro">
      <div class="pl-card pl-startcard">
        <h2 class="pl-h2">${esc(g.title)}</h2>
        <p class="pl-lead">${esc(T.startText(ctx))}</p>
        ${g.note ? `<p class="pl-note pl-greet">${esc(g.note)}</p>` : ""}
        ${gr.text ? `<p class="pl-grow"><span class="pl-btnflower" aria-hidden="true">${PL.flower(5, {stem: false})}</span>${esc(gr.text)}</p>` : ""}
        <div class="pl-segwrap"><span class="pl-eyebrow" id="pl-seg-l">Hoe wil je trainen?</span>
          <div class="pl-seg" role="radiogroup" aria-labelledby="pl-seg-l">${["A", "B"].map(f => `<button type="button" role="radio" class="pl-form" data-form="${f}" aria-checked="${f === form}">${esc(T.forms[f].name)}</button>`).join("")}</div>
          <p class="pl-note pl-formdesc" id="pl-formdesc">${esc(T.forms[form].desc)}</p></div>
        ${T.startExtra ? T.startExtra(ctx) : ""}
        ${T.practices ? `<p class="pl-note pl-daarna">Daarna helpt het bij: ${esc(T.helps)}.</p>` : ""}
        <div class="pl-row pl-links">${T.allRound ? `<button class="pl-help" id="pl-all" type="button">${esc(T.allRound.label)}</button>` : ""}<button class="pl-help" id="pl-make2" type="button">Bedenk je ronde</button></div>
      </div>
      <div class="pl-actions">
        ${op ? `<p class="pl-note pl-center">Je ronde staat nog klaar: vraag ${op.i + 1} van ${op.total}.</p>` : ""}
        <button class="pl-btn big pl-full" id="pl-go" type="button">${op ? "Ga verder" : "Start"}</button>
        ${op ? `<button class="pl-btn quiet pl-full" id="pl-new" type="button">Nieuwe ronde</button>` : ""}
      </div></div>`;
    screen.querySelectorAll(".pl-form").forEach(b => b.addEventListener("click", () => { form = b.dataset.form; data.lastForm = form; $("pl-formdesc").textContent = T.forms[form].desc; screen.querySelectorAll(".pl-form").forEach(x => x.setAttribute("aria-checked", String(x === b))); save(); }));
    const seg = screen.querySelector(".pl-seg");
    seg.addEventListener("keydown", e => { if (!/Arrow(Left|Right|Up|Down)/.test(e.key)) return; e.preventDefault(); const other = screen.querySelector(`.pl-form[data-form="${form === "A" ? "B" : "A"}"]`); other.click(); other.focus(); });
    $("pl-go").addEventListener("click", () => { if (op) return playRound(false, op); custom = null; playRound(false); });
    const nw = $("pl-new"); if (nw) nw.addEventListener("click", () => { delete data.open; custom = null; playRound(false); });
    if (T.allRound) $("pl-all").addEventListener("click", () => { custom = {all: true, form, n: 0}; log({all: 1}); playRound(false); });
    $("pl-make2").addEventListener("click", () => showMake());
  }
  /* --- eigen ronde: Natalia kiest de steen, de vorm en het aantal; de motor kiest de vragen --- */
  /* --- Bedenk je ronde: een gesprek in bouwstenen. Natalia stelt haar vraag zoals je hem aan een AI zou stellen;
         de motor laat zien wat hij begreep, wat hij kiest en waarom, en wat hij niet weet (aannames). Dan: klopt dit? --- */
  const nameOf = id => { const st = T.stones.find(x => x.id === id); return st ? st.name : id; };
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  function stoneState(st, i){ const g = ctx.green(st.id), seen = (data.stones[st.id] || {}).n > 0; const open = i <= data.stage - 1 || (st.requires || []).every(r => ctx.green(r)); const eerstIds = (st.requires || []).filter(r => !ctx.green(r)), eerst = eerstIds.map(nameOf); return {g, seen, open, label: g ? "gaat al vanzelf" : seen ? "ben je mee bezig" : open ? "nog nieuw" : "nog niet aan de beurt · komt na " + eerst.join(", "), eerst, eerstIds}; }
  /* De beslisboom van het gesprek. Puur: (antwoorden tot nu toe) → volgende vraag óf het plan met drie denkregels.
     Regels die getest worden (t_tree): een vraag wordt alleen gesteld als er minstens twee antwoorden zijn; wat niet gevraagd
     wordt, staat in de denkregels; elk pad eindigt in een geldig plan (open steen, vorm A/B, 6 of 10 vragen, opwarmer ≠ steen). */
  function planTree(a){
    const stones = T.stones.map((st, i) => Object.assign({st}, stoneState(st, i)));
    const byId = id => stones.find(x => x.st.id === id);
    const idx = id => T.stones.findIndex(x => x.id === id);
    const played = stones.filter(x => x.seen);
    const skipped = [];
    // 1. wat oefenen
    if (a.stoneId == null) return {ask: {q: "Wat wil je oefenen?", key: "stoneId", opts: stones.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label, later: !x.open && !x.seen})).concat([{v: "kies", t: "Kies jij maar", sub: "dan zeg ik wat ik koos en waarom"}])}};
    const guessed = a.stoneId === "kies";
    let stoneId = guessed ? T.stones[data.stage - 1].id : a.stoneId;
    let st = byId(stoneId);
    // v0.9.3: een steen die nog niet aan de beurt is: eerst vragen of ze hem wil proberen of de stap ervoor neemt.
    // De stap ervoor is de eerste nog-niet-vanzelf-steen in de keten eronder die wél open is.
    const stapErvoor = id => { const x = byId(id); for (const r of x.eerstIds || []){ const y = byId(r); if (y.open || y.seen) return r; const d = stapErvoor(r); if (d) return d; } return null; };
    const ancestors = id => { const out = new Set(), walk = i => (T.stones[idx(i)].requires || (idx(i) > 0 ? [T.stones[idx(i) - 1].id] : [])).forEach(r => { if (!out.has(r)){ out.add(r); walk(r); } }); walk(id); return out; };
    const laterChosen = !guessed && !st.open && !st.seen;
    const ervoor = laterChosen ? stapErvoor(stoneId) : null;
    if (laterChosen && ervoor && a.later == null) return {ask: {q: `${cap(nameOf(stoneId))} is nog niet aan de beurt. Wat wil je?`, key: "later", opts: [{v: "proberen", t: "Toch proberen", sub: "met alle hulp erbij"}, {v: "eerst", t: `Eerst ${nameOf(ervoor)}`, sub: (st.eerstIds || []).includes(ervoor) ? "de stap ervoor; daarna kom je hier vanzelf" : "daar begint de weg ernaartoe"}]}};
    if (a.later === "eerst" && ervoor){ stoneId = ervoor; st = byId(stoneId); }
    // 2a. groene steen: herhalen of verder (alleen vragen als er een open volgende steen is)
    const next = T.stones[idx(stoneId) + 1]; const nextOpen = next && byId(next.id).open;
    if (!guessed && st.g && nextOpen && a.verder == null) return {ask: {q: `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Wat wil je?`, key: "verder", opts: [{v: "herhalen", t: "Herhalen", sub: "de basis komt altijd terug"}, {v: "verder", t: "Een stapje verder", sub: cap(nameOf(next.id))}]}};
    if (a.verder === "verder"){ stoneId = next.id; st = byId(stoneId); }
    // 2b. wat gaat al goed: alleen vragen als er iets te kiezen valt (gespeelde stenen vóór deze steen)
    // alleen stenen waar deze op bouwt (de keten eronder), en die ze hier al speelde
    const onder = ancestors(stoneId);
    const warmOpts = played.filter(x => x.st.id !== stoneId && onder.has(x.st.id)).slice(-4);
    if (!guessed && warmOpts.length && a.warmId == null) return {ask: {q: "Wat gaat al goed?", key: "warmId", opts: warmOpts.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label})).concat([{v: "niets", t: "Dat weet ik niet", sub: "dan kies ik iets wat vorige keer lukte"}])}};
    if (guessed) skipped.push("goedKies"); else if (!warmOpts.length) skipped.push("goedLeeg");
    // 3. hoe, 4. hoeveel
    if (a.form == null) return {ask: {q: "Hoe wil je het doen?", key: "form", opts: ["A", "B"].map(f => ({v: f, t: T.forms[f].name, sub: T.forms[f].desc}))}};
    if (a.n == null) return {ask: {q: "Hoeveel tijd heb je?", key: "n", opts: [{v: 6, t: "Kort", sub: "6 vragen"}, {v: 10, t: "Wat langer", sub: "10 vragen"}]}};
    // het plan
    const warmId = a.warmId && a.warmId !== "niets" ? a.warmId : null;
    const n = +a.n, f = a.form;
    const autoWarm = !warmId && warmOpts.length ? warmOpts[warmOpts.length - 1].st.id : null;
    const later = !guessed && !st.open && !st.seen;
    const vormZin = n => /^met /i.test(n) ? n.toLowerCase() : "met " + n.toLowerCase();   // "met het model", niet "met met het model"
    const vraag = `Ik wil ${guessed ? "oefenen, kies jij maar wat" : a.later === "eerst" ? "eerst " + nameOf(stoneId) + " oefenen, de stap vóór " + nameOf(a.stoneId) : nameOf(stoneId) + " oefenen"}${a.verder === "verder" ? " (een stapje verder)" : a.verder === "herhalen" ? " (herhalen)" : ""}${later ? ", ook al is het nog niet aan de beurt" : ""}. ${warmId ? cap(nameOf(warmId)) + " gaat al goed." : a.warmId === "niets" ? "Ik weet niet wat al goed gaat." : ""} Ik wil het doen ${vormZin(T.forms[f].name)}, ${n === 6 ? "kort" : "wat langer"}.`.replace(/\s+/g, " ");
    const begreep = `Je wilt ${guessed ? "oefenen en laat de keuze aan mij" : a.later === "eerst" ? nameOf(a.stoneId) + ", en eerst de stap ervoor: " + nameOf(stoneId) : nameOf(stoneId)}. ${warmId ? `${cap(nameOf(warmId))} gaat al goed, zei je.` : a.warmId === "niets" ? "Wat al goed gaat, weet je zelf niet zeker." : ""} ${T.forms[f].name}, ${n} vragen.`.replace(/\s+/g, " ");
    const warmSrc = warmId || autoWarm;
    // elke bewering hieronder volgt uit de stand (A3): eerste steen, gespeelde stenen, afgeronde rondes
    const firstStone = idx(stoneId) === 0, anyRound = data.sessions.length > 0;
    const kies = warmSrc ? `Ik begin met twee uit ${nameOf(warmSrc)}${warmId ? "" : ", want dat lukte vorige keer"}, als opwarmer. Dan ${n - 2} uit ${nameOf(stoneId)}. Wat niet in één keer lukt, komt drie vragen later terug.`
      : `Alles komt uit ${nameOf(stoneId)}; ${firstStone ? "er is geen steen vóór deze om mee op te warmen" : "de stenen ervoor heb je hier nog niet gespeeld, dus ik warm niet op"}. Wat niet in één keer lukt, komt drie vragen later terug.`;
    const cur = T.stones[data.stage - 1], curNaVanzelf = (cur.requires || (idx(cur.id) > 0 ? [T.stones[idx(cur.id) - 1].id] : [])).every(r => ctx.green(r));
    const weetNiet = a.later === "eerst" ? `Je koos eerst ${nameOf(stoneId)}, de stap ervoor. Gaat dat vanzelf, dan ligt ${nameOf(a.stoneId)} klaar.`
      : later ? `${cap(nameOf(stoneId))} is nog niet aan de beurt: het komt na ${st.eerst.join(" en ")}. Je wilt het proberen, en dat mag. Ik laat de hulp helemaal staan. ${(() => { const e = stapErvoor(stoneId); return e ? `Gaat het nog niet, dan is ${nameOf(e)} een goed begin.` : ""; })()}`
      : guessed ? `Je zei niet wát je wilt oefenen. Ik koos ${nameOf(stoneId)}, omdat ${curNaVanzelf ? "dat de volgende stap is na wat al vanzelf gaat" : "je daar nu bent in deze training"}. Bedoel je iets anders, zeg het dan.`
      : skipped.includes("goedLeeg") ? (firstStone ? `Ik vroeg niet wat al goed gaat: er is geen steen vóór ${nameOf(stoneId)}.` : anyRound ? `Ik vroeg niet wat al goed gaat: de stenen vóór ${nameOf(stoneId)} heb je hier nog niet gespeeld.` : `Ik vroeg niet wat al goed gaat: je hebt hier nog geen ronde afgemaakt, dus dat weet ik nog niet.`) + (st.g ? ` ${cap(nameOf(stoneId))} gaat bij jou al vanzelf; herhalen is prima.` : !st.seen ? ` ${cap(nameOf(stoneId))} is nieuw; wat lastig is, merk ik aan je tussenstappen.` : ` Hoe het nu gaat, merk ik aan je tussenstappen.`)
      : st.g ? `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Herhalen is prima; de basis komt altijd terug.`
      : !st.seen ? `${cap(nameOf(stoneId))} is nieuw voor je. Ik weet nog niet wat daar lastig is; dat merk ik aan je tussenstappen.`
      : `Ik weet niet of je dit vandaag met of zonder hulp wilt. Ik laat de hulp staan tot het vanzelf gaat.`;
    return {plan: {stoneId, warmId: warmSrc, form: f, n, guessed}, vraag, lines: [begreep, kies, weetNiet]};
  }
  PL._planTree = planTree;

  function showMake(fromRoute){
    if (!fromRoute) route("bedenk");
    app.classList.remove("pl-inround");
    const ans = {};
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:12px">
        <div><h2 class="pl-h2">Bedenk je ronde</h2><p class="pl-lead">Kies wat je wilt oefenen; ik laat zien wat ik ervan maak. Zo ziet een duidelijke vraag aan een AI eruit.</p></div>
        <div class="pl-chat" id="pl-chat" aria-live="polite"></div>
      </div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-make-cancel" type="button">Terug</button></div>`;
    $("pl-make-cancel").addEventListener("click", () => showStart());
    const chat = $("pl-chat");
    const bubble = (who, html) => { chat.insertAdjacentHTML("beforeend", `<div class="pl-bub ${who}">${html}</div>`); chat.lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"}); };
    function step(){
      const r = planTree(ans);
      if (r.ask){
        const S = r.ask;
        bubble("ik", esc(S.q));
        // v0.9: alle stenen in één blok. Wat nog niet aan de beurt is, ziet er rustiger uit (stippelrand), maar je mag het kiezen.
        chat.insertAdjacentHTML("beforeend", `<div class="pl-chips" role="group" aria-label="${esc(S.q)}">${S.opts.map(o => `<button type="button" class="pl-chip${o.later ? " later" : ""}" data-v="${esc(String(o.v))}"><b>${esc(o.t)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</button>`).join("")}</div>`);
        const rows = chat.querySelectorAll(".pl-chips"), row = rows[rows.length - 1];
        row.querySelectorAll(".pl-chip:not([disabled])").forEach(b => b.addEventListener("click", () => { const o = S.opts.find(x => String(x.v) === b.dataset.v); ans[S.key] = o.v; row.remove(); bubble("jij", esc(o.later ? o.t + ". Ik wil het proberen." : o.t)); step(); }));
        row.scrollIntoView({block: "nearest", behavior: "smooth"});
        return;
      }
      const {plan, vraag, lines} = r;
      chat.insertAdjacentHTML("beforeend", `
        <div class="pl-plan">
          <span class="pl-eyebrow">Zo kun je het vragen</span><blockquote class="pl-vraag" id="pl-vraag">${esc(vraag)}</blockquote>
          <span class="pl-eyebrow">Zo denk ik erover</span>
          <dl class="pl-denk" id="pl-denk"><dt>Wat ik begreep</dt><dd>${esc(lines[0])}</dd><dt>Wat ik kies, en waarom</dt><dd>${esc(lines[1])}</dd><dt>Wat ik niet weet</dt><dd>${esc(lines[2])}</dd></dl>
          <p class="pl-note">Een AI gokt als je iets niet zegt. Daarom laat ik zien wat ik aanneem, zodat jij het kunt nakijken.</p>
          <div class="pl-row"><button class="pl-btn big" id="pl-plan-go" type="button">Klopt, start</button><button class="pl-btn quiet" id="pl-plan-edit" type="button">Nee, iets aanpassen</button></div>
        </div>`);
      chat.lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"});
      $("pl-plan-go").addEventListener("click", () => { custom = plan; form = plan.form; log({make: 1, st: plan.stoneId, warm: plan.warmId || "", f: plan.form, n: plan.n, guess: plan.guessed ? 1 : 0}); playRound(false); });
      $("pl-plan-edit").addEventListener("click", () => { log({make_edit: 1}); showMake(); });
      // haak: als Claude bereikbaar is, mag hij alleen de drie denkregels herschrijven; het plan blijft uit code
      PL.ai(`Je bent het rustige oefenmaatje in het Leeratelier. Herschrijf deze drie regels voor een kind, in het Nederlands, korte zinnen, je-vorm, geen emoji, geen lof, geen cijfers of niveaus. Verander de inhoud niet. Geef precies drie regels terug, gescheiden door een regeleinde.\n1. ${lines[0]}\n2. ${lines[1]}\n3. ${lines[2]}`).then(t => {
        if (!t) return; const ls = t.split(/\n+/).map(x => x.replace(/^\d+[.)]\s*/, "").trim()).filter(Boolean); if (ls.length !== 3) return;
        const dds = document.querySelectorAll("#pl-denk dd"); if (dds.length === 3){ ls.forEach((l, i) => { dds[i].textContent = l; }); const d = $("pl-denk"); if (d) d.insertAdjacentHTML("afterend", `<p class="pl-note">Deze drie regels heeft Claude voor je herschreven; wat erin staat, komt uit de training zelf.</p>`); }
      });
    }
    step();
  }

  /* --- v0.13 Te makkelijk / Pittig: twee rustige knoppen, vrijwillig. Pas met een reden doet het iets; geen beloning voor klikken.
         Een reden binnen 0,7 s, of een reden die de laatste drie keer niet klopte, wordt alleen gelogd (ouderscherm). --- */
  function feelHTML(where){
    const chosen = feelUsed ? lastFeel : null;
    return `<div class="pl-feel pl-feel-${where}" id="pl-feel" role="group" aria-label="Te makkelijk of pittig">
      <button type="button" class="pl-feelbtn" data-feel="makkelijk" aria-expanded="false" aria-pressed="${chosen && chosen.kind === "makkelijk"}" ${feelUsed ? "disabled" : ""}>Te makkelijk</button>
      <button type="button" class="pl-feelbtn" data-feel="pittig" aria-expanded="false" aria-pressed="${chosen && chosen.kind === "pittig"}" ${feelUsed ? "disabled" : ""}>Pittig</button>
      <div class="pl-feelpanel" id="pl-feelpanel" aria-live="polite" ${chosen && where === "einde" ? "" : "hidden"}>${chosen && where === "einde" ? `<p class="pl-note">${esc(chosen.reply)}</p>` : ""}</div></div>`;
  }
  let lastFeel = null;
  function wireFeel(){
    const box = $("pl-feel"); if (!box) return;
    const panel = $("pl-feelpanel"), set = PL.feelSet(T);
    box.querySelectorAll("[data-feel]").forEach(b => b.addEventListener("click", () => {
      if (feelUsed) return;
      const kind = b.dataset.feel, open = b.getAttribute("aria-expanded") !== "true";
      box.querySelectorAll("[data-feel]").forEach(x => x.setAttribute("aria-expanded", String(x === b && open)));
      if (!open){ panel.hidden = true; return; }
      feelOpenT = performance.now();
      const q = kind === "pittig" ? "Wat was er pittig?" : "Wat was er te makkelijk?";
      panel.innerHTML = `<p class="pl-note">${q}</p><div class="pl-chips pl-feelchips" role="group" aria-label="${q}">${set[kind].concat([["vraag", "Weet ik niet"]]).map(([v, t]) => `<button type="button" class="pl-chip" data-why="${v}"><b>${esc(t)}</b></button>`).join("")}</div>`;
      panel.hidden = false;
      panel.querySelectorAll("[data-why]").forEach(c => c.addEventListener("click", () => feelChoose(kind, c.dataset.why)));
    }));
  }
  function feelChoose(kind, why){
    if (feelUsed) return;
    const st = feelStone || (lastRound && lastRound.res && lastRound.res.stoneId) || T.stones[data.stage - 1].id;
    const fast = performance.now() - feelOpenT < 700;
    const recent = (data.feelLog || []).filter(x => x.why === why).slice(-3);
    const ignored = why === "vraag" || fast || (recent.length === 3 && recent.every(x => x.pass === false));
    const E = PL.FEEL_EFFECT[why];
    log({feel: kind, why, st, fast: fast ? 1 : undefined, ign: ignored && why !== "vraag" ? 1 : undefined});
    S.react[kind] = (S.react[kind] || 0) + 1;
    if (!ignored && E){
      const s = data.stones[st];
      data.feel = {kind, why, st, d: today(), base: s && s.rts && s.rts.length ? s.rts.slice().sort((a, b) => a - b)[Math.floor(s.rts.length / 2)] : null};
      if (E.adj) data.adjust = {kind: E.adj, left: 1, st, from: today()};
      if (kind === "pittig" && data.fade) delete data.fade[st];
    }
    // eerlijk: alleen beloven wat er ook gebeurt
    const reply = why === "vraag" ? PL.FEEL_REPLY.vraag : ignored ? "Dank je. Ik kijk de volgende ronde gewoon mee." : PL.FEEL_REPLY[why];
    feelUsed = true; lastFeel = {kind, why, reply};
    const box = $("pl-feel"), panel = $("pl-feelpanel");
    if (box){ box.querySelectorAll("[data-feel]").forEach(x => { x.disabled = true; x.setAttribute("aria-pressed", String(x.dataset.feel === kind)); x.setAttribute("aria-expanded", "false"); }); }
    if (panel){ panel.innerHTML = `<p class="pl-note">${esc(reply)}</p>`; panel.hidden = false; if (box && box.classList.contains("pl-feel-ronde")) setTimeout(() => { if ($("pl-feelpanel")) $("pl-feelpanel").hidden = true; }, 3500); }
    save();
  }

  /* --- ronde samenstellen: 2 opwarmers (eerst wat aan herhaling toe is), 4 uit de huidige steen --- */
  function composeRound(){
    const stones = T.stones;
    if (custom && custom.all){   // alle landen langs (v0.10): elk item één keer, in willekeurige volgorde
      return T.allRound.items(ctx).map(it => Object.assign(it, {stone: T.stoneOf(it.key, ctx)}));
    }
    if (custom){
      const st = stones.find(x => x.id === custom.stoneId) || stones[0];
      const items = []; let guard = 0;
      const warmSrc = custom.warmId ? stones.find(x => x.id === custom.warmId) : null;
      if (warmSrc && warmSrc !== st && custom.n >= 6) while (items.length < P.warm && guard++ < 40){ const it = warmSrc.gen(ctx, "warm"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {warm: true, stone: warmSrc.id})); }
      guard = 0;
      while (items.length < custom.n && guard++ < 120){ const it = st.gen(ctx, "main"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: st.id})); }
      return items;
    }
    if (data.hold > 0) data.hold--;                                                            // na een stapje terug: eerst oefenen, nog niet overslaan
    else while (data.stage < stones.length && green(stones[data.stage - 1].id)) data.stage++;   // stille diagnose
    const cur = stones[data.stage - 1];
    const earlier = stones.slice(0, data.stage - 1);
    const items = [];
    // na "pittig: veel lukte niet meteen" één opwarmer meer; na "pittig: het duurde lang" een kortere ronde
    const kind = roundAdj && roundAdj.kind;
    const warmN = kind === "veel" ? P.warm + 1 : kind === "lang" ? 1 : P.warm;
    const size = kind === "lang" ? 4 : P.roundSize;
    const dueKeys = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok");
    for (const k of shuffle(dueKeys).slice(0, warmN)){ const it = T.fromKey(k, ctx); if (it) items.push(Object.assign(it, {warm: true, due: true, stone: T.stoneOf(k, ctx)})); }
    let guard = 0;
    while (items.length < warmN && guard++ < 30){
      const src = earlier.length ? pick(earlier) : cur;
      const it = src.gen(ctx, "warm"); if (!it) break;
      if (!items.some(x => x.key === it.key)) items.push(Object.assign(it, {warm: true, stone: src.id}));
    }
    guard = 0;
    while (items.length < size && guard++ < 60){
      const it = cur.gen(ctx, "main");
      if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: cur.id}));
    }
    return items;
  }

  /* een vraag bewaren en terughalen (open ronde): via fromKey als de training dat kan, anders als kopie */
  const serItem = it => { const o = {k: it.key, st: it.stone, w: it.warm ? 1 : 0, rq: it.requeue ? 1 : 0, du: it.due ? 1 : 0}; let fk = null; try { fk = T.fromKey ? T.fromKey(it.key, ctx) : null; } catch(e){} if (!fk){ try { o.j = JSON.parse(JSON.stringify(it)); } catch(e){} } return o; };
  const deserItem = o => { let it = null; if (o.j) it = Object.assign({}, o.j); else { try { it = T.fromKey ? T.fromKey(o.k, ctx) : null; } catch(e){} } if (!it) return null; return Object.assign(it, {key: o.k, stone: o.st, warm: !!o.w, requeue: !!o.rq, due: !!o.du}); };

  async function playRound(again, resume){
    const run = ++runId; inRound = true; topBtn(true);
    route("ronde", view === "ronde" || view === "klaar" || view === "bedenk");
    app.classList.add("pl-inround");
    if (resume){ form = resume.f || form; custom = resume.c || null; }
    data.lastForm = form;
    // v0.13: wat ze vorige ronde zei (Te makkelijk / Pittig) wordt in deze ronde getoetst
    roundFeel = data.feel || null; feelUsed = false; feelRulesOpened = false; lastFeel = null; feelStone = null;
    // een aanpassing uit een reden van vorige keer geldt voor deze ronde; daarna telt hij af
    roundAdj = data.adjust && data.adjust.left > 0 ? Object.assign({}, data.adjust) : null;
    if (data.adjust){ data.adjust.left--; if (data.adjust.left <= 0) data.adjust = null; }
    const knownBefore = new Set(Object.keys(data.items).filter(k => known(k)));
    // één schermindeling voor een ronde (B1/B2): een werkvlak van hooguit ~600 px in het midden; vraag, hulp en invoer samen in beeld
    screen.innerHTML = `<div class="pl-round" id="pl-round">
      <div class="pl-roundprog" id="pl-roundprog" hidden><span class="pl-bar" aria-hidden="true"><i id="pl-bar-i"></i></span><span class="pl-count" id="pl-count" aria-live="off"></span>${feelHTML("ronde")}</div>
      <div class="pl-ask" aria-live="polite"><span class="pl-ask-lead" id="pl-ask-lead"></span><span class="pl-ask-main" id="pl-ask-main"></span></div>
      <div class="pl-rulebar" id="pl-rulebar" hidden><button type="button" class="pl-rulebtn" id="pl-rule-btn" aria-expanded="false" aria-controls="pl-rules">${esc(T.rulesLabel || "Laat de regel zien")}</button><div class="pl-rules" id="pl-rules" hidden></div></div>
      <div class="pl-fb" id="pl-fb" aria-live="polite"></div>
      <div id="pl-work"></div>
      <div class="pl-sheet" id="pl-sheet" aria-live="polite" hidden></div></div>`;
    ctx.work = $("pl-work");
    wireFeel();
    T.setup(ctx);
    /* "Laat de regel zien" (v0.9.2): de regel van de gevraagde vorm, nooit het antwoord. Hij is er altijd (bij elke training
       met regels). Bij het begin, zolang het model nog vol steunt, en na een tussenstap valt hij op; na drie keer op rij meteen
       goed wordt hij rustig (klein, grijs), maar hij blijft te openen. Bekijken stopt niets. */
    let okRun = 0, ruleItem = null, ruleSeen = false;
    let prevNotFirst = null, stuckNote = "", stuckShown = false, voiceN = 0;   // v0.12: de stem in de ronde (hooguit drie zinnen na "Gelukt")
    okVoice = () => {
      if (!cur_ || !cur_.item || voiceN >= 3) return "";
      const it = cur_.item, first = !cur_.step, lab = PL.stem.label(T, it.key), ms = performance.now() - cur_.t0;
      const sl = {item: lab, genus: PL.stem.genus(T), reg: new Date().getHours() >= 19 ? "rustig" : ""};
      let out = "";
      if (first && it.requeue) out = PL.stem.say("ronde.terugok", sl, data.voice);
      else if (first){
        const bn = PL.stem.sig.breakNow(data, it.key);   // nog niet gelogd: dit is het moment zelf
        const rec_ = data.items[it.key], lastRt = rec_ && rec_.rts && rec_.rts.length ? rec_.rts[rec_.rts.length - 1] : null;
        cur_.doubt = PL.stem.sig.doubt(data.stones[it.stone], ms, PL._cor);
        if (bn) out = PL.stem.say("ronde.doorbraak", Object.assign({eerder: PL.stem.dag(bn.eerder)}, sl), data.voice);
        else if (cur_.doubt) out = PL.stem.say("ronde.twijfel", sl, data.voice);
        else if (lastRt != null && ms < lastRt * 0.75 && lastRt - ms > 800) out = PL.stem.say("ronde.sneller", sl, data.voice);
      }
      if (out) voiceN++;
      return out;
    };
    rulesShow = (prom, fresh) => {
      const bar = $("pl-rulebar"); if (!bar) return;
      const R = ruleItem && T.rules ? T.rules(ruleItem, ctx) : null;
      if (!R){ bar.hidden = true; return; }
      bar.classList.toggle("stil", !prom);
      if (!fresh && !bar.hidden) return;
      $("pl-rules").innerHTML = `<b>${esc(R.title)}</b><ul>${R.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>${R.html || ""}`;   // html: een voorbeeld in beeld, gemaakt door de training
      $("pl-rules").hidden = true; $("pl-rule-btn").setAttribute("aria-expanded", "false"); $("pl-rule-btn").textContent = T.rulesLabel || "Laat de regel zien";
      bar.hidden = false;
    };
    $("pl-rule-btn").addEventListener("click", () => {
      const p = $("pl-rules"), open = p.hidden; p.hidden = !open;
      $("pl-rule-btn").setAttribute("aria-expanded", String(open)); $("pl-rule-btn").textContent = open ? (T.rulesLabel ? "Wegleggen" : "Regel wegleggen") : (T.rulesLabel || "Laat de regel zien");
      if (open && !ruleSeen && ruleItem){ ruleSeen = true; res.rules = (res.rules || 0) + 1; log({rules: 1, k: ruleItem.key, st: ruleItem.stone}); }
    });
    const adjNote = roundAdj ? ({veel: "Ik begin met meer uit wat al lukt.", snel: "Ik doe het rustiger: de hulp blijft langer staan.", lang: "Een kortere ronde nu. Kort is ook trainen.", uitleg: `Bij een tussenstap leg ik het nu uit met ${ctx.modeName(roundAdj.mode) || "een andere manier"}.`})[roundAdj.kind] : "";
    if (again || adjNote) ctx.fb.note([again ? pick(AGAIN) : "", adjNote].filter(Boolean).join(" "));
    const restored = resume ? resume.q.map(deserItem).filter(Boolean) : null;
    const queue = restored && restored.length ? restored : composeRound();
    const offset = restored && restored.length ? resume.i : 0;
    const cur = custom && !custom.all ? (T.stones.find(x => x.id === custom.stoneId) || T.stones[0]) : T.stones[data.stage - 1];
    const res = {t0: new Date().toISOString().slice(0, 19), items: [], first: 0, steps: 0, fluent: 0, stoneId: cur.id, stageAtStart: data.stage, reqN: 0, reqOk: 0, hints: 0, switches: 0, modes: {}, rts: [], reqItems: [], adj: roundAdj && roundAdj.kind};
    const total = queue.length;
    // v0.11 (Goal-Gradient, Parkinson): de lengte van de ronde als balk met "2 van 6" (geen score: alleen waar je bent in de ronde)
    const lang = total > 12;
    $("pl-roundprog").hidden = false;
    let i = offset;
    const keepOpen = () => { data.open = {d: new Date().toISOString(), f: form, c: custom, i, total: i + queue.length, st: cur.id, q: queue.map(serItem)}; };
    while (queue.length){
      const n = i + queue.length;
      $("pl-bar-i").style.width = (100 * i / n) + "%";
      $("pl-count").textContent = `${i + 1} van ${n}`;
      keepOpen();
      const item = queue.shift();
      const t0 = performance.now();
      cur_ = {item, t0, step: false}; PL._cor = 0;
      if (stuckNote && !stuckShown){ stuckShown = true; ctx.fb.note(stuckNote); stuckNote = ""; }
      tried = null; PL._item = item;   // alleen voor tests/ux.py (controle: noemt de tussenstap het antwoord?)
      ruleItem = item; ruleSeen = false; rulesShow(ctx.support(item.stone) === "vol" && okRun < 3, true);
      feelStone = item.stone;
      if (roundFeel && !feelRulesOpened && item.stone === roundFeel.st && (PL.FEEL_EFFECT[roundFeel.why] || {}).rules && $("pl-rules") && $("pl-rules").hidden && !$("pl-rulebar").hidden){ feelRulesOpened = true; $("pl-rule-btn").click(); }
      let r;
      try { r = await T.ask(item, ctx); } catch(e){ if (run !== runId) return; console.error(e); r = {first: false, step: false}; }
      if (run !== runId) return;   // de ronde is verlaten
      const rt = Math.max(0, Math.round(performance.now() - t0 - (r.typingMs || 0)));
      const fluent = updateItem(item.key, r.first, r.step, r.first ? rt : null);
      updateStone(item.stone, r.first, r.first ? rt : null);
      log({k: item.key, st: item.stone, f: form, ok1: r.first ? 1 : 0, step: r.step ? 1 : 0, rt, warm: item.warm ? 1 : 0, sup: r.support || "", ex: r.step ? (r.expl || "standaard") : undefined, sw: r.switches || undefined, rev: r.revealed ? 1 : undefined, cor: PL._cor || undefined});
      if (cur_.doubt && r.first) res.doubt = res.doubt || item;
      // v0.12 vastlopen (S6, S7, S8): na twee vragen op rij niet in één keer, één keer per ronde een rustige zin bij de volgende vraag
      if (!r.first && !item.requeue && prevNotFirst && !stuckShown && queue.length){ const ks = [prevNotFirst, item]; stuckNote = PL.stem.say("ronde.vast", {items: PL.stem.kort([...new Set(ks.map(x => PL.stem.label(T, x.key)))], 0, PL.stem.noun(T), 60), pl: ks[0].key !== ks[1].key, genus: PL.stem.genus(T)}, data.voice); }
      prevNotFirst = !r.first && !item.requeue ? item : null;
      res.items.push({label: item.label, first: r.first, step: r.step, item, rt, requeue: !!item.requeue, expl: r.expl || null});
      okRun = r.first ? okRun + 1 : 0;
      if (r.first && rt != null) res.rts.push(rt);
      if (/\+knop|nudge/.test(r.support || "")) res.hints++;
      res.switches += r.switches || 0;
      // begrip van de uitleg: lukt dezelfde vraag even later in één keer?
      // tussenstap-regel (A2): alleen een tussenstap waarin zij het antwoord zelf vond, telt voor "landt de uitleg"
      if (r.step && !item.requeue && !r.revealed){ const m = r.expl || "standaard"; data.explPending[item.key] = {m, st: item.stone}; res.modes[m] = (res.modes[m] || 0) + 1; }
      if (r.revealed) res.revealed = (res.revealed || 0) + 1;
      if (item.requeue){
        res.reqN++; if (r.first) res.reqOk++;
        const p = data.explPending[item.key];
        if (p){ const st = data.expl[p.st] || (data.expl[p.st] = {}); const s_ = st[p.m] || (st[p.m] = {ok: 0, no: 0, sw: 0}); if (r.first) s_.ok++; else s_.no++; delete data.explPending[item.key]; log({land: r.first ? 1 : 0, st: p.st, ex: p.m, k: item.key}); }
        res.reqItems.push({label: item.label, ok: r.first, expl: p ? p.m : null});
      }
      if (!item.requeue){ if (r.first) res.first++; if (r.step) res.steps++; if (fluent) res.fluent++; }
      if (!custom){ wheelRun = r.first ? wheelRun + 1 : 0; wheelCount = wheelRun >= 3 ? 0 : wheelCount + 1; }
      if (!r.first && !item.requeue && queue.length){ queue.splice(Math.min(P.requeueAfter, queue.length), 0, Object.assign({}, item, {requeue: true})); }
      i++;
      if (queue.length) keepOpen(); else delete data.open;
      $("pl-bar-i").style.width = (100 * i / (i + queue.length)) + "%";
      save();
      // v0.9.2: de oplossing blijft staan tot de volgende vraag: lang genoeg om "Gelukt" en het waarom te lezen
      // (1,2 s + 45 ms per teken, hooguit 7 s); "Verder" gaat meteen door. Het tempo wordt vóór deze pauze gemeten.
      await waitNext(Math.max(T.pause || 900, Math.min(7000, 1200 + (($("pl-fb").innerText || "") + ($("pl-sheet") ? $("pl-sheet").innerText : "")).length * 45)) * (ctx.pace === "rustig" ? 1.4 : 1), run);
      if (run !== runId) return;
      ctx.fb.clear();
    }
    inRound = false; topBtn(false); delete data.open;
    res.knownBefore = knownBefore;
    res.newKnown = [...new Set(res.items.filter(x => x.first && known(x.item.key) && !knownBefore.has(x.item.key)).map(x => x.label))];
    res.dueOk = res.items.filter(x => x.item.due && x.first).map(x => x.label);
    if (T.roundEnd) try { T.roundEnd(ctx, res); } catch(e){}
    // twee verborgen hefbomen: moeilijkheid (stap) en herhaling (spacing, in updateItem)
    let moved = 0;
    if (custom){ /* een eigen ronde telt mee voor beheersing en tempo, maar schuift de trainingsstap niet */ }
    else if (data.cooldown > 0) data.cooldown--;
    else if (res.first >= P.promoteFirst && green(cur.id) && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; }
    else if (res.steps >= P.demoteSteps && data.stage > 1){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; }
    if (!custom && wheelCount >= P.wheel && data.stage > 1 && moved === 0){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; log({wheel: 1, st: cur.id}); }
    if (moved !== 0){ wheelCount = 0; wheelRun = 0; }
    if (moved < 0) data.hold = P.holdRounds;
    // v0.13: de toets van "Te makkelijk" / "Pittig" (vorige ronde). Klopt het vermoeden, dan volgt de afgesproken stap.
    if (roundFeel){
      const E = PL.FEEL_EFFECT[roundFeel.why] || {}, its = res.items.filter(x => !x.requeue && x.item.stone === roundFeel.st);
      if (!its.length){ roundFeel.tries = (roundFeel.tries || 0) + 1; if (roundFeel.tries >= 2) delete data.feel; }   // die steen kwam niet langs: nog één ronde wachten
      else {
        const med = a => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;
        const firstRts = its.filter(x => x.first).map(x => x.rt);
        const pass = E.test === "zonder" ? its.length >= 2 && its.every(x => x.first && x.rt <= P.fluentMs * 1.5)
          : E.test === "flits" ? its.length >= 2 && its.filter(x => !x.first).length <= 1
          : E.test === "tempo" ? (roundFeel.base ? (med(firstRts) != null && med(firstRts) < roundFeel.base * 0.9) : firstRts.length >= its.length / 2)
          : E.test === "eerste" ? !!its[0].first
          : E.test === "gok" ? !its.some(x => !x.first && x.rt < 1500)
          : its.filter(x => !x.first).length <= 1;
        let did = "";
        if (pass && E.pass === "verder" && moved > 0) did = "verder";   // de motor zette de stap al: het vermoeden klopte
        else if (pass && E.pass === "verder" && moved === 0 && !custom && T.stones[data.stage - 1].id === roundFeel.st && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; did = "verder"; }
        else if (pass && E.pass === "flits"){ data.fade = data.fade || {}; data.fade[roundFeel.st] = 1; did = "flits"; }
        const lab = PL.stem.label(T, (its.find(x => pass ? x.first : !x.first) || its[0]).item.key), g = PL.stem.genus(T);
        res.feelMsg = E.kind === "makkelijk" ? (did === "verder" ? PL.stem.say("toets.verder", {item: lab, stap: T.stones[data.stage - 1].name, genus: g}, data.voice)
            : did === "flits" ? PL.stem.say("toets.flits", {item: lab, genus: g}, data.voice) : pass ? "" : PL.stem.say("toets.niet", {item: lab, genus: g}, data.voice))
          : PL.stem.say(pass ? "toets.pittig.ok" : "toets.pittig.nog", {item: lab, genus: g}, data.voice);
        data.feelLog = (data.feelLog || []).concat([{d: today(), kind: E.kind, why: roundFeel.why, st: roundFeel.st, pass, did: did || undefined}]).slice(-50);
        log({feelTest: roundFeel.why, st: roundFeel.st, pass: pass ? 1 : 0, did: did || undefined});
        delete data.feel;
      }
    }
    S.rounds++; data.lastPlayed = new Date().toISOString(); S.first += res.first; S.steps += res.steps; S.items += total;
    if (!S.forms.includes(form)) S.forms.push(form);
    data.forms[form].rounds++;
    const nMain = res.items.filter(x => !x.requeue).length;
    res.fr = nMain ? res.first / nMain : 0;
    log({round: 1, st: cur.id, f: form, first: res.first, steps: res.steps, fluent: res.fluent, moved, again: again ? 1 : 0, make: custom ? 1 : 0, n: nMain, fr: Math.round(res.fr * 100) / 100, reqN: res.reqN, reqOk: res.reqOk, sw: res.switches, adj: res.adj || undefined, rules: res.rules || undefined});
    res.frBefore = data.lastFr;
    if (res.adj && data.lastFr != null) log({adjResult: res.adj, before: data.lastFr, after: Math.round(res.fr * 100) / 100, st: cur.id});
    data.lastFr = Math.round(res.fr * 100) / 100;
    const facts = roundFacts(res, again);
    const base = PL.compose(facts, data.lines);
    data.lines = data.lines.concat(base.used).slice(-12);
    if (facts.has.wise && base.used.some(u => u.startsWith("wise"))) wiseShown = true;
    await save();
    const V = endVoice(res);
    lastRound = {res, moved, again, next: nextLine(res, moved, cur), base: V.high || base.text || `Je deed ${res.items.length} ${T.noun}, tot en met ${res.items[res.items.length - 1].label}.`, voice: V, mustHave: V.mustHave};
    save();
    showEnd(true);
  }

  /* v0.12 einde (S13, S16, S14, S8): één echt hoogtepunt, wat er groeide, wat terugkomt, en na een lange sessie: stoppen mag */
  function endVoice(res){
    const st = PL.stem, V = data.voice, g = st.genus(T), lab = k => st.label(T, k), tIso = today();
    const reg = new Date().getHours() >= 19 ? "rustig" : "";
    const out = {high: "", groei: "", morgen: "", lang: "", tired: false, mustHave: ""};
    const nkKeys = [...new Set(res.items.filter(x => x.first && known(x.item.key) && !res.knownBefore.has(x.item.key)).map(x => x.item.key))];
    for (const x of res.items){
      if (!x.first) continue;
      const bn = st.sig.breakNow(data, x.item.key, res.t0);   // de stand vóór deze ronde
      if (bn){ out.high = st.say("einde.doorbraak", {item: lab(x.item.key), eerder: st.dag(bn.eerder), genus: g, reg}, V); out.mustHave = lab(x.item.key); break; }
    }
    const vanzelf = () => st.say("einde.vanzelf", {items: st.kort(nkKeys.slice(0, 3).map(lab), nkKeys.length, st.noun(T)), pl: nkKeys.length > 1, genus: g, reg}, V);
    if (!out.high && nkKeys.length){ out.high = vanzelf(); out.mustHave = lab(nkKeys[0]); }
    else if (nkKeys.length) out.groei = vanzelf();
    if (!out.high){ const x = res.items.find(x => x.requeue && x.first); if (x){ out.high = st.say("einde.terugok", {item: lab(x.item.key), genus: g, reg}, V); out.mustHave = lab(x.item.key); } }
    if (!out.high && res.doubt){ out.high = st.say("einde.twijfel", {item: lab(res.doubt.key), genus: g, reg}, V); out.mustHave = lab(res.doubt.key); }
    if (!out.high){ const fs = res.items.filter(x => x.first); const x = fs[fs.length - 1]; if (x){ out.high = st.say("einde.zelf", {item: lab(x.item.key), genus: g, reg}, V); out.mustHave = lab(x.item.key); } }
    const today_ = realSessions(data).filter(s => s.d === tIso).reduce((a, s) => a + (s.rounds || 0), 0);
    if (!out.groei) out.groei = st.say("einde.tuin", {ronde: st.rang(Math.max(1, today_)), training: T.title, reg}, V);
    const back = [...new Set(res.items.filter(x => !x.first && !res.items.some(y => y.requeue && y.first && y.item.key === x.item.key)).map(x => x.item.key))];
    if (back.length) out.morgen = st.say("einde.morgen", {items: st.kort(back.slice(0, 3).map(lab), back.length, st.noun(T)), pl: back.length > 1, dagT: st.dagT(dayNum(tIso) + 1), genus: g, reg}, V);
    const tired = st.sig.tired(S, res, P.sessionMin);
    if (tired.lang){ out.tired = true; out.lang = st.say("einde.lang", {minuten: st.aantal(tired.min, "minuten"), reg}, V); }
    return out;
  }
  /* wat de volgende ronde wordt en waarom: dezelfde regels als composeRound, zonder iets te veranderen.
     "Nog een keer" is de knop; deze regel laat zien dat de volgende ronde uit haar resultaten volgt. */
  function nextLine(res, moved, cur){
    if (custom && custom.all) return `Weer alle ${T.noun} langs, in een nieuwe volgorde.`;
    if (custom) return `Weer jouw keuze: ${nameOf(custom.stoneId)}, met nieuwe ${T.noun}.`;
    let st = data.stage; if (!(data.hold > 0)) while (st < T.stones.length && green(T.stones[st - 1].id)) st++;
    const next = T.stones[st - 1], s_ = stone(cur.id);
    if (moved > 0) return `Bijna alles kwam meteen en ${nameOf(cur.id)} gaat nu vanzelf. Daarom gaat de volgende ronde een stapje verder: ${next.name}.`;
    if (moved < 0) return `Deze ronde vroeg veel tussenstappen. De volgende gaat eerst terug naar ${next.name}; daarna weer verder.`;
    if (next.id !== cur.id) return `${cap(nameOf(cur.id))} gaat al vanzelf. De volgende ronde gaat verder met ${next.name}.`;
    if (green(cur.id)) return `${cap(nameOf(cur.id))} gaat vanzelf. De volgende ronde houdt het vast, met nieuwe ${T.noun}.`;
    if (s_.power) return `${cap(nameOf(cur.id))} lukt bijna altijd meteen. De volgende ronde blijft hier, tot het ook vanzelf gaat.`;
    return `De volgende ronde blijft bij ${nameOf(cur.id)}, met nieuwe ${T.noun}${res.steps ? ". Wat vandaag een tussenstap nodig had, komt terug" : ""}.`;
  }
  /* waarnemingen van één ronde, voor de stem (PL.compose) en voor de AI-haak */
  function roundFacts(res, again){
    const names = m => ctx.modeName(m);
    const reqOk = res.reqItems.filter(x => x.ok), reqNo = res.reqItems.filter(x => !x.ok);
    const help = reqOk.find(x => x.expl && names(x.expl));
    const stepItem = res.items.find(x => x.step && !x.requeue);
    const last = res.items[res.items.length - 1];
    const f = {noun: T.noun, n: res.items.length, last: last ? last.label : "", fl: res.fluent, r: S.rounds, again: !!again, adj: res.adj,
      L: (help || reqOk[0] || reqNo[0] || stepItem || {}).label || "", M: help ? names(help.expl) : roundAdj && roundAdj.mode ? names(roundAdj.mode) : "",
      Mpl: !!(help && T.explainPlural && T.explainPlural[help.expl]),
      K: lst(res.newKnown.slice(0, 2)), k: Math.min(2, res.newKnown.length), D: res.dueOk[0] || "", has: {}};
    f.has.explHelp = !!help;
    f.has.reqOk = !!reqOk.length;
    f.has.reqStill = !reqOk.length && !!reqNo.length;
    if (f.has.reqStill) f.L = reqNo[0].label;
    f.has.step = !reqOk.length && !reqNo.length && !!stepItem;
    f.has.newKnown = res.newKnown.length > 0;
    f.has.switch = res.switches > 0;
    f.has.dueOk = res.dueOk.length > 0;
    f.has.adjOk = !!res.adj && (res.adj === "lang" || (res.frBefore != null && res.fr > res.frBefore)) && (res.adj !== "uitleg" || !!f.M);
    f.has.fluent = res.fluent >= 4 && !res.steps;
    f.has.wise = !wiseShown && res.steps >= 2;
    f.has.allSelf = !res.steps && res.items.every(x => x.first);
    f.has.roundN = S.rounds >= 3;
    return f;
  }
  /* meting van de ronde voor de reden-vraag (alleen intern; Natalia ziet geen cijfers) */
  function roundMeasure(res){
    const modes = T.explainModes || null;
    const used = Object.keys(res.modes).sort((x, y) => res.modes[y] - res.modes[x])[0] || null;

/* ---------- tabel per steen (A6): alleen meten, de drempels in P blijven staan ---------- */
PL.stoneTable = function(d, T){
  const ev = (d.events || []).filter(e => e.k != null && e.ok1 != null && e.land == null);
  return T.stones.map(s => {
    const es = ev.filter(e => e.st === s.id), ok = es.filter(e => e.ok1), rts = ok.map(e => e.rt).filter(x => x != null);
    const st = (d.stones || {})[s.id] || {};
    return {id: s.id, name: s.name, n: es.length, ok1: ok.length, fluent: rts.filter(x => x <= P.fluentMs).length, med: median(rts),
      state: st.power ? "beheerst" : st.n ? "oefent" : "nog niet gezien", speed: st.speed ? "vlot" : st.power ? "nog niet vlot" : "",
      stuck: !!st.power && !st.speed};
  });
};

PL.weekly = function(all, trainingsList){

  for (const id of Object.keys(all)){

    const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const weeks = {};
    for (const s of realSessions(d)){
      const w = weeks[weekKey(s.d)] || (weeks[weekKey(s.d)] = {week: weekKey(s.d), training: name, sessions: 0, min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, fluent: 0, leuk: 0, gewoon: 0, pittig: 0, rules: 0, rts: []});
      w.sessions++; w.min += s.min || 0; w.rounds += s.rounds || 0; w.again += s.again || 0; w.steps += s.steps || 0; w.first += s.first || 0; w.items += s.items || 0;
      w.leuk += (s.react && s.react.leuk) || 0; w.makkelijk = (w.makkelijk || 0) + ((s.react && s.react.makkelijk) || 0); w.pittig += (s.react && s.react.pittig) || 0; w.gewoon += (s.react && s.react.gewoon) || 0;
    }
    for (const e of d.events || []){
      if (e.react){ const key = e.react + (e.why ? " / " + e.why : ""); const r = reacts[key] || (reacts[key] = {n: 0, fr: [], again: 0, labels: {}}); r.n++; if (e.fr != null) r.fr.push(e.fr); if (e.again) r.again++; const c = PL.classifyReact(e); r.labels[c] = (r.labels[c] || 0) + 1; continue; }
      if (e.adjResult){ adjs.push(`${name}: na "${e.adjResult}" van ${Math.round(e.before * 100)}% naar ${Math.round(e.after * 100)}% in één keer`); continue; }
      if (e.rules){ const w = weeks[weekKey(e.t.slice(0, 10))]; if (w) w.rules++; continue; }
      if (e.k == null || e.round || e.land != null) continue;
      const w = weeks[weekKey(e.t.slice(0, 10))]; if (!w) continue;
      if (e.ok1 && e.rt != null){ w.rts.push(e.rt); if (e.rt <= P.fluentMs) w.fluent++; }
      const fk = name + " / vorm " + e.f; const f = byForm[fk] || (byForm[fk] = {n: 0, ok: 0, rts: []});
      f.n++; if (e.ok1){ f.ok++; f.rts.push(e.rt); }
    }
    for (const w of Object.values(weeks)){ w.medianRt = median(w.rts); delete w.rts; rows.push(w); }
    for (const [k, r] of Object.entries(d.items || {})) if (r.st > 0) hard[name + ": " + (T && T.keyLabel ? T.keyLabel(k) : k)] = r;
    if (T && T.stones) for (const r of PL.stoneTable(d, T)) if (r.n) stoneLines.push(`${name}, ${r.name}: ${r.n} vragen, ${r.ok1} in één keer, ${r.fluent} vlot, mediaan ${r.med != null ? (r.med / 1000).toFixed(1) : "-"} s${r.stuck ? " (beheerst, haalt vlot nog niet)" : ""}`);
    for (const [stId, modes] of Object.entries(d.expl || {})){
      const stName = T && T.stones ? ((T.stones.find(x => x.id === stId) || {}).name || stId) : stId;
      for (const [m, v] of Object.entries(modes)){ if (m === "avoid" || !v || typeof v !== "object") continue; const n = (v.ok || 0) + (v.no || 0); if (!n) continue;
        expl.push(`${name}, ${stName}, ${(T && T.explainNames && T.explainNames[m]) || (m === "standaard" ? "de tussenstap" : m)}: ${n}x uitgelegd, ${v.ok || 0}x daarna in één keer${v.sw ? `, ${v.sw}x "anders uitleggen"` : ""}${modes.avoid === m ? " (nu even overgeslagen)" : ""}`); }
    }
  }
  rows.sort((a, b) => b.week.localeCompare(a.week) || a.training.localeCompare(b.training));
  const formsText = Object.entries(byForm).map(([k, f]) => `${k}: ${f.n} vragen, ${Math.round(100 * f.ok / Math.max(1, f.n))}% in één keer, mediaan ${f.rts.length ? (median(f.rts) / 1000).toFixed(1) : "-"} s`).join("; ");
  const hardText = Object.entries(hard).sort((a, b) => b[1].st - a[1].st).slice(0, 8).map(([k, r]) => `${k} (${r.st}x tussenstap, ${r.ok1}x in één keer)`).join("; ");
  const reactText = Object.entries(reacts).sort((a, b) => b[1].n - a[1].n).map(([k, r]) => `${k}: ${r.n}x${r.fr.length ? `, in die rondes gemiddeld ${Math.round(100 * r.fr.reduce((a, b) => a + b, 0) / r.fr.length)}% in één keer` : ""}${r.again ? `, ${r.again}x daarna nog een keer` : ""} (${Object.entries(r.labels).map(([l, n]) => n > 1 ? `${l} ${n}x` : l).join("; ")})`).join("\n");
  const feelLines = [];
  for (const id of Object.keys(all)){ const d = all[id]; if (!d) continue; const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const set = T ? PL.feelSet(T) : null, txt = (k, w) => { const o = set && set[k] && set[k].find(x => x[0] === w); return o ? o[1] : w === "vraag" ? "Weet ik niet" : w; };
    for (const e of (d.events || []).filter(e => e.feel || e.feelTest).slice(-30)){
      if (e.feel) feelLines.push(`${(e.t || "").slice(0, 10)} ${name}: ${e.feel === "makkelijk" ? "Te makkelijk" : "Pittig"}, "${txt(e.feel, e.why)}"${e.fast ? " (snelle klik, niets gedaan)" : e.ign ? " (klopte drie keer niet, niets gedaan)" : ""}`);
      else feelLines.push(`${(e.t || "").slice(0, 10)} ${name}: toets "${e.feelTest}" ${e.pass ? "klopte" : "klopte niet"}${e.did === "verder" ? ", een stap verder" : e.did === "flits" ? ", model kort" : ""}`);
    } }
  return {feelText: feelLines.slice(-20).join("\n"), rows, formsText, hardText, byForm, reactText, explText: expl.join("\n"), stoneText: stoneLines.join("\n"), adjText: adjs.slice(-8).join("; ")};
};
PL.weeklyText = function(w){
  return [`Leeratelier weekoverzicht (${today()})`,
    ...w.rows.map(r => `Week van ${r.week}, ${r.training}: ${r.sessions} sessies, ${r.min} min, ${r.rounds} rondes, ${r.again}x nog een keer, ${r.first}/${r.items} in één keer, ${r.fluent} vlot (binnen 3 s), ${r.steps} tussenstappen, ${r.rules || 0}x de regel bekeken, mediaan ${r.medianRt != null ? (r.medianRt / 1000).toFixed(1) : "-"} s, te makkelijk ${r.makkelijk || 0} / pittig ${r.pittig}`),
    `Per vorm: ${w.formsText || "nog niets"}`,

    `Aanpassingen na een reden: ${w.adjText || "geen"}`,
    `Per steen (tempo-drempel ${P.fluentMs / 1000} s, alleen gemeten):\n${w.stoneText || "nog niets"}`,
    `Regels voor de lezer: alleen patronen over meerdere weken benoemen; geen niveau, groep, cijfer of leeftijd; technische problemen apart van observaties.`].join("\n");
};

const dn = iso => Math.floor(Date.parse(iso.slice(0, 10) + "T12:00:00Z") / 864e5);
const todayIso = () => new Date().toISOString().slice(0, 10);   // dezelfde dag als de kern (today())
S.nu = () => S._nu || todayIso();          // tests zetten S._nu vast
const vandaag = () => dn(S.nu());
const weekdag = n => DAG[new Date(n * 864e5).getUTCDay()];
/* een dag in het verleden, als woord: alleen uit echte data (S18) */
S.dag = iso => {
  if (!iso) return ""; const n = dn(iso), ago = vandaag() - n;
  if (ago <= 0) return "vandaag"; if (ago === 1) return "gisteren"; if (ago === 2) return "eergisteren";
  if (ago < 7) return weekdag(n); if (ago < 14) return "vorige week";
  const m = new Date(n * 864e5).getUTCMonth(); return ago < 60 ? "in " + MAAND[m] : "een tijd terug";
};
/* een dag in de toekomst (herhaalrooster) */
S.dagT = n => { const d = n - vandaag(); if (d <= 0) return "vandaag"; if (d === 1) return "morgen"; if (d === 2) return "overmorgen"; if (d < 7) return weekdag(n); if (d < 14) return "volgende week"; return "over een paar weken"; };

/* verboden woorden (S4, S5, S7, S8, G3) */
S.VERBODEN = /\b(super\w*|geweldig\w*|perfect\w*|fantastisch\w*|ongelooflijk\w*|slim\w*|knap\w*|fout\w*|moet|moeten|hoort|horen|streak\w*|verloren|gemist|makkelijk\w*|gemakkelijk\w*|moeilijk\w*|niveau\w*|groep\w*)\b|al \S+ dagen niet/i;

/* ---------- zinnen ---------- */
S.mem = {recent: {}, lines: []};             // home en tuin: philearn-stem; een training: data.voice
const MAX = 12;
const slotsOf = t => [...t.matchAll(/\{([A-Za-z]+)\}/g)].map(m => m[1].toLowerCase()).filter(k => !["hij", "hem"].includes(k));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function fill(t, sl){
  const pl = !!sl.pl, het = sl.genus === "het";
  t = t.replace(/^(pl|ev):\s*/, "");
  // eerst de vaste tekst: werkwoorden, voornaamwoorden, dagwoord-voorzetsels en hoofdletters aan het begin van een zin.
  // Pas daarna de slots: een vraagteken ín een item ("5 = 2 + ?") maakt dan geen nieuwe zin (v0.12.1).
  const vals = [];
  let s = t.replace(/\{v:([^|}]*)\|([^}]*)\}/g, (_, a, b) => pl ? b : a)
    .replace(/\{(hij|Hij|hem|Hem)\}/g, (_, w) => { const v = pl ? "ze" : het ? "het" : w.toLowerCase(); return w[0] === "H" ? cap(v) : v; })
    .replace(/\{([A-Za-z]+)\}/g, (_, k) => { const v = String(sl[k.toLowerCase()]); vals.push(k[0] === k[0].toUpperCase() ? cap(v) : v); return "\u0001" + (vals.length - 1) + "\u0002"; });
  s = s.replace(/(^|[.!?]\s+)([a-zàáäéëèïíóöúü])/g, (m, a, b) => a + b.toUpperCase());
  s = s.replace(/\u0001(\d+)\u0002/g, (_, i) => vals[+i]);
  // dagwoorden passend maken bij het voorzetsel ervoor ("sinds in september" → "sinds september")
  s = s.replace(/\bsinds in /g, "sinds ").replace(/\bsinds een tijd terug\b/g, "al een tijd").replace(/\bvan in /g, "uit ").replace(/\btot over een paar weken\b/g, "over een paar weken").replace(/\bop vandaag\b/g, "vandaag");
  return s.replace(/^([a-zàáäéëèïíóöúü])/, m => m.toUpperCase()).replace(/\s+/g, " ").trim();
}
/* register (S10): eerste ronde van de dag kort en licht; avond rustig (geen uitroepteken); na een doorbraak mag het energieker */
function past(v, reg){ if (!reg) return true; if (reg === "kort") return v.t.length <= 64; if (reg === "rustig") return !v.t.includes("!"); return true; }
S.say = function(fam, slots, mem){
  const F = PL.STEM_FAM[fam]; if (!F) return "";
  mem = mem || S.mem; mem.recent = mem.recent || {}; mem.lines = mem.lines || [];
  const sl = {}; for (const [k, v] of Object.entries(slots || {})) sl[k.toLowerCase()] = v;
  // "pl:" = alleen bij meervoud, "ev:" = alleen bij enkelvoud (v0.12.1: geen "de één zin die vanzelf gaan")
  const ok = F.v.map((t, i) => ({t, id: fam + "#" + (i + 1)})).filter(v => slotsOf(v.t).every(k => sl[k] != null && sl[k] !== "") && !(/^pl:/.test(v.t) && !sl.pl) && !(/^ev:/.test(v.t) && sl.pl));
  if (!ok.length) return "";
  const rec = mem.recent[fam] || [];
  let cand = ok.filter(v => !rec.includes(v.id));
  if (!cand.length){ const age = v => rec.indexOf(v.id); cand = ok.slice().sort((a, b) => age(a) - age(b)).slice(0, 1); }   // alles kort geleden gebruikt: de oudste
  const reg = cand.filter(v => past(v, sl.reg)); if (reg.length) cand = reg;
  // geen exacte herhaling van een eerder getoonde zin
  const fresh = cand.filter(v => !mem.lines.includes(fill(v.t, sl))); if (fresh.length) cand = fresh;
  const v = cand[Math.floor(rnd() * cand.length)];
  const out = fill(v.t, sl);
  mem.recent[fam] = rec.filter(x => x !== v.id).concat([v.id]).slice(-MAX);
  mem.lines = mem.lines.concat([out]).slice(-60);
  S.last = {id: v.id, fam, text: out};
  if (S.log) S.log.push({id: v.id, fam, text: out, feiten: slotsOf(v.t).map(k => sl[k])});
  return out;
};
S.loadMem = async store => { try { const m = await store.load("philearn-stem"); if (m && m.recent) S.mem = m; } catch(e){} };
S.saveMem = store => { try { return store.save("philearn-stem", S.mem); } catch(e){} };

/* ---------- labels: het item zonder antwoord ---------- */
const vast = s => String(s).replace(/ ([×:+=−\-?]) /g, "\u00a0$1\u00a0").replace(/ ([=?])$/g, "\u00a0$1");   // een som breekt niet over twee regels
S.label = (T, k) => vast(labelRaw(T, k));
const labelRaw = (T, k) => {
  try { if (T.voiceLabel) return T.voiceLabel(k); } catch(e){}
  try { const it = T.fromKey && T.fromKey(k); if (it && it.label && (T.id === "rekenmuur" || T.id === "tafels")) return it.label; } catch(e){}
  try { if (T.keyLabel) return T.keyLabel(k); } catch(e){}
  return k;
};
S.genus = T => HET.has(S.noun(T)) ? "het" : "de";

/* ---------- signalen ---------- */
const sig = S.sig = {};
const known = r => !!r && r.fl >= 2 && r.last === "ok";
const real = d => ((d && d.sessions) || []).filter(s => (s.rounds || 0) > 0);
const itemEvents = d => ((d && d.events) || []).filter(e => e.k != null && e.ok1 != null && e.land == null && !e.round);
const day = e => (e.t || "").slice(0, 10);
const isHelp = e => /^vol/.test(e.sup || "") || /\+knop/.test(e.sup || "");
sig.lastSession = d => { const ss = real(d); return ss.length ? ss[ss.length - 1] : null; };
sig.lastItem = d => { const ev = itemEvents(d); return ev.length ? ev[ev.length - 1] : null; };
sig.roundsOn = (d, iso) => real(d).filter(s => s.d === iso).reduce((a, s) => a + (s.rounds || 0), 0);
sig.roundsWeek = d => { const t = vandaag(); return real(d).filter(s => t - dn(s.d) < 7).reduce((a, s) => a + (s.rounds || 0), 0); };
sig.daysSince = d => { const s = sig.lastSession(d); return s ? vandaag() - dn(s.d) : null; };
/* doorbraak: een item dat op eerdere dagen minstens twee keer niet in één keer lukte, nu (op de laatste dag) in één keer */
sig.breakthroughs = (d, sinceIso) => {
  const by = {}; for (const e of itemEvents(d)) (by[e.k] = by[e.k] || []).push(e);
  const out = [];
  for (const [k, es] of Object.entries(by)){
    const last = es[es.length - 1]; if (!last.ok1) continue;
    const fi = es.map(e => !e.ok1).lastIndexOf(true); if (fi < 0) continue;
    const first = es[fi + 1];                                   // de eerste keer in één keer na de laatste tussenstap
    const before = es.slice(0, fi + 1).filter(e => !e.ok1 && day(e) < day(first));
    if (before.length < 2) continue;
    if (sinceIso && day(first) < sinceIso) continue;
    out.push({k, dag: day(first), eerder: day(before[before.length - 1]), t: first.t});
  }
  return out.sort((a, b) => (b.t || "").localeCompare(a.t || ""));
};
/* is dit (nu, of sinds tijdstip t0) de doorbraak? Eerdere dagen ≥ 2× niet in één keer, en daarna nog nooit in één keer */
sig.breakNow = (d, k, sinceT) => {
  const es = itemEvents(d).filter(e => e.k === k), before = sinceT ? es.filter(e => (e.t || "") < sinceT) : es;
  const fi = before.map(e => !e.ok1).lastIndexOf(true); if (fi < 0) return null;
  if (before.slice(fi + 1).some(e => e.ok1)) return null;
  const fails = before.slice(0, fi + 1).filter(e => !e.ok1 && day(e) < S.nu());
  return fails.length >= 2 ? {eerder: day(fails[fails.length - 1])} : null;
};
/* nieuwste item dat vanzelf gaat (d = de laatste dag dat het lukte) */
sig.newestKnown = d => { const it = Object.entries((d && d.items) || {}).filter(([, r]) => known(r) && r.d).sort((a, b) => (b[1].d || "").localeCompare(a[1].d || "")); return it.length ? {k: it[0][0], d: it[0][1].d} : null; };
sig.knownCount = d => Object.values((d && d.items) || {}).filter(known).length;
/* herhaalrooster: wat wanneer terugkomt (uit due) en wat rust */
sig.schedule = d => {
  const t = vandaag(), groups = {}, rest = [];
  for (const [k, r] of Object.entries((d && d.items) || {})){
    if (!r || r.due == null) continue;
    if (r.due - t > 6) rest.push({k, due: r.due}); else (groups[Math.max(r.due, t)] = groups[Math.max(r.due, t)] || []).push(k);
  }
  return {soon: Object.entries(groups).map(([n, ks]) => ({n: +n, ks})).sort((a, b) => a.n - b.n), rest: rest.sort((a, b) => a.due - b.due)};
};
sig.dueToday = d => { const t = vandaag(); return Object.entries((d && d.items) || {}).filter(([, r]) => r && r.due != null && r.due <= t && r.last === "ok").map(([k]) => k); };
/* minder hulp: eerder met het model (vol) of de knop, op een latere dag in één keer zonder */
sig.helpDrop = d => {
  const by = {}; for (const e of itemEvents(d)) (by[e.k] = by[e.k] || []).push(e);
  const out = [];
  for (const [k, es] of Object.entries(by)){
    const last = es[es.length - 1]; if (!last.ok1 || isHelp(last)) continue;
    const h = es.filter(e => day(e) < day(last) && isHelp(e)); if (!h.length) continue;
    out.push({k, dag: day(last), eerder: day(h[h.length - 1]), t: last.t});
  }
  return out.sort((a, b) => (b.t || "").localeCompare(a.t || ""));
};
/* vlotter: hetzelfde item in één keer op twee dagen, nu duidelijk sneller (≥ 25% en ≥ 0,8 s) */
sig.faster = d => {
  const by = {}; for (const e of itemEvents(d)) if (e.ok1 && e.rt != null) (by[e.k] = by[e.k] || []).push(e);
  const out = [];
  for (const [k, es] of Object.entries(by)){
    const last = es[es.length - 1], prev = es.filter(e => day(e) < day(last)); if (!prev.length) continue;
    const p = prev[prev.length - 1]; if (last.rt < p.rt * 0.75 && p.rt - last.rt > 800) out.push({k, dag: day(last), eerder: day(p), t: last.t});
  }
  return out.sort((a, b) => (b.t || "").localeCompare(a.t || ""));
};
/* uitleg: landde hij (dezelfde vraag even later in één keer)? */
sig.uitleg = d => ((d && d.events) || []).filter(e => e.land != null && e.k).map(e => ({k: e.k, mode: e.ex, ok: !!e.land, t: e.t})).reverse();
/* vastlopen in een ronde: de laatste twee vragen niet in één keer */
sig.stuck = res => { const it = res.items.filter(x => !x.requeue); const l = it.slice(-2); return l.length === 2 && l.every(x => !x.first) ? l.map(x => x.item.key) : null; };
/* vermoeidheid: sessie langer dan een kwartier, of binnen de ronde steeds trager (laatste drie ≥ 1,4 × eerste drie) */
sig.tired = (S0, res, sessionMin) => { const min = (Date.now() - S0.t0) / 60000; const r = res.rts || []; const med = a => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null; const slow = r.length >= 6 && med(r.slice(-3)) >= 1.4 * med(r.slice(0, 3)); return {min: Math.round(min), lang: min >= sessionMin, slow}; };
/* twijfel bij één vraag: veel langer dan haar eigen mediaan bij die steen, of twee keer of vaker gewist */
sig.doubt = (stone, ms, cor) => { const r = (stone && stone.rts) || []; if (cor >= 2) return true; if (r.length < 3) return false; const m = r.slice().sort((a, b) => a - b)[Math.floor(r.length / 2)]; return ms > Math.max(2 * m, m + 4000); };
/* weekoverzicht over alle trainingen: welke kreeg de meeste rondes (alleen als er ≥ 2 zijn) */
sig.weekTop = (states, trainings) => { let best = null; for (const T of trainings){ const n = sig.roundsWeek(states[T.id]); if (n >= 2 && (!best || n > best.n)) best = {T, n}; } return best; };
})();

/* De tuin v0.9 — groei zonder getal.
   Elke training heeft een tuintje; wat erin groeit hangt aan wat ze trainde (afgeronde rondes, wat vanzelf gaat, wat na dagen
   nog vanzelf gaat, stenen die groen zijn). Rekenen = planten en bomen, taal = bloemen, topografie = insecten. De rups die een
   vlinder wordt, hoort bij alles samen. Hoe meer dagen ze trainde, hoe meer er beweegt en hoe meer van het landschap je ziet.
   Het licht volgt de echte tijd van de dag. Niets krimpt (hoogste stand wordt bewaard), en er staat geen tekst in de tuin.
   Renders staan in tuin/lagen/ (gemaakt door de ouder, uitgesneden met tuin/maak-lagen.py). Ontbreekt een render, dan neemt de
   tuin de dichtstbijzijnde stap en tekent hij in code een eenvoudige stand-in (zie kennis/03, sectie De tuin). */
(function(){
"use strict";
const PL = window.PL;
const FILES = new Set(window.__tuinFiles || []);
const BASE = "tuin/";
const img = (f, cls, style) => `<img class="${cls || ""}" src="${BASE + f}" alt="" draggable="false" decoding="async" ${style ? `style="${style}"` : ""}>`;
function rng(seed){ let s = 2166136261; for (const c of String(seed)) s = Math.imul(s ^ c.charCodeAt(0), 16777619) >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// v0.14: een versie kan eigen perken hebben (groep3: rekenen, lezen, schrijven) via space.tuin {cat, order, kind}
const TZ = (PL.space && PL.space.tuin) || {};
const CAT = TZ.cat || {rekenmuur: "planten", tafels: "planten", "spelling-een-of-twee": "bloemen", werkwoorden: "bloemen", zinnen: "bloemen", europa: "insecten"};
const ORDER = TZ.order || ["tafels", "europa", "rekenmuur", "spelling-een-of-twee", "werkwoorden", "zinnen"];   // achter: 3, voor: 3
const KIND = TZ.kind || {"spelling-een-of-twee": "a", werkwoorden: "b", zinnen: "c"};
// stand-in voor bloemsoorten zonder eigen render: de lila soort in een andere tint (amber voor b, roze voor c)
// (tinten werkte niet: het blad kleurt mee. Tot er renders voor b en c zijn, groeit overal de lila soort.)
const KIND_FILTER = {};

/* ---------- de maat van een training: alleen uit de stand ---------- */
PL.tuinMaat = function(d){
  const ss = PL.realSessions(d), items = Object.values((d && d.items) || {}), stones = Object.values((d && d.stones) || {});
  return {
    e: ss.reduce((a, s) => a + (s.rounds || 0), 0),                                   // moeite: afgeronde rondes
    k: items.filter(r => r && r.fl >= 2 && r.last === "ok").length,                    // gaat vanzelf
    r: items.filter(r => r && r.iv >= 2 && r.last === "ok").length,                    // na dagen nog vanzelf (herhaalschema)
    g: stones.filter(s => s && s.power && s.speed).length,                             // stenen die groen zijn
    days: [...new Set(ss.map(s => s.d))]
  };
};

/* ---------- wat er groeit: een lijst elementen per tuintje en voor alles samen (puur, testbaar) ---------- */
const PLANT = ["plant-0-kiem", "plant-1-spruit", "plant-2-zaailing", "plant-3-struik", "plant-4-boompje", "plant-5-boom"];
const PLANT_W = [7, 14, 20, 27, 34, 44];                       // breedte in % van het bedje
const SLOTS = [[50, 56], [30, 50], [70, 50], [40, 36], [60, 34], [24, 66], [76, 66]];
const FLOWER = ["", "1-knop", "2-dicht", "3-open", "4-groot"];
const FLOWER_W = [0, 7, 9, 13, 17];
const INSECTS = [["lieveheersbeestje", "k", 1], ["mier", "k", 5], ["bij", "k", 10], ["lieveheersbeestje", "k", 16], ["sprinkhaan", "k", 22], ["libel", "r", 3], ["bij", "r", 8]];
function best(prefixes, stage){ for (let s = stage; s >= 0; s--){ const f = prefixes[s]; if (f && FILES.has(f + ".webp")) return {file: f + ".webp", s}; } return null; }

PL.tuinPlan = function(maat){
  // maat: {id: {e,k,r,g,days}} (al met de hoogste stand)
  const beds = [], all = {e: 0, k: 0, r: 0, g: 0}, days = new Set();
  for (const id of ORDER){
    const m = maat[id]; if (!m) continue;
    for (const x of ["e", "k", "r", "g"]) all[x] += m[x] || 0; (m.days || []).forEach(d => days.add(d));
    if (!m.e) continue;                                                       // een tuintje verschijnt na de eerste afgeronde ronde
    const cat = CAT[id], els = [], R = rng(id);
    if (cat === "planten"){
      const V = m.e + 2 * m.k + 4 * m.r + 6 * m.g, start = [1, 10, 24, 45, 75, 110, 150];
      start.forEach((s0, i) => { if (V < s0) return; const stage = Math.min(5, Math.floor((V - s0) / 8)); els.push({id: `${id}-p${i}`, t: "plant", stage, x: SLOTS[i][0] + (R() * 6 - 3), y: SLOTS[i][1] + (R() * 4 - 2)}); });
    } else if (cat === "bloemen"){
      const n = Math.min(7, m.k > 0 ? 1 + Math.floor(m.k / 4) : 1);
      for (let i = 0; i < n; i++){
        let stage = m.k > 0 ? Math.max(1, Math.min(3, 1 + Math.floor((m.k - i * 4) / 5))) : 1;
        if (m.r >= (i + 1) * 2) stage = 4;
        els.push({id: `${id}-b${i}`, t: "bloem", kind: KIND[id], stage, x: SLOTS[i][0] + (R() * 6 - 3), y: SLOTS[i][1] + (R() * 4 - 2)});
      }
      if (m.r >= 5) els.push({id: `${id}-plant`, t: "bloemplant", kind: KIND[id], x: 50, y: 46});
    } else {
      INSECTS.forEach(([kind, key, need], i) => { const have = key === "k" ? Math.max(m.k, i === 0 ? 1 : 0) : m.r; if (have >= need) els.push({id: `${id}-i${i}`, t: "insect", kind, x: 22 + R() * 56, y: 34 + R() * 34, n: i}); });
    }
    beds.push({id, cat, els});
  }
  const G = all.e + all.k + 2 * all.r + 3 * all.g, D = days.size;
  const groei = G >= 160 ? "vlinder" : G >= 100 ? "cocon" : G >= 35 ? "rups" : G >= 6 ? "rupsje" : G >= 1 ? "eitje" : "";
  const vlinders = G < 160 ? 0 : 1 + [260, 400, 580, 800].filter(x => G >= x).length;
  return {beds, groei, vlinders, G, D, tier: D >= 10 ? 3 : D >= 5 ? 2 : D >= 2 ? 1 : 0, gras: Math.min(1, all.e / 40), nevel: Math.max(0, .6 - D * .045)};
};

/* ---------- stand-ins in code (tot er een render is) ---------- */
const SVG = {

/* elk element: [html, breedte in % van het bedje]. Ontbreekt de render voor deze stap, dan de dichtstbijzijnde lagere, iets groter. */
function plantHTML(e){
  const b = best(PLANT, e.stage); const w = PLANT_W[e.stage];
  if (b) return [img(b.file, "gd-sprite gd-sway"), w * (b.s < e.stage ? .8 + (e.stage - b.s) * .12 : 1)];
  return [`<span class="gd-sprite">${SVG.eitje}</span>`, w];
}
function bloemHTML(e){
  const pre = s => `bloem-${e.kind}-${FLOWER[s]}`;
  let f = FILES.has(pre(e.stage) + ".webp") ? pre(e.stage) + ".webp" : null, filt = "";
  if (!f){ const a = `bloem-a-${FLOWER[e.stage]}.webp`; if (FILES.has(a)){ f = a; filt = KIND_FILTER[e.kind] || ""; } }
  if (!f) return ["", 0];
