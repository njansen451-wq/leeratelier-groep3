PL.slug = t => String(t || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const AGAIN = ["Nog een keer: zo leer je het echt.", "Goed plan. Elke ronde maakt het steviger.", "Daar gaan we weer. Nieuwe ronde.", "Herhalen is trainen. Net als bij ballet."];

/* ---------- de stem in code: zinnen uit bouwstenen met variabelen (kennis/08) ----------
   Na een ronde verzamelt de motor waarnemingen: wat gebeurde er precies? Elke waarneming heeft een gewicht en twee of
   drie varianten. Gekozen worden de zwaarste die niet net gebruikt zijn: hooguit twee zinnen, plus "nog een keer".
   Waarom zo: procesfeedback over wat ze deed (Mueller & Dweck 1998), concreet en specifiek (Hattie & Timperley 2007),
   en herhaling van dezelfde zin slijt. Alle zinnen gaan door de verboden-woordenfilter (tests/dialoog.js). */
const cap1 = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const ORD = ["", "eerste", "tweede", "derde", "vierde", "vijfde", "zesde", "zevende", "achtste", "negende", "tiende"];
const lst = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " en " + a[a.length - 1];
const OBS = {
  explHelp: {w: 10, v: [f => `Bij ${f.L} ${f.Mpl ? "hielpen" : "hielp"} ${f.M}. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst met ${f.M} erbij. Toen hij terugkwam, wist je hem.`]},
  reqOk:    {w: 9, v: [f => `Bij ${f.L} nam je een tussenstap. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst via een tussenstap. Toen hij terugkwam, wist je hem.`, f => `Bij ${f.L} hielp de tussenstap: de tweede keer deed je hem zelf.`]},
  newKnown: {w: 8, v: [f => `Nieuw: ${f.K} ${f.k > 1 ? "gaan" : "gaat"} nu vanzelf.`, f => `${cap1(f.K)} ${f.k > 1 ? "gaan" : "gaat"} sinds deze ronde vanzelf.`]},
  switch:   {w: 8, v: [() => `Je vroeg om een andere uitleg. Dat kun je aan elke AI ook vragen.`, () => `Je zei dat de uitleg niet hielp, en kreeg een andere. Zo werkt goed vragen.`]},
  dueOk:    {w: 6, v: [f => `${cap1(f.D)} kwam terug van een vorige keer, en je wist hem meteen. Zo werkt herhalen.`, f => `${cap1(f.D)} had je een tijdje niet gezien. Hij zat er nog.`]},
  step:     {w: 6, v: [f => `Bij ${f.L} nam je een tussenstap, en daarna vond je het zelf. Zo werkt trainen.`, f => `${cap1(f.L)} deed je via een tussenstap. Die weg heb je straks niet meer nodig.`]},
  adjOk:    {w: 5, v: [f => ({veel: "Met de extra opwarmers ging het rustiger.", snel: "Rustiger aan werkte: je nam de tijd die je nodig had.", lang: "Een korte ronde is ook een ronde.", uitleg: `De andere uitleg, ${f.M}, heb je gebruikt.`})[f.adj] || ""]},
  reqStill: {w: 5, v: [f => `${cap1(f.L)} kwam twee keer langs met een tussenstap. Hij komt nog eens terug; zo wordt hij van jou.`, f => `Bij ${f.L} heb je de tussenstap twee keer gezet. Volgende keer komt hij weer, met dezelfde hulp.`]},
  fluent:   {w: 5, v: [f => `Veel ${f.noun} wist je meteen, zonder te hoeven denken. Dat is wat trainen doet.`, f => `De meeste ${f.noun} kwamen meteen, zonder tellen.`]},
  wise:     {w: 4, v: [f => `Ik geef je deze ${f.noun} omdat ik weet dat je ze kunt leren. Elke tussenstap laat zien dat het gebeurt.`]},
  allSelf:  {w: 3, v: [f => `Je deed de ${f.noun} achter elkaar zelf, tot en met ${f.last}.`, f => `Alles in deze ronde deed je zelf, tot en met ${f.last}.`]},
  roundN:   {w: 2, v: [f => `Dit is al je ${ORD[f.r] || f.r + "e"} ronde vandaag.`, f => `Je ${ORD[f.r] || f.r + "e"} ronde vandaag. Je bleef erbij.`]}
};
const GROUPS = [["explHelp", "reqOk", "step", "reqStill"], ["fluent", "allSelf"]];
const AGAIN_END = ["En je koos zelf voor nog een keer.", "Nog een keer was jouw keuze. Dat is trainen.", "En deze ronde koos je zelf."];
/* f: waarnemingen van één ronde. recent: lijst "soort:variant" van de laatste eindschermen. Geeft {text, used}. */
PL.compose = function(f, recent){
  recent = recent || [];
  const recentKinds = recent.map(x => x.split(":")[0]);
  const have = Object.keys(OBS).filter(k => f.has[k]);
  const pickKinds = have.map(k => [k, OBS[k].w - (recentKinds.slice(-6).includes(k) && OBS[k].w < 8 ? 4 : 0) - (recentKinds.slice(-2).includes(k) ? 2 : 0)])
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const chosen = [];
  for (const k of pickKinds){
    if (chosen.length >= 2) break;
    // per groep hooguit één zin: over de tussenstap, of over "alles zelf"
    const grp = GROUPS.find(g => g.includes(k)); if (grp && chosen.some(c => grp.includes(c))) continue;
    chosen.push(k);
  }
  const used = [], parts = [];
  for (const k of chosen){
    const vs = OBS[k].v; let i = vs.findIndex((_, j) => !recent.includes(k + ":" + j)); if (i < 0) i = Math.floor(Math.random() * vs.length);
    const t = vs[i](f); if (t){ parts.push(t); used.push(k + ":" + i); }
  }
  if (f.again){ const i = (recent.filter(x => x.startsWith("again:")).length) % AGAIN_END.length; parts.push(AGAIN_END[i]); used.push("again:" + i); }
  // kort houden: hooguit vier zinnen; anders valt de tweede waarneming weg
  const sentences = a => (a.join(" ").match(/[.!?](\s|$)/g) || []).length;
  if (parts.length > 1 && sentences(parts) > 4 && !used[1].startsWith("again")){ parts.splice(1, 1); used.splice(1, 1); }
  return {text: parts.join(" "), used};
};

/* m: meting van de ronde {fr: aandeel in één keer, steps, reqN, reqOk, switches, mode, nextMode, modeName, nextName, hasModes, form} */
PL.reasonReply = function(react, why, m){
  const ok = m.fr >= 0.67, low = m.fr < 0.5;
  if (react === "leuk"){
    if (why === "lukte") return ok ? "Dat zag ik ook: de meeste kwamen meteen." : "Fijn dat het zo voelde. Je nam ook een paar tussenstappen; die horen erbij.";
    if (why === "snapte") return m.modeName && m.reqOk ? `Dan onthoud ik dat ${m.modeName} bij jou ${m.pl ? "werken" : "werkt"}.` : "Fijn. Snappen maakt het onthouden lichter.";
    if (why === "spel") return `Dat onthoud ik. Je kiest de vorm altijd zelf; vandaag was het ${m.form}.`;
    if (why === "kiezen") return "Zo werkt het hier ook: jij kiest wat en hoe, ik kies de volgorde.";
    return "Dat mag. Soms weet je het pas later.";
  }
  if (react === "pittig"){
    if (why === "veel") return (low ? "Dat zag ik ook." : "Er lukte toch veel meteen; pittig en lukken kan samen.") + " De volgende ronde begin ik met meer uit wat al lukt.";
    if (why === "uitleg") return m.hasModes ? `Dank je, dat helpt mij. De volgende keer leg ik het anders uit: met ${m.nextName}.` : "Dank je. Dat schrijf ik op, zodat er een andere uitleg kan komen.";
    if (why === "snel") return "Dan doe ik het rustiger: de hulp blijft langer staan en er zit meer tijd tussen de vragen.";
    if (why === "lang") return "Dan maak ik de volgende ronde korter. Kort is ook trainen.";
    return "Dat mag. Pittig is niet erg; zo voelt trainen soms.";
  }
  return "";
};
/* wat de reden verandert: een aanpassing voor de volgende ronde(s); de lat (beheersing, tempo) zakt nooit */
PL.adjustFor = function(react, why, m){
  if (react !== "pittig") return null;
  if (why === "veel") return {kind: "veel", left: 1};
  if (why === "snel") return {kind: "snel", left: 3};
  if (why === "lang") return {kind: "lang", left: 1};
  if (why === "uitleg" && m.hasModes) return {kind: "uitleg", left: 1, mode: m.nextMode};
  return null;
};
/* voor het ouderscherm: klopt het gevoel met de meting? Alleen een etiket per keer; patronen pas over weken. */
PL.classifyReact = function(e){
  const fr = e.fr == null ? null : e.fr;
  if (e.react === "gewoon") return "gewoon";
  if (!e.why) return e.react + " zonder reden";
  if (e.react === "leuk"){
    if (e.why === "lukte") return fr != null && fr >= 0.67 ? "leuk omdat het lukte (klopt met meting)" : "leuk omdat het lukte, meting: veel tussenstappen";
    return "leuk om een andere reden dan lukken (" + e.why + ")";
  }
  if (e.why === "veel") return fr != null && fr < 0.5 ? "pittig door veel tussenstappen (klopt met meting)" : "voelde pittig terwijl veel lukte (inspanning of onzekerheid)";
  if (e.why === "uitleg") return e.re > 0 ? "uitleg landde niet (na de uitleg opnieuw een tussenstap)" : e.sw > 0 ? "uitleg landde niet (vroeg om een andere)" : "uitleg niet gesnapt, meting: vraag erna lukte wel";
  if (e.why === "snel") return "tempo voelde te hoog";
  if (e.why === "lang") return "ronde voelde lang";
  return "pittig, reden onbekend";
};

/* ---------- uitlegvormen: welke uitleg helpt bij deze steen? ----------
   Begrip meten we aan gedrag, niet aan een label: een uitleg "landt" als dezelfde vraag even later in één keer lukt.
   Nog niet geprobeerde vormen eerst (in de volgorde van de training), daarna de vorm met de beste (ok+1)/(n+2), met af en toe
   een andere (15 %), zodat één slechte dag een vorm niet voorgoed wegzet. "Anders uitleggen" en "ik snapte de uitleg niet"
   tellen als niet geland. Leerstijlen bestaan hier als observatie per steen, nooit als label (Pashler e.a. 2008). */
PL.chooseExpl = function(modes, stats, avoid, rand){
  rand = rand == null ? Math.random() : rand;
  stats = stats || {};
  let cand = modes.filter(m => m !== avoid); if (!cand.length) cand = modes.slice();
  const untried = cand.filter(m => !stats[m] || !((stats[m].ok || 0) + (stats[m].no || 0)));
  if (untried.length) return untried[0];
  const sc = m => ((stats[m].ok || 0) + 1) / ((stats[m].ok || 0) + (stats[m].no || 0) + 2);
  const best = cand.slice().sort((a, b) => sc(b) - sc(a))[0];
  if (rand < 0.15 && cand.length > 1){ const others = cand.filter(m => m !== best); return others[Math.floor(rand / 0.15 * others.length) % others.length]; }
  return best;
};

/* ---------- v0.11: vakken, voortgang en een open ronde (Laws of UX, zie CHANGELOG) ---------- */
/* Similarity + Chunking: drie vakken met elk één kleur. Het icoon is overal dezelfde bloem, in de kleur van het vak. */
const CATS = [{id: "rekenen", name: "Rekenen", petal: "#C12F78", soft: "var(--pl-violet-soft)"}, {id: "taal", name: "Taal", petal: "#B9790F", soft: "var(--pl-honey-soft)"}, {id: "wereld", name: "Wereld", petal: "#2F8F5E", soft: "var(--pl-leaf-soft)"}];
const catOf = T => T.cat || (/rekenen/i.test(T.subject || "") ? "rekenen" : /topografie/i.test(T.subject || "") ? "wereld" : "taal");
const catIcon = (id, cls) => { const c = CATS.find(x => x.id === id) || CATS[0]; return `<span class="pl-badge ${cls || ""}" style="background:${c.soft}" aria-hidden="true">${PL.flower(5, {stem: false, petal: c.petal, heart: "#FFFFFF"})}</span>`; };
PL._catOf = catOf;
const knownRec = r => !!r && r.fl >= 2 && r.last === "ok";
/* Groei zonder eindpunt (grondbeginsel: geen scores, geen levels; je traint, en met trainen gaat het steeds beter).
   Er is geen totaal en geen balk die vol moet: alleen wanneer ze trainde en wat al vanzelf gaat. Dat getal kan alleen groeien. */
const NOUN1 = {sommen: "som", woorden: "woord", landen: "land", werkwoorden: "werkwoord", zinnen: "zin"};
const nounN = (n, noun) => n === 1 ? (NOUN1[noun] || noun) : noun;
const whenText = d => { if (!d) return ""; const ago = dayNum(today()) - dayNum(d); return ago <= 0 ? "Vandaag getraind" : ago === 1 ? "Gisteren getraind" : ago < 7 ? `${ago} dagen geleden getraind` : "Even geleden getraind"; };
PL.growthOf = function(T, d){
  const ss = realSessions(d), known = Object.values((d && d.items) || {}).filter(knownRec).length;
  const last = ss.length ? ss[ss.length - 1].d : "";
  return {sessions: ss.length, known, last, status: ss.length ? whenText(last) : "Nieuw",
    text: known ? `${cap1(PL.stem.aantal(known, PL.stem.noun(T)))} ${known === 1 ? "gaat" : "gaan"} al vanzelf.` : ""};   // v0.12: getallen tot twintig voluit; geen zin zonder feit
};
/* Zeigarnik: een ronde die halverwege verlaten is, blijft staan (data.open) tot ze hem afmaakt; ouder dan 3 dagen telt niet. */
const openRound = d => { const o = d && d.open; if (!o || !o.q || !o.q.length) return null; if (dayNum(today()) - dayNum((o.d || "").slice(0, 10)) > 3) return null; return o; };
PL._openRound = openRound;

/* ---------- route (Jakob's Law): elk scherm een eigen adres, zodat "terug" op de telefoon in de app blijft ---------- */
let routing = false;
function setRoute(h, replace){
  const want = h ? "#" + h : location.pathname + location.search;
  if (("#" + h) === location.hash || (!h && !location.hash)) return;
  try { history[replace ? "replaceState" : "pushState"]({pl: 1}, "", want); } catch(e){ if (!replace) location.hash = h; }
}
PL._route = setRoute;
const parseHash = () => { const raw = decodeURIComponent((location.hash || "").slice(1)); const [id, view] = raw.split("/"); return {id: id || "", view: view || ""}; };

/* ---------- groepen (v0.10): trainingen met T.group staan op home als één regel; tik → kies het deel (bv. de regio) ---------- */
const GROUP_ROUTE = {topo: "landen"};
function listRows(){
  const out = [], seen = {};
  for (const T of trainings){
    if (!T.group){ out.push(T); continue; }
    if (seen[T.group]) continue;
    const members = trainings.filter(t => t.group === T.group);
    seen[T.group] = 1; out.push({isGroup: true, id: T.group, route: GROUP_ROUTE[T.group] || T.group, title: T.groupTitle, tint: T.tint, subject: T.subject, cat: catOf(T), members,
      sub: `${T.subject} · ${members.filter(m => m.id !== "wereld").length} werelddelen`});
  }
  return out;
}
/* groei van een groep: landen die al vanzelf gaan, over alle delen samen (elk land één keer) */
function groupGrowth(G, states){
  const codes = new Set(), ss = [];
  for (const m of G.members){ ss.push(...realSessions(states[m.id])); for (const [k, r] of Object.entries((states[m.id] && states[m.id].items) || {})) if (knownRec(r)) codes.add(k.slice(k.indexOf(":") + 1)); }
  const last = ss.map(s => s.d).sort().pop() || "", known = codes.size;
  return {sessions: ss.length, known, last, status: ss.length ? whenText(last) : "Nieuw", text: known ? `${cap1(PL.stem.aantal(known, "landen"))} ${known === 1 ? "gaat" : "gaan"} al vanzelf.` : ""};
}
function rowHTML(R, states, todayId, make){
  const isG = !!R.isGroup, pr = isG ? groupGrowth(R, states) : PL.growthOf(R, states[R.id]);
  const sub = isG ? R.sub : (R.subject || "");
  const isToday = !make && (isG ? R.members.some(m => m.id === todayId) : R.id === todayId);
  const attr = isG ? `data-group="${esc(R.id)}"` : make ? `data-make="${esc(R.id)}"` : `data-start="${esc(R.id)}"`;
  // a11y: de knop krijgt één duidelijke naam (titel, vak, status, voortgang)
  // v0.16 (Von Restorff): alleen wat anders is valt op: Nieuw, of iets wat klaarstaat om te herhalen. Vandaag gedaan zegt niets extra's.
  let due = false; try { due = !make && !isG && !!states[R.id] && PL.stem.sig.dueToday(states[R.id]).length > 0; } catch(e){}
  const trainedToday = pr.sessions && pr.last === today();
  const stat = !pr.sessions ? {t: "Nieuw", c: " s-nieuw"} : due ? {t: "Er staat iets klaar", c: " s-klaar"} : trainedToday ? {t: pr.known ? pr.text : "", c: ""} : {t: pr.status, c: ""};
  const label = `${R.title}. ${sub}. ${isToday ? "Vandaag. " : ""}${stat.t ? stat.t + "." : ""}`;
  return `<button type="button" class="pl-listrow pl-card-row" ${attr} aria-label="${esc(label)}">${catIcon(R.cat || catOf(R))}
    <span class="pl-listtext"><span class="pl-rowtop"><b>${esc(R.title)}</b></span><span class="pl-sub">${esc(sub)}</span>
    ${make || !stat.t ? "" : `<span class="pl-status${stat.c}">${esc(stat.t)}</span>`}</span><span class="pl-chev" aria-hidden="true"></span></button>`;
}
function groupedList(states, todayId, make){
  const rows = listRows();
  return CATS.map(c => { const rs = rows.filter(R => (R.cat || catOf(R)) === c.id); if (!rs.length) return "";
    return `<section class="pl-group" aria-labelledby="pl-cat-${c.id}"><h2 class="pl-eyebrow pl-cathead" id="pl-cat-${c.id}">${c.name}</h2><div class="pl-list pl-grid2">${rs.map(R => rowHTML(R, states, todayId, make)).join("")}</div></section>`; }).join("");
}
/* voor de tuin: alle delen van een groep samen in één tuintje (het tuintje van het eerste deel, bv. europa) */
function mergeGroups(states){
  const st = Object.assign({}, states);
  for (const G of listRows().filter(r => r.isGroup)){
    const parts = G.members.map(m => states[m.id]).filter(Boolean); if (!parts.length) continue;
    const m = {items: {}, stones: {}, sessions: []};
    parts.forEach((d, i) => { Object.assign(m.items, d.items || {}); for (const [k, v] of Object.entries(d.stones || {})) m.stones[G.members[i].id + ":" + k] = v; m.sessions = m.sessions.concat(d.sessions || []); });
    m.sessions.sort((a, b) => (a.d || "").localeCompare(b.d || ""));
    st[G.members[0].id] = Object.assign({}, parts[0], m);
  }
  return st;
}
/* wat er gegroeid is, in woorden: "12 sommen en 5 woorden gaan vanzelf" (Peak-End, Von Restorff) */
function grownLine(states){
  const per = {};
  for (const T of trainings){ const d = states[T.id]; if (!d) continue; const n = Object.values(d.items || {}).filter(knownRec).length; if (n) per[T.noun] = (per[T.noun] || 0) + n; }
  const parts = Object.entries(per).map(([noun, n]) => `${n} ${nounN(n, noun)}`);
  if (!parts.length) return "";
  const tot = Object.values(per).reduce((a, b) => a + b, 0);
  return `${lst(parts)} ${tot === 1 ? "gaat" : "gaan"} al vanzelf.`;
}

PL.home = async function(){
  PL._current = null; PL._guard = null; PL._view = null;
  const app = $("pl-app");

    const ls = trainings.map(T => ({T, s: st.sig.lastSession(states[T.id])})).filter(x => x.s && x.s.d).sort((a, b) => b.s.d.localeCompare(a.s.d));

    <div class="pl-area-list">
      ${groupedList(states, todayT.id)}
      <button type="button" class="pl-makebtn" id="pl-make"><span class="pl-bloemicoon" aria-hidden="true">${PL.flower(5, {stem: false})}</span>Bedenk je ronde</button>

        <button type="button" class="pl-btn quiet pl-full" id="pl-open-tuin">Bekijk mijn tuin</button>

  const openT = () => showHomeGarden(states);
  $("pl-open-tuin").addEventListener("click", openT);
  $("pl-make").addEventListener("click", () => showHomeMake(states));

/* ---------- v0.12 resultatenkaart: Laatste keer (S16), Komt terug (S14), Wat jij deed (S5, S9, S12), Uitleg (S12).
   Alleen zinnen met een feit uit de stand (S18); geen blok zonder feit (S11). ---------- */
function resultBlocks(T, d, mem){
  const st = PL.stem, sig = st.sig, g = st.genus(T), lab = k => st.label(T, k), blocks = [];
  const last = sig.lastSession(d); if (!last) return [];
  const bt = sig.breakthroughs(d).filter(b => b.dag === last.d)[0], li = sig.lastItem(d);
  blocks.push(["Laatste keer", [bt ? st.say("kaart.doorbraak", {item: lab(bt.k), eerder: st.dag(bt.eerder), dag: st.dag(bt.dag), genus: g}, mem)
    : st.say("kaart.laatste", {dag: st.dag(last.d), rondes: st.aantal(sig.roundsOn(d, last.d), "rondes"), item: li ? lab(li.k) : ""}, mem)]]);
  const sc = sig.schedule(d), terug = [];
  for (const gp of sc.soon.slice(0, 2)) terug.push(st.say("kaart.terug", {dagT: st.dagT(gp.n), items: st.kort(gp.ks.slice(0, 3).map(lab), gp.ks.length, st.noun(T)), pl: gp.ks.length > 1, genus: g}, mem));
  if (sc.rest.length) terug.push(st.say("kaart.rust", {aantal: st.aantal(sc.rest.length, st.noun(T)), dagT: st.dagT(sc.rest[0].due), pl: sc.rest.length > 1, genus: g}, mem));
  if (terug.filter(Boolean).length) blocks.push(["Komt terug", terug.filter(Boolean)]);
  const deed = [], hd = sig.helpDrop(d)[0];
  if (hd) deed.push(st.say("kaart.hulp", {item: lab(hd.k), eerder: st.dag(hd.eerder), dag: st.dag(hd.dag), genus: g}, mem));
  const fa = sig.faster(d).filter(x => !hd || x.k !== hd.k)[0];
  if (fa && fa.dag !== fa.eerder) deed.push(st.say("kaart.tempo", {item: lab(fa.k), eerder: st.dag(fa.eerder), dag: st.dag(fa.dag), genus: g}, mem));
  const rw = sig.roundsWeek(d); if (rw >= 2 && deed.length < 2) deed.push(st.say("kaart.afmaken", {rondes: st.aantal(rw, "rondes")}, mem));
  const lf = d.lastForm || "A", fr = (d.forms && d.forms[lf] && d.forms[lf].rounds) || 0;
  if (fr >= 2 && deed.length < 2 && T.forms[lf]) deed.push(st.say("kaart.vorm", {vorm: `"${T.forms[lf].name}"`, rondes: st.aantal(fr, "rondes")}, mem));
  if (deed.filter(Boolean).length) blocks.push(["Wat jij deed", deed.filter(Boolean)]);
  const u = sig.uitleg(d)[0];
  if (u){ const mode = (T.explainNames && T.explainNames[u.mode]) || (u.mode === "standaard" ? "de tussenstap" : u.mode); const z = st.say(u.ok ? "kaart.uitleg" : "kaart.uitleg.nog", {item: lab(u.k), mode, genus: g}, mem); if (z) blocks.push(["Uitleg", [z]]); }
  return blocks;
}

/* de regel onder de tuin per training (perk): wat al vanzelf gaat en wat het laatst bijkwam; leeg perk: een uitnodiging */
function perkLine(T, d, mem){
  const st = PL.stem, sig = st.sig, g = st.genus(T), n = sig.knownCount(d), nk = sig.newestKnown(d), last = sig.lastSession(d);
  const title = T.isGroup ? T.title : T.title;
  if (!last) return st.say("perk.leeg", {training: title}, mem);
  if (n && nk) return st.say("perk.groei", {aantal: st.aantal(n, st.noun(T)), item: st.label(T, nk.k), dag: st.dag(nk.d), pl: n > 1, genus: g}, mem);
  return st.say("perk.bezig", {dag: st.dag(last.d), rondes: st.aantal(realSessions(d).reduce((a, s) => a + (s.rounds || 0), 0), "rondes"), stap: T.stones[Math.max(0, (d.stage || 1) - 1)].name}, mem);
}
/* van een rij op home (training of groep) naar de training met de meest recente stand */
const rowTraining = (R, states) => !R.isGroup ? R : R.members.slice().sort((a, b) => ((PL.stem.sig.lastSession(states[b.id]) || {}).d || "").localeCompare(((PL.stem.sig.lastSession(states[a.id]) || {}).d || "")))[0];

/* Mijn tuin vanaf home (#tuin): de hele tuin, en in woorden wat vanzelf gaat. In de tuin zelf staat geen tekst. */

  if (!fromRoute) setRoute("tuin" + (openId ? "/" + openId : ""));
  const sec = app.querySelector(".pl-screen"), st = PL.stem, mem = st.mem;
  // v0.12: één regel van de rups over het geheel, alleen met een feit (S9, S18)
  const top = st.sig.weekTop(states, trainings);
  let rups = "";

  const door = trainings.map(T => ({T, b: st.sig.breakthroughs(states[T.id], new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10))[0]})).filter(x => x.b).sort((a, b) => (b.b.t || "").localeCompare(a.b.t || ""))[0];
  if (door) rups = st.say("rups.doorbraak", {item: st.label(door.T, door.b.k), dag: st.dag(door.b.dag), eerder: st.dag(door.b.eerder), training: door.T.groupTitle || door.T.title, genus: st.genus(door.T)}, mem);
  else if (groei && (!top || Math.random() < .5)) rups = st.say("rups.groei", {item: st.label(groei.T, groei.nk.k), dag: st.dag(groei.nk.d), training: groei.T.groupTitle || groei.T.title, genus: st.genus(groei.T)}, mem);
  else if (top) rups = st.say("rups.week", {training: top.T.groupTitle || top.T.title, rondes: st.aantal(top.n, "rondes")}, mem);
  const rows = listRows().map(R => { const T = rowTraining(R, states); return {R, T, line: perkLine(Object.assign(Object.create(T), {title: R.title}), states[T.id], mem)}; });

      <div class="pl-paneelin" id="pl-paneelin" hidden><ul class="pl-grownlist pl-perken">${rows.map(({R, line}) => `<li><button type="button" class="pl-perk" data-perk="${esc(R.id)}" aria-expanded="false" aria-controls="pl-res-${esc(R.id)}"><b>${esc(R.title)}</b><span>${esc(line)}</span><span class="pl-chev" aria-hidden="true"></span></button><div class="pl-result" id="pl-res-${esc(R.id)}" aria-live="polite" hidden></div></li>`).join("")}</ul></div></div>`;
  // v0.21: het paneel met de trainingen open en dicht
  const paneel = on => { const k = $("pl-paneel"); k.setAttribute("aria-expanded", String(on)); $("pl-paneelin").hidden = !on; };

  }
  const known = key => { const r = data.items[key]; return !!r && r.fl >= 2 && r.last === "ok"; };
  const due = key => { const r = data.items[key]; return !!r && r.due != null && r.due <= dayNum(today()); };
  /* v0.14 variatie binnen een sessie (ouder, 23 oktober): wat vandaag al gevraagd is en meteen lukte, komt vandaag niet meer
     terug zolang er iets anders is; alleen wat een tussenstap nodig had, komt terug. Bewaard per dag (ook na herladen). */
  const sessObj = () => (data.sess && data.sess.d === today() && data.sess.items) ? data.sess : (data.sess = {d: today(), items: {}});
  const sessRec = key => sessObj().items[key];
  // een vraag die in dezelfde ronde terugkwam (na een tussenstap) blijft "met tussenstap": hij komt de volgende ronde nog één keer

  const sessScore = key => { const r = sessRec(key); if (!r) return 0; if (r.miss) return -12; return 40 + 3 * r.n + (due(key) ? 20 : 0); };

  const ctx = {

    explainMode(stoneId){

  let introLine = null;

  /* --- eigen ronde: Natalia kiest de steen, de vorm en het aantal; de motor kiest de vragen --- */
  /* --- Bedenk je ronde: een gesprek in bouwstenen. Natalia stelt haar vraag zoals je hem aan een AI zou stellen;

  const nameOf = id => { const st = T.stones.find(x => x.id === id); return st ? st.name : id; };

  function stoneState(st, i){ const g = ctx.green(st.id), seen = (data.stones[st.id] || {}).n > 0; const open = i <= data.stage - 1 || (st.requires || []).every(r => ctx.green(r)); const eerstIds = (st.requires || []).filter(r => !ctx.green(r)), eerst = eerstIds.map(nameOf); return {g, seen, open, label: g ? "gaat al vanzelf" : seen ? "ben je mee bezig" : open ? "nog nieuw" : "nog niet aan de beurt · komt na " + eerst.join(", "), eerst, eerstIds}; }
  /* De beslisboom van het gesprek. Puur: (antwoorden tot nu toe) → volgende vraag óf het plan met drie denkregels.

     wordt, staat in de denkregels; elk pad eindigt in een geldig plan (open steen, vorm A/B, 6 of 10 vragen, opwarmer ≠ steen). */
  function planTree(a){
    const stones = T.stones.map((st, i) => Object.assign({st}, stoneState(st, i)));
    const byId = id => stones.find(x => x.st.id === id);
    const idx = id => T.stones.findIndex(x => x.id === id);
    const played = stones.filter(x => x.seen);
    const skipped = [];
    // 1. wat oefenen
    if (a.stoneId == null) return {ask: {q: "Wat wil je oefenen?", key: "stoneId", opts: stones.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label, later: !x.open && !x.seen})).concat([{v: "kies", t: "Kies jij maar", sub: "dan zeg ik wat ik koos en waarom"}])}};
    const guessed = a.stoneId === "kies";
    let stoneId = guessed ? T.stones[data.stage - 1].id : a.stoneId;
    let st = byId(stoneId);
    // v0.9.3: een steen die nog niet aan de beurt is: eerst vragen of ze hem wil proberen of de stap ervoor neemt.
    // De stap ervoor is de eerste nog-niet-vanzelf-steen in de keten eronder die wél open is.
    const stapErvoor = id => { const x = byId(id); for (const r of x.eerstIds || []){ const y = byId(r); if (y.open || y.seen) return r; const d = stapErvoor(r); if (d) return d; } return null; };
    const ancestors = id => { const out = new Set(), walk = i => (T.stones[idx(i)].requires || (idx(i) > 0 ? [T.stones[idx(i) - 1].id] : [])).forEach(r => { if (!out.has(r)){ out.add(r); walk(r); } }); walk(id); return out; };
    const laterChosen = !guessed && !st.open && !st.seen;
    const ervoor = laterChosen ? stapErvoor(stoneId) : null;
    if (laterChosen && ervoor && a.later == null) return {ask: {q: `${cap(nameOf(stoneId))} is nog niet aan de beurt. Wat wil je?`, key: "later", opts: [{v: "proberen", t: "Toch proberen", sub: "met alle hulp erbij"}, {v: "eerst", t: `Eerst ${nameOf(ervoor)}`, sub: (st.eerstIds || []).includes(ervoor) ? "de stap ervoor; daarna kom je hier vanzelf" : "daar begint de weg ernaartoe"}]}};
    if (a.later === "eerst" && ervoor){ stoneId = ervoor; st = byId(stoneId); }
    // 2a. groene steen: herhalen of verder (alleen vragen als er een open volgende steen is)
    const next = T.stones[idx(stoneId) + 1]; const nextOpen = next && byId(next.id).open;
    if (!guessed && st.g && nextOpen && a.verder == null) return {ask: {q: `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Wat wil je?`, key: "verder", opts: [{v: "herhalen", t: "Herhalen", sub: "de basis komt altijd terug"}, {v: "verder", t: "Een stapje verder", sub: cap(nameOf(next.id))}]}};
    if (a.verder === "verder"){ stoneId = next.id; st = byId(stoneId); }
    // 2b. wat gaat al goed: alleen vragen als er iets te kiezen valt (gespeelde stenen vóór deze steen)
    // alleen stenen waar deze op bouwt (de keten eronder), en die ze hier al speelde
    const onder = ancestors(stoneId);
    const warmOpts = played.filter(x => x.st.id !== stoneId && onder.has(x.st.id)).slice(-4);
    if (!guessed && warmOpts.length && a.warmId == null) return {ask: {q: "Wat gaat al goed?", key: "warmId", opts: warmOpts.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label})).concat([{v: "niets", t: "Dat weet ik niet", sub: "dan kies ik iets wat vorige keer lukte"}])}};
    if (guessed) skipped.push("goedKies"); else if (!warmOpts.length) skipped.push("goedLeeg");
    // 3. hoe, 4. hoeveel
    if (a.form == null) return {ask: {q: "Hoe wil je het doen?", key: "form", opts: ["A", "B"].map(f => ({v: f, t: T.forms[f].name, sub: T.forms[f].desc}))}};
    if (a.n == null) return {ask: {q: "Hoeveel tijd heb je?", key: "n", opts: [{v: 6, t: "Kort", sub: "6 vragen"}, {v: 10, t: "Wat langer", sub: "10 vragen"}]}};
    // het plan
    const warmId = a.warmId && a.warmId !== "niets" ? a.warmId : null;
    const n = +a.n, f = a.form;
    const autoWarm = !warmId && warmOpts.length ? warmOpts[warmOpts.length - 1].st.id : null;
    const later = !guessed && !st.open && !st.seen;
    const vormZin = n => /^met /i.test(n) ? n.toLowerCase() : "met " + n.toLowerCase();   // "met het model", niet "met met het model"
    const vraag = `Ik wil ${guessed ? "oefenen, kies jij maar wat" : a.later === "eerst" ? "eerst " + nameOf(stoneId) + " oefenen, de stap vóór " + nameOf(a.stoneId) : nameOf(stoneId) + " oefenen"}${a.verder === "verder" ? " (een stapje verder)" : a.verder === "herhalen" ? " (herhalen)" : ""}${later ? ", ook al is het nog niet aan de beurt" : ""}. ${warmId ? cap(nameOf(warmId)) + " gaat al goed." : a.warmId === "niets" ? "Ik weet niet wat al goed gaat." : ""} Ik wil het doen ${vormZin(T.forms[f].name)}, ${n === 6 ? "kort" : "wat langer"}.`.replace(/\s+/g, " ");
    const begreep = `Je wilt ${guessed ? "oefenen en laat de keuze aan mij" : a.later === "eerst" ? nameOf(a.stoneId) + ", en eerst de stap ervoor: " + nameOf(stoneId) : nameOf(stoneId)}. ${warmId ? `${cap(nameOf(warmId))} gaat al goed, zei je.` : a.warmId === "niets" ? "Wat al goed gaat, weet je zelf niet zeker." : ""} ${T.forms[f].name}, ${n} vragen.`.replace(/\s+/g, " ");
    const warmSrc = warmId || autoWarm;
    // elke bewering hieronder volgt uit de stand (A3): eerste steen, gespeelde stenen, afgeronde rondes
    const firstStone = idx(stoneId) === 0, anyRound = data.sessions.length > 0;
    const kies = warmSrc ? `Ik begin met twee uit ${nameOf(warmSrc)}${warmId ? "" : ", want dat lukte vorige keer"}, als opwarmer. Dan ${n - 2} uit ${nameOf(stoneId)}. Wat niet in één keer lukt, komt drie vragen later terug.`
      : `Alles komt uit ${nameOf(stoneId)}; ${firstStone ? "er is geen steen vóór deze om mee op te warmen" : "de stenen ervoor heb je hier nog niet gespeeld, dus ik warm niet op"}. Wat niet in één keer lukt, komt drie vragen later terug.`;
    const cur = T.stones[data.stage - 1], curNaVanzelf = (cur.requires || (idx(cur.id) > 0 ? [T.stones[idx(cur.id) - 1].id] : [])).every(r => ctx.green(r));
    const weetNiet = a.later === "eerst" ? `Je koos eerst ${nameOf(stoneId)}, de stap ervoor. Gaat dat vanzelf, dan ligt ${nameOf(a.stoneId)} klaar.`
      : later ? `${cap(nameOf(stoneId))} is nog niet aan de beurt: het komt na ${st.eerst.join(" en ")}. Je wilt het proberen, en dat mag. Ik laat de hulp helemaal staan. ${(() => { const e = stapErvoor(stoneId); return e ? `Gaat het nog niet, dan is ${nameOf(e)} een goed begin.` : ""; })()}`
      : guessed ? `Je zei niet wát je wilt oefenen. Ik koos ${nameOf(stoneId)}, omdat ${curNaVanzelf ? "dat de volgende stap is na wat al vanzelf gaat" : "je daar nu bent in deze training"}. Bedoel je iets anders, zeg het dan.`
      : skipped.includes("goedLeeg") ? (firstStone ? `Ik vroeg niet wat al goed gaat: er is geen steen vóór ${nameOf(stoneId)}.` : anyRound ? `Ik vroeg niet wat al goed gaat: de stenen vóór ${nameOf(stoneId)} heb je hier nog niet gespeeld.` : `Ik vroeg niet wat al goed gaat: je hebt hier nog geen ronde afgemaakt, dus dat weet ik nog niet.`) + (st.g ? ` ${cap(nameOf(stoneId))} gaat bij jou al vanzelf; herhalen is prima.` : !st.seen ? ` ${cap(nameOf(stoneId))} is nieuw; wat lastig is, merk ik aan je tussenstappen.` : ` Hoe het nu gaat, merk ik aan je tussenstappen.`)
      : st.g ? `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Herhalen is prima; de basis komt altijd terug.`
      : !st.seen ? `${cap(nameOf(stoneId))} is nieuw voor je. Ik weet nog niet wat daar lastig is; dat merk ik aan je tussenstappen.`
      : `Ik weet niet of je dit vandaag met of zonder hulp wilt. Ik laat de hulp staan tot het vanzelf gaat.`;
    return {plan: {stoneId, warmId: warmSrc, form: f, n, guessed}, vraag, lines: [begreep, kies, weetNiet]};
  }
  PL._planTree = planTree;

  function showMake(fromRoute){
    if (!fromRoute) route("bedenk");
    app.classList.remove("pl-inround", "pl-atstart");

    screen.innerHTML = `

    function step(){

        chat.insertAdjacentHTML("beforeend", `<div class="pl-chips" role="group" aria-label="${esc(S.q)}">${S.opts.map(o => `<button type="button" class="pl-chip${o.later ? " later" : ""}" data-v="${esc(String(o.v))}"><b>${esc(o.t)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</button>`).join("")}</div>`);

          <p class="pl-note">Een AI gokt als je iets niet zegt. Daarom laat ik zien wat ik aanneem, zodat jij het kunt nakijken.</p>

        </div>`);
      chat.lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"});

      $("pl-plan-edit").addEventListener("click", () => { log({make_edit: 1}); showMake(); });
      // haak: als Claude bereikbaar is, mag hij alleen de drie denkregels herschrijven; het plan blijft uit code
      PL.ai(`Je bent het rustige oefenmaatje in het Leeratelier. Herschrijf deze drie regels voor een kind, in het Nederlands, korte zinnen, je-vorm, geen emoji, geen lof, geen cijfers of niveaus. Verander de inhoud niet. Geef precies drie regels terug, gescheiden door een regeleinde.\n1. ${lines[0]}\n2. ${lines[1]}\n3. ${lines[2]}`).then(t => {
        if (!t) return; const ls = t.split(/\n+/).map(x => x.replace(/^\d+[.)]\s*/, "").trim()).filter(Boolean); if (ls.length !== 3) return;
        const dds = document.querySelectorAll("#pl-denk dd"); if (dds.length === 3){ ls.forEach((l, i) => { dds[i].textContent = l; }); const d = $("pl-denk"); if (d) d.insertAdjacentHTML("afterend", `<p class="pl-note">Deze drie regels heeft Claude voor je herschreven; wat erin staat, komt uit de training zelf.</p>`); }
      });

  /* --- v0.13 Te makkelijk / Pittig: twee rustige knoppen, vrijwillig. Pas met een reden doet het iets; geen beloning voor klikken.
         Een reden binnen 0,7 s, of een reden die de laatste drie keer niet klopte, wordt alleen gelogd (ouderscherm). --- */
  function feelHTML(where){
    const chosen = feelUsed ? lastFeel : null;
    return `<div class="pl-feel pl-feel-${where}" id="pl-feel" role="group" aria-label="Te makkelijk of pittig">
      <button type="button" class="pl-feelbtn" data-feel="makkelijk" aria-expanded="false" aria-pressed="${chosen && chosen.kind === "makkelijk"}" ${feelUsed ? "disabled" : ""}>Te makkelijk</button>
      <button type="button" class="pl-feelbtn" data-feel="pittig" aria-expanded="false" aria-pressed="${chosen && chosen.kind === "pittig"}" ${feelUsed ? "disabled" : ""}>Pittig</button>
      <div class="pl-feelpanel" id="pl-feelpanel" aria-live="polite" ${chosen && where === "einde" ? "" : "hidden"}>${chosen && where === "einde" ? `<p class="pl-note">${esc(chosen.reply)}</p>` : ""}</div></div>`;
  }
  let lastFeel = null;
  function wireFeel(){
    const box = $("pl-feel"); if (!box) return;
    const panel = $("pl-feelpanel"), set = PL.feelSet(T);
    box.querySelectorAll("[data-feel]").forEach(b => b.addEventListener("click", () => {
      if (feelUsed) return;
      const kind = b.dataset.feel, open = b.getAttribute("aria-expanded") !== "true";
      box.querySelectorAll("[data-feel]").forEach(x => x.setAttribute("aria-expanded", String(x === b && open)));
      if (!open){ panel.hidden = true; return; }
      feelOpenT = performance.now();
      const q = kind === "pittig" ? "Wat was er pittig?" : "Wat was er te makkelijk?";
      panel.innerHTML = `<p class="pl-note">${q}</p><div class="pl-chips pl-feelchips" role="group" aria-label="${q}">${set[kind].concat([["vraag", "Weet ik niet"]]).map(([v, t]) => `<button type="button" class="pl-chip" data-why="${v}"><b>${esc(t)}</b></button>`).join("")}</div>`;
      panel.hidden = false;
      panel.querySelectorAll("[data-why]").forEach(c => c.addEventListener("click", () => feelChoose(kind, c.dataset.why)));
    }));
  }
  function feelChoose(kind, why){
    if (feelUsed) return;
    const st = feelStone || (lastRound && lastRound.res && lastRound.res.stoneId) || T.stones[data.stage - 1].id;
    const fast = performance.now() - feelOpenT < 700;
    const recent = (data.feelLog || []).filter(x => x.why === why).slice(-3);
    const ignored = why === "vraag" || fast || (recent.length === 3 && recent.every(x => x.pass === false));
    const E = PL.FEEL_EFFECT[why];
    log({feel: kind, why, st, fast: fast ? 1 : undefined, ign: ignored && why !== "vraag" ? 1 : undefined});
    S.react[kind] = (S.react[kind] || 0) + 1;
    if (!ignored && E){
      const s = data.stones[st];
      data.feel = {kind, why, st, d: today(), base: s && s.rts && s.rts.length ? s.rts.slice().sort((a, b) => a - b)[Math.floor(s.rts.length / 2)] : null};
      if (E.adj) data.adjust = {kind: E.adj, left: 1, st, from: today()};
      if (kind === "pittig" && data.fade) delete data.fade[st];
    }
    // eerlijk: alleen beloven wat er ook gebeurt
    const reply = why === "vraag" ? PL.FEEL_REPLY.vraag : ignored ? "Dank je. Ik kijk de volgende ronde gewoon mee." : PL.FEEL_REPLY[why];
    feelUsed = true; lastFeel = {kind, why, reply};
    const box = $("pl-feel"), panel = $("pl-feelpanel");
    if (box){ box.querySelectorAll("[data-feel]").forEach(x => { x.disabled = true; x.setAttribute("aria-pressed", String(x.dataset.feel === kind)); x.setAttribute("aria-expanded", "false"); }); }
    if (panel){ panel.innerHTML = `<p class="pl-note">${esc(reply)}</p>`; panel.hidden = false; if (box && box.classList.contains("pl-feel-ronde")) setTimeout(() => { if ($("pl-feelpanel")) $("pl-feelpanel").hidden = true; }, 3500); }
    save();
  }

  /* --- ronde samenstellen: 2 opwarmers (eerst wat aan herhaling toe is), 4 uit de huidige steen --- */
  function composeRound(){
    const stones = T.stones;
    if (custom && custom.all){   // alle landen langs (v0.10): elk item één keer, in willekeurige volgorde
      return T.allRound.items(ctx).map(it => Object.assign(it, {stone: T.stoneOf(it.key, ctx)}));
    }
    if (custom){
      const st = stones.find(x => x.id === custom.stoneId) || stones[0];
      const items = []; let guard = 0;
      const warmSrc = custom.warmId ? stones.find(x => x.id === custom.warmId) : null;
      if (warmSrc && warmSrc !== st && custom.n >= 6) while (items.length < P.warm && guard++ < 40){ const it = warmSrc.gen(ctx, "warm"); if (it && !items.some(x => x.key === it.key) && (sessFresh(it.key) || guard > 25)) items.push(Object.assign(it, {warm: true, stone: warmSrc.id})); }
      guard = 0;
      while (items.length < custom.n && guard++ < 120){ const it = st.gen(ctx, "main"); if (it && !items.some(x => x.key === it.key) && (sessFresh(it.key) || guard > 80)) items.push(Object.assign(it, {stone: st.id})); }
      return items;
    }
    if (data.hold > 0) data.hold--;                                                            // na een stapje terug: eerst oefenen, nog niet overslaan
    else while (data.stage < stones.length && green(stones[data.stage - 1].id)) data.stage++;   // stille diagnose
    const cur = stones[data.stage - 1];
    const earlier = stones.slice(0, data.stage - 1);
    const items = [];
    // na "pittig: veel lukte niet meteen" één opwarmer meer; na "pittig: het duurde lang" een kortere ronde
    const kind = roundAdj && roundAdj.kind;
    const warmN = kind === "veel" ? P.warm + 1 : kind === "lang" ? 1 : P.warm;
    const size = kind === "lang" ? 4 : P.roundSize;
    const dueKeys = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok" && !sessRec(k));   // v0.14: één keer per sessie
    for (const k of shuffle(dueKeys).slice(0, warmN)){ const it = T.fromKey(k, ctx); if (it) items.push(Object.assign(it, {warm: true, due: true, stone: T.stoneOf(k, ctx)})); }
    let guard = 0;
    while (items.length < warmN && guard++ < 30){
      const src = earlier.length ? pick(earlier) : cur;
      const it = src.gen(ctx, "warm"); if (!it) break;
      if (!items.some(x => x.key === it.key) && (sessFresh(it.key) || guard > 20)) items.push(Object.assign(it, {warm: true, stone: src.id}));
    }
    // v0.14: de toets van "Te makkelijk" / "Pittig" vraagt om sommen van die stap; staat de ronde al verder, dan komen er twee bij
    if (data.feel && data.feel.st !== cur.id){ const fs = stones.find(s => s.id === data.feel.st); let g2 = 0;
      while (fs && items.filter(x => x.stone === fs.id && !x.warm).length < 2 && g2++ < 30){ const it = fs.gen(ctx, "main"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: fs.id})); } }
    // v0.14: wat vandaag een tussenstap nodig had, komt de volgende ronde terug (ook bij trainingen die vragen willekeurig maken)
    const okStones = new Set(stones.slice(0, data.stage).map(s => s.id));
    for (const [k, r] of Object.entries(sessObj().items)){
      if (items.length >= size - 2) break;
      if (!r.miss || items.some(x => x.key === k)) continue;
      let it = null; try { it = T.fromKey(k, ctx); } catch(e){}
      const st = it && T.stoneOf(k, ctx); if (!it || !okStones.has(st)) continue;
      items.push(Object.assign(it, {stone: st, terug: true}));
    }
    guard = 0;
    while (items.length < size && guard++ < 60){
      const it = cur.gen(ctx, "main");
      if (it && !items.some(x => x.key === it.key) && (sessFresh(it.key) || guard > 40)) items.push(Object.assign(it, {stone: cur.id}));
    }
    return items;
  }

  /* een vraag bewaren en terughalen (open ronde): via fromKey als de training dat kan, anders als kopie */
  const serItem = it => { const o = {k: it.key, st: it.stone, w: it.warm ? 1 : 0, rq: it.requeue ? 1 : 0, du: it.due ? 1 : 0}; let fk = null; try { fk = T.fromKey ? T.fromKey(it.key, ctx) : null; } catch(e){} if (!fk){ try { o.j = JSON.parse(JSON.stringify(it)); } catch(e){} } return o; };
  const deserItem = o => { let it = null; if (o.j) it = Object.assign({}, o.j); else { try { it = T.fromKey ? T.fromKey(o.k, ctx) : null; } catch(e){} } if (!it) return null; return Object.assign(it, {key: o.k, stone: o.st, warm: !!o.w, requeue: !!o.rq, due: !!o.du}); };

  async function playRound(again, resume){
    const run = ++runId; inRound = true; topBtn(true);
    route("ronde", view === "ronde" || view === "klaar" || view === "bedenk");
    app.classList.add("pl-inround"); app.classList.remove("pl-atstart");
    if (resume){ form = resume.f || form; custom = resume.c || null; }
    data.lastForm = form;
    // v0.13: wat ze vorige ronde zei (Te makkelijk / Pittig) wordt in deze ronde getoetst
    roundFeel = data.feel || null; feelUsed = false; feelRulesOpened = false; lastFeel = null; feelStone = null;
    // een aanpassing uit een reden van vorige keer geldt voor deze ronde; daarna telt hij af
    roundAdj = data.adjust && data.adjust.left > 0 ? Object.assign({}, data.adjust) : null;
    if (data.adjust){ data.adjust.left--; if (data.adjust.left <= 0) data.adjust = null; }
    const knownBefore = new Set(Object.keys(data.items).filter(k => known(k)));
    // één schermindeling voor een ronde (B1/B2): een werkvlak van hooguit ~600 px in het midden; vraag, hulp en invoer samen in beeld
    screen.innerHTML = `<div class="pl-round" id="pl-round">
      <div class="pl-roundprog" id="pl-roundprog" hidden><span class="pl-bar" aria-hidden="true"><i id="pl-bar-i"></i></span><span class="pl-count" id="pl-count" aria-live="off"></span></div>
      <div class="pl-ask" aria-live="polite"><span class="pl-ask-lead" id="pl-ask-lead"></span><span class="pl-ask-main" id="pl-ask-main"></span></div>
      <div class="pl-rulebar" id="pl-rulebar" hidden><button type="button" class="pl-rulebtn" id="pl-rule-btn" aria-expanded="false" aria-controls="pl-rules">${esc(T.rulesLabel || "Laat de regel zien")}</button><div class="pl-rules" id="pl-rules" hidden></div></div>
      <div class="pl-fb" id="pl-fb" aria-live="polite"></div>
      <div id="pl-work"></div>
      <div class="pl-prev" id="pl-prev" hidden></div>
      ${feelHTML("ronde")}
      <div class="pl-sheet" id="pl-sheet" aria-live="polite" hidden></div><div class="pl-sr" id="pl-sr" aria-live="polite"></div></div>`;
    ctx.work = $("pl-work");
    wireFeel();
    T.setup(ctx);
    /* "Laat de regel zien" (v0.9.2): de regel van de gevraagde vorm, nooit het antwoord. Hij is er altijd (bij elke training
       met regels). Bij het begin, zolang het model nog vol steunt, en na een tussenstap valt hij op; na drie keer op rij meteen
       goed wordt hij rustig (klein, grijs), maar hij blijft te openen. Bekijken stopt niets. */
    let okRun = 0, ruleItem = null, ruleSeen = false;
    let prevNotFirst = null, stuckNote = "", stuckShown = false, voiceN = 0;   // v0.12: de stem in de ronde (hooguit drie zinnen na "Gelukt")
    okVoice = () => {
      if (!cur_ || !cur_.item || voiceN >= 3) return "";
      const it = cur_.item, first = !cur_.step, lab = PL.stem.label(T, it.key), ms = performance.now() - cur_.t0;
      const sl = {item: lab, genus: PL.stem.genus(T), reg: new Date().getHours() >= 19 ? "rustig" : ""};
      let out = "";
      if (first && it.requeue) out = PL.stem.say("ronde.terugok", sl, data.voice);
      else if (first){
        const bn = PL.stem.sig.breakNow(data, it.key);   // nog niet gelogd: dit is het moment zelf
        const rec_ = data.items[it.key], lastRt = rec_ && rec_.rts && rec_.rts.length ? rec_.rts[rec_.rts.length - 1] : null;
        cur_.doubt = PL.stem.sig.doubt(data.stones[it.stone], ms, PL._cor);
        if (bn) out = PL.stem.say("ronde.doorbraak", Object.assign({eerder: PL.stem.dag(bn.eerder)}, sl), data.voice);
        else if (cur_.doubt) out = PL.stem.say("ronde.twijfel", sl, data.voice);
        else if (lastRt != null && ms < lastRt * 0.75 && lastRt - ms > 800) out = PL.stem.say("ronde.sneller", sl, data.voice);
      }
      if (out) voiceN++;
      return out;
    };
    rulesShow = (prom, fresh) => {
      const bar = $("pl-rulebar"); if (!bar) return;
      const R = ruleItem && T.rules ? T.rules(ruleItem, ctx) : null;
      if (!R){ bar.hidden = true; return; }
      bar.classList.toggle("stil", !prom);
      if (!fresh && !bar.hidden) return;
      $("pl-rules").innerHTML = `<b>${esc(R.title)}</b><ul>${R.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>${R.html || ""}`;   // html: een voorbeeld in beeld, gemaakt door de training
      $("pl-rules").hidden = true; $("pl-rule-btn").setAttribute("aria-expanded", "false"); $("pl-rule-btn").textContent = T.rulesLabel || "Laat de regel zien";
      bar.hidden = false;
    };
    $("pl-rule-btn").addEventListener("click", () => {
      const p = $("pl-rules"), open = p.hidden; p.hidden = !open;
      $("pl-rule-btn").setAttribute("aria-expanded", String(open)); $("pl-rule-btn").textContent = open ? (T.rulesLabel ? "Wegleggen" : "Regel wegleggen") : (T.rulesLabel || "Laat de regel zien");
      if (open && !ruleSeen && ruleItem){ ruleSeen = true; res.rules = (res.rules || 0) + 1; log({rules: 1, k: ruleItem.key, st: ruleItem.stone}); }
    });
    const adjNote = roundAdj ? ({veel: "Ik begin met meer uit wat al lukt.", snel: "Ik doe het rustiger: de hulp blijft langer staan.", lang: "Een kortere ronde nu. Kort is ook trainen.", uitleg: `Bij een tussenstap leg ik het nu uit met ${ctx.modeName(roundAdj.mode) || "een andere manier"}.`})[roundAdj.kind] : "";
    if (again || adjNote) ctx.fb.note([again ? pick(AGAIN) : "", adjNote].filter(Boolean).join(" "));
    const restored = resume ? resume.q.map(deserItem).filter(Boolean) : null;
    const queue = restored && restored.length ? restored : composeRound();
    queueLeft = () => queue.length > 0; prevOk = null;
    const offset = restored && restored.length ? resume.i : 0;
    const cur = custom && !custom.all ? (T.stones.find(x => x.id === custom.stoneId) || T.stones[0]) : T.stones[data.stage - 1];
    const res = {t0: new Date().toISOString().slice(0, 19), items: [], first: 0, steps: 0, fluent: 0, stoneId: cur.id, stageAtStart: data.stage, reqN: 0, reqOk: 0, hints: 0, switches: 0, modes: {}, rts: [], reqItems: [], adj: roundAdj && roundAdj.kind};
    const total = queue.length;
    // v0.11 (Goal-Gradient, Parkinson): de lengte van de ronde als balk met "2 van 6" (geen score: alleen waar je bent in de ronde)
    const lang = total > 12;
    $("pl-roundprog").hidden = false;
    let i = offset;
    const keepOpen = () => { data.open = {d: new Date().toISOString(), f: form, c: custom, i, total: i + queue.length, st: cur.id, q: queue.map(serItem)}; };
    while (queue.length){
      const n = i + queue.length;
      $("pl-bar-i").style.width = (100 * i / n) + "%";
      $("pl-count").textContent = `${i + 1} van ${n}`;
      keepOpen();
      const item = queue.shift();
      const t0 = performance.now();
      cur_ = {item, t0, step: false}; PL._cor = 0;
      if (stuckNote && !stuckShown){ stuckShown = true; ctx.fb.note(stuckNote); stuckNote = ""; }
      tried = null; PL._item = item;   // alleen voor tests/ux.py (controle: noemt de tussenstap het antwoord?)
      ruleItem = item; ruleSeen = false; rulesShow(ctx.support(item.stone) === "vol" && okRun < 3, true);
      feelStone = item.stone;
      if (roundFeel && !feelRulesOpened && item.stone === roundFeel.st && (PL.FEEL_EFFECT[roundFeel.why] || {}).rules && $("pl-rules") && $("pl-rules").hidden && !$("pl-rulebar").hidden){ feelRulesOpened = true; $("pl-rule-btn").click(); }
      let r;
      try { r = await T.ask(item, ctx); } catch(e){ if (run !== runId) return; console.error(e); r = {first: false, step: false}; }
      if (run !== runId) return;   // de ronde is verlaten
      const rt = Math.max(0, Math.round(performance.now() - t0 - (r.typingMs || 0)));
      const fluent = updateItem(item.key, r.first, r.step, r.first ? rt : null);
      sessMark(item.key, r.first, !!item.requeue);
      updateStone(item.stone, r.first, r.first ? rt : null);
      log({k: item.key, st: item.stone, f: form, ok1: r.first ? 1 : 0, step: r.step ? 1 : 0, rt, warm: item.warm ? 1 : 0, sup: r.support || "", ex: r.step ? (r.expl || "standaard") : undefined, sw: r.switches || undefined, rev: r.revealed ? 1 : undefined, cor: PL._cor || undefined});
      if (cur_.doubt && r.first) res.doubt = res.doubt || item;
      // v0.12 vastlopen (S6, S7, S8): na twee vragen op rij niet in één keer, één keer per ronde een rustige zin bij de volgende vraag
      if (!r.first && !item.requeue && prevNotFirst && !stuckShown && queue.length){ const ks = [prevNotFirst, item]; stuckNote = PL.stem.say("ronde.vast", {items: PL.stem.kort([...new Set(ks.map(x => PL.stem.label(T, x.key)))], 0, PL.stem.noun(T), 60), pl: ks[0].key !== ks[1].key, genus: PL.stem.genus(T)}, data.voice); }
      prevNotFirst = !r.first && !item.requeue ? item : null;
      res.items.push({label: item.label, first: r.first, step: r.step, item, rt, requeue: !!item.requeue, expl: r.expl || null});
      okRun = r.first ? okRun + 1 : 0;
      if (r.first && rt != null) res.rts.push(rt);
      if (/\+knop|nudge/.test(r.support || "")) res.hints++;
      res.switches += r.switches || 0;
      // begrip van de uitleg: lukt dezelfde vraag even later in één keer?
      // tussenstap-regel (A2): alleen een tussenstap waarin zij het antwoord zelf vond, telt voor "landt de uitleg"
      if (r.step && !item.requeue && !r.revealed){ const m = r.expl || "standaard"; data.explPending[item.key] = {m, st: item.stone}; res.modes[m] = (res.modes[m] || 0) + 1; }
      if (r.revealed) res.revealed = (res.revealed || 0) + 1;
      if (item.requeue){
        res.reqN++; if (r.first) res.reqOk++;
        const p = data.explPending[item.key];
        if (p){ const st = data.expl[p.st] || (data.expl[p.st] = {}); const s_ = st[p.m] || (st[p.m] = {ok: 0, no: 0, sw: 0}); if (r.first) s_.ok++; else s_.no++; delete data.explPending[item.key]; log({land: r.first ? 1 : 0, st: p.st, ex: p.m, k: item.key}); }
        res.reqItems.push({label: item.label, ok: r.first, expl: p ? p.m : null});
      }
      if (!item.requeue){ if (r.first) res.first++; if (r.step) res.steps++; if (fluent) res.fluent++; }
      if (!custom){ wheelRun = r.first ? wheelRun + 1 : 0; wheelCount = wheelRun >= 3 ? 0 : wheelCount + 1; }
      if (!r.first && !item.requeue && queue.length){ queue.splice(Math.min(P.requeueAfter, queue.length), 0, Object.assign({}, item, {requeue: true})); }
      i++;
      if (queue.length) keepOpen(); else delete data.open;
      $("pl-bar-i").style.width = (100 * i / (i + queue.length)) + "%";
      save();
      // v0.9.2: de oplossing blijft staan tot de volgende vraag: lang genoeg om "Gelukt" en het waarom te lezen
      // (1,2 s + 45 ms per teken, hooguit 7 s); "Verder" gaat meteen door. Het tempo wordt vóór deze pauze gemeten.
      if (r.first !== undefined && !($("pl-sheet") && $("pl-sheet").querySelector(".pl-ok"))) await sleep(T.okPause || 550);   // v0.17: snel door, in elke training
      else await waitNext(Math.max(T.pause || 900, Math.min(7000, 1200 + (($("pl-fb").innerText || "") + ($("pl-sheet") ? $("pl-sheet").innerText : "")).length * 45)) * (ctx.pace === "rustig" ? 1.4 : 1), run);
      if (run !== runId) return;
      ctx.fb.clear();
      showPrev();
    }
    inRound = false; topBtn(false); delete data.open;
    res.knownBefore = knownBefore;
    res.newKnown = [...new Set(res.items.filter(x => x.first && known(x.item.key) && !knownBefore.has(x.item.key)).map(x => x.label))];
    res.dueOk = res.items.filter(x => x.item.due && x.first).map(x => x.label);
    if (T.roundEnd) try { T.roundEnd(ctx, res); } catch(e){}
    // twee verborgen hefbomen: moeilijkheid (stap) en herhaling (spacing, in updateItem)
    let moved = 0;
    if (custom){ /* een eigen ronde telt mee voor beheersing en tempo, maar schuift de trainingsstap niet */ }
    else if (data.cooldown > 0) data.cooldown--;
    else if (res.first >= P.promoteFirst && green(cur.id) && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; }
    else if (res.steps >= P.demoteSteps && data.stage > 1){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; }
    if (!custom && wheelCount >= P.wheel && data.stage > 1 && moved === 0){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; log({wheel: 1, st: cur.id}); }
    if (moved !== 0){ wheelCount = 0; wheelRun = 0; }
    if (moved < 0) data.hold = P.holdRounds;
    // v0.13: de toets van "Te makkelijk" / "Pittig" (vorige ronde). Klopt het vermoeden, dan volgt de afgesproken stap.
    if (roundFeel){
      const E = PL.FEEL_EFFECT[roundFeel.why] || {}, its = res.items.filter(x => !x.requeue && x.item.stone === roundFeel.st);
      if (!its.length){ roundFeel.tries = (roundFeel.tries || 0) + 1; if (roundFeel.tries >= 2) delete data.feel; }   // die steen kwam niet langs: nog één ronde wachten
      else {
        const med = a => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;
        const firstRts = its.filter(x => x.first).map(x => x.rt);
        const pass = E.test === "zonder" ? its.length >= 2 && its.every(x => x.first && x.rt <= P.fluentMs * 1.5)
          : E.test === "flits" ? its.length >= 2 && its.filter(x => !x.first).length <= 1
          : E.test === "tempo" ? (roundFeel.base ? (med(firstRts) != null && med(firstRts) < roundFeel.base * 0.9) : firstRts.length >= its.length / 2)
          : E.test === "eerste" ? !!its[0].first
          : E.test === "gok" ? !its.some(x => !x.first && x.rt < 1500)
          : its.filter(x => !x.first).length <= 1;
        let did = "";
        if (pass && E.pass === "verder" && moved > 0) did = "verder";   // de motor zette de stap al: het vermoeden klopte
        else if (pass && E.pass === "verder" && moved === 0 && !custom && T.stones[data.stage - 1].id === roundFeel.st && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; did = "verder"; }
        else if (pass && E.pass === "flits"){ data.fade = data.fade || {}; data.fade[roundFeel.st] = 1; did = "flits"; }
        const lab = PL.stem.label(T, (its.find(x => pass ? x.first : !x.first) || its[0]).item.key), g = PL.stem.genus(T);
        res.feelMsg = E.kind === "makkelijk" ? (did === "verder" ? PL.stem.say("toets.verder", {item: lab, stap: T.stones[data.stage - 1].name, genus: g}, data.voice)
            : did === "flits" ? PL.stem.say("toets.flits", {item: lab, genus: g}, data.voice) : pass ? "" : PL.stem.say("toets.niet", {item: lab, genus: g}, data.voice))
          : PL.stem.say(pass ? "toets.pittig.ok" : "toets.pittig.nog", {item: lab, genus: g}, data.voice);
        data.feelLog = (data.feelLog || []).concat([{d: today(), kind: E.kind, why: roundFeel.why, st: roundFeel.st, pass, did: did || undefined}]).slice(-50);
        log({feelTest: roundFeel.why, st: roundFeel.st, pass: pass ? 1 : 0, did: did || undefined});
        delete data.feel;
      }
    }
    S.rounds++; data.lastPlayed = new Date().toISOString(); S.first += res.first; S.steps += res.steps; S.items += total;
    if (!S.forms.includes(form)) S.forms.push(form);
    data.forms[form].rounds++;
    const nMain = res.items.filter(x => !x.requeue).length;
    res.fr = nMain ? res.first / nMain : 0;
    log({round: 1, st: cur.id, f: form, first: res.first, steps: res.steps, fluent: res.fluent, moved, again: again ? 1 : 0, make: custom ? 1 : 0, n: nMain, fr: Math.round(res.fr * 100) / 100, reqN: res.reqN, reqOk: res.reqOk, sw: res.switches, adj: res.adj || undefined, rules: res.rules || undefined});
    res.frBefore = data.lastFr;
    if (res.adj && data.lastFr != null) log({adjResult: res.adj, before: data.lastFr, after: Math.round(res.fr * 100) / 100, st: cur.id});
    data.lastFr = Math.round(res.fr * 100) / 100;
    const facts = roundFacts(res, again);
    const base = PL.compose(facts, data.lines);
    data.lines = data.lines.concat(base.used).slice(-12);
    if (facts.has.wise && base.used.some(u => u.startsWith("wise"))) wiseShown = true;
    await save();
    const V = endVoice(res);
    lastRound = {res, moved, again, next: nextLine(res, moved, cur), base: V.high || base.text || `Je deed ${res.items.length} ${T.noun}, tot en met ${res.items[res.items.length - 1].label}.`, voice: V, mustHave: V.mustHave};
    save();
    showEnd(true);
  }

  /* v0.12 einde (S13, S16, S14, S8): één echt hoogtepunt, wat er groeide, wat terugkomt, en na een lange sessie: stoppen mag */
  function endVoice(res){
    const st = PL.stem, V = data.voice, g = st.genus(T), lab = k => st.label(T, k), tIso = today();
    const reg = new Date().getHours() >= 19 ? "rustig" : "";
    const out = {high: "", groei: "", morgen: "", lang: "", tired: false, mustHave: ""};
    const nkKeys = [...new Set(res.items.filter(x => x.first && known(x.item.key) && !res.knownBefore.has(x.item.key)).map(x => x.item.key))];
    for (const x of res.items){
      if (!x.first) continue;
      const bn = st.sig.breakNow(data, x.item.key, res.t0);   // de stand vóór deze ronde
      if (bn){ out.high = st.say("einde.doorbraak", {item: lab(x.item.key), eerder: st.dag(bn.eerder), genus: g, reg}, V); out.mustHave = lab(x.item.key); break; }
    }
    const vanzelf = () => st.say("einde.vanzelf", {items: st.kort(nkKeys.slice(0, 3).map(lab), nkKeys.length, st.noun(T)), pl: nkKeys.length > 1, genus: g, reg}, V);
    if (!out.high && nkKeys.length){ out.high = vanzelf(); out.mustHave = lab(nkKeys[0]); }
    else if (nkKeys.length) out.groei = vanzelf();
    if (!out.high){ const x = res.items.find(x => x.requeue && x.first); if (x){ out.high = st.say("einde.terugok", {item: lab(x.item.key), genus: g, reg}, V); out.mustHave = lab(x.item.key); } }
    if (!out.high && res.doubt){ out.high = st.say("einde.twijfel", {item: lab(res.doubt.key), genus: g, reg}, V); out.mustHave = lab(res.doubt.key); }
    if (!out.high){ const fs = res.items.filter(x => x.first); const x = fs[fs.length - 1]; if (x){ out.high = st.say("einde.zelf", {item: lab(x.item.key), genus: g, reg}, V); out.mustHave = lab(x.item.key); } }
    const today_ = realSessions(data).filter(s => s.d === tIso).reduce((a, s) => a + (s.rounds || 0), 0);
    if (!out.groei) out.groei = st.say("einde.tuin", {ronde: st.rang(Math.max(1, today_)), training: T.title, reg}, V);
    const back = [...new Set(res.items.filter(x => !x.first && !res.items.some(y => y.requeue && y.first && y.item.key === x.item.key)).map(x => x.item.key))];
    if (back.length) out.morgen = st.say("einde.morgen", {items: st.kort(back.slice(0, 3).map(lab), back.length, st.noun(T)), pl: back.length > 1, dagT: st.dagT(dayNum(tIso) + 1), genus: g, reg}, V);
    const tired = st.sig.tired(S, res, P.sessionMin);
    if (tired.lang){ out.tired = true; out.lang = st.say("einde.lang", {minuten: st.aantal(tired.min, "minuten"), reg}, V); }
    return out;
  }
  /* wat de volgende ronde wordt en waarom: dezelfde regels als composeRound, zonder iets te veranderen.
     "Nog een keer" is de knop; deze regel laat zien dat de volgende ronde uit haar resultaten volgt. */
  function nextLine(res, moved, cur){
    if (custom && custom.all) return `Weer alle ${T.noun} langs, in een nieuwe volgorde.`;
    if (custom) return `Weer jouw keuze: ${nameOf(custom.stoneId)}, met nieuwe ${T.noun}.`;
    let st = data.stage; if (!(data.hold > 0)) while (st < T.stones.length && green(T.stones[st - 1].id)) st++;
    const next = T.stones[st - 1], s_ = stone(cur.id);
    if (moved > 0) return `${cap(nameOf(cur.id))} gaat nu vanzelf. Volgende ronde: ${next.name}.`;
    if (moved < 0) return `Eerst nog even ${next.name}; daarna weer verder.`;
    if (next.id !== cur.id) return `${cap(nameOf(cur.id))} gaat al vanzelf. Volgende ronde: ${next.name}.`;
    if (green(cur.id)) return `${cap(nameOf(cur.id))} gaat vanzelf. Volgende ronde: vasthouden, met nieuwe ${T.noun}.`;
    if (s_.power) return `${cap(nameOf(cur.id))} lukt bijna altijd meteen. We blijven hier tot het vanzelf gaat.`;
    return `Volgende ronde: weer ${nameOf(cur.id)}, met nieuwe ${T.noun}${res.steps ? ", en wat een tussenstap nodig had" : ""}.`;
  }
  /* waarnemingen van één ronde, voor de stem (PL.compose) en voor de AI-haak */
  function roundFacts(res, again){
    const names = m => ctx.modeName(m);
    const reqOk = res.reqItems.filter(x => x.ok), reqNo = res.reqItems.filter(x => !x.ok);
    const help = reqOk.find(x => x.expl && names(x.expl));
    const stepItem = res.items.find(x => x.step && !x.requeue);
    const last = res.items[res.items.length - 1];
    const f = {noun: T.noun, n: res.items.length, last: last ? last.label : "", fl: res.fluent, r: S.rounds, again: !!again, adj: res.adj,
      L: (help || reqOk[0] || reqNo[0] || stepItem || {}).label || "", M: help ? names(help.expl) : roundAdj && roundAdj.mode ? names(roundAdj.mode) : "",
      Mpl: !!(help && T.explainPlural && T.explainPlural[help.expl]),
      K: lst(res.newKnown.slice(0, 2)), k: Math.min(2, res.newKnown.length), D: res.dueOk[0] || "", has: {}};
    f.has.explHelp = !!help;
    f.has.reqOk = !!reqOk.length;
    f.has.reqStill = !reqOk.length && !!reqNo.length;
    if (f.has.reqStill) f.L = reqNo[0].label;
    f.has.step = !reqOk.length && !reqNo.length && !!stepItem;
    f.has.newKnown = res.newKnown.length > 0;
    f.has.switch = res.switches > 0;
    f.has.dueOk = res.dueOk.length > 0;
    f.has.adjOk = !!res.adj && (res.adj === "lang" || (res.frBefore != null && res.fr > res.frBefore)) && (res.adj !== "uitleg" || !!f.M);
    f.has.fluent = res.fluent >= 4 && !res.steps;
    f.has.wise = !wiseShown && res.steps >= 2;
    f.has.allSelf = !res.steps && res.items.every(x => x.first);
    f.has.roundN = S.rounds >= 3;
    return f;
  }
  /* meting van de ronde voor de reden-vraag (alleen intern; Natalia ziet geen cijfers) */
  function roundMeasure(res){
    const modes = T.explainModes || null;
    const used = Object.keys(res.modes).sort((x, y) => res.modes[y] - res.modes[x])[0] || null;
    const mode = used && used !== "standaard" ? used : null;
    const stats = data.expl[res.stoneId] || {};
    const nextMode = modes ? PL.chooseExpl(modes, stats, mode || modes[0], 0.99) : null;
    return {fr: res.fr, steps: res.steps, reqN: res.reqN, reqOk: res.reqOk, switches: res.switches, mode, nextMode, hasModes: !!modes,
      pl: !!(mode && T.explainPlural && T.explainPlural[mode]), modeName: mode ? ctx.modeName(mode) : "", nextName: nextMode ? ctx.modeName(nextMode) : "", form: T.forms[form].name.toLowerCase()};
  }

    let fact = "";

    route("klaar", true); app.classList.remove("pl-inround", "pl-atstart");
    // v0.11 (Peak-End): een kort feestje. Geen score: wat ze deed, wat erbij groeide, en één volgende stap.
    const V = lastRound.voice || {};   // v0.12: de stem (src/stem.js)
    screen.innerHTML = `
      <div class="pl-intro pl-end">
      <div class="pl-card pl-endcard">
        <div class="pl-endtop"><span class="pl-endflower" aria-hidden="true">${PL.flower(5, {stem: false})}</span><h2 class="pl-h2">Ronde klaar</h2></div>
        <div class="pl-cheer" id="pl-cheer" aria-live="polite">${esc(lastRound.cheer || lastRound.base)}</div>
        ${res.feelMsg ? `<p class="pl-stemline pl-toets">${esc(res.feelMsg)}</p>` : ""}
        ${V.groei ? `<p class="pl-grow">${esc(V.groei)}</p>` : ""}
        <div class="pl-tuinwrap pl-tuin-onder pl-tuin-perk" id="pl-endtuin" aria-hidden="true"></div>
        <p class="pl-note pl-nextline"><b>Volgende ronde.</b> ${esc(lastRound.next)}</p>
        ${V.lang ? `<p class="pl-note pl-stemline">${esc(V.lang)}</p>` : ""}
        <div class="pl-feelwrap"><span class="pl-note">Te makkelijk of pittig? Zeg het gerust.</span>${feelHTML("einde")}</div>
        ${(T.endExtra || V.morgen || fact || (custom && !custom.all)) ? `<details class="pl-details pl-more"><summary>Meer</summary>
        ${T.endExtra ? T.endExtra(ctx, res) : ""}
        ${V.morgen ? `<p class="pl-note pl-stemline">${esc(V.morgen)}</p>` : ""}
        ${fact}
        ${custom && !custom.all ? `<button class="pl-help" id="pl-make3" type="button">Iets anders kiezen</button>` : ""}</details>` : ""}
      </div>
      <div class="pl-actions">
        ${V.tired ? `<button class="pl-btn big pl-full" id="pl-stop" type="button">Klaar voor vandaag</button>
        <button class="pl-btn quiet pl-full" id="pl-again" type="button">Nog een keer</button>` : `<button class="pl-btn big pl-full" id="pl-again" type="button">Nog een keer</button>
        <button class="pl-btn quiet pl-full" id="pl-stop" type="button">Klaar voor vandaag</button>`}
      </div></div>`;
    allStates().then(st => { const b = $("pl-endtuin"); if (b && PL.tuin) PL.tuin(b, {states: st, strook: true, focus: T.id}); });
    if (!feelStone) feelStone = res.stoneId;
    wireFeel();
    $("pl-again").addEventListener("click", () => { S.again++; data.forms[form].again++; if (lastRound.ev) lastRound.ev.again = 1; if (T.onAgain) try { T.onAgain(ctx); } catch(e){} save(); playRound(true); });
    const mk = $("pl-make3"); if (mk) mk.addEventListener("click", () => showMake());
    $("pl-stop").addEventListener("click", showBye);
    $("pl-again").focus();
    if (fresh && !lastRound.cheer){
      const facts = res.items.map(x => `${x.label}: ${x.first ? "zelf in één keer" : "via een tussenstap"}${x.requeue ? " (kwam terug)" : ""}`).join("; ");
      PL.ai(`Je bent het rustige oefenmaatje in Leeratelier, een oefenspel voor een kind. Herschrijf de bemoediging hieronder in één of twee korte zinnen in het Nederlands, direct tegen ${SPACE.learnerName}.
Regels: houd het concreet over wat ze deed; verander geen feiten. Noem geen cijfers, scores, niveaus, groepen of leeftijd. Zeg niet "makkelijk", "moeilijk", "fout" of "slim". Geen emoji. Geen overdreven lof. Een tussenstap nemen is goed; benoem dat zo als het gebeurde.${again ? " Ze koos zelf voor nog een keer; beloon dat kort." : ""}
Training: ${T.title}. Vorm: ${T.forms[form].name}.
Wat er gebeurde: ${facts}.
De bemoediging uit de code: ${lastRound.base}
Antwoord alleen met de zinnen.`).then(t => { if (t && (!lastRound.mustHave || t.includes(lastRound.mustHave)) && !PL.stem.VERBODEN.test(t)){ /* v0.12: het feit moet blijven, verboden woorden niet */ lastRound.cheer = t; const el = $("pl-cheer"); if (el) el.textContent = t; } });
    }
  }
  /* alle trainingen laden (de tuin is van alles samen), dan inzoomen op het tuintje van deze training */
  async function allStates(){ const st = {}; for (const t of trainings) st[t.id] = t.id === T.id ? data : ((await store.load("philearn-" + t.id)) || null); return mergeGroups(st); }
  async function showGarden(back, fromRoute){
    if (!fromRoute) route("tuin");
    app.classList.remove("pl-inround", "pl-atstart");
    const can = T.canDo(ctx);
    gardenBack = back || null;
    // v0.12 (S9, S12, S14, S16): de resultatenkaart van deze training, in zinnen met feiten; daaronder wat ze al kan
    const bl = resultBlocks(T, data, data.voice), pl = perkLine(T, data, data.voice);
    screen.innerHTML = `
      <div class="pl-intro">
      <div class="pl-card pl-tuinpagina" style="display:grid;gap:12px">
        <h2 class="pl-h2">Mijn tuin</h2>
        <div class="pl-tuinwrap" id="pl-tuin"></div>
        <p class="pl-rups">${esc(pl)}</p>
        ${bl.length ? `<div class="pl-result" aria-live="polite">${resultHTML(bl)}</div>` : ""}
        <div><h3 class="pl-h2" style="font-size:1.2rem">${esc(T.canTitle)}</h3>${can.length ? `<ul class="pl-cando">${can.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : `<p class="pl-note">Dit lijstje groeit vanzelf als je traint.</p>`}</div>
      </div>
      <div class="pl-actions"><button class="pl-btn big pl-full" id="pl-back" type="button">Verder trainen</button></div></div>`;
    $("pl-back").addEventListener("click", () => (back ? back(false) : showStart()));
    save();
    if (PL.tuin) PL.tuin($("pl-tuin"), {states: await allStates(), focus: T.id});
  }
  let gardenBack = null;
  /* --- een ronde verlaten (v0.11, Zeigarnik): de ronde blijft bewaard, dus er hoeft niets bevestigd te worden.
         Home en de terug-knop gaan meteen; op Home en hier staat daarna "Ga verder". --- */
  function leaveGuard(go){
    if (!inRound) return go();
    runId++; inRound = false; topBtn(false); app.classList.remove("pl-inround", "pl-atstart");
    log({leave: 1, st: custom && !custom.all ? custom.stoneId : T.stones[data.stage - 1].id, f: form, open: data.open ? data.open.i : undefined});
    if (data.open && data.open.i === 0 && !(data.open.q || []).some(o => o.rq)) delete data.open;   // nog niets gedaan: dan is er niets om af te maken
    if (T.teardown) T.teardown(ctx);
    ctx.fb.clear();
    save().then(go, go);   // eerst bewaren, dan pas Home laden (anders mist Home de open ronde)
  }
  $("pl-garden-btn").addEventListener("click", () => { const wasIn = inRound; leaveGuard(() => showGarden(wasIn || !lastRound ? () => showStart() : showEnd)); });
  PL._current = T; PL._guard = leaveGuard;
  const hb = $("pl-home-btn"); if (hb) hb.addEventListener("click", () => leaveGuard(() => { setRoute(""); PL.home(); }));
  /* terug/vooruit van de browser binnen deze training */
  PL._view = v => {
    if (v === view) return;
    if (v === "ronde"){ if (inRound) return; view = v; const op = openRound(data); return op ? playRound(false, op) : (lastRound ? showEnd(false) : showStart(true)); }
    view = v;
    leaveGuard(() => {
      if (v === "tuin") return showGarden(gardenBack, true);
      if (v === "bedenk") return showMake(true);
      if (v === "klaar" && lastRound) return showEnd(false);
      view = v === "klaar" ? "" : v; return showStart(true);
    });
  };

  function showBye(){
    route("", true); app.classList.remove("pl-inround", "pl-atstart");
    screen.innerHTML = `<div class="pl-intro"><div class="pl-card" style="display:grid;gap:12px"><h2 class="pl-h2">Tot de volgende keer</h2>
      <p class="pl-lead">Je tuin groeit mee met wat je vandaag deed. De volgende keer beginnen we met iets wat vandaag lukte.</p>
      <div class="pl-tuinwrap" id="pl-tuin"></div></div>
      <div class="pl-actions">${trainings.length > 1 ? `<button class="pl-btn big pl-full" id="pl-bye-home" type="button">Naar Home</button>` : ""}<button class="pl-btn quiet pl-full" id="pl-restart" type="button">Toch nog een ronde</button></div></div>`;
    save().then(async () => { if (PL.tuin && $("pl-tuin")) PL.tuin($("pl-tuin"), {states: await allStates(), strook: true}); });
    $("pl-restart").addEventListener("click", () => playRound(true));
    const h = $("pl-bye-home"); if (h) h.addEventListener("click", () => { setRoute(""); PL.home(); });
  }

  wireParent(T, null, {data, resetSession(){ if (sessionAdded){ data.sessions = data.sessions.filter(x => x !== S); sessionAdded = false; } }, showStart, setLastRound(v){ lastRound = v; }});
  const h0 = parseHash().view;
  if (opts.make || h0 === "bedenk") showMake(true);
  else if (opts.resume || h0 === "ronde"){ const op = openRound(data); if (op){ view = "ronde"; playRound(false, op); } else showStart(); }
  else if (h0 === "tuin") showGarden(null, true);
  else showStart(true);
};

    $("pl-close").addEventListener("click", () => { P_.hidden = true; });
    $("pl-copy").addEventListener("click", () => copy(text, "pl-copied", "Weekoverzicht"));

    $("pl-export").addEventListener("click", () => copy(`PHILEARN-STAND v2\n` + JSON.stringify({trainings: all, content}), "pl-exported", "Stand"));
    let pendingRaw = null;
    $("pl-import").addEventListener("input", () => { if (pendingRaw){ pendingRaw = null; $("pl-import-btn").textContent = "Verwerk"; $("pl-imported").textContent = ""; } });
    $("pl-import-btn").addEventListener("click", async () => {
      const raw = $("pl-import").value.trim(); const out = $("pl-imported");
      const m = raw.match(/^PHILEARN-STAND(?: (\S+))? v([12])\s*([\s\S]+)$/);
      if (m){
        let obj; try { obj = JSON.parse(m[3]); } catch(e){ out.textContent = "De stand is niet compleet gekopieerd."; return; }
        if (m[2] === "1"){ const id = m[1]; if (!id || !trainings.find(t => t.id === id)){ out.textContent = `Onbekende training in deze stand: ${id || "?"}.`; return; } delete obj.explanations; obj.v = 2; obj.stones = obj.stones || {}; obj.events = obj.events || []; obj = {trainings: {[id]: obj}}; }
        // een stand vervangt wat er nu is: eerst bevestigen (C9)
        if (pendingRaw !== raw){
          pendingRaw = raw;
          const ids_ = Object.keys(obj.trainings || {}).filter(id => obj.trainings[id]);
          const now = ids_.map(id => { const cur = T && id === T.id ? H.data : (states && states[id]); const nm = (trainings.find(t => t.id === id) || {title: id}).title; return `${nm}: nu ${realSessions(cur).length}, in de stand ${realSessions(obj.trainings[id]).length} sessies`; });
          out.textContent = `Dit vervangt de stand van ${ids_.length} training${ids_.length === 1 ? "" : "en"} (${now.join("; ")}). Wat er nu staat, is daarna weg. Tik nog een keer op "Ja, vervang" als dat goed is.`;
          $("pl-import-btn").textContent = "Ja, vervang";
          return;
        }
        pendingRaw = null; $("pl-import-btn").textContent = "Verwerk";
        for (const id of Object.keys(obj.trainings || {})){
          if (!obj.trainings[id]) continue;
          if (T && id === T.id){ H.resetSession(); for (const k of Object.keys(H.data)) delete H.data[k]; Object.assign(H.data, obj.trainings[id]); H.data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, H.data.forms || {}); saving = saving.then(() => store.save("philearn-" + id, H.data)); }
          else await store.save("philearn-" + id, obj.trainings[id]);
        }
        if (obj.content){ content = obj.content; await store.save(CONTENT_KEY, content); }
        if (T) H.setLastRound(null);
        out.textContent = `Stand teruggezet voor: ${Object.keys(obj.trainings || {}).join(", ")}.`;
        setTimeout(() => { P_.hidden = true; T ? H.showStart() : PL.home(); }, 900);
        return;
      }
      let obj; try { obj = JSON.parse(raw); } catch(e){ out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\"."; return; }
      if (obj.training && Array.isArray(obj.items)){
        const tr = trainings.find(t => t.id === obj.training);
        if (!tr){ out.textContent = `Onbekende training: ${obj.training}.`; return; }
        const check = tr.checkPack ? tr.checkPack(obj) : {ok: obj.items.length, bad: []};
        const name = obj.name || ("pakket-" + today());
        content.packs = content.packs.filter(p => p.name !== name).concat([{name, training: obj.training, items: obj.items, added: today()}]);
        await store.save(CONTENT_KEY, content);
        if (T && T.id === obj.training && T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
        out.textContent = `Pakket "${name}" toegevoegd: ${check.ok} items${check.bad.length ? `, ${check.bad.length} overgeslagen (${check.bad.slice(0, 3).join(", ")})` : ""}.`;
        return;
      }
      out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\".";
    });

  }

};
