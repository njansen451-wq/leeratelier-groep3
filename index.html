/* Compact rekenrek voor keuzes ("Waar zie je er …?"): alleen de kralen die meetellen, op vaste plekken in rijen van tien,
   vijf rood en vijf wit per rij, met een kleine opening na de vijfde. Zo is 15 in één oogopslag "een volle rij en vijf rood"
   (vijf- en tienstructuur, Treffers 1991; kralenlessen Freudenthal Instituut). Geen bleke kralen: die zijn op een klein scherm ruis. */
P.rekenrekKort = function(n){
  const rows = n > 10 ? 2 : 1, r = 12, dx = 27, gap5 = 10, pad = 14, W = pad * 2 + 9 * dx + gap5 + r * 2, rowH = 34, H = pad * 2 + rows * rowH - 6;
  let b = `<rect x="3" y="3" width="${W - 6}" height="${H - 6}" rx="12" fill="none" stroke="${C.woodDark}" stroke-width="5"/>`;
  [Math.min(n, 10), n > 10 ? n - 10 : 0].slice(0, rows).forEach((k, ri) => {
    const y = pad + r + ri * rowH;
    b += `<line x1="8" y1="${y}" x2="${W - 8}" y2="${y}" stroke="${C.woodDark}" stroke-width="2.5" opacity=".55"/>`;
    for (let i = 0; i < k; i++){
      const x = pad + r + i * dx + (i >= 5 ? gap5 : 0), red = i < 5;
      b += `<circle cx="${x}" cy="${y}" r="${r}" fill="${red ? C.red : C.white}" stroke="${red ? C.redDark : C.navy}" stroke-width="${red ? 1.5 : 2.5}"/>`;
    }
  });
  return svg(`0 0 ${W} ${H}`, b, "k-rrkort");
};
P.rekenrek = function(top, bottom, o){
  o = o || {}; const rows = o.rows || (bottom == null ? 1 : 2), W = 340, rowH = 46, H = 22 + rows * rowH;
  let b = `<rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="10" fill="none" stroke="${C.woodDark}" stroke-width="6"/>`;
  [top, bottom].slice(0, rows).forEach((n, r) => {
    const y = 6 + 14 + r * rowH + rowH / 2 - 4;
    b += `<line x1="12" y1="${y}" x2="${W - 12}" y2="${y}" stroke="${C.woodDark}" stroke-width="3"/>`;
    for (let i = 0; i < 10; i++){
      const moved = i < n, x = moved ? 30 + i * 21 : W - 30 - (9 - i) * 21 - (n === 10 ? 0 : 0);
      // per rij vijf rood en vijf wit, zoals het rekenrek in de klas (rood betekent hier nooit "mis")
      const red = i < 5, dotted = o.empty && !moved && i < (o.empty[r] || 0) + n;
      b += `<circle cx="${x}" cy="${y}" r="9.5" fill="${red ? C.red : C.white}" stroke="${red ? C.redDark : C.navy}" stroke-width="${red ? 1.5 : 2.5}" opacity="${moved || o.all ? 1 : 0.38}"/>`;

/* kies uit kandidaten wat nog niet vlot gaat; wat aan herhaling toe is eerst */
function choose(ctx, cands){
  const sc = k => { const r = ctx.rec(k); return (ctx.due(k) ? -20 : 0) + (ctx.known(k) ? 10 : 0) + (r.last === "step" ? -5 : 0) + Math.random() * 6; };
  return cands.map(k => [sc(k), k]).sort((a, b) => a[0] - b[0])[0][1];
}
/* drie getallen: het antwoord en twee buren (bij hulp: twee); bij tientallen buren van tien */
function numberChoices(ans, lo, hi, support, stap){
  stap = stap || 1;
  const near = shuffle([ans - stap, ans + stap, ans - 2 * stap, ans + 2 * stap].filter(v => v >= lo && v <= hi && v !== ans));
  return shuffle([ans].concat(near.slice(0, support ? 1 : 2))).map(v => ({value: v, label: String(v), html: `<span class="k-num">${v}</span>`}));
}
const qhtml = (vis, extra) => `<div class="k-q"><div class="k-vis">${vis}</div>${extra || ""}</div>`;
const rr = n => P.rekenrek(Math.min(n, 10), n > 10 ? n - 10 : null, {rows: n > 10 ? 2 : 1});
const addHelp = (ctx, html) => { const v = ctx.work.querySelector(".k-vis"); if (!v) return; const h = v.querySelector(".k-help"); if (h) h.innerHTML = html; else v.insertAdjacentHTML("beforeend", `<div class="k-help">${html}</div>`); };
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);

/* ---------- Tellen ---------- */
// key: tel:<vorm>:<n>  d = dobbelsteen, h = vingers, r = rekenrek, o = omgekeerd (waar zie je er n?); tel:s:<sprong>:<start> = verder tellen
const tel = {
  id: "tellen", line: "rekenen", title: "Tellen", icon: P.icon.tellen,
  introParts: () => [z("tel-intro")],
  stones: [
    {id: "TL1", name: "tellen tot 5", gen: ctx => tel.fromKey(choose(ctx, range(1, 5).flatMap(n => [`tel:d:${n}`, `tel:h:${n}`]).concat([3, 4, 5].map(n => `tel:o:${n}`))))},
    {id: "TL2", name: "tellen tot 10", gen: ctx => tel.fromKey(choose(ctx, range(6, 10).flatMap(n => [`tel:h:${n}`, `tel:r:${n}`]).concat([4, 6, 7, 8].map(n => `tel:o:${n}`))))},
    {id: "TL3", name: "tellen tot 20", gen: ctx => tel.fromKey(choose(ctx, range(11, 20).map(n => `tel:r:${n}`).concat([12, 15, 18].map(n => `tel:o:${n}`))))},
    {id: "TL4", name: "verder tellen in sprongen", g4: true, gen: ctx => tel.fromKey(choose(ctx, [2, 5, 10].flatMap(s => range(0, 9).filter(i => (i + 3) * s <= 100).map(i => `tel:s:${s}:${i}`))))}
  ],
  stoneOf: k => { const [, v, a] = k.split(":"); if (v === "s") return "TL4"; const n = +a; return n <= 5 ? "TL1" : n <= 10 ? "TL2" : "TL3"; },
  fromKey: k => { const p = k.split(":"); return p[1] === "s" ? {key: k, vorm: "s", s: +p[2], i: +p[3]} : {key: k, vorm: p[1], n: +p[2]}; },
  sayItem: k => { const it = tel.fromKey(k); return [getal(it.vorm === "s" ? (it.i + 3) * it.s : it.n)]; },
  vis(v, n){ return v === "d" ? P.dobbel(n) : v === "h" ? P.handen(n) : rr(n); },
  async ask(ctx, it){
    if (it.vorm === "s"){   // 2, 4, 6, … wat komt hierna?
      const rij = [0, 1, 2].map(j => (it.i + j + 1) * it.s), ans = (it.i + 4) * it.s;
      ctx.work.innerHTML = qhtml(`<div class="k-rij">${rij.map(x => `<span class="k-num">${x}</span>`).join("")}<span class="k-num k-open">?</span></div>`);
      ctx.say(rij.map(getal).flatMap(g => [g, {gap: 250}]).concat([z("tel-verder")]));
      return KS.choose(ctx, {options: numberChoices(ans, 0, 100, it.support, it.s === 10 ? 10 : 1), correct: ans, answer: [getal(ans)],
        stepBack: () => { addHelp(ctx, P.tientallen(Math.min(ans, 100))); return rij.map(getal).flatMap(g => [g, {gap: 300}]).concat([z("tel-verder")]); }});
    }
    const n = it.n, max = n <= 5 ? 6 : n <= 10 ? 10 : 20;
    if (it.vorm === "o"){
      const kind = n <= 6 ? "d" : "r";
      const others = shuffle([n - 1, n + 1, n - 2, n + 2].filter(v => v >= 1 && v <= (kind === "d" ? 6 : 20) && v !== n)).slice(0, it.support ? 1 : 2);
      const opts = shuffle([n].concat(others)).map(v => ({value: v, label: "", html: kind === "d" ? P.dobbel(v) : P.rekenrekKort(v)}));
      ctx.work.innerHTML = qhtml(`<div class="k-asknum"><span class="k-num k-num-big">${n}</span></div>`);
      ctx.say([z("tel-waar"), {gap: 300}, getal(n), {t: "?"}]);
      return KS.choose(ctx, {options: opts, correct: n, answer: [getal(n)], cls: kind === "r" ? "k-pics k-rrkeuze" : "k-pics", stepBack: () => [z("tel-plaatjes")]});
    }
    const prompt = it.vorm === "d" ? "tel-stippen" : it.vorm === "h" ? "tel-vingers" : "tel-kralen";
    ctx.work.innerHTML = qhtml(tel.vis(it.vorm, n) + (it.support && it.vorm !== "r" ? `<div class="k-help">${rr(n)}</div>` : ""));
    ctx.say([z(prompt)]);
    return KS.choose(ctx, {options: numberChoices(n, 1, max, it.support), correct: n, answer: [getal(n)],
      stepBack: () => { if (it.vorm !== "r") addHelp(ctx, rr(n)); return [z("tel-mee")]; }});
  }
};

/* ---------- Splitsen (v0.15: zoals in het werkboek) ----------
   Woorden van school: "splits", "maak de splitstabel". Drie vormen, steeds in deze volgorde: met plaatjes, met getallen (ook 0),
   de splitstabel (rij voor rij; links 1, 2, 3 …). Eerst tot 5, dan 6 tot 10. Daarna samen 10 vlot en tot 20 (de vormen van v0.14).
   keys: sp:p:<heel>:<deel>            plaatjes; deel staat links, rechts is leeg
         sp:g:<heel>:<deel>:<leeg>     getallen; leeg = l of r (welk vakje leeg is), deel staat in het andere vakje
         sp:t:<heel>:<rij>:<leeg>      splitstabel; rij i heeft links i en rechts heel − i
         sp:5:<a> sp:10:<a> sp:20:<n>  oude vormen (v0.14) */
for (let h = 1; h <= 10; h++){ zin["sp-splits-" + h] = `Splits ${woordVan(h)}.`; if (h >= 3) zin["sp-tabel-" + h] = `Maak de splitstabel van ${woordVan(h)}.`; }
for (let d = 0; d <= 10; d++){ zin["sp-l-" + d] = `${cap(woordVan(d))} en hoeveel?`; zin["sp-r-" + d] = `Hoeveel en ${woordVan(d)}?`; }
Object.assign(zin, {
  "sp-intro": "Splitsen. Eén getal in twee stukken.",
  "sp-tel-over": "Die zijn er al. Tel wat over is.",
  "sp-kijk-plaatjes": "Kijk naar de plaatjes. Tel wat over is.",
  "sp-rij-boven": "Kijk naar de rij erboven.",
  "sp-patroon": "Zie je het? Links steeds één meer, rechts één minder."
});
KS.addZin(zin);
const spRij = (h, d, leeg) => leeg === "r" ? z("sp-l-" + d) : z("sp-r-" + d);   // d = het getal dat er staat
const spVul = ctx => v => { const e = ctx.work.querySelector("[data-leeg]"); if (!e) return; e.removeAttribute("data-leeg"); e.classList.add("k-spvol"); e.innerHTML = e.classList.contains("k-spvak") ? `<span class="k-num">${v}</span>` : String(v); };
const tafelKeys = (hs, leeg) => hs.map(h => `sp:t:${h}:1:${leeg}`);
function tafelGen(ctx, stoneId, hs, leegs){
  const t = ctx._tafel;
  if (t && t.stone === stoneId && t.i < t.h) { t.i++; return sp.fromKey(`sp:t:${t.h}:${t.i}:${t.leeg}`); }
  const leeg = leegs[Math.floor(Math.random() * leegs.length)];
  const it = sp.fromKey(choose(ctx, tafelKeys(hs, leeg)));
  ctx._tafel = {stone: stoneId, h: it.heel, i: 1, leeg};
  return it;
}
const sp = {
  id: "splitsen", line: "rekenen", title: "Splitsen", icon: P.icon.splitsen,
  introParts: () => [z("sp-intro")],
  stones: [
    {id: "SP1", name: "splits, met plaatjes tot 5", gen: ctx => sp.fromKey(choose(ctx, range(2, 5).flatMap(h => range(1, h - 1).map(d => `sp:p:${h}:${d}`))))},
    {id: "SP2", name: "splits, met getallen tot 5 (ook 0)", gen: ctx => sp.fromKey(choose(ctx, range(1, 5).flatMap(h => range(0, h).flatMap(d => [`sp:g:${h}:${d}:r`, `sp:g:${h}:${d}:l`]))))},
    {id: "SP3", name: "maak de splitstabel tot 5", gen: ctx => tafelGen(ctx, "SP3", range(3, 5), ["r"])},
    {id: "SP4", name: "splits, met plaatjes 6 tot 10", gen: ctx => sp.fromKey(choose(ctx, range(6, 10).flatMap(h => range(1, h - 1).map(d => `sp:p:${h}:${d}`))))},
    {id: "SP5", name: "splits, met getallen 6 tot 10 (ook 0)", gen: ctx => sp.fromKey(choose(ctx, range(6, 10).flatMap(h => range(0, h).flatMap(d => [`sp:g:${h}:${d}:r`, `sp:g:${h}:${d}:l`]))))},
    {id: "SP6", name: "maak de splitstabel 6 tot 10", gen: ctx => tafelGen(ctx, "SP6", range(6, 10), ["r"])},
    {id: "SP6b", name: "maak de splitstabel, ook links leeg", gen: ctx => tafelGen(ctx, "SP6b", range(3, 10), ["l", "l", "r"])},
    {id: "SP7", name: "samen 10, vlot", gen: ctx => sp.fromKey(choose(ctx, range(1, 9).map(a => `sp:10:${a}`)))},
    {id: "SP8", name: "tot 20: tien en nog wat", g4: true, gen: ctx => sp.fromKey(choose(ctx, range(11, 20).map(n => `sp:20:${n}`)))}
  ],
  stoneOf: k => {
    const p = k.split(":");
    if (p[1] === "p") return +p[2] <= 5 ? "SP1" : "SP4";
    if (p[1] === "g") return +p[2] <= 5 ? "SP2" : "SP5";
    if (p[1] === "t") return p[4] === "l" ? "SP6b" : +p[2] <= 5 ? "SP3" : "SP6";
    return ({5: "SP2", 10: "SP7", 20: "SP8"})[p[1]];
  },
  fromKey: k => {
    const p = k.split(":");
    if (p[1] === "p") return {key: k, vorm: "p", heel: +p[2], deel: +p[3], leeg: "r", ans: +p[2] - +p[3]};
    if (p[1] === "g") return {key: k, vorm: "g", heel: +p[2], deel: +p[3], leeg: p[4], ans: +p[2] - +p[3]};
    if (p[1] === "t"){ const h = +p[2], i = +p[3]; return {key: k, vorm: "t", heel: h, rij: i, leeg: p[4], deel: p[4] === "r" ? i : h - i, ans: p[4] === "r" ? h - i : i}; }
    const h = +p[1], a = +p[2];
    if (h === 5) return sp.fromKey(`sp:g:5:${a}:r`);   // oude sleutel: altijd in de nieuwe vorm
    return h === 20 ? {key: k, heel: 20, n: a, ans: a - 10} : {key: k, heel: h, a, ans: h - a};
  },
  sayItem: k => { const it = sp.fromKey(k); return [getal(it.ans)]; },
  /* oude stand (v0.14: SP1 samen 5, SP2 samen 10, SP3 tot 20) overzetten: de oude stenen bewaren onder een andere naam,
     en wie verder was dan samen 5 begint bij SP2 (met getallen); de oude items tellen mee bij SP2, SP7 en SP8 */
  upgrade(d){
    if (!(d.spv >= 2)){
      for (const id of ["SP1", "SP2", "SP3"]) if (d.stones[id]){ d.stones["v014-" + id] = d.stones[id]; delete d.stones[id]; }
      d.stage = Math.min(d.stage || 1, 2); d.spv = 2;
    }
    // v0.15.1: de oude "samen 5"-oefeningen (met de hand) worden "Splits vijf. a en hoeveel?"; wat het kind ervan wist blijft bewaard
    if (d.spv < 3){
      for (const k of Object.keys(d.items)){ const m = /^sp:5:(\d+)$/.exec(k); if (!m) continue; const nk = `sp:g:5:${m[1]}:r`; if (!d.items[nk]) d.items[nk] = d.items[k]; delete d.items[k]; }
      d.spv = 3;
    }
  },
  async ask(ctx, it){
    if (it.vorm) return sp.askNieuw(ctx, it);
    if (it.heel === 20){
      ctx.work.innerHTML = qhtml(`<div class="k-asknum"><span class="k-num k-num-big">${it.n}</span></div>` + P.rekenrek(10, it.ans, {rows: 2}));
      ctx.say([getal(it.n), {gap: 300}, z("sp-na-tien")]);
      return KS.choose(ctx, {options: numberChoices(it.ans, 0, 10, it.support), correct: it.ans, answer: [getal(it.ans)],
        stepBack: () => [z("tel-mee")]});
    }
    // samen 10, vlot (SP7): het rekenrek met de kralen die er al zijn
    ctx.work.innerHTML = qhtml(P.rekenrek(it.a, null, {rows: 1, empty: it.support ? [it.ans] : null}));
    ctx.say([{id: "n-kralen-" + it.a, t: zin["n-kralen-" + it.a]}, {gap: 300}, z("sp-tot"), {gap: 300}, getal(it.heel)]);
    return KS.choose(ctx, {options: numberChoices(it.ans, 0, it.heel, it.support), correct: it.ans, answer: [getal(it.ans)],
      stepBack: () => { ctx.work.querySelector(".k-vis").innerHTML = P.rekenrek(it.a, null, {rows: 1, empty: [it.ans]}); return [z("tel-leeg")]; }});
  },
  async askNieuw(ctx, it){
    const h = it.heel, d = it.deel, ding = P.TELDING.length ? P.TELDING[Math.floor(Math.random() * P.TELDING.length)] : "";
    const plaatjes = licht => P.splitsPlaatjes(h, ding, licht);
    let vis, zeg, stepBack;
    if (it.vorm === "t"){
      const rows = range(1, h).map(i => ({l: i, r: h - i, toon: i < it.rij ? "vol" : i === it.rij ? "vraag" : "later"}));
      vis = P.splitstabel(h, rows, it.leeg);
      zeg = (it.rij === 1 ? [z("sp-tabel-" + h), {gap: 350}] : []).concat([spRij(h, d, it.leeg)]);
      stepBack = () => {
        if (it.rij > 1){ const r = ctx.work.querySelectorAll(".k-strij")[it.rij - 2]; if (r) r.classList.add("k-st-vraag"); return [z("sp-rij-boven"), {gap: 300}, spRij(h, d, it.leeg)]; }
        addHelp(ctx, plaatjes(d)); return [z("sp-kijk-plaatjes")];
      };
    } else {
      const top = it.vorm === "p" ? plaatjes(0) : `<span class="k-num">${h}</span>`;
      vis = it.leeg === "r" ? P.splitsvorm(top, d, "", "r") : P.splitsvorm(top, "", d, "l");
      zeg = [z("sp-splits-" + h), {gap: 300}, spRij(h, d, it.leeg)];
      stepBack = () => {
        const t = ctx.work.querySelector(".k-sptop"); if (t) t.innerHTML = plaatjes(d);
        return [z(it.vorm === "p" ? "sp-tel-over" : "sp-kijk-plaatjes")];
      };
    }
    ctx.work.innerHTML = qhtml(vis);
    ctx.say(zeg);
    const r = await KS.choose(ctx, {options: numberChoices(it.ans, 0, h, it.support), correct: it.ans, answer: [getal(it.ans)], onOk: spVul(ctx), stepBack});
    // de tabel is vol: het patroon laten zien (links één meer, rechts één minder)
    if (it.vorm === "t" && it.rij === h && r.first){
      const tb = ctx.work.querySelector(".k-sttabel"); if (tb) tb.classList.add("k-patroon");
      await G.say([z("sp-patroon")]);
    }
    return r;
  }
};
const G = PL.geluid;

/* ---------- Erbij en eraf ---------- */
// key: ee:p:<a>:<b> / ee:m:<a>:<b>; stenen EE1–EE3 met plaatjes tot 10, EE4–EE7 (groep 4) als som met rekenrek of staven
const sommen = {
  EE4: () => { const c = []; for (let a = 11; a <= 19; a++) for (let b = 1; b <= 9; b++){ if (a % 10 + b <= 9) c.push(`ee:p:${a}:${b}`); if (b <= a % 10) c.push(`ee:m:${a}:${b}`); } return c; },
  EE5: () => { const c = []; for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) if (a + b > 10){ c.push(`ee:p:${a}:${b}`); c.push(`ee:m:${a + b}:${b}`); } return c; },
  EE6: () => range(5, 10).map(a => `ee:p:${a}:${a}`).concat(range(5, 9).map(a => `ee:p:${a}:${a + 1}`)),
  EE7: () => { const c = []; for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++){ c.push(`ee:p:${a * 10}:${b * 10}`); c.push(`ee:m:${(a + b) * 10}:${b * 10}`); } return c; }
};
const ee = {
  id: "erbij-eraf", line: "rekenen", title: "Erbij en eraf", icon: P.icon.erbij,
  introParts: () => [z("ee-intro")],
  stones: [
    {id: "EE1", name: "erbij tot 5", gen: ctx => { const c = []; for (let a = 1; a <= 4; a++) for (let b = 1; a + b <= 5; b++) c.push(`ee:p:${a}:${b}`); return ee.fromKey(choose(ctx, c)); }},
    {id: "EE2", name: "erbij tot 10", gen: ctx => { const c = []; for (let a = 2; a <= 8; a++) for (let b = 1; a + b <= 10; b++) if (a + b > 5) c.push(`ee:p:${a}:${b}`); return ee.fromKey(choose(ctx, c)); }},
    {id: "EE3", name: "eraf tot 10", gen: ctx => { const c = []; for (let a = 3; a <= 10; a++) for (let b = 1; b < a && b <= 5; b++) c.push(`ee:m:${a}:${b}`); return ee.fromKey(choose(ctx, c)); }},
    {id: "EE4", name: "tot 20 zonder het tiental te passeren", g4: true, gen: ctx => ee.fromKey(choose(ctx, sommen.EE4()))},
    {id: "EE5", name: "over het tiental", g4: true, gen: ctx => ee.fromKey(choose(ctx, sommen.EE5()))},
    {id: "EE6", name: "dubbelen en bijna-dubbelen", g4: true, gen: ctx => ee.fromKey(choose(ctx, sommen.EE6()))},
    {id: "EE7", name: "tientallen tot 100", g4: true, gen: ctx => ee.fromKey(choose(ctx, sommen.EE7()))}
  ],
  stoneOf(k){
    const [, o, A, B] = k.split(":"), a = +A, b = +B;
    if (a % 10 === 0 && b % 10 === 0 && a >= 10 && b >= 10) return "EE7";
    if (o === "p" && (b === a || b === a + 1) && a + b > 10) return "EE6";
    if (o === "p" ? a + b > 10 && a < 10 : a > 10 && a - b < 10) return "EE5";
    if (a > 10) return "EE4";
    return o === "m" ? "EE3" : a + b <= 5 ? "EE1" : "EE2";
  },
  fromKey: k => { const [, o, a, b] = k.split(":"); return {key: k, op: o, a: +a, b: +b, ans: o === "p" ? +a + +b : +a - +b}; },
  sayItem: k => { const it = ee.fromKey(k); return [{id: SOM(it.a, it.op, it.b), t: somZin(it.a, it.op, it.b)}]; },
  async ask(ctx, it){
    const st = ee.stoneOf(it.key);
    if (["EE1", "EE2", "EE3"].includes(st)){
      // drie vormen door elkaar: plaatjes (appels erbij, ballonnen weg), de appelboom, de kledingkast
      const vormen = ["plaatjes"].concat(["boom", "kast"].filter(v => P.sceneKan(v) && it.a + (it.op === "p" ? it.b : 0) <= 10));
      const vorm = it.vorm = vormen[Math.floor(Math.random() * vormen.length)];
      if (vorm !== "plaatjes") return ee.askScene(ctx, it, vorm);
      let vis;
      if (it.op === "p") vis = `<div class="k-twee">${P.groep("appel", it.a)}<span class="k-plusteken" aria-hidden="true">+</span><div class="k-erbij">${P.groep("appel", it.b)}</div></div>`;
      else vis = P.groep("ballon", it.a, {fadeFrom: it.a - it.b});
      if (it.support) vis += `<div class="k-help">${rr(it.op === "p" ? it.a + it.b : it.ans)}</div>`;
      ctx.work.innerHTML = qhtml(vis);
      const een = it.op === "p" ? "n-appels-" : "n-ballonnen-", twee = it.op === "p" ? "erbij-" : "eraf-";
      const speel = {fn: () => { const v = ctx.work.querySelector(".k-vis"); if (v) v.classList.add("k-gespeeld"); }};   // erbij ploppen in, ballonnen vliegen weg
      ctx.say([{id: een + it.a, t: zin[een + it.a]}, {gap: 300}, speel, {id: twee + it.b, t: zin[twee + it.b]}, {gap: 300}, z(it.op === "p" ? "hoeveel-nu" : "hoeveel-blijven")]);
      return KS.choose(ctx, {options: numberChoices(it.ans, 0, 10, it.support), correct: it.ans, answer: [getal(it.ans)],
        stepBack: () => { speel.fn(); const v = ctx.work.querySelector(".k-vis"); if (v) v.classList.add("k-tel"); addHelp(ctx, rr(it.op === "p" ? it.a + it.b : it.ans)); return [z(it.op === "p" ? "tel-alles" : "tel-blijft")]; }});
    }
    // groep 4: de som in cijfers, met rekenrek (tot 20) of staven van tien (tot 100)
    const tien = st === "EE7", teken = it.op === "p" ? "+" : "−";
    const hulp = tien ? P.tientallen(it.a, it.op === "m" ? {fadeFrom: it.ans / 10} : {}) : rr(it.a);
    ctx.work.innerHTML = qhtml(`<div class="k-som"><span class="k-num k-num-big">${it.a} ${teken} ${it.b}</span></div>` + (it.support ? `<div class="k-help">${hulp}</div>` : ""));
    ctx.say([{id: SOM(it.a, it.op, it.b), t: somZin(it.a, it.op, it.b)}, {gap: 300}, z("hoeveel-is-dat")]);
    return KS.choose(ctx, {options: numberChoices(it.ans, 0, 100, it.support, tien ? 10 : 1), correct: it.ans, answer: [getal(it.ans)],
      stepBack: () => {
        if (tien){ addHelp(ctx, P.tientallen(it.op === "p" ? it.a + it.b : it.a, it.op === "m" ? {fadeFrom: it.ans / 10} : {})); return [z("tel-tientallen")]; }
        addHelp(ctx, rr(it.op === "p" ? it.a + it.b : it.a));
        return [z(st === "EE5" ? "eerst-tien" : st === "EE6" ? "dubbel" : it.op === "p" ? "tel-alles" : "tel-blijft")];
      }});
  }
};
ee.askScene = function(ctx, it, vorm){
  const html = P.scene(vorm, it.a, it.b, it.op);
  ctx.work.innerHTML = qhtml(html + (it.support ? `<div class="k-help">${rr(it.op === "p" ? it.a + it.b : it.ans)}</div>` : ""));
  const zeg = id => ({id, t: zin[id]});
  const speel = {fn: () => P.sceneSpeel(ctx.work)};
  const vraag = it.op === "p" ? z("hoeveel-nu") : zeg(vorm === "boom" ? "boom-nog" : "kast-nog");
  ctx.say([zeg(`${vorm}-n-${it.a}`), {gap: 350}, speel, zeg(`${vorm}-${it.op === "p" ? "bij" : "af"}-${it.b}`), {gap: 700}, vraag]);
  return KS.choose(ctx, {options: numberChoices(it.ans, 0, 10, it.support), correct: it.ans, answer: [getal(it.ans)],
    stepBack: () => {
      P.sceneSpeel(ctx.work);   // voor het geval er al getikt werd voor de animatie klaar was
      const sc = ctx.work.querySelector(".k-scene"); if (sc) sc.classList.add("k-tel");   // wat er nog is licht op; wat weg is verdwijnt bijna
      return [z(it.op === "p" ? "tel-alles" : "tel-blijft")];
    }});
};
// alle somzinnen als opnames (groep 4)
Object.values(sommen).forEach(f => f().forEach(k => { const it = ee.fromKey(k); KS.addZin({[SOM(it.a, it.op, it.b)]: somZin(it.a, it.op, it.b)}); }));
// groep 4-stenen pas als de basis van die training groen is (de motor zet stage pas door als de vorige steen groen is)
[tel, sp, ee].forEach(KS.register);
KS._rekenen = {woordVan, sommen};
})();

/* Kindschil · lezen en schrijven (v0.14.1): Letterklanken, Hakken en plakken, Woorden bouwen.
   Materiaal: de woordenbank (content/groep3/woorden.json, 304 woorden) en de klankvolgorde (content/groep3/klankvolgorde.json,
   34 klanken in 17 stappen); de bouw zet beide in de pagina (window.__g3Woorden, window.__g3Klanken).
   - Letterklanken heeft 17 stenen, één per stap. De stand van Letterklanken bepaalt welke klanken "gehad" zijn.
   - Hakken en plakken kiest alleen woorden waarvan alle klanken gehad zijn; woorden met twee medeklinkers en spellingkeuzes
     (groep 4) pas vanaf stap 15. Bouwen loopt één stap achter op lezen.
   - Plaatjes alleen bij woorden met een prent (97); de rest wordt gehoord. Nooit een plaatje naast een woord dat gelezen moet worden.
   - Klanken komen uit opnames (klank-m …); zonder opname een beginwoord ("Waarmee begint … mes?"), nooit een letternaam.
   - Klanken die hetzelfde klinken (ei/ij, ou/au, g/ch) en letters die op elkaar lijken (b/d/p, m/n) zijn nooit elkaars afleider.
   - Taal: één korte zin, kernwoord achteraan na een pauze (…). Onderbouwing: kennis/10 en kennis/11. */
(function(){
"use strict";
const PL = window.PL, KS = PL.kind, P = KS.pic, z = KS.z, G = PL.geluid;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, window.__kindStil ? Math.min(ms, 20) : ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- materiaal ---------- */
const STEPS = ((window.__g3Klanken || {}).stappen || []).map(s => s.nieuw);
const WORDS = (window.__g3Woorden || []).map(([w, l, f, b, zz]) => ({w, gr: l.split("."), fase: +f, beeld: !!b, zuiver: !!zz}));
const BY = Object.fromEntries(WORDS.map(x => [x.w, x]));
const KLANKEN = STEPS.flat();
const units = gr => gr.flatMap(g => g === "sch" ? ["s", "ch"] : g === "nk" ? ["n", "k"] : [g]);   // zo schrijf je het: s+ch, n+k
const MIN_STAP = 4;                                    // hakken en bouwen pas met tien klanken (dan zijn er woorden genoeg)
const geleerd = stap => new Set(STEPS.slice(0, Math.max(1, stap)).flat());
function leesbaar(stap){
  const L = geleerd(stap);
  return WORDS.filter(x => x.gr.every(g => L.has(g)) && (x.fase <= 3 || stap >= 15));
}
// beginwoorden voor als een opname van de klank ontbreekt: [woord, waar de klank zit: b(egin) m(idden) e(ind)]
const CUE = {i: ["inktvis", "b"], k: ["kam", "b"], m: ["mes", "b"], s: ["sok", "b"], r: ["rok", "b"], a: ["appel", "b"], n: ["nest", "b"], o: ["otter", "b"],
  l: ["lam", "b"], e: ["emmer", "b"], p: ["pop", "b"], t: ["tas", "b"], aa: ["aap", "b"], v: ["vis", "b"], b: ["bal", "b"], oo: ["oog", "b"], ee: ["eend", "b"],
  z: ["zon", "b"], u: ["bus", "m"], h: ["huis", "b"], j: ["jas", "b"], w: ["wol", "b"], ie: ["mier", "m"], oe: ["koe", "e"], d: ["dak", "b"], g: ["geit", "b"],
  f: ["fiets", "b"], uu: ["uur", "b"], ui: ["uil", "b"], eu: ["neus", "m"], ei: ["ei", "b"], ij: ["ijs", "b"], ou: ["oud", "b"], au: ["auto", "b"],
  ng: ["ring", "e"], nk: ["bank", "e"], sch: ["schaap", "b"], ch: ["lach", "e"]};
const ZELFDE = [["ei", "ij"], ["ou", "au"], ["g", "ch"]], LIJKT = [["b", "d"], ["b", "p"], ["d", "p"], ["m", "n"]];
const botst = (a, b) => ZELFDE.concat(LIJKT).some(([x, y]) => (a === x && b === y) || (a === y && b === x));

const zinWoord = {}; WORDS.forEach(x => zinWoord["woord-" + x.w] = x.w); Object.values(CUE).forEach(([w]) => zinWoord["woord-" + w] = w);
KS.addZin(Object.assign(zinWoord, Object.fromEntries(KLANKEN.map(k => ["klank-" + k, ""]))));
KS.addZin({
  "lk-intro": "Luister naar de klank. Tik de letter.",
  "lk-nieuw": "Een nieuwe klank. Luister.",
  "lk-zeg": "Zeg maar mee.",
  "lk-welke": "Welke letter hoor je?",
  "lk-cue-b": "Waarmee begint …",
  "lk-cue-m": "Wat hoor je in het midden van …",
  "lk-cue-e": "Waarmee eindigt …",
  "hp-intro": "Je hoort een woord. Wat hoor je erin?",
  "hp-eerst": "Wat hoor je eerst bij …",
  "hp-laatst": "Wat hoor je als laatste bij …",
  "hp-midden": "Wat hoor je in het midden van …",
  "hp-plak": "Plak de klanken. Welk plaatje is het?",
  "hp-lees": "Lees maar zacht. Welk plaatje is het?",
  "wb-intro": "Je hoort een woord. Bouw het met letters.",
  "wb-bouw": "Bouw het woord …",
  "wb-welke": "Welke klank komt nu?",
  "kijk-deze": "Kijk, deze."
});
const klank = l => G.has("klank-" + l) ? {id: "klank-" + l} : null;
const woord = w => ({id: "woord-" + w, t: w});
const stil = p => Object.assign({}, p, {cap: false});      // wel horen, niet in de zichtbare zin
const letterBtn = l => ({value: l, label: "", html: `<span class="k-letter">${esc(l)}</span>`});
const qhtml = (vis, extra) => `<div class="k-q"><div class="k-vis">${vis}</div>${extra || ""}</div>`;
const hear = () => `<button type="button" class="k-hear" id="k-hear" aria-label="Nog eens horen">${KS.ICON.luid}</button>`;
const beeldVan = w => (BY[w] && BY[w].beeld) ? P.wordPic(w) : "";
function choose(ctx, cands){
  const sc = k => { const r = ctx.rec(k); return (ctx.due(k) ? -20 : 0) + (ctx.known(k) ? 10 : 0) + (r.last === "step" ? -5 : 0) + Math.random() * 6; };
  return cands.map(k => [sc(k), k]).sort((a, b) => a[0] - b[0])[0][1];
}
function afleiders(goed, pool, n, verboden){
  const uit = new Set([goed].concat(verboden || []));
  return shuffle(pool.filter(x => !uit.has(x) && !botst(x, goed) && !(verboden || []).some(v => botst(x, v)))).slice(0, n);
}
// de klank als hoorbaar stuk: opname, anders het beginwoord met een vraag waar de klank zit
const klankOfCue = l => klank(l) ? [klank(l)] : [z("lk-cue-" + (CUE[l] || ["", "b"])[1]), woord((CUE[l] || [l])[0])];

/* ---------- Letterklanken: 17 stenen ---------- */
const lk = {
  id: "letterklanken", line: "lezen", title: "Letterklanken", icon: P.icon.klanken,
  introParts: () => [z("lk-intro")],
  stones: STEPS.map((nieuw, i) => ({id: "LK" + (i + 1), name: "klanken " + nieuw.join(", "), gen: ctx => {
    const pool = Math.random() < .65 ? nieuw : STEPS.slice(0, i + 1).flat();     // vooral de nieuwe klanken; af en toe een eerdere
    return lk.fromKey(choose(ctx, pool.map(l => "lk:" + l)));
  }})),
  stoneOf: k => "LK" + (STEPS.findIndex(s => s.includes(k.split(":")[1])) + 1),
  fromKey: k => ({key: k, l: k.split(":")[1]}),
  sayItem: k => klankOfCue(k.split(":")[1]).slice(-1),
  async ask(ctx, it){
    const l = it.l, K_ = klank(l), known = STEPS.slice(0, ctx.data.stage).flat();
    if (!ctx.rec(it.key).n && !it.requeue){                       // kennismaken met een nieuwe klank
      ctx.work.innerHTML = qhtml(`<div class="k-bigletter"><span class="k-letter k-letter-xl">${esc(l)}</span></div>`);
      await ctx.say(K_ ? [z("lk-nieuw"), {gap: 250}, K_, {gap: 500}, K_, {gap: 300}, z("lk-zeg")] : [z("lk-nieuw"), {gap: 250}].concat(klankOfCue(l)).concat([{t: "?"}]));
      await sleep(400);
      ctx.work.innerHTML = "";
    }
    const pool = known.length >= 3 ? known : KLANKEN.slice(0, 4);
    const opts = shuffle([l].concat(afleiders(l, pool, it.support ? 1 : 2))).map(letterBtn);
    ctx.work.innerHTML = qhtml(hear());
    const vraag = K_ ? [z("lk-welke"), {gap: 350}, stil(K_)] : klankOfCue(l).concat([{t: "?"}]);
    document.getElementById("k-hear").addEventListener("click", () => { G.unlock(); const t = document.getElementById("k-say"); if (t) t.click(); });   // zelfde knop, zelfde werking (v0.17)
    ctx.say(vraag);
    return KS.choose(ctx, {options: opts, correct: l, cls: "k-letters",
      stepBack: () => [z("luister-nog"), {gap: 250}].concat(K_ ? [K_, {gap: 500}, K_] : klankOfCue(l)),
      okParts: [z("ja")].concat(K_ ? [K_] : []),
      model: [z("kijk-deze")].concat(K_ ? [K_] : [])});
  }
};

/* ---------- Hakken en plakken ---------- */
// key: hp:<soort>:<woord>  e = eerste klank, p = plakken (klanken → plaatje), l = laatste klank, m = middelste klank (mkm)
const hp = {
  id: "hakken-plakken", line: "lezen", title: "Hakken en plakken", icon: P.icon.hakken,
  introParts: () => [z("hp-intro")],
  stones: [
    {id: "HP1", name: "de eerste klank", gen: ctx => hp.pick(ctx, "e")},
    {id: "HP2", name: "klanken plakken", gen: ctx => hp.pick(ctx, "p")},
    {id: "HP3", name: "de laatste klank", gen: ctx => hp.pick(ctx, "l")},
    {id: "HP4", name: "de middelste klank", gen: ctx => hp.pick(ctx, "m")}
  ],
  pick(ctx, soort){
    let ws = leesbaar(Math.max(MIN_STAP, ctx.leesStap || 1));
    if (soort === "m") ws = ws.filter(x => units(x.gr).length === 3);
    if (soort === "p"){ const met = ws.filter(x => x.beeld && P.wordPic(x.w)); if (met.length >= 3) ws = met; else soort = "e"; }
    if (!ws.length) ws = leesbaar(MIN_STAP);
    return hp.fromKey(choose(ctx, ws.map(x => `hp:${soort}:${x.w}`)));
  },
  stoneOf: k => ({e: "HP1", p: "HP2", l: "HP3", m: "HP4"})[k.split(":")[1]],
  fromKey: k => { const [, s, w] = k.split(":"); return {key: k, soort: s, w}; },
  sayItem: k => [woord(k.split(":")[2])],
  async ask(ctx, it){
    const w = it.w, x = BY[w] || {gr: w.split("")}, us = units(x.gr), L = [...geleerd(Math.max(MIN_STAP, ctx.leesStap || 1))];
    if (it.soort === "p"){
      // de letters staan in beeld, de klanken klinken één voor één, dan kiest het kind het plaatje
      const same = y => [...y].filter((c, i) => c === w[i]).length;
      const met = leesbaar(Math.max(MIN_STAP, ctx.leesStap || 1)).filter(y => y.beeld && y.w !== w && P.wordPic(y.w)).map(y => y.w);
      const others = it.support ? shuffle(met.filter(y => same(y) <= 1)).slice(0, 1) : shuffle(met).sort((a, b) => same(b) - same(a)).slice(0, 2);
      const opts = shuffle([w].concat(others)).map(y => ({value: y, label: y, html: P.wordPic(y)}));
      ctx.work.innerHTML = qhtml(`<div class="k-boxes">${us.map((l, i) => `<span class="k-box k-letter" data-i="${i}">${esc(l)}</span>`).join("")}</div>`);
      const boxes = [...ctx.work.querySelectorAll(".k-box")];
      const zoem = async () => { for (let i = 0; i < us.length; i++){ boxes.forEach(b => b.classList.toggle("k-lit", +b.dataset.i === i)); if (klank(us[i])) await G.say([klank(us[i])]); else await sleep(450); await sleep(200); } boxes.forEach(b => b.classList.remove("k-lit")); };
      if (us.every(l => klank(l))) (async () => { await zoem(); await ctx.say([z("hp-plak")]); })(); else ctx.say([z("hp-lees")]);
      return KS.choose(ctx, {options: opts, correct: w, cls: "k-pics", answer: [woord(w)],
        stepBack: async () => { await G.say([z("luister-nog")]); await zoem(); return [z("hp-plak")]; }});
    }
    const pos = it.soort === "e" ? 0 : it.soort === "l" ? us.length - 1 : 1, l = us[pos];
    const opts = shuffle([l].concat(afleiders(l, L.filter(y => !us.includes(y)), it.support ? 1 : 2, us))).map(letterBtn);
    const pic = beeldVan(w);
    ctx.work.innerHTML = qhtml((pic ? `<div class="k-pic">${pic}</div>` : "") + hear());
    document.getElementById("k-hear").addEventListener("click", () => { G.unlock(); const t = document.getElementById("k-say"); if (t) t.click(); });   // zelfde knop, zelfde werking (v0.17)
    const q = it.soort === "e" ? "hp-eerst" : it.soort === "l" ? "hp-laatst" : "hp-midden";
    ctx.say([z(q), {gap: 350}, woord(w), {t: "?"}]);
    return KS.choose(ctx, {options: opts, correct: l, cls: "k-letters",
      stepBack: () => [z("luister-nog"), {gap: 250}, woord(w), {gap: 600}, woord(w)],
      okParts: [z("ja")].concat(klank(l) ? [klank(l)] : [woord(w)]),
      model: [z("kijk-deze")].concat(klank(l) ? [klank(l)] : [woord(w)])});
  }
};

/* ---------- Woorden bouwen ---------- */
// key: wb:<woord>; de steen bepaalt het aantal extra letters (0, 1, 2). Bij hulp: geen extra letters. Eén stap achter op lezen.
const wb = {
  id: "woorden-bouwen", line: "schrijven", title: "Woorden bouwen", icon: P.icon.bouwen,
  introParts: () => [z("wb-intro")],
  stones: [0, 1, 2].map(n => ({id: "WB" + (n + 1), name: n ? `met ${n} letter${n > 1 ? "s" : ""} extra` : "alleen de letters van het woord", extra: n,
    gen: ctx => { const stap = Math.max(MIN_STAP, (ctx.leesStap || 1) - 1); const ws = leesbaar(stap).filter(x => units(x.gr).length <= 5); return wb.fromKey(choose(ctx, ws.map(x => "wb:" + x.w))); }})),
  stoneOf: () => "WB" + Math.max(1, Math.min(3, (wb._stage || 1))),
  fromKey: k => ({key: k, w: k.split(":")[1]}),
  sayItem: k => [woord(k.split(":")[1])],
  ask(ctx, it){
    wb._stage = ctx.data.stage;
    return new Promise(resolve => {
      const w = it.w, x = BY[w] || {gr: w.split("")}, ls = units(x.gr), st = wb.stones[ctx.data.stage - 1] || wb.stones[0];
      const L = [...geleerd(Math.max(MIN_STAP, (ctx.leesStap || 1) - 1))].filter(y => !["sch", "nk"].includes(y));
      const extra = it.support ? 0 : st.extra;
      const tiles = shuffle(ls.concat(afleiders(ls[0], L.filter(y => !ls.includes(y)), extra, ls)));
      const pic = beeldVan(w);
      ctx.work.innerHTML = qhtml((pic ? `<div class="k-pic">${pic}</div>` : "") + hear(),
        `<div class="k-boxes k-slots">${ls.map((_, i) => `<span class="k-box k-slot" data-i="${i}"></span>`).join("")}</div>
         <div class="k-tilebank">${tiles.map((l, i) => `<button type="button" class="k-tilebtn" data-l="${esc(l)}" data-i="${i}"><span class="k-letter">${esc(l)}</span></button>`).join("")}</div>`);
      ctx.work.querySelector(".k-q").classList.add("k-bouw");
      document.getElementById("k-hear").addEventListener("click", () => { G.unlock(); const t = document.getElementById("k-say"); if (t) t.click(); });   // zelfde knop, zelfde werking (v0.17)
      ctx.say([z("wb-bouw"), {gap: 350}, woord(w), {t: "."}]);
      const slots = [...ctx.work.querySelectorAll(".k-slot")], btns = [...ctx.work.querySelectorAll(".k-tilebtn")];
      let pos = 0, first = true, busy = false; const t0 = performance.now(); const missAt = {};
      KS._now = {kind: "bouw", word: w, letters: ls, pos: () => pos};   // voor de tests
      const model = async () => {
        const good = btns.find(b => !b.disabled && b.dataset.l === ls[pos]);
        btns.forEach(b => b.classList.toggle("k-dim", b !== good && !b.disabled)); if (good) good.classList.add("k-show");
        await G.say([z("kijk-deze")].concat(klank(ls[pos]) ? [klank(ls[pos])] : []).concat([{gap: 200}, z("nu-jij")]));
      };
      ctx.work.querySelector(".k-tilebank").addEventListener("click", async e => {
        const b = e.target.closest(".k-tilebtn"); if (!b || b.disabled || busy) return;
        G.unlock();
        if (b.dataset.l === ls[pos]){
          busy = true;
          b.disabled = true; b.classList.add("k-used"); btns.forEach(y => y.classList.remove("k-dim", "k-show"));
          slots[pos].textContent = ls[pos]; slots[pos].classList.add("k-filled");
          pos++;
          if (klank(ls[pos - 1])) await G.say([klank(ls[pos - 1])]);
          busy = false;
          if (pos === ls.length){
            ctx.work.querySelector(".k-slots").classList.add("k-ok");
            const rt = (performance.now() - (ctx.speechEnd || t0)) / ls.length;
            await G.say([z("ja"), woord(w)]);
            await sleep(600);
            resolve({first, rt: Math.max(0, rt)});
          }
        } else {
          b.classList.add("k-wobble"); setTimeout(() => b.classList.remove("k-wobble"), 450);
          first = false; busy = true;
          missAt[pos] = (missAt[pos] || 0) + 1;
          if (missAt[pos] === 1) await G.say([z("wb-welke")].concat(klank(ls[pos]) ? [{gap: 250}, klank(ls[pos])] : [{gap: 250}, woord(w)]));   // stap terug
          else await model();                                                                                                                 // daarna voordoen
          busy = false;
        }
      });
    });
  }
};
[lk, hp, wb].forEach(KS.register);
KS._lezen = {STEPS, WORDS, CUE, KLANKEN, leesbaar, units, botst};
})();
