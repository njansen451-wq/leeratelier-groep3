  // v0.14: de kindschil (groep3) heeft een eigen Home, ronde en slot; opslag, login en tuin komen uit de kern
  if (SPACE.shell === "kind" && PL.kind) return PL.kind.boot(app, store);
  content = (await store.load(CONTENT_KEY)) || {packs: []};
  const {id, view} = parseHash();
  const T = trainings.find(t => t.id === id) || (trainings.length === 1 ? trainings[0] : null);
  if (T) PL.start(T, {routed: true}); else PL.homeRoute(id, view);
};

/* ---------- v0.11: vakken, voortgang en een open ronde (Laws of UX, zie CHANGELOG) ---------- */
/* Similarity + Chunking: drie vakken met elk één kleur. Het icoon is overal dezelfde bloem, in de kleur van het vak. */
const CATS = [{id: "rekenen", name: "Rekenen", petal: "#C12F78", soft: "var(--pl-violet-soft)"}, {id: "taal", name: "Taal", petal: "#B9790F", soft: "var(--pl-honey-soft)"}, {id: "wereld", name: "Wereld", petal: "#2F8F5E", soft: "var(--pl-leaf-soft)"}];
const catOf = T => T.cat || (/rekenen/i.test(T.subject || "") ? "rekenen" : /topografie/i.test(T.subject || "") ? "wereld" : "taal");
const catIcon = (id, cls) => { const c = CATS.find(x => x.id === id) || CATS[0]; return `<span class="pl-badge ${cls || ""}" style="background:${c.soft}" aria-hidden="true">${PL.flower(5, {stem: false, petal: c.petal, heart: "#FFFFFF"})}</span>`; };
PL._catOf = catOf;
const knownRec = r => !!r && r.fl >= 2 && r.last === "ok";
/* Groei zonder eindpunt (grondbeginsel: geen scores, geen levels; je traint, en met trainen gaat het steeds beter).
   Er is geen totaal en geen balk die vol moet: alleen wanneer ze trainde en wat al vanzelf gaat. Dat getal kan alleen groeien. */
const NOUN1 = {sommen: "som", woorden: "woord", landen: "land", werkwoorden: "werkwoord", zinnen: "zin"};
const nounN = (n, noun) => n === 1 ? (NOUN1[noun] || noun) : noun;
const whenText = d => { if (!d) return ""; const ago = dayNum(today()) - dayNum(d); return ago <= 0 ? "Vandaag getraind" : ago === 1 ? "Gisteren getraind" : ago < 7 ? `${ago} dagen geleden getraind` : "Even geleden getraind"; };
PL.growthOf = function(T, d){
  const ss = realSessions(d), known = Object.values((d && d.items) || {}).filter(knownRec).length;
  const last = ss.length ? ss[ss.length - 1].d : "";
  return {sessions: ss.length, known, last, status: ss.length ? whenText(last) : "Nieuw",
    text: known ? `${cap1(PL.stem.aantal(known, PL.stem.noun(T)))} ${known === 1 ? "gaat" : "gaan"} al vanzelf.` : ""};   // v0.12: getallen tot twintig voluit; geen zin zonder feit
};
/* Zeigarnik: een ronde die halverwege verlaten is, blijft staan (data.open) tot ze hem afmaakt; ouder dan 3 dagen telt niet. */
const openRound = d => { const o = d && d.open; if (!o || !o.q || !o.q.length) return null; if (dayNum(today()) - dayNum((o.d || "").slice(0, 10)) > 3) return null; return o; };
PL._openRound = openRound;

/* ---------- route (Jakob's Law): elk scherm een eigen adres, zodat "terug" op de telefoon in de app blijft ---------- */
let routing = false;
function setRoute(h, replace){
  const want = h ? "#" + h : location.pathname + location.search;
  if (("#" + h) === location.hash || (!h && !location.hash)) return;
  try { history[replace ? "replaceState" : "pushState"]({pl: 1}, "", want); } catch(e){ if (!replace) location.hash = h; }
}
PL._route = setRoute;
const parseHash = () => { const raw = decodeURIComponent((location.hash || "").slice(1)); const [id, view] = raw.split("/"); return {id: id || "", view: view || ""}; };

/* ---------- groepen (v0.10): trainingen met T.group staan op home als één regel; tik → kies het deel (bv. de regio) ---------- */
const GROUP_ROUTE = {topo: "landen"};
function listRows(){
  const out = [], seen = {};
  for (const T of trainings){
    if (!T.group){ out.push(T); continue; }
    if (seen[T.group]) continue;
    const members = trainings.filter(t => t.group === T.group);
    seen[T.group] = 1; out.push({isGroup: true, id: T.group, route: GROUP_ROUTE[T.group] || T.group, title: T.groupTitle, tint: T.tint, subject: T.subject, cat: catOf(T), members,
      sub: `${T.subject} · ${members.filter(m => m.id !== "wereld").length} werelddelen`});
  }
  return out;
}
/* groei van een groep: landen die al vanzelf gaan, over alle delen samen (elk land één keer) */
function groupGrowth(G, states){
  const codes = new Set(), ss = [];
  for (const m of G.members){ ss.push(...realSessions(states[m.id])); for (const [k, r] of Object.entries((states[m.id] && states[m.id].items) || {})) if (knownRec(r)) codes.add(k.slice(k.indexOf(":") + 1)); }
  const last = ss.map(s => s.d).sort().pop() || "", known = codes.size;
  return {sessions: ss.length, known, last, status: ss.length ? whenText(last) : "Nieuw", text: known ? `${cap1(PL.stem.aantal(known, "landen"))} ${known === 1 ? "gaat" : "gaan"} al vanzelf.` : ""};
}
function rowHTML(R, states, todayId, make){
  const isG = !!R.isGroup, pr = isG ? groupGrowth(R, states) : PL.growthOf(R, states[R.id]);
  const sub = isG ? R.sub : (R.subject || "");
  const isToday = !make && (isG ? R.members.some(m => m.id === todayId) : R.id === todayId);
  const attr = isG ? `data-group="${esc(R.id)}"` : make ? `data-make="${esc(R.id)}"` : `data-start="${esc(R.id)}"`;
  // a11y: de knop krijgt één duidelijke naam (titel, vak, status, voortgang)
  const label = `${R.title}. ${sub}. ${isToday ? "Vandaag. " : ""}${pr.status}.${pr.known ? " " + pr.text : ""}`;
  return `<button type="button" class="pl-listrow pl-card-row" ${attr} aria-label="${esc(label)}">${catIcon(R.cat || catOf(R))}
    <span class="pl-listtext"><span class="pl-rowtop"><b>${esc(R.title)}</b>${isToday ? `<span class="pl-tag">Vandaag</span>` : ""}</span><span class="pl-sub">${esc(sub)}</span>
    ${make ? "" : `<span class="pl-status${pr.sessions ? "" : " s-nieuw"}">${esc(pr.status)}</span>`}</span><span class="pl-chev" aria-hidden="true"></span></button>`;
}
function groupedList(states, todayId, make){
  const rows = listRows();
  return CATS.map(c => { const rs = rows.filter(R => (R.cat || catOf(R)) === c.id); if (!rs.length) return "";
    return `<section class="pl-group" aria-labelledby="pl-cat-${c.id}"><h2 class="pl-eyebrow pl-cathead" id="pl-cat-${c.id}">${c.name}</h2><div class="pl-list pl-grid2">${rs.map(R => rowHTML(R, states, todayId, make)).join("")}</div></section>`; }).join("");
}
/* voor de tuin: alle delen van een groep samen in één tuintje (het tuintje van het eerste deel, bv. europa) */
function mergeGroups(states){
  const st = Object.assign({}, states);
  for (const G of listRows().filter(r => r.isGroup)){
    const parts = G.members.map(m => states[m.id]).filter(Boolean); if (!parts.length) continue;
    const m = {items: {}, stones: {}, sessions: []};
    parts.forEach((d, i) => { Object.assign(m.items, d.items || {}); for (const [k, v] of Object.entries(d.stones || {})) m.stones[G.members[i].id + ":" + k] = v; m.sessions = m.sessions.concat(d.sessions || []); });
    m.sessions.sort((a, b) => (a.d || "").localeCompare(b.d || ""));
    st[G.members[0].id] = Object.assign({}, parts[0], m);
  }
  return st;
}
/* wat er gegroeid is, in woorden: "12 sommen en 5 woorden gaan vanzelf" (Peak-End, Von Restorff) */
function grownLine(states){
  const per = {};
  for (const T of trainings){ const d = states[T.id]; if (!d) continue; const n = Object.values(d.items || {}).filter(knownRec).length; if (n) per[T.noun] = (per[T.noun] || 0) + n; }
  const parts = Object.entries(per).map(([noun, n]) => `${n} ${nounN(n, noun)}`);
  if (!parts.length) return "";
  const tot = Object.values(per).reduce((a, b) => a + b, 0);
  return `${lst(parts)} ${tot === 1 ? "gaat" : "gaan"} al vanzelf.`;
}
async function loadStates(){ const states = {}; for (const T of trainings) states[T.id] = (await store.load("philearn-" + T.id)) || null; return states; }

async function showGroup(gid, make, states, fromRoute){
  states = states || await loadStates();
  const G = listRows().find(r => r.isGroup && r.id === gid), app = $("pl-app");
  if (!G) return PL.home();
  homeFrame(app, G.title, true);
  if (!fromRoute) setRoute(G.route + (make ? "/bedenk" : ""));
  const sec = app.querySelector(".pl-screen");
  const stat = T => PL.growthOf(T, states[T.id]).status;
  sec.innerHTML = `<div class="pl-card pl-narrow" style="display:grid;gap:12px"><p class="pl-lead">${make ? "Bedenk je ronde: in welk deel?" : "Welk deel van de wereld?"}</p>
    <div class="pl-regions">${G.members.map(T => `<button type="button" class="pl-region" data-r="${esc(T.id)}"><b>${esc(T.groupName)}</b><span>${T.groupCount} landen</span><span class="pl-note">${esc(stat(T))}</span></button>`).join("")}</div></div>`;
  sec.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { setRoute(b.dataset.r + (make ? "/bedenk" : "")); PL.start(trainings.find(t => t.id === b.dataset.r), make ? {make: true, routed: true} : {routed: true}); }));
  wireParent(null, states);
}
PL._showGroup = showGroup;

/* kop voor home-schermen: op home het merkteken, op een subscherm "terug naar Home" linksboven (Jakob's Law) */
function homeFrame(app, title, sub){
  app.classList.remove("pl-wide", "pl-inround"); app.classList.add("pl-homeapp");
  app.innerHTML = `
  <header class="pl-top">
    ${sub ? `<button class="pl-backhome" id="pl-back-home" type="button"><span class="pl-chev pl-chev-l" aria-hidden="true"></span>Home</button>` : ""}
    <button class="pl-logo" id="pl-logo" type="button" aria-label="Leeratelier"${sub ? " hidden" : ""}>${PL.flower(5, {stem: false})}</button>
    <div class="pl-title"><h1>${esc(title)}</h1>${sub ? "" : `<p class="pl-helps">Trainingen voor ${esc(SPACE.learnerName)}</p>`}</div>
  </header>
  <section class="pl-screen"></section>
  <div class="pl-foot" id="pl-foot">Leeratelier ${PL.VERSION}</div>
  <div class="pl-parent" id="pl-parent" hidden></div>`;
  const b = $("pl-back-home"); if (b) b.addEventListener("click", () => { setRoute(""); PL.home(); });

/* ---------- startscherm met alle trainingen ---------- */
PL.home = async function(){
  PL._current = null; PL._guard = null; PL._view = null;
  const app = $("pl-app");
  const states = await loadStates();
  const dn = dayNum(today());
  const dueCount = T => { const it = (states[T.id] && states[T.id].items) || {}; return Object.keys(it).filter(k => it[k] && it[k].due != null && it[k].due <= dn && it[k].last === "ok").length; };
  const played = T => realSessions(states[T.id]);
  const lastDay = T => { const ss = played(T); return ss.length ? ss[ss.length - 1].d : ""; };
  // "Vandaag" (Pareto): het pad van 80%. Een open ronde gaat voor (Zeigarnik); anders wat klaarstaat om te herhalen, anders de laatst gespeelde.
  const opens = trainings.map(T => ({T, o: openRound(states[T.id])})).filter(x => x.o).sort((a, b) => (b.o.d || "").localeCompare(a.o.d || ""));
  const open = opens[0] || null;
  const cand = trainings.filter(T => played(T).length);
  const last = cand.slice().sort((a, b) => dueCount(b) - dueCount(a) || lastDay(b).localeCompare(lastDay(a)))[0] || trainings[0];
  const ld = lastDay(last), ago = ld ? dn - dayNum(ld) : null;
  let why = !cand.length ? "Hier begin je. De basis komt eerst." : dueCount(last) ? "Omdat er iets klaarstaat om te herhalen." : ago === 0 ? "Omdat je hier vandaag al trainde." : ago === 1 ? "Omdat je hier gisteren trainde." : "Omdat je hier de vorige keer trainde.";
  const todayT = open ? open.T : last;
  // v0.12 (S10, S14, S18): de reden voor Vandaag en de regel bij de tuin komen uit de stand
  const st = PL.stem, mem = st.mem;
  {
    const dl = states[last.id], lab = k => st.label(last, k), g = st.genus(last);
    const sinceAll = Math.min(...trainings.map(T => st.sig.daysSince(states[T.id])).filter(x => x != null), 999);
    const reg = new Date().getHours() >= 19 ? "rustig" : "";
    let w = "";
    if (!cand.length) w = st.say("home.eerste", {training: last.title, stap: last.stones[0].name, reg}, mem);
    else if (sinceAll >= 5 && sinceAll < 999){ const nk = st.sig.newestKnown(dl) || st.sig.lastItem(dl); if (nk) w = st.say("home.pauze", {item: lab(nk.k), genus: g, reg}, mem); }
    if (!w && cand.length){ const dk = st.sig.dueToday(dl); w = dk.length ? st.say("home.due", {items: st.kort(dk.slice(0, 3).map(lab), dk.length, st.noun(last)), pl: dk.length > 1, genus: g, reg}, mem) : st.say("home.laatst", {dag: st.dag(ld), stap: last.stones[Math.max(0, (dl.stage || 1) - 1)].name, reg}, mem); }
    if (w) why = w;
  }
  homeFrame(app, "Leeratelier", false);
  let grown = "";
  {
    const nks = trainings.map(T => ({T, nk: st.sig.newestKnown(states[T.id])})).filter(x => x.nk && x.nk.d).sort((a, b) => b.nk.d.localeCompare(a.nk.d));
    const ls = trainings.map(T => ({T, s: st.sig.lastSession(states[T.id])})).filter(x => x.s && x.s.d).sort((a, b) => b.s.d.localeCompare(a.s.d));
    if (nks.length) grown = st.say("home.teaser", {item: st.label(nks[0].T, nks[0].nk.k), dag: st.dag(nks[0].nk.d), genus: st.genus(nks[0].T)}, mem);
    else if (ls.length) grown = st.say("home.teaser.bezig", {training: ls[0].T.groupTitle || ls[0].T.title, dag: st.dag(ls[0].s.d)}, mem);
    st.saveMem(store);
  }
  const anyRound = trainings.some(T => played(T).length);
  const sec = app.querySelector(".pl-screen");
  sec.classList.add("pl-home");
  const todayCard = open ? `
    <div class="pl-card pl-today pl-today-open">
      <div class="pl-row pl-between"><span class="pl-eyebrow">Ga verder</span><span class="pl-note">± ${P.sessionMin} min</span></div>
      <h2 class="pl-h2">${esc(open.T.title)}</h2>
      <p class="pl-lead">Vraag ${open.o.i + 1} van ${open.o.total}. Je ronde staat nog klaar.</p>
      <button class="pl-btn big pl-full" type="button" data-resume="${esc(open.T.id)}">Ga verder</button>
    </div>` : `
    <div class="pl-card pl-today">
      <div class="pl-row pl-between"><span class="pl-eyebrow">Vandaag</span><span class="pl-note">± ${P.sessionMin} min</span></div>
      <h2 class="pl-h2">${esc(last.title)}</h2>
      <p class="pl-lead">Je oefent: ${esc(last.practices || last.helps)}</p>
      <p class="pl-note pl-why-today">${esc(why)}</p>
      <button class="pl-btn big pl-full" type="button" data-start="${esc(last.id)}">Start training</button>
    </div>`;
  sec.innerHTML = `
    <div class="pl-hero">
      ${PL.face ? `<img class="pl-hero-img" src="${PL.face}" alt="">` : `<span class="pl-hero-img pl-hero-flower" aria-hidden="true">${PL.flower(5, {stem: false})}</span>`}
      <div class="pl-hero-text"><h2 class="pl-h2">Hoi ${esc(SPACE.learnerName)}</h2><p class="pl-lead">Zin in een kwartiertje trainen?</p></div>
    </div>
    <div class="pl-area-today">${todayCard}</div>
    <div class="pl-area-list">
      ${groupedList(states, todayT.id)}
      <button type="button" class="pl-help pl-makelink" id="pl-make">Bedenk je ronde</button>
    </div>
    <div class="pl-area-tuin">
      <div class="pl-card pl-tuinkaart">
        <div class="pl-row pl-between"><h2 class="pl-eyebrow pl-cathead">Mijn tuin</h2></div>
        <div class="pl-tuinwrap pl-tuin-onder" id="pl-tuin" aria-hidden="true"></div>
        <p class="pl-lead pl-grown">${anyRound ? esc(grown || "Je tuin groeit met elke ronde die je afmaakt.") : "Hier groeit je tuin. Maak je eerste ronde af, dan komt er iets op."}</p>
        <button type="button" class="pl-btn quiet pl-full" id="pl-open-tuin">Bekijk mijn tuin</button>
      </div>
    </div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => { setRoute(b.dataset.start); PL.start(trainings.find(t => t.id === b.dataset.start), {routed: true}); }));
  app.querySelectorAll("[data-resume]").forEach(b => b.addEventListener("click", () => { setRoute(b.dataset.resume + "/ronde"); PL.start(trainings.find(t => t.id === b.dataset.resume), {resume: true, routed: true}); }));
  app.querySelectorAll("[data-group]").forEach(b => b.addEventListener("click", () => showGroup(b.dataset.group, false, states)));
  if (PL.tuin) PL.tuin($("pl-tuin"), {states: mergeGroups(states), strook: true});
  const openT = () => showHomeGarden(states);
  $("pl-open-tuin").addEventListener("click", openT);
  $("pl-tuin").addEventListener("click", openT);
  $("pl-make").addEventListener("click", () => showHomeMake(states));
  wireParent(null, states);
};
/* ---------- v0.12 resultatenkaart: Laatste keer (S16), Komt terug (S14), Wat jij deed (S5, S9, S12), Uitleg (S12).
   Alleen zinnen met een feit uit de stand (S18); geen blok zonder feit (S11). ---------- */
function resultBlocks(T, d, mem){
  const st = PL.stem, sig = st.sig, g = st.genus(T), lab = k => st.label(T, k), blocks = [];
  const last = sig.lastSession(d); if (!last) return [];
  const bt = sig.breakthroughs(d).filter(b => b.dag === last.d)[0], li = sig.lastItem(d);
  blocks.push(["Laatste keer", [bt ? st.say("kaart.doorbraak", {item: lab(bt.k), eerder: st.dag(bt.eerder), dag: st.dag(bt.dag), genus: g}, mem)
    : st.say("kaart.laatste", {dag: st.dag(last.d), rondes: st.aantal(sig.roundsOn(d, last.d), "rondes"), item: li ? lab(li.k) : ""}, mem)]]);
  const sc = sig.schedule(d), terug = [];
  for (const gp of sc.soon.slice(0, 2)) terug.push(st.say("kaart.terug", {dagT: st.dagT(gp.n), items: st.kort(gp.ks.slice(0, 3).map(lab), gp.ks.length, st.noun(T)), pl: gp.ks.length > 1, genus: g}, mem));
  if (sc.rest.length) terug.push(st.say("kaart.rust", {aantal: st.aantal(sc.rest.length, st.noun(T)), dagT: st.dagT(sc.rest[0].due), pl: sc.rest.length > 1, genus: g}, mem));
  if (terug.filter(Boolean).length) blocks.push(["Komt terug", terug.filter(Boolean)]);
  const deed = [], hd = sig.helpDrop(d)[0];
  if (hd) deed.push(st.say("kaart.hulp", {item: lab(hd.k), eerder: st.dag(hd.eerder), dag: st.dag(hd.dag), genus: g}, mem));
  const fa = sig.faster(d).filter(x => !hd || x.k !== hd.k)[0];
  if (fa && fa.dag !== fa.eerder) deed.push(st.say("kaart.tempo", {item: lab(fa.k), eerder: st.dag(fa.eerder), dag: st.dag(fa.dag), genus: g}, mem));
  const rw = sig.roundsWeek(d); if (rw >= 2 && deed.length < 2) deed.push(st.say("kaart.afmaken", {rondes: st.aantal(rw, "rondes")}, mem));
  const lf = d.lastForm || "A", fr = (d.forms && d.forms[lf] && d.forms[lf].rounds) || 0;
  if (fr >= 2 && deed.length < 2 && T.forms[lf]) deed.push(st.say("kaart.vorm", {vorm: `"${T.forms[lf].name}"`, rondes: st.aantal(fr, "rondes")}, mem));
  if (deed.filter(Boolean).length) blocks.push(["Wat jij deed", deed.filter(Boolean)]);
  const u = sig.uitleg(d)[0];
  if (u){ const mode = (T.explainNames && T.explainNames[u.mode]) || (u.mode === "standaard" ? "de tussenstap" : u.mode); const z = st.say(u.ok ? "kaart.uitleg" : "kaart.uitleg.nog", {item: lab(u.k), mode, genus: g}, mem); if (z) blocks.push(["Uitleg", [z]]); }
  return blocks;
}
PL._resultBlocks = resultBlocks;
const resultHTML = blocks => blocks.map(([h, ls]) => `<section class="pl-resblock"><h3 class="pl-eyebrow">${esc(h)}</h3>${ls.map(l => `<p>${esc(l)}</p>`).join("")}</section>`).join("");
/* de regel onder de tuin per training (perk): wat al vanzelf gaat en wat het laatst bijkwam; leeg perk: een uitnodiging */
function perkLine(T, d, mem){
  const st = PL.stem, sig = st.sig, g = st.genus(T), n = sig.knownCount(d), nk = sig.newestKnown(d), last = sig.lastSession(d);
  const title = T.isGroup ? T.title : T.title;
  if (!last) return st.say("perk.leeg", {training: title}, mem);
  if (n && nk) return st.say("perk.groei", {aantal: st.aantal(n, st.noun(T)), item: st.label(T, nk.k), dag: st.dag(nk.d), pl: n > 1, genus: g}, mem);
  return st.say("perk.bezig", {dag: st.dag(last.d), rondes: st.aantal(realSessions(d).reduce((a, s) => a + (s.rounds || 0), 0), "rondes"), stap: T.stones[Math.max(0, (d.stage || 1) - 1)].name}, mem);
}
/* van een rij op home (training of groep) naar de training met de meest recente stand */
const rowTraining = (R, states) => !R.isGroup ? R : R.members.slice().sort((a, b) => ((PL.stem.sig.lastSession(states[b.id]) || {}).d || "").localeCompare(((PL.stem.sig.lastSession(states[a.id]) || {}).d || "")))[0];

/* Mijn tuin vanaf home (#tuin): de hele tuin, en in woorden wat vanzelf gaat. In de tuin zelf staat geen tekst. */
async function showHomeGarden(states, fromRoute, openId){
  states = states || await loadStates();
  const app = $("pl-app"); homeFrame(app, "Mijn tuin", true);
  if (!fromRoute) setRoute("tuin" + (openId ? "/" + openId : ""));
  const sec = app.querySelector(".pl-screen"), st = PL.stem, mem = st.mem;
  // v0.12: één regel van de rups over het geheel, alleen met een feit (S9, S18)
  const top = st.sig.weekTop(states, trainings);
  let rups = "";
  const groei = trainings.map(T => ({T, nk: st.sig.newestKnown(states[T.id])})).filter(x => x.nk && x.nk.d && dayNum(today()) - dayNum(x.nk.d) < 7).sort((a, b) => b.nk.d.localeCompare(a.nk.d))[0];
  const door = trainings.map(T => ({T, b: st.sig.breakthroughs(states[T.id], new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10))[0]})).filter(x => x.b).sort((a, b) => (b.b.t || "").localeCompare(a.b.t || ""))[0];
  if (door) rups = st.say("rups.doorbraak", {item: st.label(door.T, door.b.k), dag: st.dag(door.b.dag), eerder: st.dag(door.b.eerder), training: door.T.groupTitle || door.T.title, genus: st.genus(door.T)}, mem);
  else if (groei && (!top || Math.random() < .5)) rups = st.say("rups.groei", {item: st.label(groei.T, groei.nk.k), dag: st.dag(groei.nk.d), training: groei.T.groupTitle || groei.T.title, genus: st.genus(groei.T)}, mem);
  else if (top) rups = st.say("rups.week", {training: top.T.groupTitle || top.T.title, rondes: st.aantal(top.n, "rondes")}, mem);
  const rows = listRows().map(R => { const T = rowTraining(R, states); return {R, T, line: perkLine(Object.assign(Object.create(T), {title: R.title}), states[T.id], mem)}; });
  sec.innerHTML = `<div class="pl-card pl-narrow pl-tuinpagina" style="display:grid;gap:12px">
      ${rups ? `<p class="pl-rups" aria-live="polite">${esc(rups)}</p>` : ""}
      <div class="pl-tuinwrap" id="pl-tuin"></div>
      <ul class="pl-grownlist pl-perken">${rows.map(({R, line}) => `<li><button type="button" class="pl-perk" data-perk="${esc(R.id)}" aria-expanded="false" aria-controls="pl-res-${esc(R.id)}"><b>${esc(R.title)}</b><span>${esc(line)}</span><span class="pl-chev" aria-hidden="true"></span></button><div class="pl-result" id="pl-res-${esc(R.id)}" aria-live="polite" hidden></div></li>`).join("")}</ul>
    </div>`;
  const open = id => {
    sec.querySelectorAll(".pl-perk").forEach(b => { const on = b.dataset.perk === id && b.getAttribute("aria-expanded") !== "true"; b.setAttribute("aria-expanded", String(on)); const box = $("pl-res-" + b.dataset.perk); box.hidden = !on;
      if (on){ const x = rows.find(r => r.R.id === b.dataset.perk), bl = resultBlocks(x.T, states[x.T.id], mem); box.innerHTML = bl.length ? resultHTML(bl) + `<button type="button" class="pl-help" data-go="${esc(x.T.id)}">Naar ${esc(x.R.title)}</button>` : `<p>${esc(x.line)}</p><button type="button" class="pl-help" data-go="${esc(x.T.id)}">Naar ${esc(x.R.title)}</button>`;
        box.querySelector("[data-go]").addEventListener("click", e => { const t = trainings.find(t => t.id === e.currentTarget.dataset.go); setRoute(t.id); PL.start(t, {routed: true}); }); } });
    try { history.replaceState({pl: 1}, "", "#tuin" + (id ? "/" + id : "")); } catch(e){}
    st.saveMem(store);
  };
  sec.querySelectorAll(".pl-perk").forEach(b => b.addEventListener("click", () => open(b.dataset.perk)));
  if (PL.tuin) PL.tuin($("pl-tuin"), {states: mergeGroups(states)}).then(() => {
    // een perk in de tuin aantikken opent dezelfde kaart (europa = het perk van Landen van de wereld)
    sec.querySelectorAll("#pl-tuin [data-bed]").forEach(bed => { bed.style.cursor = "pointer"; bed.addEventListener("click", () => { const id = bed.dataset.bed, R = listRows().find(r => r.id === id || (r.isGroup && r.members.some(m => m.id === id))); if (R){ open(R.id); const el = sec.querySelector(`[data-perk="${R.id}"]`); if (el) el.scrollIntoView({block: "nearest", behavior: "smooth"}); } }); });
  });
  if (openId) open(openId);
  st.saveMem(store);
  wireParent(null, states);
}
/* Bedenk je ronde vanaf home (#bedenk): eerst de training kiezen (Tesler: de keuze zit ook in elke training) */
async function showHomeMake(states, fromRoute){
  states = states || await loadStates();

/* home-routes: "", tuin, bedenk, landen(/bedenk) */
PL.homeRoute = function(id, view){
  const G = listRows().find(r => r.isGroup && r.route === id);
  if (G) return showGroup(G.id, view === "bedenk", null, true);
  if (id === "tuin") return showHomeGarden(null, true, view || null);
  if (id === "bedenk") return showHomeMake(null, true);
  return PL.home();
};

/* ---------- één training ---------- */
PL.start = async function(T, opts){
  opts = opts || {};
  const app = $("pl-app"); app.classList.remove("pl-homeapp", "pl-inround"); app.classList.toggle("pl-wide", !!T.wide);   // v0.10: een training mag 90% van de breedte gebruiken (de kaart)
  if (!opts.routed){ const h = parseHash(); if (h.id !== T.id) setRoute(T.id + (opts.make ? "/bedenk" : opts.resume ? "/ronde" : ""), true); }
  /* v0.11 kop (Jakob's Law, Mental Model): linksboven terug naar Home, rechts Geluid en Mijn tuin (met de bloem); de titel eronder.
     Lang drukken op de titel opent het ouderscherm (zoals het merkteken op home). */
  const sounds = soundItems(T);
  app.innerHTML = `
  <header class="pl-top pl-top-tr">
    ${trainings.length > 1 ? `<button class="pl-backhome" id="pl-home-btn" type="button"><span class="pl-chev pl-chev-l" aria-hidden="true"></span>Home</button>` : ""}
    <div class="pl-title" id="pl-logo"><h1>${esc(T.title)}</h1></div>
    <div class="pl-topbtns">
      ${sounds.length ? `<button class="pl-garden-btn" id="pl-sound-btn" type="button" aria-expanded="false" aria-controls="pl-sound">Geluid</button>` : ""}
      <button class="pl-garden-btn pl-tuinbtn" id="pl-garden-btn" type="button"><span class="pl-btnflower" aria-hidden="true">${PL.flower(5, {stem: false})}</span>Mijn tuin</button>
    </div>
    ${sounds.length ? `<div class="pl-soundpanel" id="pl-sound" role="group" aria-label="Geluid" hidden>${sounds.map(x => `<label class="pl-toggle"><input type="checkbox" data-sound="${esc(x.key)}" ${x.get() ? "checked" : ""}><span>${esc(x.label)}</span></label>`).join("")}</div>` : ""}
  </header>
  <section class="pl-screen" id="pl-screen"></section>
  <div class="pl-foot" id="pl-foot">${esc(T.title)} ${esc(T.version)} · Leeratelier ${PL.VERSION}</div>
  <div class="pl-parent" id="pl-parent" hidden></div>`;
  if (sounds.length){
    const sb = $("pl-sound-btn"), sp = $("pl-sound");
    sb.addEventListener("click", () => { sp.hidden = !sp.hidden; sb.setAttribute("aria-expanded", String(!sp.hidden)); });
    sp.querySelectorAll("[data-sound]").forEach(c => c.addEventListener("change", () => sounds.find(x => x.key === c.dataset.sound).set(c.checked)));
    document.addEventListener("click", e => { if (!sp.hidden && !sp.contains(e.target) && e.target !== sb){ sp.hidden = true; sb.setAttribute("aria-expanded", "false"); } });
  }
  const screen = $("pl-screen");
  let view = parseHash().id === T.id ? parseHash().view : "";
  const route = (v, rep) => { const was = view; view = v; if (parseHash().id === T.id && parseHash().view === v) return; setRoute(T.id + (v ? "/" + v : ""), rep || (was === v)); };
  const KEY = "philearn-" + T.id;
  const base = {v: 3, stage: 1, items: {}, stones: {}, sessions: [], events: [], forms: {A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, lastForm: "A", cooldown: 0, hold: 0, lastPlayed: "",
    expl: {}, explPending: {}, adjust: null, lines: []};
  const data = Object.assign(base, (await store.load(KEY)) || {});
  data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, data.forms || {});
  data.stones = data.stones || {}; data.events = data.events || [];
  data.expl = data.expl || {}; data.explPending = data.explPending || {}; data.lines = data.lines || [];
  // v0.7-omzetting: verlaten pogingen (0 rondes) zijn geen sessies (A1); de uitlegmeting uit trainingen waarvan de tussenstap
  // het antwoord toonde (A2) wordt niet meegenomen
  data.sessions = realSessions(data);
  if ((data.v || 2) < 3){ if (["werkwoorden", "europa", "spelling-een-of-twee", "zinnen"].includes(T.id)){ data.expl = {}; data.explPending = {}; } data.v = 3; }
  PL.migrate4(data);
  const lastReal = data.sessions[data.sessions.length - 1];
  const prevPlayed = lastReal ? lastReal.d : "";
  if (T.migrate) T.migrate(data);   // een training die stenen toevoegt, zet de stand om (Zinnen v0.7)
  if (T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
  const S = {d: today(), t0: Date.now(), min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, forms: [], react: {leuk: 0, gewoon: 0, pittig: 0}, why: {}};
  let sessionAdded = false, form = data.lastForm || "A", lastRound = null, factShown = false, wheelRun = 0, wheelCount = 0, custom = null;
  let wiseShown = false, aiNoteShown = false, roundAdj = null, tried = null;
  let cur_ = null, okVoice = () => "";
  let roundFeel = null, feelUsed = false, feelRulesOpened = false, feelStone = null, feelOpenT = 0;   // v0.13 Te makkelijk / Pittig   // v0.12: de vraag die nu loopt (voor de stem na "Gelukt")
  /* tijdens een ronde staat "Laat zien" (het scherm voor papa of je zus) niet in de kop: hulp bij de vraag zit in de ronde zelf */
  const topBtn = on => { const b = $("pl-garden-btn"); if (b) b.hidden = on; };
  let rulesShow = () => {};   // wordt per ronde gezet (playRound)
  function waitNext(ms, run){
    if (window.__plSnel) ms = Math.min(ms, T.pause || 900);   // alleen voor tests/ux.py: de oude snelheid
    const box = $("pl-sheet") && $("pl-sheet").querySelector(".pl-ok");
    if (!box) return sleep(ms);
    // v0.11 (Fitts): "Verder" over de hele breedte, onderin waar de duim al is; zonder tikken gaat het vanzelf verder
    box.insertAdjacentHTML("beforeend", `<button type="button" class="pl-btn pl-full pl-verder" id="pl-verder">Verder</button>`);
    return new Promise(res => {
      const done = () => { clearTimeout(t); document.removeEventListener("keydown", key); res(); };
      const key = e => { if (e.key === "Enter" && !e.repeat) setTimeout(done, 0); };
      const t = setTimeout(done, ms);
      setTimeout(() => document.addEventListener("keydown", key), 300);   // de Enter van het antwoord zelf telt niet
      $("pl-verder").addEventListener("click", done);
    });
  }
  let runId = 0, inRound = false;   // een ronde die verlaten wordt, krijgt een nieuw runId; de oude lus stopt dan vanzelf

  function save(){
    S.min = Math.max(1, Math.round((Date.now() - S.t0) / 60000));
    if (!sessionAdded && S.rounds > 0){ data.sessions.push(S); sessionAdded = true; }
    if (data.sessions.length > 200) data.sessions = data.sessions.slice(-200);
    if (data.events.length > P.maxEvents) data.events = data.events.slice(-P.maxEvents);
    if (S.rounds > 0) data.lastPlayed = new Date().toISOString();
    saving = saving.then(() => store.save(KEY, data)).catch(() => {});
    return saving;
  }
  const log = ev => { data.events.push(Object.assign({t: new Date().toISOString().slice(0, 19), tr: T.id}, ev)); };

  /* --- stenen: beheersing (power) en tempo (speed) per steen --- */
  const stone = id => data.stones[id] || (data.stones[id] = {hist: [], rts: [], power: false, speed: false, n: 0});
  function updateStone(id, first, rt){
    const s = stone(id); s.n++;
    s.hist.push(first ? 1 : 0); if (s.hist.length > P.powerWindow) s.hist.shift();
    if (first && rt != null){ s.rts.push(rt); if (s.rts.length > P.speedWindow) s.rts.shift(); } else if (s.rts.length) s.rts.shift();
    const okCount = s.hist.reduce((a, b) => a + b, 0);
    s.power = s.hist.length >= P.powerWindow && okCount >= P.powerNeed;
    s.speed = s.power && s.rts.length >= P.speedWindow && median(s.rts) <= P.fluentMs;
  }
  const green = id => stone(id).power && stone(id).speed;

  /* --- items: vlotheid en herhaalschema --- */
  const rec = key => data.items[key] || {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []};
  function updateItem(key, first, step, rt){
    const r = data.items[key] || (data.items[key] = {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []});
    r.n++; if (first) r.ok1++; if (step) r.st++;
    r.rts = (r.rts || []).concat(rt != null ? [rt] : []).slice(-5);
    const fluent = first && rt != null && rt <= P.fluentMs;
    r.last = first ? "ok" : "step"; r.d = today();
    if (fluent){ r.fl++; r.iv = Math.min(P.review.length - 1, (r.iv || 0) + (r.fl >= 2 ? 1 : 0)); r.due = dayNum(today()) + P.review[r.iv]; }
    else if (!first){ r.fl = 0; r.iv = Math.max(0, (r.iv || 0) - 1); r.due = dayNum(today()) + 1; }
    return fluent;
  }
  const known = key => { const r = data.items[key]; return !!r && r.fl >= 2 && r.last === "ok"; };
  const due = key => { const r = data.items[key]; return !!r && r.due != null && r.due <= dayNum(today()); };

  const ctx = {
    T, data, P, sleep, shuffle, pick, rnd, esc, say: PL.say, canSay: PL.canSay, log,
    get form(){ return form; }, get stage(){ return data.stage; },
    // tempo van de hulp: "rustig" na "het ging te snel" (langer model, langere adempauze); de lat zelf zakt niet
    get pace(){ return roundAdj && roundAdj.kind === "snel" ? "rustig" : ""; },
    get flashMs(){ return roundAdj && roundAdj.kind === "snel" ? 4200 : 2500; },
    get nudgeMs(){ return roundAdj && roundAdj.kind === "snel" ? 12000 : 8000; },
    /* uitlegvormen (alleen als de training T.explainModes heeft): kies, wissel, en geef de namen */
    explainMode(stoneId){
      const modes = T.explainModes || ["standaard"]; const st = data.expl[stoneId] || {};
      const forced = roundAdj && roundAdj.kind === "uitleg" && roundAdj.st === stoneId && modes.includes(roundAdj.mode) ? roundAdj.mode : null;
      return forced || PL.chooseExpl(modes, st, st.avoid);
    },
    explainSwitch(stoneId, from){
      const modes = T.explainModes || ["standaard"]; const st = data.expl[stoneId] || (data.expl[stoneId] = {});
      const m = st[from] || (st[from] = {ok: 0, no: 0, sw: 0}); m.no++; m.sw = (m.sw || 0) + 1;
      const next = modes[(modes.indexOf(from) + 1) % modes.length];
      log({switch: 1, st: stoneId, from, to: next}); return next;
    },
    modeName: m => (T.explainNames && T.explainNames[m]) || "",
    rec, known, due, stone, green,
    // steunniveau van het model: vol (geen beheersing), flits (beheersing, nog geen tempo), opvraag (tempo)
    support(id){
      // v0.13: een "Te makkelijk" of "Pittig" van vorige ronde zet de hulp bij die steen voor deze ronde (de toets)
      if (roundFeel && roundFeel.st === id){ const E = PL.FEEL_EFFECT[roundFeel.why]; if (E && E.sup) return E.sup; }
      const s = stone(id); const lv = !s.power ? "vol" : !s.speed ? "flits" : "opvraag";
      return lv === "vol" && data.fade && data.fade[id] ? "flits" : lv;   // na een geslaagde toets "plaatje niet nodig": kort
    },
    setAsk(lead, main){ $("pl-ask-lead").textContent = lead || ""; $("pl-ask-main").textContent = main || ""; },
    /* feedback: drie vaste vormen. Tijdens een tussenstap blijft haar eigen antwoord in beeld (C3): fb.tried(waarde). */
    fb: {
      // v0.11: "Gelukt" komt in een vaste strook onderin (geen verspringende inhoud), met een zacht toontje
      ok(text){ tried = null; $("pl-fb").innerHTML = ""; const sh = $("pl-sheet"); if (!sh) return; const extra = okVoice(); sh.innerHTML = `<div class="pl-ok" role="status"><p class="pl-ok-text"><b>Gelukt</b>${esc(text)}</p>${extra ? `<p class="pl-ok-stem">${esc(extra)}</p>` : ""}</div>`; sh.hidden = false; requestAnimationFrame(() => sh.classList.add("open")); if (!(T.sound && T.sound.ownFeedback)) PL.chime(); },
      step(text){ rulesShow(true); cur_.step = true; ctx.fb.clearSheet(); $("pl-fb").innerHTML = `<div class="pl-step">${tried != null ? `<span class="pl-tried">Jouw antwoord: ${esc(tried)}</span>` : ""}<b>Tussenstap</b>${esc(text)}</div>`; },
      tried(v){ tried = v; },
      clearSheet(){ const sh = $("pl-sheet"); if (sh && !sh.hidden){ sh.classList.remove("open"); sh.hidden = true; sh.innerHTML = ""; } },
      note(text){ ctx.fb.clearSheet(); $("pl-fb").innerHTML = `<p class="pl-note">${esc(text)}</p>`; },
      clear(){ $("pl-fb").innerHTML = ""; const sh = $("pl-sheet"); if (sh){ sh.classList.remove("open"); sh.hidden = true; sh.innerHTML = ""; } }
    }
  };
  PL.ctx = ctx;

  function greeting(){
    const dn = dayNum(today()), last = prevPlayed ? dayNum(prevPlayed.slice(0, 10)) : null;
    const dueN = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok").length;
    const a = data.adjust;
    // v0.12: een aanpassing na "pittig" blijft (die komt uit haar eigen reden); de rest zegt de stem (introVoice)
    const g = PL.greet({first: !data.sessions.length, hour: new Date().getHours(), daysSince: null, adjust: a && a.kind, adjName: a && a.mode ? ctx.modeName(a.mode) : "", due: false});
